apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: body-dynamic
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ProxyRewrite
      config:
        jsonBody:
          set:
            /version: updated-body-version-is-longer
          remove:
            - /discard

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: body-dynamic
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ProxyRewrite
      config:
        jsonBody:
          operations:
            - op: remove
              path: /discard
            - op: replace
              path: /version
              value: updated-body-version-is-longer

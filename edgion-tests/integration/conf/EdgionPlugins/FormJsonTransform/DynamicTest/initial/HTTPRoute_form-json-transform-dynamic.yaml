apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: form-json-transform-dynamic
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - form-json-transform-dynamic.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: form-json-transform-dynamic
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

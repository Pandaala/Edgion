# ClusterRegionSetting fixtures; routing logic references a separate setting.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: data-managed
  namespace: edgion-default
spec:
  requestPlugins:
  - type: RegionRoute
    config:
      keyGet:
      - type: header
        name: X-Account-Id
      hashCalc:
        algorithm: crc32
        modulo: 1000
      routeRules:
      - type: RouteByHashRange
      clusterRegionRef:
        name: data-managed
        namespace: edgion-default

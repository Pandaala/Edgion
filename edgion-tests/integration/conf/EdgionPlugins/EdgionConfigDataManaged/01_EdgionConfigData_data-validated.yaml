# RegionRouteOverride EdgionConfigData for data-validated test
#
# Pre-created by administrators before applying the EdgionPlugins data-validated resource.
# The EdgionPlugins overrideRef points here; when this resource exists, ResolvedRefs=True.
apiVersion: edgion.io/v1
kind: EdgionConfigData
metadata:
  name: data-validated
  namespace: edgion-default
spec:
  data:
    type: RegionRouteOverride
    config:
      regions:
        - name: east
          hashRange: [0, 499]
          backendEndpoint: "127.0.0.1:30001"
          tls: false
        - name: west
          hashRange: [500, 999]
          backendEndpoint: "127.0.0.1:30002"
          tls: false

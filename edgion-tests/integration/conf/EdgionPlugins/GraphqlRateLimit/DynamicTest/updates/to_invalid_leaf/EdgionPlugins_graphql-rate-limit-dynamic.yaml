apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: graphql-rate-limit-dynamic
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      alias: cost-budget
      type: GraphqlRateLimit
      config:
        schema: |
          type Query { users(first: Int = 10): [User!]! }
          type User { name(first: Int = 100): String! }
        costRules:
          - field: Query.users
            multipliers: [first]
          - field: User.name
            multipliers: [first]
        redisRef: "default/redis-test"
        key:
          - type: header
            name: X-Graphql-Key
        policies:
          - rate: 1000
            interval: "2h"
            algorithm: FixedWindow
        requestTimeout: "2s"

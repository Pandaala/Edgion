apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: graphql-rate-limit
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      alias: cost-budget
      type: GraphqlRateLimit
      config:
        showQueryCost: true
        schema: |
          type Query { users(first: Int = 10): [User!]! }
          type Mutation { users(first: Int = 10): [User!]! }
          type User { name: String! @deprecated(reason:"Use displayName") }
          scalar Date @specifiedBy(url:"https://example.com/date")
        costRules:
          - field: Query.users
            weight: 1
            multipliers: [first]
          - field: Mutation.users
            multipliers: [first]
        redisRef: "default/redis-test"
        key:
          - type: header
            name: X-Graphql-Key
        policies:
          - rate: 24
            interval: "2h"
            algorithm: FixedWindow
        requestTimeout: "2s"
---

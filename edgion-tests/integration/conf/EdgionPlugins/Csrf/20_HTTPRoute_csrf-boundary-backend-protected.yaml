{
  "apiVersion": "gateway.networking.k8s.io/v1",
  "kind": "HTTPRoute",
  "metadata": {
    "name": "csrf-boundary-backend-protected",
    "namespace": "edgion-default"
  },
  "spec": {
    "parentRefs": [
      {
        "name": "csrf-boundary"
      }
    ],
    "hostnames": [
      "csrf-boundary-backend-protected.example.com"
    ],
    "rules": [
      {
        "matches": [
          {
            "path": {
              "type": "PathPrefix",
              "value": "/"
            }
          }
        ],
        "backendRefs": [
          {
            "name": "test-http",
            "namespace": "edgion-test",
            "port": 30001,
            "filters": [
              {
                "type": "ExtensionRef",
                "extensionRef": {
                  "group": "edgion.io",
                  "kind": "EdgionPlugins",
                  "name": "csrf-boundary-backend-protected"
                }
              }
            ]
          }
        ]
      }
    ]
  }
}

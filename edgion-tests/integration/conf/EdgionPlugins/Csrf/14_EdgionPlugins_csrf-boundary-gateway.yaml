{
  "apiVersion": "edgion.io/v1",
  "kind": "EdgionPlugins",
  "metadata": {
    "name": "csrf-boundary-gateway",
    "namespace": "edgion-default"
  },
  "spec": {
    "requestPlugins": [
      {
        "type": "Csrf",
        "config": {
          "secretRef": {
            "name": "csrf-key",
            "namespace": "edgion-default"
          },
          "name": "X-CSRF-Token",
          "cookieSecure": false
        },
        "conditions": {
          "run": {
            "allOf": [
              {
                "type": "keyMatch",
                "key": {
                  "type": "header",
                  "name": "host"
                },
                "regex": [
                  "^csrf-boundary-gateway-"
                ]
              }
            ]
          }
        }
      }
    ]
  }
}

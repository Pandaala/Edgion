{
  "apiVersion": "gateway.networking.k8s.io/v1",
  "kind": "Gateway",
  "metadata": {
    "name": "csrf-boundary",
    "namespace": "edgion-default",
    "annotations": {
      "edgion.io/edgion-plugins": "csrf-boundary-gateway"
    }
  },
  "spec": {
    "gatewayClassName": "csrf-boundary",
    "listeners": [
      {
        "name": "http",
        "protocol": "HTTP",
        "port": 31991,
        "allowedRoutes": {
          "namespaces": {
            "from": "All"
          }
        }
      }
    ]
  }
}

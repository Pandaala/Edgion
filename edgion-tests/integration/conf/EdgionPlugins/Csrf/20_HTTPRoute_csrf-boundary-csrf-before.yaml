{
  "apiVersion": "gateway.networking.k8s.io/v1",
  "kind": "HTTPRoute",
  "metadata": {
    "name": "csrf-boundary-csrf-before",
    "namespace": "edgion-default"
  },
  "spec": {
    "parentRefs": [
      {
        "name": "csrf-boundary"
      }
    ],
    "hostnames": [
      "csrf-boundary-csrf-before.example.com"
    ],
    "rules": [
      {
        "matches": [
          {
            "path": {
              "type": "PathPrefix",
              "value": "/"
            }
          }
        ],
        "filters": [
          {
            "type": "ExtensionRef",
            "extensionRef": {
              "group": "edgion.io",
              "kind": "EdgionPlugins",
              "name": "csrf-boundary-csrf-before"
            }
          }
        ],
        "backendRefs": [
          {
            "name": "test-http",
            "namespace": "edgion-test",
            "port": 30001
          }
        ]
      }
    ]
  }
}

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: csrf-secret-rotation
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: Csrf
      config:
        secretRef:
          name: csrf-rotation-key
          namespace: edgion-default
        expires: 7200
        name: "X-CSRF-Token"

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: csrf-missing-secret
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: Csrf
      config:
        # secretRef points at a Secret that NO fixture creates → the controller
        # cannot resolve the signing key, so resolved_key stays None and the
        # gateway seals the plugin fail-closed (requests rejected with 500)
        # instead of serving CSRF with an empty key.
        secretRef:
          name: csrf-key-absent
          namespace: edgion-default
        expires: 7200
        name: "X-CSRF-Token"

{
  "apiVersion": "edgion.io/v1",
  "kind": "EdgionPlugins",
  "metadata": {
    "name": "csrf-boundary-mutation",
    "namespace": "edgion-default"
  },
  "spec": {
    "requestPlugins": [
      {
        "type": "Csrf",
        "config": {
          "secretRef": {
            "name": "csrf-key",
            "namespace": "edgion-default"
          },
          "name": "X-CSRF-Token",
          "cookieSecure": false
        }
      },
      {
        "type": "RestToGraphql",
        "config": {
          "query": "mutation Write{write}",
          "path": "/csrf-method-boundary/graphql"
        }
      }
    ]
  }
}

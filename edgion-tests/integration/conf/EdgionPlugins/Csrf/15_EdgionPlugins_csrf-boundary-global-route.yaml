{
  "apiVersion": "edgion.io/v1",
  "kind": "EdgionPlugins",
  "metadata": {
    "name": "csrf-boundary-global-route",
    "namespace": "edgion-default"
  },
  "spec": {
    "requestPlugins": [
      {
        "type": "ProxyRewrite",
        "config": {
          "method": "POST",
          "uri": "/csrf-method-boundary/action"
        }
      }
    ]
  }
}

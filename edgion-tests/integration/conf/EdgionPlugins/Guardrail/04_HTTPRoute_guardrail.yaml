apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: guardrail-pass
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-gateway
  hostnames:
    - guardrail-pass.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: guardrail-pass
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: fixture-provider
---

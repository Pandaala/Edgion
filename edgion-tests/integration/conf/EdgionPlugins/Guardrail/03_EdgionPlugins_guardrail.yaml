apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: guardrail-ext-proc
  namespace: edgion-test
spec:
  requestPlugins:
    - type: AiProxy
      config:
        backendSelection:
          type: Weighted
    - type: Guardrail
      config:
        target:
          name: test-http
          namespace: edgion-test
          port: 30001
        timeoutMs: 2000
        maxResponseBytes: 4096
        request:
          path:
            template: /guardrail/decision/replace
        windowBytes: 1
        overlapBytes: 0
        failOpen: false
    - type: ExtProc
      config:
        grpcService:
          target: 127.0.0.1:30041
          timeoutMs: 2000
        processingMode:
          requestHeaderMode: SEND
          responseHeaderMode: SEND
          responseBodyMode: STREAMED
        failureModeAllow: false
---

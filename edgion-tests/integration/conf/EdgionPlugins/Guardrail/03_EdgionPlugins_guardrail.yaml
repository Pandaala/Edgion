apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: guardrail-pass
  namespace: edgion-test
spec:
  requestPlugins:
    - type: AiProxy
      config:
        backendSelection:
          type: Weighted
    - type: Guardrail
      config:
        target:
          name: test-http
          namespace: edgion-test
          port: 30001
        timeoutMs: 2000
        maxResponseBytes: 4096
        request:
          path:
            template: /guardrail/decision/pass
        windowBytes: 1
        overlapBytes: 0
        failOpen: false
---

apiVersion: v1
kind: Secret
metadata:
  name: guardrail-anthropic-credential
  namespace: edgion-test
type: Opaque
stringData:
  api-key: anthropic-provider-test-key
---
apiVersion: edgion.io/v1
kind: EdgionBackend
metadata:
  name: guardrail-anthropic-provider
  namespace: edgion-test
spec:
  ai:
    provider: Anthropic
    endpoint: http://127.0.0.1:30001/anthropic/prefix
    allowInsecureHttp: true
    credentialPool:
      credentials:
        - name: primary
          secretRef:
            name: guardrail-anthropic-credential
    models:
      - name: claude-fixture
        aliases:
          - claude-alias
    defaults:
      streaming: true
      maxOutputTokens: 64
---

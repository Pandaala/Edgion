# Scenario 5: ServiceRegionRoute PM with clusterRef pointing at a non-existent PM
# Expect: Accepted=True, ResolvedRefs=False/InvalidEdgionDataRef
apiVersion: edgion.io/v1
kind: EdgionData
metadata:
  name: pm-status-service-missing-ref
  namespace: edgion-test
spec:
  data:
    type: ServiceRegionRoute
    config:
      clusterRef:
        namespace: edgion-test
        name: pm-status-does-not-exist
      regions:
        - name: east
        - name: west

# ServiceRegionRoute EdgionData — the "good" PMD referenced by pmd-flap-plugin.
# EP.serviceRegionRouteRef points here; this PMD's clusterRef points at pmd-flap-good-cluster.
apiVersion: edgion.io/v1
kind: EdgionData
metadata:
  name: pmd-flap-good
  namespace: edgion-test
spec:
  data:
    type: ServiceRegionRoute
    config:
      clusterRef:
        namespace: edgion-test
        name: pmd-flap-good-cluster
      regions:
        - name: east
        - name: west

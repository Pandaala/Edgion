# Scenario 2: invalid GCIR PM — activeProfile 'missing' not in profiles
# Expect: Accepted=False/Invalid, message contains "activeProfile"
apiVersion: edgion.io/v1
kind: EdgionData
metadata:
  name: pm-status-gcir-invalid
  namespace: edgion-test
spec:
  data:
    type: GlobalConnectionIpRestriction
    config:
      enable: true
      activeProfile: missing
      description: "Status test: invalid GCIR - activeProfile not in profiles"
      profiles:
        main:
          defaultAction: deny
          allow:
            - name: office
              cidrs:
                - "10.0.0.0/8"

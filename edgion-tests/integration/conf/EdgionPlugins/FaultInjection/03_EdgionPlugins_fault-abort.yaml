apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: fault-abort
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: FaultInjection
      config:
        abort:
          ratio: 1.0
          statusCode: 503
          body: "injected by fault_injection"
          contentType: "text/plain"
          headers:
            - name: X-Fault-Injected
              value: "true"

# Scenario 1: valid Selector EdgionConfigData — expect Accepted=True, ResolvedRefs=True
# A Selector is always structurally valid; it only names an active profile that the
# referencing GlobalConnectionIpRestriction plugin already owns inline.
apiVersion: edgion.io/v1
kind: EdgionConfigData
metadata:
  name: data-status-gcir-valid
  namespace: edgion-test
spec:
  data:
    type: Selector
    config:
      active: main

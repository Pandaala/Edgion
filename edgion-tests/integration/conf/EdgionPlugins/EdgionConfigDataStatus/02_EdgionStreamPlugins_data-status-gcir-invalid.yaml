# Scenario 2: invalid GlobalConnectionIpRestriction config — expect Accepted=False/Invalid.
#
# A Selector EdgionConfigData is always structurally valid, so an invalid GCIR case can no
# longer be modelled as an EdgionConfigData. The invalid config now lives in the plugin
# itself: activeProfile 'missing' is not present in `profiles`, which the controller rejects
# during EdgionStreamPlugins preparse with an "activeProfile ... not found" message.
#
# (Filename retains the EdgionConfigData prefix for load-ordering parity with scenario 1;
# the resource kind is EdgionStreamPlugins.)
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: data-status-gcir-invalid
  namespace: edgion-test
spec:
  plugins:
    - type: GlobalConnectionIpRestriction
      config:
        enable: true
        activeProfile: missing
        profiles:
          main:
            defaultAction: deny
            allow:
              - name: office
                cidrs:
                  - "10.0.0.0/8"

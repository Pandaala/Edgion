apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ext-proc-body
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ExtProc
      config:
        grpcService:
          target: "127.0.0.1:30041"
          timeoutMs: 2000
        processingMode:
          requestHeaderMode: SEND
          requestBodyMode: BUFFERED
        failureModeAllow: false

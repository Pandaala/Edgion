apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: body-mutation-retry-shorter, namespace: edgion-default}
spec:
  parentRefs: [{name: edgion-plugins-gateway, namespace: edgion-test}]
  hostnames: ["body-mutation-retry-shorter.example.com"]
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef: {group: edgion.io, kind: EdgionPlugins, name: body-mutation-retry-shorter}
      retry:
        attempts: 2
        codes: [503]
      backendRefs: [{name: test-http, namespace: edgion-test, port: 30001}]
---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: hmac-body, namespace: edgion-default}
spec:
  parentRefs: [{name: edgion-plugins-gateway, namespace: edgion-test}]
  hostnames: ["hmac-body.example.com"]
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef: {group: edgion.io, kind: EdgionPlugins, name: hmac-body}
      backendRefs: [{name: test-http, namespace: edgion-test, port: 30001}]
---

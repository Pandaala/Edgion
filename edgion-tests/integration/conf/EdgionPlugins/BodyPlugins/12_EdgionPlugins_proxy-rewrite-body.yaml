apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: proxy-rewrite-body
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ProxyRewrite
      config:
        jsonBody:
          operations:
            - op: remove
              path: /secret
            - op: replace
              path: /name
              value: gateway

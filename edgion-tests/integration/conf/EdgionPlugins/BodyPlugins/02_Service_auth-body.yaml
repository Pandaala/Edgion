apiVersion: v1
kind: Service
metadata:
  name: auth-body
  namespace: edgion-default
spec:
  ports:
    - name: http
      port: 30040
      targetPort: 30040
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: auth-body-slice
  namespace: edgion-default
  labels:
    kubernetes.io/service-name: auth-body
addressType: IPv4
ports:
  - name: http
    port: 30040
    protocol: TCP
endpoints:
  - addresses: ["127.0.0.1"]
    conditions:
      ready: true

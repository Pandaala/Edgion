apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: wasm-body
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: Wasm
      body:
        maxBodySize: 1MiB
      config:
        source:
          file: ../../../edgion-tests/wasm/artifacts/header_demo.wasm
        failOpen: false
        timeoutMs: 1000
  upstreamResponseBodyFilterPlugins:
    - enable: true
      type: Wasm
      config:
        source:
          file: ../../../edgion-tests/wasm/artifacts/header_demo.wasm
        failOpen: false
        timeoutMs: 1000
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: wasm-body-mirror
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: Wasm
      body:
        maxBodySize: 1MiB
      config:
        source:
          file: ../../../edgion-tests/wasm/artifacts/header_demo.wasm
        failOpen: false
        timeoutMs: 1000
    - enable: true
      type: RequestMirror
      config:
        backendRef:
          name: test-http
          namespace: edgion-test
          port: 30001
        connectTimeoutMs: 500
        writeTimeoutMs: 1000
        maxBufferedChunks: 10
        mirrorLog: true
        maxConcurrent: 100

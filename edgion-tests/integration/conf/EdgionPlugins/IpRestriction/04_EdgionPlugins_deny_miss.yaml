# Blacklist mode where the test client's IP (127.0.0.1) is NOT in the deny list.
# With default_action allow, the request falls through to Default(Allow) → 200.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ip-restriction-deny-miss
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: IpRestriction
      config:
        ipSource: RemoteIp
        defaultAction: allow
        denyRefs:
          - name: acl-ip-restriction-deny-miss-deny-7360096093
        status: 403
        message: "IP is blocked"

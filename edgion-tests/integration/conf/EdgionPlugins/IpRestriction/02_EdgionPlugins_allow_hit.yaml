# Whitelist mode where the test client's IP (127.0.0.1) IS in the allow list.
# Confirms the compiled allow_matcher grants access (200).
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ip-restriction-allow-hit
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: IpRestriction
      config:
        ipSource: remoteAddr
        allow:
          - name: loopback
            cidrs:
              - "127.0.0.0/8"
        status: 403
        message: "IP not in allow list"

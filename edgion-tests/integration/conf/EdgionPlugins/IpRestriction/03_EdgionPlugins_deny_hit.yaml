# Blacklist mode where the test client's IP (127.0.0.1) IS in the deny list.
# Confirms the compiled deny_matcher blocks access (403) even with default_action allow.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ip-restriction-deny-hit
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: IpRestriction
      config:
        ipSource: RemoteIp
        defaultAction: allow
        denyRefs:
          - name: acl-ip-restriction-deny-hit-deny-ea2773d774
        status: 403
        message: "IP is blocked"

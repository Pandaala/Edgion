# HTTPRoute for CtxSet 
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ctx-setter-test-route
  namespace: edgion-default
  annotations:
    # Opt-in: only these ctx vars are projected into the access log
    # (deny-by-default). The CtxSet suite asserts on these values.
    edgion.io/log-ctx-keys: "tenant_id,rate_key,method_lower,tier,api_version"
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "ctx-setter.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/ctx-setter
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ctx-setter-test
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

# EdgionPlugins resource with overrideRef -> pmd-flap-good (RegionRouteOverride EdgionData).
# Initial phase: EdgionData exists -> overrideRef resolves -> ResolvedRefs=True.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: pmd-flap-plugin
  namespace: edgion-test
spec:
  requestPlugins:
    - type: RegionRoute
      config:
        regions:
          - name: east
            hashRange: [0, 499]
            backendEndpoint: "127.0.0.1:30001"
            tls: false
          - name: west
            hashRange: [500, 999]
            backendEndpoint: "127.0.0.1:30002"
            tls: false
        keyGet:
          - type: header
            name: X-Account-Id
        hashCalc:
          algorithm: crc32
          modulo: 1000
        routeRules:
          - type: RouteByHashRange
        overrideRef:
          name: "pmd-flap-good"
          namespace: edgion-test

# EdgionPlugins resource with overrideRef -> non-existent data-flap-missing EdgionData.
# Update 1 (to_invalid): EdgionData does not exist -> overrideRef missing -> ResolvedRefs=False.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: data-flap-plugin
  namespace: edgion-test
spec:
  requestPlugins:
    - type: RegionRoute
      config:
        regions:
          - name: east
            hashRange: [0, 499]
            backendEndpoint: "127.0.0.1:30001"
            tls: false
          - name: west
            hashRange: [500, 999]
            backendEndpoint: "127.0.0.1:30002"
            tls: false
        keyGet:
          - type: header
            name: X-Account-Id
        hashCalc:
          algorithm: crc32
          modulo: 1000
        routeRules:
          - type: RouteByHashRange
        overrideRef:
          name: "data-flap-missing"
          namespace: edgion-test

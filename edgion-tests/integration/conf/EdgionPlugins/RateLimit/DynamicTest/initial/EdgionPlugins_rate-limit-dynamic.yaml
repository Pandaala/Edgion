# RateLimit dynamic test - initial phase: onMissingKey=Allow.
# Request without X-Rate-Key header → 200 (bypass).
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: rate-limit-dynamic
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: RateLimit
      config:
        rate: 100
        interval: "1m"
        key:
          - type: header
            name: "X-Rate-Key"
        onMissingKey: Allow
        rejectStatus: 429
        rejectMessage: "Rate limit exceeded"
        showLimitHeaders: false

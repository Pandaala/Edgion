# HTTPRoute for the empty-key RateLimit regression scenario
# (referenced by 04_EdgionPlugins_rate-limit-empty-key.yaml).
#
# Dedicated hostname/path so this route's global rate-limit bucket is never
# shared with, or polluted by, traffic from any other case in this suite.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rate-limit-empty-key-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "rate-limit-empty-key.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/rate-limit-empty-key
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: rate-limit-empty-key
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

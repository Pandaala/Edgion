# Regression pin: an explicitly empty `key: []` must still rate-limit.
#
# `RateLimitConfig.key` used to deserialize to an empty list whenever `key` was
# omitted, and an empty list was then treated as a key-extraction MISS — so
# with the default `onMissingKey: Allow` the limiter was silently bypassed for
# every request. This is now fixed on two fronts: an omitted `key` deserializes
# to the documented default `[{type: clientIp}]`, and an explicitly empty
# `key: []` means "one global bucket" — every request composes to the same
# empty key and IS rate-limited. It is NOT a key miss, so `onMissingKey` /
# `defaultKey` never come into play for this config.
#
# `onMissingKey: Allow` is set deliberately here — it is the exact setting that
# used to turn an empty key list into a full bypass. If key: [] regressed back
# to being treated as a miss, this config would let every request through.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: rate-limit-empty-key
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: RateLimit
      config:
        rate: 3               # small limit so the test burst can exceed it quickly
        interval: "10s"       # long enough that the whole test burst stays in one window
        key: []               # explicitly empty => one global bucket, not a key miss
        onMissingKey: Allow   # the setting that used to make this a silent bypass
        rejectStatus: 429
        rejectMessage: "Rate limit exceeded - try again later"
        showLimitHeaders: true

# Scenario 7: presence-required-degrade
# ---------------------------------------------------------------------------
# A required origin header (X-Auth) with presence: required. The
# allowDegradation/statusOnError fields below are part of the shared
# ExternalHttpConnection schema but are NOT honored by the webhook connector
# (they are only read by forward_auth) -- key_get simply returns None on any
# failure, including a missing required field.
# Test sends a request WITHOUT X-Auth -> the missing required field is
# treated as a webhook call failure -> key_get returns None -> the consuming
# CtxSet plugin falls back to its `default` and the request continues (no
# 403, no gateway-side status override). PluginLog records the failure.
# Backend via Service + EndpointSlice.
apiVersion: v1
kind: Service
metadata:
  name: wh7-svc
  namespace: edgion-default
spec:
  ports:
    - name: http
      port: 30001
      targetPort: 30001
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: wh7-svc-slice
  namespace: edgion-default
  labels:
    kubernetes.io/service-name: wh7-svc
addressType: IPv4
ports:
  - name: http
    port: 30001
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true
---
apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: wh7-resolver
  namespace: edgion-default
spec:
  type: webhook
  config:
    target:
      kind: Service
      name: wh7-svc
      namespace: edgion-default
      port: 30001
    request:
      path:
        template: "/webhook/resolve"
      method:
        template: "GET"
      headers:
        origin:
          - name: X-Auth
            presence: required
    timeoutMs: 5000
    success:
      statusCodes: [200]
    allowDegradation: true
    statusOnError: 503
    maxResponseBytes: 4096
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: wh7-ctx-set
  namespace: edgion-default
spec:
  accessLogExtern:
    - key: wh7_user_id
      from: ctx
      name: wh7_user_id
  requestPlugins:
    - enable: true
      type: CtxSet
      config:
        vars:
          - name: wh7_user_id
            from:
              type: webhook
              webhookRef: "edgion-default/wh7-resolver"
              extract:
                source: body
                path: "data.user_id"
            default: "degraded-fallback"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wh7-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "wh7.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/wh7
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: wh7-ctx-set
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

# EdgionPlugins config for WebhookKeyGet integration test
# Uses CtxSet plugin with webhook KeyGet to resolve values from external service
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: webhook-ctx-set-test
  namespace: edgion-default
spec:
  requestPlugins:
    # CtxSet plugin — uses webhook to resolve user_id from external service
    - enable: true
      type: CtxSet
      config:
        vars:
          # 1. Resolve user_id via webhook (JSON body extraction)
          - name: webhook_user_id
            from:
              type: webhook
              webhookRef: "edgion-default/webhook-resolver"
              forwardHeaders:
                - X-Tenant-Id
                - X-Request-ID
              extract:
                source: body
                path: "data.user_id"
            default: "fallback-user"

          # 2. Resolve key via webhook response header
          - name: webhook_resolved_key
            from:
              type: webhook
              webhookRef: "edgion-default/webhook-resolver"
              forwardHeaders:
                - X-Tenant-Id
                - X-Request-ID
              extract:
                source: header
                name: "X-Resolved-Key"

          # 3. Resolve via webhook body text (plain text extraction)
          - name: webhook_body_text
            from:
              type: webhook
              webhookRef: "edgion-default/webhook-body-resolver"
              forwardHeaders:
                - X-Tenant-Id
              extract:
                source: bodyText

          # 4. Local fallback — from header (non-webhook, verifies sync path still works)
          - name: local_tenant
            from:
              type: header
              name: X-Tenant-Id
            default: "no-tenant"

          # 5. Resolve via webhook with pathSuffix
          - name: webhook_path_suffix_id
            from:
              type: webhook
              webhookRef: "edgion-default/webhook-resolver"
              forwardHeaders:
                - X-Tenant-Id
              pathSuffix: "/extra"
              extract:
                source: body
                path: "data.path_suffix_id"
            default: "fallback-suffix"

          # 6. Resolve via webhook with apiKey auth
          - name: webhook_apikey_user
            from:
              type: webhook
              webhookRef: "edgion-default/webhook-apikey-resolver"
              forwardHeaders:
                - X-Tenant-Id
              extract:
                source: body
                path: "data.apikey_user"
            default: "fallback-apikey"

          # 7. Resolve via webhook with target.type=service (EndpointSlice path).
          # Gateway reads the backend IP from the shared EpSliceStore instead of
          # a controller-embedded endpoint list.  allowDegradation=true on the
          # LinkSys keeps existing test cases unaffected if the slice is not yet
          # synced when those requests arrive.
          - name: webhook_svc_user_id
            from:
              type: webhook
              webhookRef: "edgion-default/webhook-svc-resolver"
              forwardHeaders:
                - X-Tenant-Id
                - X-Request-ID
              pathSuffix: "/webhook/resolve"
              extract:
                source: body
                path: "data.user_id"
            default: "fallback-svc"

# Bonus scenario 11: custom-secret
# ---------------------------------------------------------------------------
# Custom Authorization header resolved from a K8s Secret with a "Bearer " prefix
# (the new replacement for the removed `auth.bearer` field). The controller
# resolves the Secret value at config time and ships it over conf_sync; the
# gateway injects "Bearer <token>" into the outbound webhook request.
# Backend via Service + EndpointSlice.
apiVersion: v1
kind: Secret
metadata:
  name: wh11-token
  namespace: edgion-default
type: Opaque
data:
  # base64 of "test-secret-key-12345"
  token: dGVzdC1zZWNyZXQta2V5LTEyMzQ1
---
apiVersion: v1
kind: Service
metadata:
  name: wh11-svc
  namespace: edgion-default
spec:
  ports:
    - name: http
      port: 30001
      targetPort: 30001
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: wh11-svc-slice
  namespace: edgion-default
  labels:
    kubernetes.io/service-name: wh11-svc
addressType: IPv4
ports:
  - name: http
    port: 30001
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true
---
apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: wh11-resolver
  namespace: edgion-default
spec:
  type: webhook
  config:
    target:
      kind: Service
      name: wh11-svc
      namespace: edgion-default
      port: 30001
    request:
      path:
        template: "/webhook/resolve"
      method:
        template: "GET"
      headers:
        custom:
          - name: Authorization
            template: "Bearer ${secretRef:edgion-default/wh11-token:token}"
    timeoutMs: 5000
    success:
      statusCodes: [200]
    allowDegradation: false
    maxResponseBytes: 4096
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: wh11-ctx-set
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: CtxSet
      config:
        vars:
          - name: wh11_result
            from:
              type: webhook
              webhookRef: "edgion-default/wh11-resolver"
              extract:
                # Authorization is a custom Secret-sourced header with prefix "Bearer ".
                # Reading it back proves the controller resolved the K8s Secret and the
                # gateway injected "Bearer <token>" into the outbound request.
                source: body
                path: "data.echo_headers.authorization"
            default: "fallback"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wh11-route
  namespace: edgion-default
  annotations:
    edgion.io/log-ctx-keys: "wh11_result"
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "wh11.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/wh11
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: wh11-ctx-set
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

# Scenario 2: service-clusterip
# ---------------------------------------------------------------------------
# Backend resolved via kind: ServiceClusterIp -> ClusterIP DNS via kube-proxy.
# The gateway builds the URL "<svc>.<ns>.svc.cluster.local:<port>" and dials it
# via cluster DNS; it does NOT read the Service's spec.clusterIP. So this scenario
# is only reachable inside a real Kubernetes cluster. In the local (non-k8s)
# integration harness there is no cluster DNS, so the webhook call is unreachable
# and the consumer degrades to its default — the suite's service_clusterip test
# documents this as a known gap (see the suite header).
#
# Simple origin header forwarding; method/path declared explicitly.
apiVersion: v1
kind: Service
metadata:
  name: wh2-svc
  namespace: edgion-default
spec:
  type: ClusterIP
  clusterIP: 127.0.0.1
  ports:
    - name: http
      port: 30001
      targetPort: 30001
      protocol: TCP
---
apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: wh2-resolver
  namespace: edgion-default
spec:
  type: webhook
  config:
    target:
      kind: ServiceClusterIp
      name: wh2-svc
      namespace: edgion-default
      port: 30001
    request:
      path:
        template: "/webhook/resolve"
      method:
        template: "GET"
      headers:
        origin:
          - name: X-Tenant-Id
    timeoutMs: 5000
    successStatusCodes: [200]
    allowDegradation: false
    maxResponseBytes: 4096
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: wh2-ctx-set
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: CtxSet
      config:
        vars:
          - name: wh2_user_id
            from:
              type: webhook
              webhookRef: "edgion-default/wh2-resolver"
              extract:
                source: body
                path: "data.user_id"
            default: "fallback-user"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wh2-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "wh2.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/wh2
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: wh2-ctx-set
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

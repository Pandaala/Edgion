# Scenario 6: presence-warn
# ---------------------------------------------------------------------------
# An origin header (X-Optional-Trace-Id) with presence: warnIfMissing.
# Test sends a request WITHOUT X-Optional-Trace-Id -> the field is omitted from the
# outbound request, a PluginLog alert is written, and the request PROCEEDS
# (webhook still resolves successfully): warnIfMissing never escalates to a
# failure.
# Backend via Service + EndpointSlice.
apiVersion: v1
kind: Service
metadata:
  name: wh6-svc
  namespace: edgion-default
spec:
  ports:
    - name: http
      port: 30001
      targetPort: 30001
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: wh6-svc-slice
  namespace: edgion-default
  labels:
    kubernetes.io/service-name: wh6-svc
addressType: IPv4
ports:
  - name: http
    port: 30001
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true
---
apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: wh6-resolver
  namespace: edgion-default
spec:
  type: webhook
  config:
    target:
      kind: Service
      name: wh6-svc
      namespace: edgion-default
      port: 30001
    request:
      path:
        template: "/webhook/resolve"
      method:
        template: "GET"
      headers:
        origin:
          - name: X-Optional-Trace-Id
            presence: warnIfMissing
    timeoutMs: 5000
    success:
      statusCodes: [200]
    maxResponseBytes: 4096
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: wh6-ctx-set
  namespace: edgion-default
spec:
  accessLogExtern:
    - key: wh6_user_id
      from: ctx
      name: wh6_user_id
  requestPlugins:
    - enable: true
      type: WebhookKeyGet
      config:
        vars:
          - name: wh6_user_id
            webhookRef: "edgion-default/wh6-resolver"
            extract:
              source: body
              path: "data.user_id"
            default: "fallback-user"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wh6-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "wh6.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/wh6
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: wh6-ctx-set
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

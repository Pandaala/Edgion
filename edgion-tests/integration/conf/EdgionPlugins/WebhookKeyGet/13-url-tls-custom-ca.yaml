# Scenario 13: url-tls-custom-ca
# ---------------------------------------------------------------------------
# URL target over https with a custom CA (`tls.validation.caCertificateRefs`).
# Reuses the shared HTTPS backend already started by
# `scripts/utils/start_all_with_conf.sh` for the BackendTLSPolicy suite:
# `test_server --https-backend-port 30051` serves the same echo router as the
# plain-HTTP `test_server` (including `/webhook/resolve`), so the webhook
# resolves identically. The certificate is generated by
# `scripts/gen_certs/generate_backend_certs.sh` with SAN
# `DNS: localhost, backend.example.com; IP: 127.0.0.1`, and its CA is
# published as Secret `backend-ca` in `edgion-default` (used by the
# ExtProc-over-TLS suite; reused here rather than generating a second CA).
#
# `tls.enabled: true` gates custom-CA/client-cert handling; the transport
# itself is driven by the URL scheme (`https://`), so no `blockPrivate` or
# service target is involved here.
#
# Flow: HTTPRoute -> EdgionPlugins(CtxSet webhook KeyGet) -> LinkSys webhook
#       -> https://localhost:30051/webhook/resolve (test_server HTTPS backend)
apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: wh13-resolver
  namespace: edgion-default
spec:
  type: webhook
  config:
    target:
      url: "https://localhost:30051"
    tls:
      enabled: true
      validation:
        caCertificateRefs:
          - kind: Secret
            name: backend-ca
    request:
      path:
        template: "/webhook/resolve"
      method:
        template: "GET"
    timeoutMs: 5000
    successStatusCodes: [200]
    allowDegradation: false
    maxResponseBytes: 4096
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: wh13-ctx-set
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: CtxSet
      config:
        vars:
          - name: wh13_user_id
            from:
              type: webhook
              webhookRef: "edgion-default/wh13-resolver"
              extract:
                source: body
                path: "data.user_id"
            default: "fallback-user"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wh13-route
  namespace: edgion-default
  annotations:
    edgion.io/log-ctx-keys: "wh13_user_id"
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "wh13.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/wh13
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: wh13-ctx-set
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

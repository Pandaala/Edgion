# Scenario 14: url-secret-auth-header
# ---------------------------------------------------------------------------
# URL target combined with a Secret-sourced custom Authorization header
# (`request.headers.custom` templating `${secretRef:edgion-default/hook-token:token}`
# with a "Bearer " prefix). Verifies two things end to end:
#
#   (a) test_server observes the real token value in the outbound request
#       (proves the gateway injected the controller-resolved secret).
#   (b) The controller's own Admin API — `GET /configserver/LinkSys?namespace=
#       edgion-default&name=wh14-resolver` — renders the resolved secret as
#       "[redacted]", never the real token value (proves
#       `WebhookServiceConfig.resolved_secrets` carries `#[schemars(skip)]` +
#       the `redact_opt` serde adapter all the way through the URL-target
#       code path, not just the Service-target path already covered by
#       scenario 11).
#
# Flow: HTTPRoute -> EdgionPlugins(CtxSet webhook KeyGet) -> LinkSys webhook
#       -> http://localhost:30001/webhook/resolve (test_server, echoes headers)
apiVersion: v1
kind: Secret
metadata:
  name: hook-token
  namespace: edgion-default
type: Opaque
data:
  # base64 of "integration-test-secret-77"
  token: aW50ZWdyYXRpb24tdGVzdC1zZWNyZXQtNzc=
---
apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: wh14-resolver
  namespace: edgion-default
spec:
  type: webhook
  config:
    target:
      url: "http://localhost:30001"
    request:
      path:
        template: "/webhook/resolve"
      method:
        template: "GET"
      headers:
        custom:
          - name: Authorization
            template: "Bearer ${secretRef:edgion-default/hook-token:token}"
    timeoutMs: 5000
    success:
      statusCodes: [200]
    allowDegradation: false
    maxResponseBytes: 4096
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: wh14-ctx-set
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: CtxSet
      config:
        vars:
          - name: wh14_result
            from:
              type: webhook
              webhookRef: "edgion-default/wh14-resolver"
              extract:
                # Authorization is a Secret-sourced custom header with a
                # "Bearer " prefix. Reading it back proves the controller
                # resolved the K8s Secret and the gateway injected it into the
                # outbound request made to the URL target.
                source: body
                path: "data.echo_headers.authorization"
            default: "fallback"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wh14-route
  namespace: edgion-default
  annotations:
    edgion.io/log-ctx-keys: "wh14_result"
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "wh14.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/wh14
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: wh14-ctx-set
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

# Service for webhook service-target integration test.
# In local mode this is loaded for completeness; the EndpointSlice (07_*) is what
# populates the gateway's EpSliceStore with the actual ready backend address.
apiVersion: v1
kind: Service
metadata:
  name: webhook-svc-backend
  namespace: edgion-default
spec:
  ports:
    - name: http
      port: 30001
      targetPort: 30001
      protocol: TCP

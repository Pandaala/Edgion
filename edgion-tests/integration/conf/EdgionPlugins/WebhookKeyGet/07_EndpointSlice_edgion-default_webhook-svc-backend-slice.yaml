# EndpointSlice for the webhook service-target integration test.
# Provides the gateway's EpSliceStore with a ready endpoint pointing to test_server
# at 127.0.0.1:30001.  The service_key resolved by the gateway is
# "edgion-default/webhook-svc-backend" (namespace + kubernetes.io/service-name label),
# which matches the LinkSys target in 08_LinkSys_*.yaml.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: webhook-svc-backend-slice
  namespace: edgion-default
  labels:
    kubernetes.io/service-name: webhook-svc-backend
addressType: IPv4
ports:
  - name: http
    port: 30001
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true

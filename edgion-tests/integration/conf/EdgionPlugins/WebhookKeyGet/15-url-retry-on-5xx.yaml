# Scenario 15: url-retry-on-5xx
# ---------------------------------------------------------------------------
# `retry: {maxRetries: 2, retryOnStatus: [503]}` on a URL target. test_server's
# `/retry-sequence/{test_id}/{status_list}` handler returns status codes from
# `status_list` in order per `test_id` (503, then 503, then 200), tracked by a
# process-wide in-memory counter keyed by `test_id`; each response's
# `x-attempt-history` header lists every status returned so far for that
# `test_id`. Because `success.statusCodes: [200]` accepts the 3rd attempt and
# `retryOnStatus: [503]` covers the first two, the gateway must retry exactly
# twice (3 total attempts) before extracting the key.
#
# The webhook extracts `x-attempt-history` from the *final* (successful)
# response: after 3 calls to the same `test_id` its value is "503,503,200",
# which is only possible if the gateway made exactly 3 inbound requests to
# this path in this exact sequence — a stronger and more direct assertion
# than a bare request counter.
#
# `test_id` is fixed per fixture (not derived from the client's own
# `x-trace-id`) because the webhook target path is a static template with no
# per-request variables. Because the counter is process-wide and cumulative
# (never wraps once its status_list is exhausted), the test resets it via
# `/retry-sequence-reset` before driving traffic; without that reset, a rerun
# in the same `test_server` process would reuse the previous run's counter and
# the retry path would silently stop being exercised.
#
# Flow: HTTPRoute -> EdgionPlugins(CtxSet webhook KeyGet) -> LinkSys webhook
#       -> http://localhost:30001/retry-sequence/wh15-retry-seq/503,503,200
apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: wh15-resolver
  namespace: edgion-default
spec:
  type: webhook
  config:
    target:
      url: "http://localhost:30001"
    request:
      path:
        template: "/retry-sequence/wh15-retry-seq/503,503,200"
      method:
        template: "GET"
    timeoutMs: 5000
    retry:
      maxRetries: 2
      retryDelayMs: 50
      retryOnStatus: [503]
    success:
      statusCodes: [200]
    allowDegradation: false
    maxResponseBytes: 4096
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: wh15-ctx-set
  namespace: edgion-default
spec:
  accessLogExtern:
    - key: wh15_result
      from: ctx
      name: wh15_result
  requestPlugins:
    - enable: true
      type: CtxSet
      config:
        vars:
          - name: wh15_result
            from:
              type: webhook
              webhookRef: "edgion-default/wh15-resolver"
              extract:
                source: header
                name: "x-attempt-history"
            default: "fallback"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wh15-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "wh15.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/wh15
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: wh15-ctx-set
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

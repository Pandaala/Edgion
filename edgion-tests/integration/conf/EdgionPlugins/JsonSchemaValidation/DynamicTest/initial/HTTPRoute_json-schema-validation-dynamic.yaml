apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: json-schema-validation-dynamic
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - json-schema-validation-dynamic.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: json-schema-validation-dynamic
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

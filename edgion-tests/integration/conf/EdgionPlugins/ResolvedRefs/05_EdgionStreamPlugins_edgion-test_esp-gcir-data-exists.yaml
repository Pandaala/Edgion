# Scenario 3: EdgionStreamPlugins with GCIR base + overrideRef pointing to an EXISTING
# GlobalConnIpRestrictionOverride EdgionConfigData → ResolvedRefs=True
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: esp-gcir-data-exists
  namespace: edgion-test
spec:
  plugins:
    - type: GlobalConnectionIpRestriction
      config:
        base:
          enable: true
          activeProfile: main
          profiles:
            main:
              defaultAction: deny
              allow:
                - name: office
                  cidrs:
                    - "10.0.0.0/8"
        overrideRef:
          name: esp-gcir-data-exists
          namespace: edgion-test

# Scenario 3: EdgionStreamPlugins with inline GCIR config + activeProfileRef pointing to an
# EXISTING Selector EdgionConfigData → ResolvedRefs=True
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: esp-gcir-data-exists
  namespace: edgion-test
spec:
  plugins:
    - type: GlobalConnectionIpRestriction
      config:
        enable: true
        activeProfile: main
        profiles:
          main:
            defaultAction: deny
            allow:
              - name: office
                cidrs:
                  - "10.0.0.0/8"
        activeProfileRef:
          name: esp-gcir-data-exists
          namespace: edgion-test

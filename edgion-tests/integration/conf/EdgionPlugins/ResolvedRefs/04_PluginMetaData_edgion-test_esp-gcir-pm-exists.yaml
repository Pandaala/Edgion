# EdgionData of type GlobalConnectionIpRestriction — must be loaded BEFORE the ESP that references it.
apiVersion: edgion.io/v1
kind: EdgionData
metadata:
  name: esp-gcir-pm-exists
  namespace: edgion-test
spec:
  data:
    type: GlobalConnectionIpRestriction
    config:
      enable: true
      activeProfile: main
      description: "ResolvedRefs test: existing GCIR PM"
      profiles:
        main:
          defaultAction: deny
          allow:
            - name: office
              cidrs:
                - "10.0.0.0/8"

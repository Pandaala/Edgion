# Scenario 4: EdgionStreamPlugins with inline GCIR config + activeProfileRef pointing to a
# MISSING Selector EdgionConfigData → ResolvedRefs=False/InvalidEdgionConfigDataRef
# (The inline config is still valid and is used at runtime as fail-to-base.)
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: esp-gcir-data-missing
  namespace: edgion-test
spec:
  plugins:
    - type: GlobalConnectionIpRestriction
      config:
        enable: true
        activeProfile: main
        profiles:
          main:
            defaultAction: deny
            allowRefs:
              - name: acl-esp-gcir-data-missing-allow-8a2d9d3e29
        activeProfileRef:
          name: esp-gcir-data-nonexistent
          namespace: edgion-test

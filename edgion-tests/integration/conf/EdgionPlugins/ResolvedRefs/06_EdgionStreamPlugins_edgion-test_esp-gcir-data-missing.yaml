# Scenario 4: EdgionStreamPlugins with GCIR base + overrideRef pointing to a MISSING
# GlobalConnIpRestrictionOverride EdgionConfigData → ResolvedRefs=False/InvalidEdgionConfigDataRef
# (Base is still valid and will be used at runtime as fail-to-base.)
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: esp-gcir-data-missing
  namespace: edgion-test
spec:
  plugins:
    - type: GlobalConnectionIpRestriction
      config:
        base:
          enable: true
          activeProfile: main
          profiles:
            main:
              defaultAction: deny
              allow:
                - name: office
                  cidrs:
                    - "10.0.0.0/8"
        overrideRef:
          name: esp-gcir-data-nonexistent
          namespace: edgion-test

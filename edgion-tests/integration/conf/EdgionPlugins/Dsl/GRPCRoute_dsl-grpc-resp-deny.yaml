apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: dsl-grpc-resp-deny-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: grpc-test-gateway
      namespace: edgion-test
      sectionName: grpc

  hostnames:
    - "dsl-grpc-resp-deny.example.com"

  rules:
    - matches:
        - method:
            type: Exact
            service: test.TestService
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: dsl-grpc-resp-deny
      backendRefs:
        - name: test-grpc
          namespace: edgion-test
          port: 30021

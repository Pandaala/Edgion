# Verify that query reads follow the current URI after a rewrite while the
# explicit entry URI remains frozen. Read before rewriting to warm the query cache.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: dsl-freeze-query
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: Dsl
      config:
        name: "freeze-query"
        source: |
          let before = req.query("name")
          if before == nil {
            req.set_header("X-Before-Name", "MISSING")
          } else {
            req.set_header("X-Before-Name", before)
          }
          req.set_uri("/request-header-test?name=AFTER_REWRITE")
          let captured = req.query("name")
          if captured == nil {
            req.set_header("X-Captured-Name", "MISSING")
          } else {
            req.set_header("X-Captured-Name", captured)
          }
          req.set_header("X-Entry-Uri", req.request_uri)
          req.set_header("X-Current-Uri", req.uri)
        errorPolicy: deny

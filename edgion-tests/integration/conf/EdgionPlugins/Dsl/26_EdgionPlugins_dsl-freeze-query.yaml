# Verifies that req.query reads the logical current Query: after req.set_uri
# rewrites the URI to a different query, req.query("name") returns the
# rewritten value (the frozen-at-entry getter was superseded; see
# skills/03-coding/dsl/builtins-path.md).
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: dsl-freeze-query
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: Dsl
      config:
        name: "freeze-query"
        source: |
          req.set_uri("/request-header-test?name=AFTER_REWRITE")
          let captured = req.query("name")
          if captured == nil {
            req.set_header("X-Captured-Name", "MISSING")
          } else {
            req.set_header("X-Captured-Name", captured)
          }
        errorPolicy: deny

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: dsl-terminate-http-response-contract
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: Dsl
      config:
        name: "terminate-response-queued-header"
        source: |
          resp.set_header("x-dsl-queued", "response-stage")
        errorPolicy: deny
  upstreamResponseFilterPlugins:
    - enable: true
      type: Dsl
      config:
        name: "terminate-http-response-source"
        source: |
          if req.header("x-dsl-form") == "source" {
            return terminate()
          }
        errorPolicy: ignore
    - enable: true
      type: Dsl
      config:
        name: "terminate-http-response-bytecode"
        bytecode: ""
        errorPolicy: ignore
    - enable: true
      type: Dsl
      config:
        name: "terminate-http-response-follow-on"
        source: |
          return deny(409, "response-stage chain continued")
        errorPolicy: deny

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: dsl-terminate-grpc-request-contract
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: Dsl
      config:
        name: "terminate-grpc-request-source"
        source: |
          if req.header("x-dsl-form") == "source" {
            return terminate()
          }
        errorPolicy: ignore
    - enable: true
      type: Dsl
      config:
        name: "terminate-grpc-request-bytecode"
        bytecode: ""
        errorPolicy: ignore
    - enable: true
      type: Dsl
      config:
        name: "terminate-grpc-request-follow-on"
        source: |
          return grpc_error(7, "request-stage chain continued")
        errorPolicy: deny

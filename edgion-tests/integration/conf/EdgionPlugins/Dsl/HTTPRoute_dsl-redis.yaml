# HTTPRoutes for DSL redis.* builtins integration tests
# Scenario 25a: redis.set + redis.get round-trip
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dsl-redis-roundtrip-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "dsl-redis.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/dsl-redis/roundtrip
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: dsl-redis-roundtrip
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
---

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: dsl-terminate-http-request-contract
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: Dsl
      config:
        name: "terminate-http-request-source"
        source: |
          if req.header("x-dsl-form") == "source" {
            resp.set_header("x-dsl-queued", "source")
            return terminate()
          }
        errorPolicy: ignore
    - enable: true
      type: Dsl
      config:
        name: "terminate-http-request-bytecode"
        bytecode: ""
        errorPolicy: ignore
    - enable: true
      type: Dsl
      config:
        name: "terminate-http-request-follow-on"
        source: |
          return deny(409, "request-stage chain continued")
        errorPolicy: deny

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: als-sources-route
  namespace: edgion-default
  labels:
    sl: label-value
  annotations:
    sa: annotation-value
spec:
  parentRefs:
    - name: als-gateway
      namespace: edgion-test
  hostnames:
    - "accesslogextern-sources.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: als-sources
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: als-cors-preflight-route
  namespace: edgion-default
  labels:
    tier: gold
spec:
  parentRefs:
    - name: als-gateway
      namespace: edgion-test
  hostnames:
    - "accesslogextern-cors.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: als-cors-preflight
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

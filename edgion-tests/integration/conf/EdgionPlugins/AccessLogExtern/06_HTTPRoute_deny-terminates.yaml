apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: als-deny-terminates-route
  namespace: edgion-default
  annotations:
    owner: "deny-team"
spec:
  parentRefs:
    - name: als-gateway
      namespace: edgion-test
  hostnames:
    - "accesslogextern-deny.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: als-deny-terminates
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

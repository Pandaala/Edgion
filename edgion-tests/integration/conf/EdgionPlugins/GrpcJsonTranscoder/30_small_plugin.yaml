  namespace: edgion-default
spec:
  requestPlugins:
  - type: GrpcJsonTranscoder
    config:
      descriptor:
        type: inline
        base64: 
      services:
      - test.TestService
      streamFormat: ndjson
      maxRequestMessageSize: "1"

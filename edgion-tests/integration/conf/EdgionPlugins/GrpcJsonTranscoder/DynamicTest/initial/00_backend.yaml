apiVersion: v1
kind: Service
metadata:
  name: grpc-transcoder
  namespace: edgion-default
spec:
  ports:
  - name: upstream
    port: 30021
    targetPort: 30021
    protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: grpc-transcoder
  namespace: edgion-default
  labels:
    kubernetes.io/service-name: grpc-transcoder
addressType: IPv4
ports:
- name: upstream
  port: 30021
  protocol: TCP
endpoints:
- addresses:
  - 127.0.0.1
  conditions:
    ready: true

# Shared-topology owner compatibility regressions.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: grpc-body-closed
  namespace: edgion-default
spec:
  requestPlugins:
  - type: ExtProc
    config:
      grpcService:
        target: 127.0.0.1:30041
        timeoutMs: 2000
      processingMode:
        requestHeaderMode: SKIP
        requestBodyMode: NONE
        responseHeaderMode: SKIP
        responseBodyMode: STREAMED
      failureModeAllow: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpc-body-before-closed
  namespace: edgion-default
spec:
  parentRefs:
  - name: edgion-plugins-gateway
    namespace: edgion-test
  hostnames:
  - grpc-body-before-closed.example.com
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: grpc-body-closed
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: grpc-transcoder-inline
    backendRefs:
    - name: grpc-transcoder
      port: 30021
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpc-body-after-closed
  namespace: edgion-default
spec:
  parentRefs:
  - name: edgion-plugins-gateway
    namespace: edgion-test
  hostnames:
  - grpc-body-after-closed.example.com
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: grpc-transcoder-inline
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: grpc-body-closed
    backendRefs:
    - name: grpc-transcoder
      port: 30021
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: grpc-guard-closed
  namespace: edgion-default
spec:
  requestPlugins:
  - type: Guardrail
    config:
      target:
        name: test-http
        namespace: edgion-test
        port: 30001
      timeoutMs: 2000
      maxResponseBytes: 4096
      request:
        path:
          template: /guardrail/decision/pass
      windowBytes: 1
      overlapBytes: 0
      failOpen: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpc-backend-guard-closed
  namespace: edgion-default
spec:
  parentRefs:
  - name: edgion-plugins-gateway
    namespace: edgion-test
  hostnames:
  - grpc-backend-guard-closed.example.com
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: grpc-transcoder-inline
    backendRefs:
    - name: grpc-transcoder
      port: 30021
      filters:
      - type: ExtensionRef
        extensionRef:
          group: edgion.io
          kind: EdgionPlugins
          name: grpc-guard-closed
---

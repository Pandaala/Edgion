apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: grpc-bandwidth
  namespace: edgion-default
spec:
  upstreamResponseBodyFilterPlugins:
  - type: BandwidthLimit
    config:
      rate: 100kb
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: grpc-wasm-body
  namespace: edgion-default
spec:
  upstreamResponseBodyFilterPlugins:
  - type: Wasm
    config:
      source:
        file: ../../../edgion-tests/wasm/artifacts/header_demo.wasm
      pluginConfig:
        string: response-body-probe
      failOpen: false
      timeoutMs: 500
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: grpc-header-only
  namespace: edgion-default
spec:
  upstreamResponsePlugins:
  - type: Dsl
    config:
      name: grpc-header-companion
      source: resp.set_header("x-grpc-companion", "preserved")
      errorPolicy: deny
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: grpc-late-conflict
  namespace: edgion-default
spec:
  upstreamResponsePlugins:
  - type: Dsl
    config:
      name: grpc-protected-request-mutation
      source: req.set_header("content-type", "text/plain")
      errorPolicy: ignore
---

apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: aes-tls-dynamic
  namespace: edgion-test
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: aes-tls-dynamic
      sectionName: https
  validation:
    hostname: backend.example.com
    caCertificateRefs:
      - group: ""
        kind: Secret
        name: client-ca
  options:
    edgion.io/client-certificate-ref: backend-client-cert

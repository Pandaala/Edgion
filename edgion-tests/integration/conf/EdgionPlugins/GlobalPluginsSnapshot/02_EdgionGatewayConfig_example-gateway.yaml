# Override of the cluster-scoped EdgionGatewayConfig "example-gateway".
# Apply order overwrites the base config (same name), so this overlay
# duplicates the base spec verbatim and only adds globalPluginsRef.
#
# One ref is declared: gp-resp-header-modifier (defined in 01_EdgionPlugins_*.yaml).
# A request through this gateway should succeed (200) with X-Global-Plugin added.
#
# Do not add a dangling reference here: a missing global target fails closed
# (500) for every Gateway of this class, which is every suite sharing
# example-gateway. The fail-closed case uses the private Gateway in
# 04_Gateway_global-plugins-missing.yaml instead.
apiVersion: edgion.io/v1alpha1
kind: EdgionGatewayConfig
metadata:
  name: example-gateway
spec:
  server:
    downstreamKeepaliveRequestLimit: 1000

  realIp:
    trustedIpRefs:
      - name: global-realip-proxies
        namespace: edgion-test
    realIpHeader: "X-Forwarded-For"

  securityProtect:
    xForwardedForLimit: 200
    requireSniHostMatch: true
    fallbackSni: "default.example.com"

  httpTimeout:
    client:
      readTimeout: 60s
      writeTimeout: 60s
      keepaliveTimeout: 75s
    backend:
      defaultConnectTimeout: 5s
      defaultRequestTimeout: 60s
      defaultIdleTimeout: 300s

  # Mirror the base EdgionGatewayConfig (same cluster-scoped name) so this
  # overlay stays a verbatim duplicate plus globalPluginsRef. The TCPRoute
  # IdleTimeout suite depends on this value resolving to a short window; if it
  # is dropped here, whichever overlay wins the apply-order race would leave
  # example-gateway without a tcpTimeout and the L4 relay would fall back to the
  # 1h default.
  tcpTimeout:
    idleTimeout: 2s

  globalPluginsRef:
    - name: gp-resp-header-modifier
      namespace: edgion-default

# Route on the private global-plugins-missing Gateway. Without the fail-closed
# Gateway-level reference this would proxy to test_server and return 200.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: global-plugins-missing-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: global-plugins-missing
      namespace: edgion-default
  hostnames:
    - "global-plugins-missing.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/headers"
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

# DynamicExternalUpstream - Reject mode
# onMissing: reject → no header = 400
# onNoMatch: reject → unmatched key = 400
apiVersion: edgion.io/v1alpha1
kind: EdgionPlugins
metadata:
  name: deu-reject
  namespace: default
spec:
  requestPlugins:
    - type: DynamicExternalUpstream
      dye:
        request:
          - name: X-Dynamic-External-Upstream
      config:
        from:
          type: header
          name: X-Target-Region
        domainMap:
          "us":
            domain: localhost
            port: 30001
            tls: false
          "eu":
            domain: localhost
            port: 30002
            tls: false
          # TEST-NET-3 literal in the Gateway's outbound_egress_blocked_cidrs.
          "blocked":
            domain: "203.0.113.200"
            port: 30001
            tls: false
          "blocked-dns":
            domain: deu-blocked.invalid
            port: 30001
            tls: false
        onMissing: reject
        onNoMatch: reject

# HTTPRoute for DynamicExternalUpstream fallback mode test
# Normal backend (test-http:30001) is used as fallback when onMissing/onNoMatch is fallback
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: deu-skip-test
  namespace: default
spec:
  parentRefs:
    - name: deu-gateway
      namespace: edgion-test
      sectionName: http  # Port 32005
  hostnames:
    - "deu-skip-test.example.com"
  rules:
    - backendRefs:
        - name: deu-fallback
          port: 30001
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: deu-skip

# Service EdgionData for region-route-main
#
# Auto-created by Controller when EdgionPlugins/region-route-main is processed.
# References the ClusterRegionRoute EdgionData for topology; lists all regions with optional failoverTo.
apiVersion: edgion.io/v1
kind: EdgionData
metadata:
  name: region-route-main
  namespace: edgion-default
spec:
  data:
    type: ServiceRegionRoute
    config:
        clusterRef:
          namespace: edgion-default
          name: global-region-conf
        regions:
          - name: virginia
          - name: ohio

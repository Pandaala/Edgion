# D0065: two fixed consumers share one hot-swappable table; the third base is invalid.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: rrv-small
  namespace: edgion-test
spec:
  requestPlugins:
    - type: RegionRoute
      config:
        myRegion: base
        hashKeyGet:
          - type: header
            name: X-Region-Hash
        hashCalc:
          modulo: 100
        routeRules:
          - type: RouteByDirectRegion
            keyFrom:
              - type: header
                name: X-Direct-Region
          - type: RouteByHashRange
        regions:
          - name: base
            hashRange: [0, 99]
            backendEndpoint: "127.0.0.1:30001"
            tls: false
        overrideRef:
          name: rrv-overlay
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rrv-small
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      sectionName: http
  hostnames:
    - rrv-small.example.com
  rules:
    - backendRefs:
        - name: test-http
          port: 30001
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: rrv-small
---

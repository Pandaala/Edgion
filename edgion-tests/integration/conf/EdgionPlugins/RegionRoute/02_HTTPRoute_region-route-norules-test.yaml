# HTTPRoute for RegionRoute no-rules (pass-through) test.
# Normal backend test-http:30001 (edgion-test) — plugin no-op, always reaches here.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: region-route-norules-test
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
      sectionName: http  # Port 31180
  hostnames:
    - "region-route-norules.example.com"
  rules:
    - backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: region-route-norules

# ServiceRegionRoute EdgionData for region-route-myregion
#
# Pre-created by administrator. References the ClusterRegionRoute EdgionData
# that has myRegion=virginia.
#
# Per-service failover overrides:
#   ohio: failoverTo=virginia  (ohio → redirect to local myRegion → pass-through → 200)
#   europe: failoverTo=ohio    (europe → redirect to ohio → jump to loopback → 502)
apiVersion: edgion.io/v1
kind: EdgionData
metadata:
  name: region-route-myregion
  namespace: edgion-default
spec:
  data:
    type: ServiceRegionRoute
    config:
        clusterRef:
          namespace: edgion-default
          name: global-region-myregion
        regions:
          - name: virginia
          - name: ohio
            failoverTo: virginia
          - name: europe
            failoverTo: ohio

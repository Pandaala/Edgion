# ClusterRegionRoute EdgionData for region-route-norules
#
# No routeRules configured → plugin is always a no-op (pass-through).
# The norules test verifies that a RegionRoute plugin with no routeRules
# leaves traffic untouched (normal backend returns 200).
apiVersion: edgion.io/v1
kind: EdgionData
metadata:
  name: global-region-norules
  namespace: edgion-default
spec:
  data:
    type: ClusterRegionRoute
    config:
        regions:
          - name: virginia
            hashRange: [0, 599]
            backendEndpoint: "127.0.0.1:30001"
            tls: false
          - name: ohio
            hashRange: [600, 999]
            backendEndpoint: "127.0.0.1:30002"
            tls: false
        keyGet:
          - type: header
            name: X-Account-Id
        hashCalc:
          algorithm: crc32
          modulo: 1000

# HTTPRoute for RegionRoute broken-ref test.
# The referenced EdgionPlugins "region-route-broken-ref" has an clusterRegionRef
# pointing at a non-existent EdgionConfigData, so the gateway uses the base regions
# (fail-to-base) and logs "overlay_missing". The base route hits loopback → 502.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: region-route-broken-ref-test
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
      sectionName: http  # Port 31180
  hostnames:
    - "region-route-broken-ref.example.com"
  rules:
    - backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: region-route-broken-ref

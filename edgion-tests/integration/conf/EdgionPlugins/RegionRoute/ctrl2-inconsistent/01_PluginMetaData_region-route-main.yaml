# Service EdgionData for ctrl-2
#
# In the new architecture, the ClusterRegionRoute EdgionData holds topology (not per-controller EdgionDatas).
# This file is a ServiceRegionRoute EdgionData for ctrl-2, referencing the ClusterRegionRoute EdgionData via clusterRef.
apiVersion: edgion.io/v1
kind: EdgionData
metadata:
  name: region-route-main
  namespace: edgion-default
spec:
  data:
    type: ServiceRegionRoute
    config:
        clusterRef:
          namespace: edgion-default
          name: global-region-conf
        regions:
          - name: virginia
          - name: ohio

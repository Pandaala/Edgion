# RegionRoute - ctrl-2 INCONSISTENT variant (for conflict detection testing)
#
# Same namespace as region-route-main so the Center groups them together.
# All config comes from the ServiceRegionRoute EdgionData (which references the ClusterRegionRoute EdgionData via clusterRef).
# Conflict detection relies on the ClusterRegionRoute EdgionData having different content on ctrl-2
# (not in this file).
#
# Load into controller-2 to trigger conflict detection in the dashboard:
#
#   kubectl -n edgion-test port-forward controller-2 5802:12101 &
#   edgion-cli --server http://localhost:5802 login -u admin -p <your-password>
#   edgion-cli --server http://localhost:5802 apply -f \
#     edgion-tests/integration/conf/EdgionPlugins/RegionRoute/ctrl2-inconsistent/
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: region-route-main
  namespace: edgion-default
spec:
  requestPlugins:
    - type: RegionRoute
      config:
        serviceRegionRouteRef: "region-route-main"

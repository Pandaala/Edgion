# ClusterRegionSetting fixtures; routing logic references a separate setting.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: region-route-main
  namespace: edgion-default
spec:
  requestPlugins:
  - type: RegionRoute
    config:
      keyGet:
      - type: header
        name: X-Account-Id
      - type: cookie
        name: account_id
      hashKeyGet:
      - type: cookie
        name: x_region_hash
      hashCalc:
        algorithm: crc32
        modulo: 1000
        writeBack:
        - type: responseHeader
          name: X-Region-Hash
      routeRules:
      - type: RouteByDirectRegion
        keyFrom:
        - type: header
          name: X-Direct-Region
      - type: RouteByKeyConfMatch
        matchMap:
          vip-va: virginia
          vip-oh: ohio
      - type: RouteByHashRange
      routeByKeyConfMatch:
        matchMap:
          vip-va: virginia
          vip-oh: ohio
      clusterRegionRef:
        name: region-route-main-setting

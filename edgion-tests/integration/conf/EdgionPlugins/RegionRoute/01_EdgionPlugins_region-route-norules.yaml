# ClusterRegionSetting fixtures; routing logic references a separate setting.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: region-route-norules
  namespace: edgion-default
spec:
  requestPlugins:
  - type: RegionRoute
    config:
      keyGet:
      - type: header
        name: X-Account-Id
      hashCalc:
        algorithm: crc32
        modulo: 1000
      clusterRegionRef:
        name: region-route-norules-setting

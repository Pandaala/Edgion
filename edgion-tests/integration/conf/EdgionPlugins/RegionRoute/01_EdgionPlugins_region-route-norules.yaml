# RegionRoute - no routeRules -> plugin is always a no-op (passes through)
#
# Base config has regions and hashCalc but NO routeRules.
# The plugin short-circuits with no_region_route_config when route_rules is empty,
# or simply passes through since no rule evaluates.
# The norules test verifies that traffic passes through unchanged (normal backend returns 200).
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: region-route-norules
  namespace: edgion-default
spec:
  requestPlugins:
    - type: RegionRoute
      config:
        regions:
          - name: virginia
            hashRange: [0, 599]
            backendEndpoint: "127.0.0.1:30001"
            tls: false
          - name: ohio
            hashRange: [600, 999]
            backendEndpoint: "127.0.0.1:30002"
            tls: false
        keyGet:
          - type: header
            name: X-Account-Id
        hashCalc:
          algorithm: crc32
          modulo: 1000

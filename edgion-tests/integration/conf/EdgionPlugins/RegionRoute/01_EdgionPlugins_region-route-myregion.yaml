# ClusterRegionSetting fixtures; routing logic references a separate setting.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: region-route-myregion
  namespace: edgion-default
spec:
  requestPlugins:
  - type: RegionRoute
    dye:
      request:
      - name: X-Region
    config:
      keyGet:
      - type: header
        name: X-Account-Id
      routeRules:
      - type: RouteByDirectRegion
        keyFrom:
        - type: header
          name: X-Direct-Region
      clusterRegionRef:
        name: region-route-myregion-setting

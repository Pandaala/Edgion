apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-gateway-card
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgion-plugins-gateway
  hostnames: [a2a-card.example.com]
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /.well-known/agent-card.json
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: a2a-gateway-card
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-gateway-rpc-close
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgion-plugins-gateway
  hostnames: [a2a-rpc-close.example.com]
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: a2a-gateway-rpc-close
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: a2a-gateway-backend
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-gateway-rpc-open
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgion-plugins-gateway
  hostnames: [a2a-rpc-open.example.com]
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: a2a-gateway-rpc-open
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: a2a-gateway-backend

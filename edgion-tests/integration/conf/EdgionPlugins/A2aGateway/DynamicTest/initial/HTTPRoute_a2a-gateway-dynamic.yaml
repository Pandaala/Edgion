apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: a2a-gateway-dynamic
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgion-plugins-gateway
  hostnames: [a2a-card-dynamic.example.com]
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /.well-known/agent-card.json
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: a2a-gateway-dynamic

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: a2a-gateway-dynamic
  namespace: edgion-test
spec:
  requestPlugins:
    - type: A2aGateway
      config:
        externalUrl: https://dynamic.agent.example
        card:
          name: Dynamic agent
          description: A2A Gateway hot-reload fixture
          version: 2.0.0
          capabilities: {}
          supportedInterfaces:
            - url: https://private.agent.invalid/rpc-v2?source=card
              protocolBinding: JSONRPC
              protocolVersion: "1.0"
          defaultInputModes: [application/json]
          defaultOutputModes: [application/json]
          skills:
            - id: echo
              name: Echo
              description: Echo a message
              tags: [test]

# Path Normalization Scenario 03 — TC-F: invalid annotation value falls through to default
#
# Annotation `edgion.io/forward-raw-path: "yes"` is NOT a valid tri-state value
# (only "true" / "false" are accepted). The controller logs INFO and treats it
# as None → falls through to default flow (normalized forwarding).
#
# Spec §14.6 invalid value handling:
#   - "true" / "false" → Some(true) / Some(false)
#   - any other string  → None + tracing::info! warning
#
# Expected: upstream receives /api/data (normalized — default flow), behavior
# identical to no-annotation TC-A.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forward-view-invalid-annotation
  namespace: edgion-default
  annotations:
    edgion.io/forward-raw-path: "yes"  # invalid — should be "true" or "false"
spec:
  hostnames: [path-fwd-invalid.example.com]
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

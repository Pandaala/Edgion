# PathNormalization Scenario 03 — ForwardView (default: no annotation)
#
# Host: path-fwd-default.example.com
# Gateway: reuses edgion-plugins-gateway (edgion-test namespace)
#
# No annotation on this route; the gateway forwards the normalized path by default
# (forward_normalized_path: true in gateway YAML is the compiled-in default).
#
# TC-A manual verification:
#   curl -i -H "Host: path-fwd-default.example.com" \
#     "http://127.0.0.1:31180/%61pi/data?x=1"
#   # Expected: backend echoes Path: /api/data (normalized, percent-decoded)
#   # Expected query: ?x=1 unchanged
#
# Automated test: /%61pi/data routes to PathPrefix /api → 200
# (normalization enables the route match; the echo path assertion verifies forwarding)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forward-view-default
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "path-fwd-default.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

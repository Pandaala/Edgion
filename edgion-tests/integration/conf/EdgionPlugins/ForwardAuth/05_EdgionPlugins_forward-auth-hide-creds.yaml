# ForwardAuth with hideCredentials = true
# After successful auth, the original Authorization header is removed from the upstream request
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: forward-auth-hide-creds
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ForwardAuth
      config:
        target:
          name: auth-svc
          namespace: edgion-default
          port: 30040
        timeoutMs: 5000
        request:
          path:
            template: "/verify"
          method:
            template: "GET"
          headers:
            forwardAll: true
        decision:
          upstreamHeaders:
            - X-User-ID
            - X-User-Role
          clientHeaders:
            - WWW-Authenticate
          hideCredentials: true

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: geo-gac-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: geo-restriction-gw
      namespace: edgion-test
  hostnames:
    - "geo-gac.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: geo-gac
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

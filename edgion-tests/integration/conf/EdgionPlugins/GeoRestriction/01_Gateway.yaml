# Dedicated Gateway for the EdgionPlugins GeoRestriction suite (port 31950,
# see ports.json "EdgionPlugins/GeoRestriction"). ClientGeo needs real_ip
# configured with a trusted-proxy set; the shared base EdgionGatewayConfig
# ("example-gateway", which every "public-gateway"-class Gateway uses)
# already carries `realIp.trustedIps: [... "127.0.0.0/8" ...]`
# (edgion-tests/integration/conf/base/EdgionGatewayConfig.yaml), which covers
# every loopback source address this suite uses — no private EdgionGatewayConfig
# override is needed here.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: geo-restriction-gw
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 31950
      allowedRoutes:
        namespaces:
          from: All

# Named selection must inspect even the denied weight-zero slot.
# Weighted-denied reverses the weights to exercise the real RefDenied log path.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: named-jump-denied
  namespace: default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
      sectionName: http
  hostnames: ["named-jump-denied.example.com"]
  rules:
    - matches:
        - headers:
            - name: X-Named-Jump-Case
              value: diu-reject
      backendRefs:
        - name: diu-backend-stable
          port: 30001
          weight: 1
        - name: named-jump-denied
          namespace: named-jump-target
          port: 30002
          weight: 0
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: named-jump-diu-reject
    - matches:
        - headers:
            - name: X-Named-Jump-Case
              value: diu-fallback
      backendRefs:
        - name: diu-backend-stable
          port: 30001
          weight: 1
        - name: named-jump-denied
          namespace: named-jump-target
          port: 30002
          weight: 0
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: named-jump-diu-fallback
    - matches:
        - headers:
            - name: X-Named-Jump-Case
              value: canary-reject
      backendRefs:
        - name: diu-backend-stable
          port: 30001
          weight: 1
        - name: named-jump-denied
          namespace: named-jump-target
          port: 30002
          weight: 0
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: named-jump-canary-reject
    - matches:
        - headers:
            - name: X-Named-Jump-Case
              value: canary-fallback
      backendRefs:
        - name: diu-backend-stable
          port: 30001
          weight: 1
        - name: named-jump-denied
          namespace: named-jump-target
          port: 30002
          weight: 0
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: named-jump-canary-fallback
    - matches:
        - headers:
            - name: X-Named-Jump-Case
              value: legal-control
      backendRefs:
        - name: diu-backend-stable
          port: 30001
          weight: 1
        - name: named-jump-denied
          namespace: named-jump-target
          port: 30002
          weight: 0
    - matches:
        - headers:
            - name: X-Named-Jump-Case
              value: weighted-denied
      backendRefs:
        - name: diu-backend-stable
          port: 30001
          weight: 0
        - name: named-jump-denied
          namespace: named-jump-target
          port: 30002
          weight: 1

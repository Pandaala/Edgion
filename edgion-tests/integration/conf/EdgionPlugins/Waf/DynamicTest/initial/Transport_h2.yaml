apiVersion: v1
kind: Service
metadata:
  name: waf-transport-h2
  namespace: edgion-default
spec:
  ports:
    - port: 30031
      targetPort: 30031
      protocol: TCP
      appProtocol: kubernetes.io/h2c
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: waf-transport-h2
  namespace: edgion-default
  labels:
    kubernetes.io/service-name: waf-transport-h2
addressType: IPv4
endpoints:
  - addresses: ["127.0.0.1"]
    conditions:
      ready: true
ports:
  - port: 30031
    protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waf-transport-h2
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - waf-transport-h2.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: waf-dynamic
      backendRefs:
        - name: waf-transport-h2
          port: 30031

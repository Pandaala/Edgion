apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: waf-dynamic
  namespace: edgion-default
spec:
  waf:
    mode: on
    requestBody:
      inspection: full
    rules: |
      SecRule REQUEST_HEADERS:X-Waf-Sql "@detectSQLi" "id:3501,phase:1,deny,status:403,t:urlDecodeUni,capture"
      SecRule REQUEST_HEADERS:X-Waf-Xss "@detectXSS" "id:3502,phase:1,deny,status:406,t:urlDecodeUni"

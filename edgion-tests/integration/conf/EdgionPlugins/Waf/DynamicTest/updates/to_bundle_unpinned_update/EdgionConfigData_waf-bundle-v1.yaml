apiVersion: edgion.io/v1
kind: EdgionConfigData
metadata:
  name: waf-bundle-v1
  namespace: edgion-default
spec:
  data:
    type: WafRuleBundle
    config:
      version: "1"
      profile: integration
      provenance: edgion-tests/waf-bundle
      roots: [main.conf]
      rules:
        - name: main.conf
          content: |
            Include child.conf
        - name: child.conf
          content: |
            SecRule REQUEST_HEADERS:X-Waf-Version "@pmFromFile phrases.data" "id:2001,phase:1,deny,status:451"
      phraseAssets:
        - name: phrases.data
          content: |
            v2

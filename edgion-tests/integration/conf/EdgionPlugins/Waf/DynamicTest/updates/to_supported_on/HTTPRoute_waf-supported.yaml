apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waf-supported
  namespace: edgion-default
spec:
  hostnames:
  - waf-supported.example.com
  parentRefs:
  - name: edgion-plugins-gateway
    namespace: edgion-test
  rules:
  - backendRefs:
    - name: test-http
      namespace: edgion-test
      port: 30001
    filters:
    - extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: waf-dynamic
      type: ExtensionRef

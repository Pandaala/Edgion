apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dsl-xml-dynamic-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames: [dsl-xml-dynamic.example.com]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: ExtensionRef
          extensionRef: {group: edgion.io, kind: EdgionPlugins, name: dsl-xml-dynamic}
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

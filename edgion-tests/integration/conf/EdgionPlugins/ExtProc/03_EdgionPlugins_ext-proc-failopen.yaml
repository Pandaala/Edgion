# ExtProc fail-open test: the processor target points at a dead port (nothing
# listens on 30099), so the gRPC exchange fails. With failureModeAllow=true the
# request is forwarded unprocessed (degraded mode) and reaches the backend.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ext-proc-failopen
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ExtProc
      config:
        grpcService:
          target: "127.0.0.1:30099"
          timeoutMs: 500
        processingMode:
          requestHeaderMode: SEND
        failureModeAllow: true

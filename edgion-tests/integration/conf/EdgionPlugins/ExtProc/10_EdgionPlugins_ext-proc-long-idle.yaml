# Full-test-only ExtProc long-idle fixture. The processor waits three seconds
# before returning the request-headers verdict; the transaction timeout leaves
# enough headroom to distinguish a healthy idle stream from a timeout test.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ext-proc-long-idle
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ExtProc
      config:
        grpcService:
          target: "127.0.0.1:30041"
          timeoutMs: 10000
        processingMode:
          requestHeaderMode: SEND
          responseHeaderMode: SEND
        failureModeAllow: false

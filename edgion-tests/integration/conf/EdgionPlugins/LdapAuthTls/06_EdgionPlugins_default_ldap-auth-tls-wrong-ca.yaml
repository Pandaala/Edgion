apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ldap-auth-tls-wrong-ca-test
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: LdapAuth
      config:
        ldapHost: "127.0.0.1"
        ldapPort: 33636
        ldaps: true
        baseDn: "ou=people,dc=example,dc=org"
        attribute: "uid"
        headerType: "ldap"
        realm: "LDAP wrong CA"
        timeout: 3000
        tls:
          # A self-signed CA that does NOT match the server cert — TLS will fail with certificate verify error.
          # CA material stored in Secret ldap-wrong-ca-bundle (05b_Secret_default_ldap-wrong-ca-bundle.yaml).
          validation:
            caCertificateRefs:
              - kind: Secret
                name: ldap-wrong-ca-bundle

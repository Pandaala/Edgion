# Self-signed CA that does NOT match the LDAP server cert — used by the
# ldap-auth-tls-wrong-ca test to prove TLS verification fails when a wrong
# CA is trusted. Created from the inline caCert that previously lived directly
# in the EdgionPlugins fixture (inline CA is no longer supported by OutboundTlsLocal).
apiVersion: v1
kind: Secret
metadata:
  name: ldap-wrong-ca-bundle
  namespace: edgion-default
type: Opaque
data:
  ca.crt: 

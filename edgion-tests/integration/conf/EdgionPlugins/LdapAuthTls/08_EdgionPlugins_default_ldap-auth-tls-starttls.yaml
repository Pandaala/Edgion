apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ldap-auth-tls-starttls-test
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: LdapAuth
      config:
        ldapHost: "127.0.0.1"
        ldapPort: 33389
        ldaps: false
        startTls: true
        baseDn: "ou=people,dc=example,dc=org"
        attribute: "uid"
        headerType: "ldap"
        realm: "LDAP STARTTLS Test"
        timeout: 5000
        tls:
          validation:
            caCertificateRefs:
              - kind: Secret
                name: ldap-ca-bundle

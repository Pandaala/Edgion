apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ldap-auth-tls-search-test
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: LdapAuth
      config:
        ldapHost: "127.0.0.1"
        ldapPort: 33636
        ldaps: true
        baseDn: "ou=people,dc=example,dc=org"
        attribute: "uid"
        bindDn: "cn=admin,dc=example,dc=org"
        bindPasswordRef:
          name: ldap-search-bind
        searchBase: "dc=example,dc=org"
        searchFilter: "(&(objectClass=inetOrgPerson)(uid={username}))"
        headerType: "ldap"
        realm: "LDAP Search Test"
        timeout: 5000
        tls:
          validation:
            caCertificateRefs:
              - kind: Secret
                name: ldap-ca-bundle

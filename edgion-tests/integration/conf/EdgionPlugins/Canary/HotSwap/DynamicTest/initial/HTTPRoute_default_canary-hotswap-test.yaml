apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: canary-hotswap-test
  namespace: default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
      sectionName: http  # Port 31180
  hostnames:
    - "canary-hotswap-test.example.com"
  rules:
    - backendRefs:
        - name: canary-hotswap-v1
          port: 30001
        - name: canary-hotswap-v2
          port: 30002
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: canary-hotswap-switch

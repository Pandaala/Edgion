# Canary profile resolves to a backend that is NOT present in the matching
# HTTPRoute's backendRefs (07_HTTPRoute_default_canary-invalid-fallback-test.yaml
# only lists canary-app-v1). onInvalid: fallback => fall through to the
# route's own backendRefs selection instead of taking the route down.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: canary-invalid-fallback
  namespace: default
spec:
  requestPlugins:
    - enable: true
      type: Canary
      config:
        enable: true
        activeProfile: canary
        profiles:
          stable:
            name: canary-app-v1
          canary:
            name: canary-app-v2
        onInvalid: fallback

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rlr-dye-fail-close-test
  namespace: default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
      sectionName: http  # Port 31180
  hostnames:
    - "rlr-dye-fail-close.example.com"
  rules:
    - backendRefs:
        - name: canary-app-v1
          port: 30001
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: rlr-dye-fail-close

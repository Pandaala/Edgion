apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-bearer
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-custom
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
        target:
          type: Header
          name: X-Provider-Key
          valuePrefix: "Token "
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-later-rewrite
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
        target:
          type: Header
          name: X-Provider-Key
    - type: ProxyRewrite
      config:
        headers:
          set:
            - name: X-Provider-Key
              value: later-plugin-value
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-later-route-modifier
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
        target:
          type: Header
          name: X-Provider-Key
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-double
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
        target:
          type: Header
          name: X-Provider-Key
          valuePrefix: "First "
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
        target:
          type: Header
          name: X-Provider-Key
          valuePrefix: "Second "
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-missing
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-missing-token
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-mirror
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
    - type: RequestMirror
      config:
        backendRef:
          name: test-http
          namespace: edgion-test
          port: 30001
        connectTimeoutMs: 500
        writeTimeoutMs: 1000
        maxBufferedChunks: 10
        maxConcurrent: 100

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: gac-ip-outside
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: GlobalAccessControl
      config:
        enable: true
        activeProfile: lockdown
        status: 403
        message: "forbidden: origin accepts CDN traffic only"
        profiles:
          normal:
            defaultAction: allow
            ruleGroups: []
          lockdown:
            defaultAction: deny
            ruleGroups:
              - name: cloudflare
                ip:
                  - name: outside
                    cidrs: ["10.0.0.0/8"]
                rules:
                  - source: Header
                    key: "X-CF-Secret"
                    secretRef:
                      name: gac-origin-secret
                      namespace: edgion-test
                    onMissing: NoMatch

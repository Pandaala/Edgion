# ServiceRegionRoute EdgionData for pm-managed test
apiVersion: edgion.io/v1
kind: EdgionData
metadata:
  name: pm-managed
  namespace: edgion-default
spec:
  data:
    type: ServiceRegionRoute
    config:
        clusterRef:
          namespace: edgion-default
          name: pm-managed-global
        regions:
          - name: east
          - name: west

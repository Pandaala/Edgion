# ClusterRegionRoute EdgionData for pm-managed test
apiVersion: edgion.io/v1
kind: EdgionData
metadata:
  name: pm-managed-global
  namespace: edgion-default
spec:
  data:
    type: ClusterRegionRoute
    config:
        regions:
          - name: east
            hashRange: [0, 499]
            backendEndpoint: "127.0.0.1:30001"
            tls: false
          - name: west
            hashRange: [500, 999]
            backendEndpoint: "127.0.0.1:30002"
            tls: false
        keyGet:
          - type: header
            name: X-Account-Id
        hashCalc:
          algorithm: crc32
          modulo: 1000
        routeRules:
          - type: RouteByHashRange

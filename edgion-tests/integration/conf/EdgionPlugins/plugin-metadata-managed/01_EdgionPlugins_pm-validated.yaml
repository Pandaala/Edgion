# EdgionDataManagedRegionRoute - Scenario 2: pre-created RegionRouteOverride overlay (pm-validated)
#
# An EdgionPlugins with overrideRef pointing to a pre-created RegionRouteOverride EdgionData.
# The EdgionData "pm-validated" must be created by administrators before applying this file.
#
# Verification: GET /configserver/EdgionPlugins?namespace=edgion-default&name=pm-validated
# should return data with status.conditions Accepted=True and ResolvedRefs=True.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: pm-validated
  namespace: edgion-default
spec:
  requestPlugins:
    - type: RegionRoute
      config:
        regions:
          - name: east
            hashRange: [0, 499]
            backendEndpoint: "127.0.0.1:30001"
            tls: false
          - name: west
            hashRange: [500, 999]
            backendEndpoint: "127.0.0.1:30002"
            tls: false
        keyGet:
          - type: header
            name: X-Account-Id
        hashCalc:
          algorithm: crc32
          modulo: 1000
        routeRules:
          - type: RouteByHashRange
        overrideRef:
          name: "pm-validated"
          namespace: edgion-default

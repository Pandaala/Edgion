apiVersion: edgion.io/v1alpha1
kind: EdgionPlugins
metadata:
  name: direct-endpoint
  namespace: default
spec:
  requestPlugins:
    - type: DirectEndpoint
      dye:
        response:
          - name: X-Direct-Endpoint   # response header, used by the suite for verification
      config:
        from:
          type: header
          name: x-target-ip
        onMissing: fallback # Allow requests to pass normally if header is missing
        onInvalid: reject   # Reject if IP is not valid or not in backend endpoints
        inheritTls: false

# HTTPRoute for MatchedRouteMeta integration test
# Carries labels and annotations that the ctx_set template reads at runtime.
# Expected rendered value:
#   meta-route|edgion-it|web|team-a|platform
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: meta-route
  namespace: edgion-it
  labels:
    app: web
    edgion.io/team: team-a
  annotations:
    owner: platform
    # Opt-in: project the rendered route_meta ctx var into the access log.
    edgion.io/log-ctx-keys: "route_meta"
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "matched-route-meta.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/matched-route-meta
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: matched-route-meta-plugin
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

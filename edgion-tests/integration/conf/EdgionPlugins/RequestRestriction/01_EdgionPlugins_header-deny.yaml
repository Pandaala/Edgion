# 1. Header  -  Bot User-Agent
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: request-restriction-header-deny
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: RequestRestriction
      config:
        mode: Deny
        conditions:
          anyOf:
            - allOf:
                - type: keyMatch
                  key:
                    type: header
                    name: "User-Agent"
                  regex:
                    - "(?i).*Bot.*"
                    - "(?i).*Spider.*"
                    - "(?i).*Crawler.*"
        status: 403
        message: "Bot access denied"

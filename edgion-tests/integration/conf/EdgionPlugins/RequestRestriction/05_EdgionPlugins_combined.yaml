# 5. Combined deny groups
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: request-restriction-combined
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: RequestRestriction
      config:
        mode: Deny
        conditions:
          anyOf:
            - type: keyMatch
              key:
                type: header
                name: "User-Agent"
              regex:
                - "(?i).*Bot.*"
            - allOf:
                - type: keyMatch
                  key:
                    type: path
                  regex:
                    - ".*/admin/.*"
                    - ".*/internal/.*"
            - type: keyMatch
              key:
                type: cookie
                name: "debug"
              values:
                - "true"
                - "1"
        status: 403
        message: "Access denied by security policy"

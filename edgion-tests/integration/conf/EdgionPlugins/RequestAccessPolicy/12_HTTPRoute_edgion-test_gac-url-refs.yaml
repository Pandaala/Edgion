apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gac-url-refs
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "gac-url.example.com"
    - "wrong.example.com"
  rules:
    - matches:
        - path: {type: PathPrefix, value: /test/gac/url}
      filters:
        - type: ExtensionRef
          extensionRef: {group: edgion.io, kind: EdgionPlugins, name: gac-url-refs}
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: gac-lockdown
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: RequestAccessPolicy
      config:
        defaultProfile: lockdown
        status: 403
        message: "forbidden: origin accepts CDN traffic only"
        activeProfileRef:
          name: gac-selector
          namespace: edgion-test
        profiles:
          normal:
            requiredRuleGroups:
              - name: source
                anyOfRules:
                  - name: none
                    type: directPeerIp
                    config:
                      ipRefs:
                        - name: gac-documentation-ips
          lockdown:
            requiredRuleGroups:
              - name: source
                anyOfRules:
                  - name: cloudflare
                    type: directPeerIp
                    config:
                      ipRefs:
                        - name: gac-lockdown-ips
                      conditions:
                        allOf:
                          - type: secretMatch
                            key:
                              type: header
                              name: X-CF-Secret
                            secretKey: token
                            secretRef:
                              name: gac-origin-secret
                              namespace: edgion-test

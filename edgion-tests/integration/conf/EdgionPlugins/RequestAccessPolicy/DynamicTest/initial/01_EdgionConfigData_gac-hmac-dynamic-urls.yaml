apiVersion: edgion.io/v1
kind: EdgionConfigData
metadata:
  name: gac-hmac-dynamic-urls
  namespace: edgion-default
spec:
  data:
    type: RequestAccessUrlAllowList
    config:
      items:
        - name: signed-health
          hosts: [gac-hmac-dynamic.example.com]
          paths: [{type: Exact, value: /health}]
          allOf:
            - type: hmacAuth
              secretGroups:
                - name: dynamic
                  secretRefs: [{name: gac-hmac-dynamic}]
              algorithms: [hmac-sha256]
              enforceHeaders: ["@request-target", host, date]

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: gac-hmac-dynamic
  namespace: edgion-default
spec:
  requestPlugins:
    - type: RequestAccessPolicy
      config:
        defaultProfile: lockdown
        profiles:
          lockdown:
            requiredRuleGroups:
              - name: signed
                anyOfRules:
                  - name: hmac
                    type: url
                    config:
                      configRefs: [{name: gac-hmac-dynamic-urls}]
                  - name: explicit-fallback
                    type: directPeerIp
                    config:
                      ipRefs:
                        - name: hmac-fallback-ip-list
                      conditions:
                        allOf:
                          - type: keyMatch
                            key: {type: header, name: X-Hmac-Fallback}
                            values: ["allow"]

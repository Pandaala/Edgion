apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gac-test-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "gac.example.com"
  rules:
    - matches:
        - path: { type: PathPrefix, value: /test/gac/lockdown }
      filters:
        - type: ExtensionRef
          extensionRef: { group: edgion.io, kind: EdgionPlugins, name: gac-lockdown }
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
    - matches:
        - path: { type: PathPrefix, value: /test/gac/ip-outside }
      filters:
        - type: ExtensionRef
          extensionRef: { group: edgion.io, kind: EdgionPlugins, name: gac-ip-outside }
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

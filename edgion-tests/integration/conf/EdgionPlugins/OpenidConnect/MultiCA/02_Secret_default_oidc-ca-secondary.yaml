# Secondary CA Secret for the MultiCA OIDC scenario.
# Together with 01_Secret_default_oidc-ca-primary.yaml, forms a two-CA trust
# list in caCertificateRefs, verifying that multiple CA entries are accepted.
#
# NOTE: Dummy PEM — not a real certificate. Replace with actual CA material
# when running live integration tests against a TLS OIDC provider.
apiVersion: v1
kind: Secret
metadata:
  name: oidc-ca-secondary
  namespace: edgion-default
type: Opaque
data:
  # Dummy base64-encoded PEM placeholder (not a real certificate).
  ca.crt: 

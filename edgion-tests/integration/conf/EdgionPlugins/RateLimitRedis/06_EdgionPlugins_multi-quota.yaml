apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: redis-multi-quota
  namespace: edgion-default
spec:
  requestPlugins:
    - type: RateLimitRedis
      alias: budgets
      config:
        redisRef: default/redis-test
        requestTimeout: 2s
        onRedisFailure: Deny
        responseQuota: user
        quotas:
          - name: tenant
            key: [{type: header, name: X-Tenant}]
            onKeyMiss: Deny
            policies: [{rate: 4, interval: 2h, algorithm: FixedWindow}]
          - name: user
            key: [{type: header, name: X-Tenant}, {type: header, name: X-User}]
            onKeyMiss: Deny
            policies: [{rate: 2, interval: 2h, algorithm: FixedWindow}]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: redis-multi-quota
  namespace: edgion-default
spec:
  parentRefs: [{name: edgion-plugins-gateway, namespace: edgion-test}]
  hostnames: [redis-multi-quota.example.com]
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef: {group: edgion.io, kind: EdgionPlugins, name: redis-multi-quota}
      backendRefs: [{name: test-http, namespace: edgion-test, port: 30001}]

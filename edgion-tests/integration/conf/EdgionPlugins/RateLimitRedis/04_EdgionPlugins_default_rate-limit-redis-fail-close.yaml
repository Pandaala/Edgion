apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: rate-limit-redis-fail-close
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: RateLimitRedis
      config:
        redisRef: "default/redis-not-found"
        onRedisFailure: Deny
        rejectStatus: 429
        rejectMessage: "Redis unavailable (deny)"
        showLimitHeaders: true
        keyPrefix: "edgion:it:rlr:fail-close:"
        quotas:
          - name: default
            policies:
              - rate: 3
                interval: "10s"
                algorithm: SlidingWindow
            key:
              - type: header
                name: "X-Rate-Key"
            onKeyMiss: Deny

{
  "apiVersion": "gateway.networking.k8s.io/v1",
  "kind": "HTTPRoute",
  "metadata": {
    "name": "graphql-router-backend-owner",
    "namespace": "edgion-default"
  },
  "spec": {
    "parentRefs": [
      {
        "name": "edgion-plugins-gateway",
        "namespace": "edgion-test"
      }
    ],
    "hostnames": [
      "graphql-router-backend-owner.example.com"
    ],
    "rules": [
      {
        "matches": [
          {
            "path": {
              "type": "Exact",
              "value": "/echo"
            }
          },
          {
            "path": {
              "type": "Exact",
              "value": "/graphql-routing-get"
            }
          }
        ],
        "filters": [
          {
            "type": "ExtensionRef",
            "extensionRef": {
              "group": "edgion.io",
              "kind": "EdgionPlugins",
              "name": "graphql-router"
            }
          }
        ],
        "backendRefs": [
          {
            "name": "graphql-users",
            "port": 30001,
            "filters": [
              {
                "type": "ExtensionRef",
                "extensionRef": {
                  "group": "edgion.io",
                  "kind": "EdgionPlugins",
                  "name": "graphql-router-backend-guard"
                }
              }
            ]
          },
          {
            "name": "graphql-orders",
            "port": 30002
          },
          {
            "name": "graphql-core",
            "port": 30003
          },
          {
            "name": "graphql-remote",
            "namespace": "graphql-other",
            "port": 30002,
            "weight": 0
          }
        ]
      },
      {
        "matches": [
          {
            "path": {
              "type": "Exact",
              "value": "/health"
            }
          }
        ],
        "backendRefs": [
          {
            "name": "graphql-core",
            "port": 30003
          }
        ]
      }
    ]
  }
}

{
  "apiVersion": "discovery.k8s.io/v1",
  "kind": "EndpointSlice",
  "metadata": {
    "name": "graphql-remote-slice",
    "namespace": "graphql-other",
    "labels": {
      "kubernetes.io/service-name": "graphql-remote"
    }
  },
  "addressType": "IPv4",
  "ports": [
    {
      "name": "http",
      "port": 30002,
      "protocol": "TCP"
    }
  ],
  "endpoints": [
    {
      "addresses": [
        "127.0.0.1"
      ],

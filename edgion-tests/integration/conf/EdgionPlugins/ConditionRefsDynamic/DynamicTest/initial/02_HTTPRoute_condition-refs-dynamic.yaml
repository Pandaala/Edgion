apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: condition-refs-dynamic
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - condition-refs-dynamic.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: condition-refs-dynamic
      backendRefs:
        - name: condition-refs-dynamic-backend
          port: 30001

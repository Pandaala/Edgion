# tls-F011 mtls_failclose HTTPRoute
# Routes three SNI hostnames to the standard echo backend. The handshake aborts
# before any request reaches the backend, so the backend identity is irrelevant —
# the route is needed only for the listener to register a non-empty route table.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mtls-failclose-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: mtls-failclose-gateway
      namespace: edgion-test
  # Note: parentRef targets both listeners (no sectionName); TLS handshake fails before
  # route lookup, so the overlap (frontend-mtls-garbage on both listeners) is benign.
  hostnames:
    - mtls-ca-missing.example.com
    - mtls-ca-garbage.example.com
    - frontend-mtls-garbage.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

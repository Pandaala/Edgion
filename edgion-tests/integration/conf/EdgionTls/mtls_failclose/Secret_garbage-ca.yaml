# tls-F011 case 2 garbage CA payload. The `ca.crt` field decodes to the literal
# bytes `not a pem`, which X509::stack_from_pem rejects, triggering
# add_ca_bundle_to_store's `Invalid CA certificate PEM` Err leg.
apiVersion: v1
kind: Secret
metadata:
  name: garbage-ca
  namespace: edgion-test
type: Opaque
data:
  ca.crt: bm90IGEgcGVt

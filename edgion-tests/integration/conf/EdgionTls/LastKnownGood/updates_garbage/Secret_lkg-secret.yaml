# tls-06 last-known-good: the INVALID (key/cert mismatch) update.
#
# Same Secret name/namespace as the initial valid one. Both tls.crt and tls.key
# are structurally valid PEM, but the private key does NOT match the certificate.
# The cert is a DISTINCT valid cert (different serial than the initial one, same
# SAN DNS:lkg.example.com) so the serial-equality assertion in the fallback phase
# is meaningful: if the gateway wrongly served this new cert the serial would
# differ from the stashed (initial) serial.
#
# Why a key/cert mismatch specifically: it is a realistic content-invalid cert
# (the classic cert-manager rotation-race symptom) whose validation message
# ("Key mismatch: ...") carries NO digits, so the fallback phase's
# "message contains no wall-clock year" determinism guard is unambiguous. An
# expired cert would also reach the cert-content path, but its status_message
# embeds the validity-window years (e.g. 2020), which would trip that guard. (A
# non-PEM payload would ALSO reach the cert-content path as CertParseError ->
# InvalidCertificate; mismatch is simply the cleanest fixture for this test.)
# In all these cases validate() leaves the Accepted condition clean, the EdgionTls
# is still pushed to the gateway, the controller reports
# ResolvedRefs=False/reason=InvalidCertificate (see
# edgion_tls.rs::test_validate_detects_cert_key_mismatch), and the gateway's
# insert_or_retain keeps serving the previously bound valid cert (last-known-good).
apiVersion: v1
kind: Secret
metadata:
  name: lkg-secret
  namespace: edgion-test
type: kubernetes.io/tls
data:
  tls.crt: 
  tls.key: 

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: edgiontls-https-http2-disabled
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgiontls-https-http2-disabled
      namespace: edgion-test
      sectionName: https
  hostnames:
    - test.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /secure
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

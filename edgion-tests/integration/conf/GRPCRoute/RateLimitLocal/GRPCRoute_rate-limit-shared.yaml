# gRPC RateLimitLocal end-to-end smoke route (match-item / K dimension).
#
# ONE rule with TWO match-items (variant=a / variant=b) routing the same method
# (SayHello, unary) under one rule-level RateLimitLocal. The client asserts that the
# rule enforces ONE global budget across both match-items (11th request rejected).
#
# SCOPE NOTE: this is a smoke test, NOT a "rule-runtime shared across units" pin.
# RateLimitLocal is an ExtensionRef -> EdgionPlugins plugin; its CMS lives in the global
# PluginStore keyed by EdgionPlugins identity (plugins/http/plugin_store.rs:132,173),
# resolved per request (gateway_api_filters/extension_ref.rs:131-146). A per-unit
# runtime rebuild would NOT split the CMS — both match-items still resolve the same
# global instance — so the global-budget assertion holds regardless of rule-runtime
# sharing. See tasks/review-decouple/grpc-01-... for the analysis.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-ratelimit-shared
  namespace: edgion-test
spec:
  parentRefs:
    - name: grpc-ratelimit-gateway
      namespace: edgion-test
      sectionName: grpc

  hostnames:
    - "grpc-ratelimit.example.com"

  rules:
    # Single rule, two header-based match-items, one rule-level RateLimitLocal filter.
    - matches:
        - method:
            type: Exact
            service: test.TestService
            method: SayHello
          headers:
            - name: x-variant
              value: a
        - method:
            type: Exact
            service: test.TestService
            method: SayHello
          headers:
            - name: x-variant
              value: b
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: grpc-rate-limit-shared
      backendRefs:
        - name: test-grpc
          port: 30021

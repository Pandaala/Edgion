# Rule-level RateLimitLocal plugin for the gRPC shared-CMS regression scenario.
#
# Must live in the same namespace as the GRPCRoute (edgion-test): the gateway
# resolves a rule-level ExtensionRef using the route's namespace.
#
# A fixed `x-rate-key` value forces ALL requests into one CMS bucket, so the
# limit is keyed only by the rule's shared PluginRuntime — exactly what the
# decouple must keep shared across the rule's two match-item units.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: grpc-rate-limit-shared
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: RateLimitLocal
      config:
        rate: 10               # 10 requests per window, enforced per-rule (global)
        interval: "60s"        # long window so the 11-request burst stays inside it
        key:
          - type: header
            name: "x-rate-key" # lowercase: gRPC metadata keys are always lowercase
        onKeyMiss: Deny     # every request carries the key; Deny makes a missing key fail loudly
        rejectStatus: 429      # maps to gRPC status 8 RESOURCE_EXHAUSTED (http_to_grpc_status)
        rejectMessage: "Rate limit exceeded"
        showLimitHeaders: true

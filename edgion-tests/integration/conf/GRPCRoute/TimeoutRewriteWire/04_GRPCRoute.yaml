apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-timeout-wire
  namespace: edgion-test
spec:
  parentRefs:
    - name: grpc-timeout-wire-gateway
      sectionName: grpc
  hostnames: ["grpc-timeout-wire.example.com"]
  rules:
    - matches:
        - method:
            type: Exact
            service: test.TestService
            method: SayHello
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: grpc-timeout-wire-delay
      retry:
        attempts: 4
        backoff: 100ms
      backendRefs:
        - name: grpc-timeout-wire-h2
          port: 30031

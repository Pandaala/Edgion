  namespace: edgion-test
  labels:
    kubernetes.io/service-name: grpc-spw-b
addressType: IPv4
ports:
  - name: grpc
    port: 30022
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true

apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-sp-header
  namespace: edgion-test
spec:
  parentRefs:
    - name: grpc-sp-gateway
      namespace: edgion-test
      sectionName: grpc
  hostnames:
    - "grpc-sp-header.example.com"
  rules:
    - matches:
        - method:
            type: Exact
            service: test.TestService
      retry:
        attempts: 0
      sessionPersistence:
        sessionName: "x-grpc-session-id"
        type: Header
      backendRefs:
        - name: grpc-sp-service
          port: 8080

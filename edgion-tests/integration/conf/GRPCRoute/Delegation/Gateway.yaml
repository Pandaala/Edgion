# GRPCRoute delegation test Gateway.
# HTTP/2-capable listener (gRPC rides h2c over a plaintext HTTP listener,
# mirroring GRPCRoute/Basic's convention). allowedRoutes is explicit
# `from: All`: delegation children never attach to listeners directly (only
# the parent GRPCRoute below does), so this documents intent rather than
# gating anything delegation-specific — same rationale as the equivalent
# HTTPRoute/Delegation/Gateway.yaml comment.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grpc-delegation-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: grpc
      protocol: HTTP
      port: 31934
      allowedRoutes:
        namespaces:
          from: All

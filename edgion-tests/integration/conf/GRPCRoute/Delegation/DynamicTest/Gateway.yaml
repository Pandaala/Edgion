# Dedicated Gateway for the GrpcRouteDelegationDynamic hot-reload scenario.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grpc-delegation-dyn-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: grpc
      protocol: HTTP
      port: 31935
      allowedRoutes:
        namespaces:
          from: All

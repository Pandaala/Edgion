# Update phase: the application team moves the narrowed method from
# SayHello to StreamNumbers. Only this child changes; the parent and Gateway
# are untouched.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: child
  namespace: edgion-grpc-deleg-dyn
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: delegation-dyn-parent
      namespace: edgion-test
  rules:
    - matches:
        - method:
            type: Exact
            service: test.TestService
            method: StreamNumbers
      backendRefs:
        - name: child-dyn-grpc-svc
          port: 30021

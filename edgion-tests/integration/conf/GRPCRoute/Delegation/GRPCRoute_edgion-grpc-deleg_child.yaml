# Delegation child owned by the application team.
# `parentRefs` carries a `kind: GRPCRoute` entry naming the platform team's
# delegation-parent: the edge exists only because the parent delegates to
# this route AND this route declares the parent (bidirectional
# confirmation). The child gets its own Accepted condition for this entry.
# Child matches are absolute; the scope is the intersection with the
# parent's delegated service:
# - rule 0 narrows the delegated test.TestService scope to SayHello -> the
#   child's own backend Service.
# - rule 1 matches a DIFFERENT service (test.OtherService). It never matches
#   through the parent (the root level already fixed the service) and is not
#   reported on the parent: child-side scope is never a parent error.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: child
  namespace: edgion-grpc-deleg
spec:
  parentRefs:
    - kind: GRPCRoute
      group: gateway.networking.k8s.io
      name: delegation-parent
      namespace: edgion-test
  rules:
    - matches:
        - method:
            type: Exact
            service: test.TestService
            method: SayHello
      backendRefs:
        - name: child-grpc-svc
          port: 30021
    - matches:
        - method:
            type: Exact
            service: test.OtherService
            method: Whatever
      backendRefs:
        - name: child-grpc-svc
          port: 30021

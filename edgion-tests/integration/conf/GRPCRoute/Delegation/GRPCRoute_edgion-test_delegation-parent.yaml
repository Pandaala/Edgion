# Parent (root) route owned by the platform team.
# Rule 1 is a plain rule proving delegation does not disturb siblings: it
# routes test.TestService/StreamNumbers directly to the shared test-grpc
# backend, bypassing delegation entirely.
# Rule 2 delegates the whole test.TestService service (no method — a
# service-level scope) to every GRPCRoute in the edgion-grpc-deleg namespace
# that declares this parent (wildcard) and pins a mandatory
# RequestHeaderModifier filter that runs before every child filter.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: delegation-parent
  namespace: edgion-test
spec:
  parentRefs:
    - name: grpc-delegation-gateway
      namespace: edgion-test
      sectionName: grpc
  hostnames:
    - "grpc-delegation.example.com"
  rules:
    - matches:
        - method:
            type: Exact
            service: test.TestService
            method: StreamNumbers
      backendRefs:
        - name: test-grpc
          port: 30021
    - matches:
        - method:
            type: Exact
            service: test.TestService
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-parent-filter
                value: "on"
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: GRPCRoute
          name: "*"
          namespace: edgion-grpc-deleg

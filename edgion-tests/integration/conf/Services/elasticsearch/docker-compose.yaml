# Elasticsearch single-node instance for LinkSys integration testing.
# Started/stopped by run_es_test.sh.
services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: edgion-test-elasticsearch
    ports:
      - "19200:9200"
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - cluster.name=edgion-test
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 3s
      timeout: 5s
      retries: 30
    restart: "no"

  # TLS terminator for the outbound-TLS LinkSys scenario (P0#3). Serves HTTPS on
  # 19201 using the backend test CA's server cert and proxies to the plaintext ES
  # above. Certs are generated by generate_backend_certs.sh into
  # edgion-tests/certs/backend before `docker compose up` (see run_es_test.sh).
  es-tls-proxy:
    image: nginx:1.27-alpine
    container_name: edgion-test-es-tls-proxy
    depends_on:
      elasticsearch:
        condition: service_healthy
    ports:
      - "19201:9201"
      - "19202:9202"
    volumes:
      - ../../../../certs:/certs:ro
      - ./nginx-tls.conf:/etc/nginx/nginx.conf:ro
    restart: "no"

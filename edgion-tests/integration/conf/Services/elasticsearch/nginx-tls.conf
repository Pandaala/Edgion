# TLS terminators in front of the plaintext Elasticsearch container.
#
# Used by run_es_test.sh to give the ES LinkSys integration test real outbound
# TLS handshake targets. The whole edgion-tests/certs tree is mounted at /certs.
#
#   :9201 (host 19201) — server-auth only. Cert signed by the backend test CA.
#                        Drives caSource: SecretRef / System / verify=false cases.
#   :9202 (host 19202) — mutual TLS. Same server cert, but additionally requires
#                        a client cert chaining to the mTLS client CA. Drives the
#                        clientSecretRef case (P1#4).
events {}

http {
    # Server-auth TLS terminator.
    server {
        listen 9201 ssl;

        ssl_certificate     /certs/backend/server.crt;
        ssl_certificate_key /certs/backend/server.key;

        location / {
            proxy_pass http://elasticsearch:9200;
            proxy_set_header Host $host;
        }
    }

    # Mutual-TLS terminator: rejects any client that does not present a cert
    # signed by the mTLS client CA.
    server {
        listen 9202 ssl;

        ssl_certificate     /certs/backend/server.crt;
        ssl_certificate_key /certs/backend/server.key;

        ssl_client_certificate /certs/mtls/client-ca.crt;
        ssl_verify_client      on;

        location / {
            proxy_pass http://elasticsearch:9200;
            proxy_set_header Host $host;
        }
    }
}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: metrics-lifetime
  namespace: edgion-test
spec:
  parentRefs:
    - name: metrics-lifetime
  hostnames:
    - metrics-lifetime.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: metrics-lifetime-http
          port: 30001

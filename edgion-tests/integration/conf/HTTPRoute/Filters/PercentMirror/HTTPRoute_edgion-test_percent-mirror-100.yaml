apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: percent-mirror-100
  namespace: edgion-test
  annotations:
    # Exercise the edgion.io/mirror-* tuning annotation parse path end-to-end:
    # sane values must not break mirroring (tuning effects themselves are not
    # externally observable through the capture endpoint).
    edgion.io/mirror-connect-timeout-ms: "2000"
    edgion.io/mirror-write-timeout-ms: "2000"
    edgion.io/mirror-max-buffered-chunks: "8"
    edgion.io/mirror-max-concurrent: "256"
spec:
  parentRefs:
    - name: percent-mirror-gateway
      namespace: edgion-test
  hostnames:
    - "mirror-100.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestMirror
          requestMirror:
            backendRef:
              name: test-http
              namespace: edgion-test
              port: 30001
            percent: 100
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

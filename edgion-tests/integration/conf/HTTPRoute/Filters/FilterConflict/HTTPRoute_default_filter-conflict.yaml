# HTTPRoute with two valid sibling rules. The test client submits a separate
# URLRewrite + RequestRedirect resource and verifies synchronous rejection.
#   rule[0]: URLRewrite only → should proxy with rewritten path (200)
#   rule[1]: RequestRedirect only → should redirect (302)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filter-conflict
  namespace: edgion-default
spec:
  parentRefs:
    - name: filter-conflict-gateway
      namespace: edgion-test
  hostnames:
    - "filter-conflict.example.com"
  rules:
    # rule[0]: valid — URLRewrite only (hostname rewrite, no path change)
    - matches:
        - path:
            type: Exact
            value: /rewrite-only
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: rewritten.example.com
      backendRefs:
        - name: filter-conflict-backend
          namespace: edgion-test
          port: 30001

    # rule[1]: valid — RequestRedirect only
    - matches:
        - path:
            type: Exact
            value: /redirect-only
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 302

# Routes to a backend whose EndpointSlice endpoint omits `conditions`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nil-ready
  namespace: edgion-test
spec:
  parentRefs:
    - name: http-test-gateway
      namespace: edgion-test
  hostnames:
    - "nil-ready.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /echo
      backendRefs:
        - name: nil-ready-backend
          port: 30001

apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: duplicate-header-backend
  namespace: edgion-test
  labels:
    kubernetes.io/service-name: duplicate-header-backend
addressType: IPv4
ports:
  - name: first
    port: 30001
    protocol: TCP
  - name: second
    port: 30002
    protocol: TCP
endpoints:
  - addresses: ["127.0.0.1"]
    conditions:
      ready: true

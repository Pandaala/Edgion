apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: duplicate-header-dynamic
  namespace: edgion-test
spec:
  parentRefs:
    - name: http-match-gateway
      sectionName: http
  hostnames: ["duplicate-header-dynamic.example.com"]
  rules:
    - matches:
        - path: {type: Exact, value: /echo/dynamic}
          headers:
            - {name: X-Mode, value: two}
            - {name: x-mode, value: one}
      backendRefs:
        - {name: duplicate-header-backend, port: 30002}

# Omit the mode annotation to exercise the L4 default. The Gateway endpoint table resolves localhost
# (default system resolver) in the background and publishes Gateway-local
# endpoints; TCP connections select from them like any EndpointSlice-backed
# Service. Backend: the local TCP echo server on 30010.
apiVersion: v1
kind: Service
metadata:
  name: dns-l4-gateway
  namespace: edgion-default
spec:
  type: ExternalName
  externalName: localhost
  ports:
    - name: tcp
      port: 30010
      targetPort: 30010
      protocol: TCP

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dns-per-request-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: dns-res-gateway
      namespace: edgion-test
  hostnames:
    - "per-request.dns.test"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dns-per-request
          namespace: edgion-default
          kind: ServiceExternalName
          port: 30001

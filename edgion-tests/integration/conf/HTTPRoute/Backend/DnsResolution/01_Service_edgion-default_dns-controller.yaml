# controller mode: the Controller resolves (OS resolver; no Controller default
# resolver configured) and publishes in-memory synthetic EndpointSlices through
# conf_sync; the Gateway reads only those. Works in every conf-center mode.
# externalName=localhost resolves to 127.0.0.1 → the local test backend.
apiVersion: v1
kind: Service
metadata:
  name: dns-controller
  namespace: edgion-default
  annotations:
    edgion.io/dns-resolution-mode: controller
spec:
  type: ExternalName
  externalName: localhost
  ports:
    - port: 30001
      targetPort: 30001
      protocol: TCP

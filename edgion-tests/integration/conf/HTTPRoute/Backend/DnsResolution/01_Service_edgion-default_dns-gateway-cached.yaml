# gateway mode: the Gateway endpoint table resolves in the background via the
# effective resolver and publishes the address set as Gateway-local endpoints;
# requests never resolve. Resolves via the httpdns endpoint so the test can count
# resolver hits and assert that consecutive requests trigger no resolution.
apiVersion: v1
kind: Service
metadata:
  name: dns-gateway-cached
  namespace: edgion-default
  annotations:
    edgion.io/dns-resolution-mode: gateway
    edgion.io/dns-resolver-ref: edgion-default/dns-httpdns-local
spec:
  type: ExternalName
  externalName: gwcached.dns.test
  ports:
    - port: 30001
      targetPort: 30001
      protocol: TCP

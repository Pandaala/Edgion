apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dns-controller-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: dns-res-gateway
      namespace: edgion-test
  hostnames:
    - "controller.dns.test"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: dns-controller
          namespace: edgion-default
          kind: Service
          port: 30001

# 3 reachable endpoints — test_server bound to 0.0.0.0:30001.
# macOS requires lo0 aliases for 127.0.0.2 and 127.0.0.3 (run_integration.sh checks).
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: lb-ewma-slice
  namespace: edgion-default
  labels:
    kubernetes.io/service-name: lb-ewma-service
addressType: IPv4
ports:
  - name: http
    port: 30001
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true
  - addresses:
      - "127.0.0.2"
    conditions:
      ready: true
  - addresses:
      - "127.0.0.3"
    conditions:
      ready: true

# BackendTLSPolicy for H2 mTLS + SessionPersistence suite.
# References the shared backend-ca Secret and backend-client-cert ClientCert
# which are created by the BackendTLS suite (generate_backend_certs.sh +
# generate_mtls_certs.sh). Those resources are loaded when HTTPRoute/Backend/BackendTLS
# is processed; they live in namespace edgion-test and are available to this suite.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: h2-mtls-sp-btls
  namespace: edgion-test
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: h2-mtls-sp-service
  validation:
    caCertificateRefs:
      - name: backend-ca
        kind: Secret
        group: ""
    hostname: backend.example.com
  options:
    edgion.io/client-certificate-ref: backend-client-cert

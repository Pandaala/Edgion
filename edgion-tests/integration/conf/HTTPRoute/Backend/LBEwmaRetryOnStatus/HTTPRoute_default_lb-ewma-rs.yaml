# EWMA LB + retry-on-503 — 2 endpoints, retry=3.
# Exercises finalize_attempt(Discard) on LbCommit::Ewma: the abandoned attempt's
# latency sample must NOT be folded into the backend's EWMA. After retry exhausts,
# healthy traffic must still reach both endpoints (no EWMA score collapse to single point).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lb-ewma-rs
  namespace: edgion-default
spec:
  parentRefs:
    - name: lb-ewma-rs-gateway
      namespace: edgion-test
  hostnames:
    - "lb-ewma-rs.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      retry:
        attempts: 3
        codes: [503]
      timeouts:
        request: 10s
        backendRequest: 3s
      backendRefs:
        - name: lb-ewma-rs-service
          port: 8080

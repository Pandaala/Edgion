# EWMA LB + retry-on-503 integration coverage.
# Exact Discard state mutation belongs to the LB unit tests; this route verifies
# the observable retry-attempt chain through the request access log.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lb-ewma-rs-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 31126
      allowedRoutes:
        namespaces:
          from: All

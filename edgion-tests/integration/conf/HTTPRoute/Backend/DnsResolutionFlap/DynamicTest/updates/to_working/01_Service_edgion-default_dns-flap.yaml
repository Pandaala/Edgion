# Runtime hot-reload: flip the resolver-ref annotation from the down resolver
# (dns-flap-dead) to the live one (dns-flap-local). The gateway must pick this up
# without a restart and start serving 200.
apiVersion: v1
kind: Service
metadata:
  name: dns-flap
  namespace: edgion-default
  annotations:
    edgion.io/dns-resolution-mode: per-request
    edgion.io/dns-resolver-ref: edgion-default/dns-flap-local
spec:
  type: ExternalName
  externalName: flapbackend.test
  ports:
    - port: 30001
      targetPort: 30001
      protocol: TCP

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dns-flap-gateway
  namespace: edgion-test
  annotations:
    edgion.io/dns-lookup-family: ipv6Only
spec:
  gatewayClassName: dns-flap-class
  listeners:
    - name: http
      protocol: HTTP
      port: 31361
      allowedRoutes:
        namespaces:
          from: All

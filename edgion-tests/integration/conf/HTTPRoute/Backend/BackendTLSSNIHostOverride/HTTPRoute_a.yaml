# HTTPRoute for SNI host override suite — route A.
# Client-facing hostname: host-a.example.com (the Host header the test client sends).
# Gateway-to-backend SNI:  hostname-a.example.com (set by BackendTLSPolicy_a).
# The two hostnames are intentionally different to avoid conflating client-side
# routing with the upstream TLS SNI.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: btls-sni-route-a
  namespace: edgion-test
spec:
  parentRefs:
    - name: btls-sni-gateway
      namespace: edgion-test
  hostnames:
    - "host-a.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: btls-sni-service-a
          port: 30026

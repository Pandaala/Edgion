apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: strict-sp-hc-slice
  namespace: edgion-test
  labels:
    kubernetes.io/service-name: strict-sp-hc
addressType: IPv4
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true
  - addresses:
      - "192.0.2.1"
    conditions:
      ready: true
ports:
  - port: 30001
    protocol: TCP

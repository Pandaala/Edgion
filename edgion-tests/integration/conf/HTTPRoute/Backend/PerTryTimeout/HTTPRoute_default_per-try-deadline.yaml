apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: per-try-deadline
  namespace: edgion-default
spec:
  parentRefs:
    - name: per-try-timeout-gateway
      namespace: edgion-test
  hostnames:
    - "per-try-deadline.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      retry:
        attempts: 5
      timeouts:
        # Request deadline 2s, per-try 1.5s. Attempt 1 is canceled by the per-try
        # (backendRequest) timeout and retried; attempt 2 hits the 2s request
        # deadline (which leaves ~0.5s) and is NOT retried despite the remaining
        # attempt budget. GEP-2257 Duration disallows fractional seconds, so 1.5s
        # is written 1500ms.
        request: "2s"
        backendRequest: "1500ms"
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

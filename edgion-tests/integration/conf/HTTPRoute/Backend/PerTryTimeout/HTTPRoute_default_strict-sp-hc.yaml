apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: strict-sp-hc
  namespace: edgion-default
spec:
  parentRefs:
    - name: per-try-timeout-gateway
      namespace: edgion-test
  hostnames:
    - "strict-sp-hc.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      retry:
        attempts: 0
      sessionPersistence:
        sessionName: "edgion-sp-strict-hc"
        type: Cookie
        absoluteTimeout: "1h"
        cookieConfig:
          lifetimeType: Permanent
        strict: true
      timeouts:
        request: "5s"
        backendRequest: "1s"
      backendRefs:
        - name: strict-sp-hc
          namespace: edgion-test
          port: 30001

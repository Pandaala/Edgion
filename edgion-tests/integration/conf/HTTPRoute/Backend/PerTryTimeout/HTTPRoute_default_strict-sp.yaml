apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: strict-sp
  namespace: edgion-default
spec:
  parentRefs:
    - name: per-try-timeout-gateway
      namespace: edgion-test
  hostnames:
    - "strict-sp.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      retry:
        attempts: 2
      sessionPersistence:
        sessionName: "edgion-sp-strict"
        type: Cookie
        absoluteTimeout: "1h"
        cookieConfig:
          lifetimeType: Permanent
        strict: true
      timeouts:
        request: "10s"
        backendRequest: "1s"
      backendRefs:
        - name: strict-sp
          namespace: edgion-test
          port: 30001

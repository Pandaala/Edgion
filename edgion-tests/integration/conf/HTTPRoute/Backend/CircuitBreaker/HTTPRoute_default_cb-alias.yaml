apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cb-alias
  namespace: edgion-default
spec:
  parentRefs:
    - name: cb-gw
  hostnames:
    - "cb-alias.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: cb-alias
          port: 30002
      timeouts:
        request: "30s"
        backendRequest: "5s"

apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: cb-alias-slice
  namespace: edgion-default
  labels:
    kubernetes.io/service-name: cb-alias
addressType: IPv4
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true
ports:
  - port: 30002
    protocol: TCP

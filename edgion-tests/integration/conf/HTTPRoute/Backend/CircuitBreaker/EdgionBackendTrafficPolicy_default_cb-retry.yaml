apiVersion: edgion.io/v1
kind: EdgionBackendTrafficPolicy
metadata:
  name: cb-retry-policy
  namespace: edgion-default
spec:
  targetRefs:
    - kind: Service
      name: cb-retry
  outlierDetection:
    consecutiveErrors: 100
    consecutiveGatewayErrors: 2
    ejectionTime: 30s
    maxEjectionPercent: 0

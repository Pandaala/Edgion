apiVersion: v1
kind: Service
metadata:
  name: encrypted-active-health
  namespace: edgion-test
spec:
  ports:
    - name: http
      port: 80
      targetPort: 30001
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: encrypted-active-health
  namespace: edgion-test
  labels:
    kubernetes.io/service-name: encrypted-active-health
addressType: IPv4
ports:
  - name: http
    port: 30001
    protocol: TCP
endpoints:
  - addresses: ["127.0.0.1"]
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: encrypted-active-health
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgion-plugins-gateway
  hostnames: ["encrypted-active-health.example.com"]
  rules:
    - backendRefs:
        - name: encrypted-active-health
          port: 80

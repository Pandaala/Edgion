# Rule-scope isolation: two rules both use the DEFAULT session name (no
# sessionName) with disjoint backends. A cookie minted by rule /r1 must not
# resolve on rule /r2 — /r2 serves its own backend and refreshes the token.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spw-scope-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: spw-gateway
      namespace: edgion-default
  hostnames:
    - "spw-scope.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /r1
      sessionPersistence:
        type: Cookie
        absoluteTimeout: "1h"
        cookieConfig:
          lifetimeType: Permanent
      backendRefs:
        - name: spw-a
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /r2
      sessionPersistence:
        type: Cookie
        absoluteTimeout: "1h"
        cookieConfig:
          lifetimeType: Permanent
      backendRefs:
        - name: spw-b
          port: 8080

# Weighted split (70/30) with route-rule session persistence: weights govern
# only sessions without a token; an established session must keep routing to
# its bound Service/endpoint (GEP-1619).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spw-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: spw-gateway
      namespace: edgion-default
  hostnames:
    - "spw.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      sessionPersistence:
        sessionName: "edgion-spw"
        type: Cookie
        absoluteTimeout: "1h"
        cookieConfig:
          lifetimeType: Permanent
      backendRefs:
        - name: spw-a
          port: 8080
          weight: 70
        - name: spw-b
          port: 8080
          weight: 30

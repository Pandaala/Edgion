apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: spw-a-eps
  namespace: edgion-default
  labels:
    kubernetes.io/service-name: spw-a
addressType: IPv4
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true
ports:
  - name: http
    port: 30001
    protocol: TCP

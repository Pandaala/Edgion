# Query-arg ConsistentHash keyed on query parameter "user_id".
apiVersion: edgion.io/v1
kind: EdgionBackendTrafficPolicy
metadata:
  name: lb-ch-arg-policy
  namespace: edgion-default
spec:
  targetRefs:
    - kind: Service
      name: lb-ch-arg-service
  loadBalancer:
    type: ConsistentHash
    consistentHash:
      hashOn: queryParam
      key: user_id

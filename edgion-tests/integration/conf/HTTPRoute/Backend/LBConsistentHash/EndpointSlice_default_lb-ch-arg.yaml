# 3 endpoints for the query-arg ConsistentHash Service (mirrors lb-ch-single).
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: lb-ch-arg-single
  namespace: edgion-default
  labels:
    kubernetes.io/service-name: lb-ch-arg-service
addressType: IPv4
ports:
  - name: http
    port: 30001
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true
  - addresses:
      - "127.0.0.2"
    conditions:
      ready: true
  - addresses:
      - "127.0.0.3"
    conditions:
      ready: true

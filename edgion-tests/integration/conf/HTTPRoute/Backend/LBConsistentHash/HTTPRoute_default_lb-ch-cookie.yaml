# ConsistentHash (Cookie) + EndpointSlice 
#  session-id cookie 
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lb-ch-cookie
  namespace: edgion-default
spec:
  parentRefs:
    - name: lb-ch-gateway
      namespace: edgion-test
  hostnames:
    - "lb-ch-cookie.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test
      retry:
        attempts: 0
      timeouts:
        request: 2s
        backendRequest: 1s
      backendRefs:
        - name: lb-ch-cookie-service
          port: 8080

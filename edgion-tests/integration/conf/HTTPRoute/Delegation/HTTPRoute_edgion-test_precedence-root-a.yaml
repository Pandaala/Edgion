# per_level_precedence, root A: delegates /api to precedence-child, whose
# rules are more specific (Exact /api/users, Exact /api/orders).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: precedence-root-a
  namespace: edgion-test
spec:
  parentRefs:
    - name: delegation-gateway
      namespace: edgion-test
  hostnames:
    - "precedence.delegation.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: precedence-child
          namespace: edgion-deleg

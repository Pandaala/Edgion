# five_level_chain: chain-l3 is a child of chain-l2 and delegates /chain/l2/l3 to chain-l4.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chain-l3
  namespace: edgion-deleg
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: chain-l2
      namespace: edgion-deleg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /chain/l2/l3
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: chain-l4
          namespace: edgion-deleg

# five_level_chain: chain-l4 is a child of chain-l3 and delegates /chain/l2/l3/l4 to chain-l5.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chain-l4
  namespace: edgion-deleg
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: chain-l3
      namespace: edgion-deleg
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /chain/l2/l3/l4
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: chain-l5
          namespace: edgion-deleg

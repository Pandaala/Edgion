# Delegation child owned by the application team.
# No Gateway parentRefs: this route only becomes reachable through the
# parent's delegation. Rule 1 is inside the delegated prefix; rule 2 is
# outside it and must be dropped by the controller flatten step (404).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: billing-child
  namespace: edgion-deleg
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/billing/pay
      backendRefs:
        - name: child-svc
          port: 30001
    - matches:
        - path:
            type: PathPrefix
            value: /evil
      backendRefs:
        - name: child-svc
          port: 30001

# five_level_chain: chain-l2 is a child of chain-l1 and delegates /chain/l2 to chain-l3.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: chain-l2
  namespace: edgion-deleg
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: chain-l1
      namespace: edgion-test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /chain/l2
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: chain-l3
          namespace: edgion-deleg

# Initial child: serves /api/v1/billing/pay. The updates/ overlay moves the
# rule to /api/v1/billing/pay2 to prove child-change → parent re-flatten →
# gateway hot reload.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: billing-child
  namespace: edgion-deleg-dyn
spec:
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/billing/pay
      backendRefs:
        - name: child-dyn-svc
          port: 30001

# Initial child: serves /api/v1/billing/pay. The updates/ overlay moves the
# rule to /api/v1/billing/pay2 to prove child-change → subtree rebuild →
# gateway hot reload.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: billing-child
  namespace: edgion-deleg-dyn
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: delegation-dyn-parent
      namespace: edgion-test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/billing/pay
      backendRefs:
        - name: child-dyn-svc
          port: 30001
    - matches:
        - path:
            type: RegularExpression
            value: '^/api/v1/billing/?guard$'
      backendRefs:
        - name: child-dyn-svc
          port: 30001

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mcp-route-lifecycle
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-gateway
  hostnames:
    - mcp-route-lifecycle.edgion.test
  rules:
    - matches:
        - path:
            type: Exact
            value: /mcp-route-lifecycle
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: mcp-route-lifecycle-tools

# H2C backend endpoint slice
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: test-h2c
  namespace: edgion-test
  labels:
    kubernetes.io/service-name: test-h2c
addressType: IPv4
ports:
  - port: 30001
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true

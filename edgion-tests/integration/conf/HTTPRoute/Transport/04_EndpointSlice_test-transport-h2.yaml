# Endpoints for the raw HTTP/2 transport backend.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: test-transport-h2
  namespace: edgion-test
  labels:
    kubernetes.io/service-name: test-transport-h2
addressType: IPv4
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true
ports:
  - port: 30031
    protocol: TCP

# P090-008: explicit policy and opt-in controls on the shared transport topology.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transport-retry-optin-h2
  namespace: edgion-default
  annotations:
    edgion.io/retry-non-idempotent: "true"
spec:
  parentRefs:
    - name: transport-gateway
      namespace: edgion-test
  hostnames:
    - "transport-retry-optin-h2.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /cached
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: transport-retry-cache
      backendRefs:
        - name: test-transport-h2
          namespace: edgion-test
          port: 30031
    - backendRefs:
        - name: test-transport-h2
          namespace: edgion-test
          port: 30031
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transport-retry-policy-h2
  namespace: edgion-default
spec:
  parentRefs:
    - name: transport-gateway
      namespace: edgion-test
  hostnames:
    - "transport-retry-policy-h2.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /limited
      retry:
        attempts: 1
        codes: [503]
      backendRefs:
        - name: test-transport-h2
          namespace: edgion-test
          port: 30031
    - matches:
        - path:
            type: PathPrefix
            value: /deadline
      retry:
        attempts: 5
      timeouts:
        request: "1s"
        backendRequest: "1s"
      backendRefs:
        - name: test-transport-h2
          namespace: edgion-test
          port: 30031
    - retry:
        attempts: 1
        codes: [503]
      timeouts:
        request: "4s"
        backendRequest: "1s"
      backendRefs:
        - name: test-transport-h2
          namespace: edgion-test
          port: 30031

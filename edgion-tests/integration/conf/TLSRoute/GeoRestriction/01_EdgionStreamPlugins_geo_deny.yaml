# Two-plugin chain, enough to prove layer="tls" is wired and counted, and
# that the "plugins: [...]" order still holds at this layer:
# GlobalConnectionIpRestriction (non-geo IP deny, first) THEN GeoIpLocation
# (geo-only, second).
#
# Uses the legacy `plugins` field (Stage-1 shape; the Stage-2 `tlsRoutePlugins`
# enum only offers IpRestriction — see
# edgion-resources/src/resources/edgion_stream_plugins/tls_route_plugins.rs).
# Referencing this ESP directly from the TLSRoute (not the Gateway) means
# `tls_route_plugin_runtime` is empty and routes/tls/mod.rs::check_tls_route_plugins
# falls back to running the Stage-1 `stream_plugin_runtime` with
# `.with_layer("tls")` — the exact seam TLSRoute/StreamPlugins already
# exercises for plain IpRestriction (05_TLSRoute_deny.yaml).
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: tls-geo-deny
  namespace: edgion-test
spec:
  plugins:
    - type: GlobalConnectionIpRestriction
      config:
        enable: true
        activeProfile: default
        profiles:
          default:
            defaultAction: allow
            deny:
              - name: deny-unrelated-source
                cidrs:
                  - "127.0.0.9/32"
    - type: GeoIpLocation
      config:
        defaultAction: allow
        failOpen: false
        denyRuleGroups:
          - name: block-ru
            rules:
              - source: DirectPeerIp
                key: country
                values: ["RU"]

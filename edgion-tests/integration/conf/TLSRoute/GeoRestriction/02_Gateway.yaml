# Supported TLS Passthrough listener with Gateway Stage-1 geo admission.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-geo-gw
  namespace: edgion-test
  annotations:
    edgion.io/edgion-stream-plugins: tls-geo-deny
spec:
  gatewayClassName: public-gateway
  listeners:
  - name: tls-geo
    protocol: TLS
    port: 31953
    hostname: '*.geo.example.com'
    tls:
      mode: Passthrough

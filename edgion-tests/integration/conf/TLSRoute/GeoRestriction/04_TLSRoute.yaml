# TLSRoute behind the Gateway's Stage-1 geo admission policy.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tls-geo-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: tls-geo-gw
      namespace: edgion-test
      sectionName: tls-geo
      port: 31953
  hostnames:
    - "*.geo.example.com"
  rules:
    - backendRefs:
        - name: test-tcp
          port: 30010
          weight: 100

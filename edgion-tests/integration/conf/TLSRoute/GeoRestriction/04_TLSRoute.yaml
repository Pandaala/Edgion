# TLSRoute forwards through the Stage-1 policy to the existing real HTTPS backend.
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tls-geo-route
  namespace: edgion-test
spec:
  parentRefs:
  - name: tls-geo-gw
    namespace: edgion-test
    sectionName: tls-geo
    port: 31953
  hostnames:
  - '*.geo.example.com'
  rules:
  - backendRefs:
    - name: test-https-backend
      port: 30051
      weight: 100

    - name: tls-denied-ref-gw
      namespace: edgion-test
      sectionName: tls-passthrough
  hostnames:
    - "denied-passthrough.sandbox.example.com"
  rules:
    - backendRefs:
        - name: tls-denied-ref-https
          namespace: backend
          port: 30051
          weight: 100

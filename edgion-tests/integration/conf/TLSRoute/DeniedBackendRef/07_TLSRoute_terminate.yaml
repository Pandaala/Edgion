apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tls-denied-ref-terminate
  namespace: edgion-test
spec:
  parentRefs:
    - name: tls-denied-ref-gw
      namespace: edgion-test
      sectionName: tls-terminate
  hostnames:
    - "denied-terminate.sandbox.example.com"
  rules:
    - backendRefs:
        - name: tls-denied-ref
          namespace: backend
          port: 30010
          weight: 100

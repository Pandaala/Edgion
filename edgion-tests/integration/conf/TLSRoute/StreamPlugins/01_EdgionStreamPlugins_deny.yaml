# EdgionStreamPlugins: deny all IPs
# Tests that stream plugin at TLSRoute level correctly denies connections
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: tls-deny-all
  namespace: edgion-test
spec:
  tlsRoutePlugins:
    - type: IpRestriction
      config:
        denyRefs:
          - name: acl-tls-deny-all-deny-dd12b47039
        defaultAction: deny

# EdgionStreamPlugins: deny all IPs
# Tests that stream plugin at TLSRoute level correctly denies connections
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: tls-deny-all
  namespace: edgion-test
spec:
  tlsRoutePlugins:
    - type: IpRestriction
      config:
        deny:
          - name: all
            cidrs:
              - "0.0.0.0/0"
              - "::/0"
        defaultAction: deny

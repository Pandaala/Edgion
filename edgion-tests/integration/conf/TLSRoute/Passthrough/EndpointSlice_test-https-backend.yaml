# EndpointSlice for HTTPS backend server (TLS Passthrough testing)
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: test-https-backend-slice
  namespace: edgion-test
  labels:
    kubernetes.io/service-name: test-https-backend
addressType: IPv4
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true
ports:
  - port: 30051
    protocol: TCP

# GlobalConnIpRestrictionOverride EdgionData — smoke test fixture
#
# Verifies that the GlobalConnIpRestrictionOverride variant is accepted by the controller.
# Profile p1: allow-list semantics — only 192.168.1.0/24 allowed; all others denied.
# Profile strict: deny-list semantics — explicitly deny 10.10.10.0/24; default allow.
#
# The full GCIR overlay (all fields present) exercises all Optional fields.
apiVersion: edgion.io/v1
kind: EdgionData
metadata:
  name: gcir-smoke
  namespace: edgion-test
spec:
  data:
    type: GlobalConnIpRestrictionOverride
    config:
      enable: true
      activeProfile: p1
      profiles:
        p1:
          defaultAction: deny
          allow:
            - name: office
              cidrs:
                - "192.168.1.0/24"
        strict:
          defaultAction: allow
          deny:
            - name: blocked-range
              cidrs:
                - "10.10.10.0/24"

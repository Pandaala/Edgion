apiVersion: edgion.io/v1
kind: EdgionAIService
metadata:
  name: resilience-rate-limited
  namespace: edgion-test
spec:
  provider: OpenAICompatible
  endpoint: http://127.0.0.1:30001/ai/resilience-429
  allowInsecureHttp: true
  credentialPool:
    credentials:
      - name: rate-primary
        secretRef:
          name: ai-resilience-openai-credential
  models:
    - name: fixture-model
---
apiVersion: edgion.io/v1
kind: EdgionAIService
metadata:
  name: resilience-healthy
  namespace: edgion-test
spec:
  provider: Anthropic
  endpoint: http://127.0.0.1:30001/anthropic/prefix
  allowInsecureHttp: true
  credentialPool:
    credentials:
      - name: healthy-primary
        secretRef:
          name: ai-resilience-anthropic-credential
  models:
    - name: claude-fixture
      aliases:
        - fixture-model
  defaults:
    maxOutputTokens: 64
---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-proxy-credential-tpm
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-gateway
  hostnames:
    - ai-credential-tpm.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ai-proxy-quota-terminate
      timeouts:
        request: 5s
      backendRefs:
        - group: edgion.io
          kind: EdgionAIService
          name: fixture-provider-credential-tpm

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: anthropic-ai-proxy
  namespace: edgion-test
spec:
  parentRefs:
    - name: anthropic-ai-gateway
  hostnames:
    - anthropic.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: anthropic-ai-proxy
      backendRefs:
        - group: edgion.io
          kind: EdgionAIService
          name: anthropic-fixture-provider

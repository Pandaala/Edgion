# Route that attaches the Mock EdgionPlugins via ExtensionRef and forwards to
# the pp-http upstream. Traffic is sent with Host: pp-mock.example.com.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pp-mock-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: pp-gw
      namespace: edgion-test
      sectionName: http
  hostnames:
    - "pp-mock.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: pp-mock
      backendRefs:
        - name: pp-http
          namespace: edgion-test
          port: 30001

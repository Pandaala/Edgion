# Endpoints for the pp-http Service (local test_server HTTP echo on 30001).
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: pp-http
  namespace: edgion-test
  labels:
    kubernetes.io/service-name: pp-http
addressType: IPv4
ports:
  - name: http
    port: 30001
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true

# HTTP upstream (local test_server on 30001). Reached only when the Mock plugin
# is bypassed; a block short-circuits at ingress and never gets here.
# NOTE: file-mode (file_system) conf_center requires ONE resource per file, so
# the paired EndpointSlice lives in EndpointSlice_edgion-test_pp-http.yaml.
apiVersion: v1
kind: Service
metadata:
  name: pp-http
  namespace: edgion-test
spec:
  ports:
    - name: http
      port: 30001
      targetPort: 30001
      protocol: TCP
  type: ClusterIP

# A single request-stage Mock plugin. With terminate:true it normally answers
# the request itself (200 + the marker body) WITHOUT reaching the upstream.
# The plugin-policy scenarios drive three distinct outcomes on this ONE resource:
#   - denylist http/Mock -> block  : request is rejected at ingress (451), the
#                                     marker body never appears (upstream not hit).
#   - denylist http/Mock -> bypass : Mock is skipped, the request reaches the
#                                     real upstream (test_server), marker absent.
#   - policy relaxed (absent)      : Mock runs again, the marker body returns.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: pp-mock
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: Mock
      config:
        statusCode: 200
        terminate: true
        contentType: "text/plain"
        body: "PP-MOCK-TERMINATED"

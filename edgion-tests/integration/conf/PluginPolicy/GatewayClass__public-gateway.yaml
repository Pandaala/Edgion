# GatewayClass for the plugin-policy standalone test. No parametersRef, so no
# EdgionGatewayConfig is required (mirrors ResourceAbnormalMetrics's file-mode
# setup). The Gateway pp-gw references this class by name.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: public-gateway
spec:
  controllerName: edgion.io/gateway-controller
  description: "Edgion-based HTTP/TCP gateway (plugin-policy test)"

# Connection-stage stream plugin. It admits loopback (allow: 127.0.0.0/8) with
# defaultAction: allow, so the plugin itself would ALWAYS ADMIT the probe's
# connection from 127.0.0.1. Therefore, if the TCP connection is closed while
# the policy is active, it can only be the policy block (stream/IpRestriction),
# never the plugin's own decision.
# NOTE: IpRestriction preparse requires at least one non-empty allow/deny list,
# so the allow entry below is mandatory (not just defaultAction).
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: pp-ipr
  namespace: edgion-test
spec:
  plugins:
    - type: IpRestriction
      config:
        defaultAction: allow
        allow:
          - name: localhost
            cidrs:
              - "127.0.0.0/8"

# TCPRoute wired to the connection-stage stream plugin via annotation and
# forwarding to the pp-tcp echo upstream.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: pp-tcp-route
  namespace: edgion-test
  annotations:
    edgion.io/edgion-stream-plugins: "pp-ipr"
spec:
  parentRefs:
    - name: pp-gw
      namespace: edgion-test
      sectionName: tcp
      port: 58331
  rules:
    - backendRefs:
        - name: pp-tcp
          port: 30010
          weight: 100

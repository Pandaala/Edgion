apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-mcp-lifecycle-dependencies
  namespace: edgion-default
spec:
  from:
    - group: edgion.io
      kind: EdgionBackend
      namespace: edgion-test
  to:
    - group: ""
      kind: Service
      name: mcp-lifecycle-upstream
    - group: ""
      kind: Secret
      name: mcp-lifecycle-bearer

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ai-proxy-default
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: AiProxy
      config:
        backendSelection:
          type: Weighted
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ai-proxy-passthrough
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: AiProxy
      config:
        backendSelection:
          type: Weighted
        onUnknownModel: passthrough
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ai-proxy-optout
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: AiProxy
      config:
        backendSelection:
          type: Weighted
        injectUsageTracking: false
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ai-proxy-streaming-disabled
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: AiProxy
      config:
        backendSelection:
          type: Weighted
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ai-proxy-quota
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: AiProxy
      config:
        backendSelection:
          type: Weighted
        tokenQuota:
          redisRef: default/redis-test
          key:
            - type: header
              name: x-quota-user
          limits:
            - scope: identity
              tokens: 18
              window: 1h
          onExceeded:
            type: Reject
          flushTokens: 1
          flushInterval: 10ms
          requestTimeout: 2s
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ai-proxy-priority-retry
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: AiProxy
      config:
        backendSelection:
          type: Priority
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ai-proxy-quota-throttle
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: AiProxy
      config:
        backendSelection:
          type: Weighted
        tokenQuota:
          redisRef: default/redis-test
          key:
            - type: header
              name: x-quota-user
          limits:
            - scope: identity
              tokens: 18
              window: 1h
          onExceeded:
            type: Throttle
            maxDelay: 10ms
          flushTokens: 1
          flushInterval: 10ms
          requestTimeout: 2s
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ai-proxy-quota-downgrade
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: AiProxy
      config:
        backendSelection:
          type: Weighted
        tokenQuota:
          redisRef: default/redis-test
          key:
            - type: header
              name: x-quota-user
          limits:
            - scope: identityModel
              tokens: 18
              window: 1h
          onExceeded:
            type: Downgrade
            model: economy-model
          flushTokens: 1
          flushInterval: 10ms
          requestTimeout: 2s

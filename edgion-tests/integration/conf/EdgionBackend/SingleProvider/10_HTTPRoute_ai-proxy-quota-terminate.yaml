apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-proxy-quota-terminate
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-gateway
  hostnames:
    - ai-quota-terminate.example.com
    - ai-quota-terminate-guard.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ai-proxy-quota-terminate
      timeouts:
        request: 5s
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: fixture-provider

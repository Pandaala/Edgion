apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: redis-test
  namespace: default
spec:
  type: redis
  config:
    endpoints:
      - "redis://127.0.0.1:16379"
    db: 0
    auth:
      secretRef:
        name: redis-test-auth
    pool:
      size: 4
    timeout:
      connect: 3s
      command: 2s

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: responses-off
  namespace: edgion-test
spec:
  parentRefs:
    - name: responses-gateway
  hostnames:
    - responses-off.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: responses-off
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: responses-provider
---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: responses-guard-rewrite
  namespace: edgion-test
spec:
  parentRefs:
    - name: responses-gateway
  hostnames:
    - responses-guard-rewrite.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: responses-guard
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/responses
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: responses-provider
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: responses-provider

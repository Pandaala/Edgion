# Equivalent native Chat and ordinary HTTP paths; local synthetic credentials only.
apiVersion: v1
kind: Secret
metadata:
  name: ai-performance-credential
  namespace: edgion-test
type: Opaque
stringData:
  api-key: performance-fixture-key
---
apiVersion: edgion.io/v1
kind: EdgionBackend
metadata:
  name: ai-performance
  namespace: edgion-test
spec:
  ai:
    provider: OpenAI
    endpoint: http://127.0.0.1:30001/ai-performance
    allowInsecureHttp: true
    credentialPool:
      credentials:
        - name: primary
          secretRef:
            name: ai-performance-credential
    models:
      - name: perf-model
---
apiVersion: v1
kind: Service
metadata:
  name: ai-performance
  namespace: edgion-test
spec:
  ports:
    - name: http
      port: 30001
      targetPort: 30001
      protocol: TCP
  type: ClusterIP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ai-performance
  namespace: edgion-test
  labels:
    kubernetes.io/service-name: ai-performance
addressType: IPv4
ports:
  - name: http
    port: 30001
    protocol: TCP
endpoints:
  - addresses: ["127.0.0.1"]
    conditions:
      ready: true
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ai-performance-off
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: AiProxy
      config:
        api: openaiChat
        usageObservation: off
        injectUsageTracking: false
        backendSelection:
          type: Weighted
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-performance-off
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-gateway
  hostnames:
    - perf-off.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ai-performance-off
      timeouts:
        request: 60s
        backendRequest: 60s
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: ai-performance
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ai-performance-provider
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: AiProxy
      config:
        api: openaiChat
        usageObservation: provider
        injectUsageTracking: false
        backendSelection:
          type: Weighted
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-performance-provider
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-gateway
  hostnames:
    - perf-provider.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ai-performance-provider
      timeouts:
        request: 60s
        backendRequest: 60s
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: ai-performance
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-performance-plain
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-gateway
  hostnames:
    - perf-plain.example.com
  rules:
    - filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /ai-performance/v1/chat/completions
      timeouts:
        request: 60s
        backendRequest: 60s
      backendRefs:
        - name: ai-performance
          port: 30001

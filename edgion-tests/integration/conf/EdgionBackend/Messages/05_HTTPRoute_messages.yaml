apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: messages-off
  namespace: edgion-test
spec:
  parentRefs:
    - name: messages-gateway
  hostnames:
    - messages-off.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: messages-off
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: messages-provider
---

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: messages-guard-rewrite
  namespace: edgion-test
spec:
  parentRefs:
    - name: messages-gateway
  hostnames:
    - messages-guard-rewrite.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: messages-guard
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/messages
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: messages-provider
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: messages-provider

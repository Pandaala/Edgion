apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-resilience-429
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-resilience-gateway
  hostnames:
    - ai-resilience-429.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ai-resilience-proxy
      retry:
        attempts: 1
        codes:
          - 429
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: resilience-rate-limited
        - group: edgion.io
          kind: EdgionBackend
          name: resilience-healthy
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-resilience-sse
  namespace: edgion-test
  annotations:
    edgion.io/retry-non-idempotent: "true"
spec:
  parentRefs:
    - name: ai-resilience-gateway
  hostnames:
    - ai-resilience-sse.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ai-resilience-proxy
      retry:
        attempts: 1
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: resilience-stream-primary
        - group: edgion.io
          kind: EdgionBackend
          name: resilience-stream-fallback
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:

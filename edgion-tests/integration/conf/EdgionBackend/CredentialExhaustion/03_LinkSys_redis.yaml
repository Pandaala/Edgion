apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: credential-exhaustion-redis
  namespace: default
spec:
  type: redis
  config:
    endpoints:
      - "redis://127.0.0.1:16379"
    db: 0
    auth:
      secretRef:
        name: ai-credential-exhaustion-redis-auth
    pool:
      size: 4
    timeout:
      connect: 3000
      read: 2000
      write: 2000

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-credential-exhaustion
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-credential-exhaustion
  hostnames:
    - ai-credential-exhaustion.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ai-credential-exhaustion-proxy
      retry:
        attempts: 2
        codes:
          - 503
      timeouts:
        request: 10s
        backendRequest: 2s
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: credential-exhaustion-primary
        - group: edgion.io
          kind: EdgionBackend
          name: credential-exhaustion-secondary

apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: duplicate-host-policy-hot-reload
spec:
  controllerName: edgion.io/gateway-controller
  parametersRef:
    group: edgion.io
    kind: EdgionGatewayConfig
    name: duplicate-host-policy-hot-reload
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: duplicate-host-policy-hot-reload
  namespace: edgion-test
spec:
  gatewayClassName: duplicate-host-policy-hot-reload
  listeners:
    - name: http
      protocol: HTTP
      port: 31983
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: duplicate-host-policy-hot-reload-redirect
  namespace: edgion-test
  annotations:
    edgion.io/http-to-https-redirect: "true"
spec:
  gatewayClassName: duplicate-host-policy-hot-reload
  listeners:
    - name: http-redirect
      protocol: HTTP
      port: 31984
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: duplicate-host-policy-hot-reload
  namespace: edgion-test
spec:
  parentRefs:
    - name: duplicate-host-policy-hot-reload
      sectionName: http
  hostnames:
    - duplicate-host-policy.sandbox.example.com
  rules:
    - backendRefs:
        - name: test-http
          port: 30001

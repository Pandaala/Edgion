{
  "apiVersion": "edgion.io/v1alpha1",
  "kind": "EdgionGatewayConfig",
  "metadata": {
    "name": "downstream-ecdh-curves"
  },
  "spec": {
    "tcpTimeout": {
      "idleTimeout": "120s"
    },
    "downstreamTls": {
      "minTlsVersion": "TLS1_3",
      "ciphers": [
        "ECDHE-RSA-AES128-GCM-SHA256",
        "ECDHE-ECDSA-AES128-GCM-SHA256"
      ],
      "ecdhCurves": [
        "P-256"
      ]
    }
  }
}
---
{
  "apiVersion": "edgion.io/v1alpha1",
  "kind": "EdgionTls",
  "metadata": {
    "name": "downstream-ecdh-curves",
    "namespace": "edgion-test"
  },
  "spec": {
    "parentRefs": [
      {
        "name": "ecdh-edgion",
        "sectionName": "tls"
      }
    ],
    "hosts": [
      "ecdh-edgion.sandbox.example.com"
    ],
    "secretRef": {
      "name": "edge-tls"
    },
    "minTlsVersion": "TLS1_2"
  }
}

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-gw-cert
  namespace: edgion-test
spec:
  parentRefs:
    - name: backend-tls-gw-cert
      namespace: edgion-test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /backend-gw-cert/
      backendRefs:
        - name: test-backend-gw-cert
          port: 30052

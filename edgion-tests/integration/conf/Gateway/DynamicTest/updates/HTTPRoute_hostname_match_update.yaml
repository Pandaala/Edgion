# Update phase: drop the route-level hostname filter so that, combined with the
# listener also removing its hostname filter (Gateway_dynamic-test_update.yaml),
# requests with arbitrary Host header can match the route on listener `http-with-hostname`.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-hostname-match
  namespace: edgion-test
spec:
  parentRefs:
  - name: dynamic-test-gateway
    namespace: edgion-test
    sectionName: http-with-hostname
  # hostnames removed: route now matches any Host header on the parent listener.
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /match
    backendRefs:
    - name: test-http
      namespace: edgion-test
      port: 30001

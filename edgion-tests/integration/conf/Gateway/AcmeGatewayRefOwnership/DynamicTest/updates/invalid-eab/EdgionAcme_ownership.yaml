apiVersion: edgion.io/v1
kind: EdgionAcme
metadata:
  name: acme-gatewayref-ownership
  namespace: edgion-test
spec:
  email: admin@example.com
  privateKeySecretRef:
    name: acme-gatewayref-account
  externalAccountBinding:
    keyId: public-id
    keySecretRef:
      kind: ConfigMap
      name: acme-gatewayref-eab
  domains:
    - acme-ownership.example.com
  challenge:
    type: http-01
    gatewayRef:
      name: acme-ownership-a
      sectionName: http
      port: 31410
  storage:
    secretName: acme-gatewayref-certificate

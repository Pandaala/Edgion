# Test: Cross-Gateway Same Port - Gateway A
# This Gateway uses the same port as Gateway B (31261)
# After fix: cross-Gateway same port is NOT a conflict (conflict is Gateway-internal only)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: port-conflict-cross-a
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    # HTTP Listener on port 31261
    - name: http
      protocol: HTTP
      port: 31261

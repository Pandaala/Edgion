apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fv-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: frontend-validation-gateway
      namespace: edgion-test
      sectionName: https-fv
  hostnames:
    - "fv-mtls.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

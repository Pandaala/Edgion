apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: retained-handles-http
  namespace: edgion-test
  labels:
    kubernetes.io/service-name: retained-handles-http
addressType: IPv4
ports:
  - name: http
    port: 30001
    protocol: TCP
endpoints:
  - addresses: ["127.0.0.1"]
    conditions:
      ready: true
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: retained-handles-grpc
  namespace: edgion-test
  labels:

# EdgionStreamPlugins: allow localhost only.
# Proves the real client IP is extracted (not hardcoded "0.0.0.0"):
# the client's source 127.0.0.1 matches 127.0.0.0/8 -> ALLOW.
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: udp-allow-localhost
  namespace: edgion-test
spec:
  plugins:
    - type: IpRestriction
      config:
        defaultAction: deny
        allowRefs:
          - name: acl-udp-allow-localhost-allow-1f567d51d3

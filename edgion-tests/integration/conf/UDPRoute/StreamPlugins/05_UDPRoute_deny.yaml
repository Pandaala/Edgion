# UDPRoute with deny-all stream plugin.
# Uses short name annotation (namespace inferred from the UDPRoute's namespace).
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
  name: udp-sp-deny
  namespace: edgion-test
  annotations:
    edgion.io/edgion-stream-plugins: "udp-deny-all"
spec:
  parentRefs:
    - name: udp-stream-plugins-gw
      namespace: edgion-test
      sectionName: udp-deny-all
      port: 31393
  rules:
    - backendRefs:
        - name: test-udp
          port: 30011
          weight: 100

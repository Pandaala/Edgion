# UDPRoute with allow-localhost stream plugin (IP-extraction positive path).
# Uses full "namespace/name" annotation format.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
  name: udp-sp-allow-localhost
  namespace: edgion-test
  annotations:
    edgion.io/edgion-stream-plugins: "edgion-test/udp-allow-localhost"
spec:
  parentRefs:
    - name: udp-stream-plugins-gw
      namespace: edgion-test
      sectionName: udp-allow-localhost
      port: 31392
  rules:
    - backendRefs:
        - name: test-udp
          port: 30011
          weight: 100

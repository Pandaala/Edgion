# UDPRoute referencing a non-existent EdgionStreamPlugins to lock in the
# fail-close contract: when the gateway cannot resolve the referenced ESP,
# packets are dropped rather than silently forwarded.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: UDPRoute
metadata:
  name: udp-sp-fail-close
  namespace: edgion-test
  annotations:
    edgion.io/edgion-stream-plugins: "udp-nonexistent-esp"
spec:
  parentRefs:
    - name: udp-stream-plugins-gw
      namespace: edgion-test
      sectionName: udp-fail-close
      port: 31394
  rules:
    - backendRefs:
        - name: test-udp
          port: 30011
          weight: 100

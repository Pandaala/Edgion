# Cross-namespace UDPRoute without a ReferenceGrant. The backend Service is
# real so a missing fail-close gate would echo instead of dropping.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: udp-denied-ref-gw
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: udp
      protocol: UDP
      port: 31955

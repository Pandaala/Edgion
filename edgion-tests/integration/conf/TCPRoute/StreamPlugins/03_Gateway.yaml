# Gateway for TCPRoute StreamPlugins testing
# Listeners: allow-localhost filter, deny-all filter, missing-ESP fail-close,
#            connection-rate-limit (local and Redis), connection-limit (route stage)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tcp-stream-plugins-gw
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: tcp-allow-localhost
      protocol: TCP
      port: 31274
    - name: tcp-deny-all
      protocol: TCP
      port: 31275
    - name: tcp-fail-close
      protocol: TCP
      port: 31273
    - name: tcp-conn-rate
      protocol: TCP
      port: 31277
    - name: tcp-conn-rate-redis
      protocol: TCP
      port: 31278
    - name: tcp-conn-limit
      protocol: TCP
      port: 31279

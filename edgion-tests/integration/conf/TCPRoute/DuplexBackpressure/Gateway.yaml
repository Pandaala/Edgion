apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: l4-duplex-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: tcp
      protocol: TCP
      port: 31958
    - name: tls-terminate
      protocol: TLS
      port: 31959
      hostname: duplex.sandbox.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-tls
    - name: tls-passthrough
      protocol: TLS
      port: 31960
      hostname: duplex.sandbox.example.com
      tls:
        mode: Passthrough

# EdgionStreamPlugins with GlobalConnectionIpRestriction using the flattened config model.
#
# The plugin config holds all profiles inline (safe default = allow-local, which permits
# loopback only). The optional activeProfileRef points at the gcir-enforce-test Selector
# EdgionConfigData, which can hot-swap the active profile (among the inline profiles)
# without touching this resource. A missing/unknown selector falls back to activeProfile.
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: gcir-stream-plugins
  namespace: edgion-test
spec:
  plugins:
    - type: GlobalConnectionIpRestriction
      config:
        enable: true
        activeProfile: allow-local
        profiles:
          allow-local:
            defaultAction: deny
            allowRefs:
              - name: acl-gcir-stream-plugins-allow-af75fff99c
          block-local:
            defaultAction: allow
            denyRefs:
              - name: acl-gcir-stream-plugins-deny-59e25a3eea
        activeProfileRef:
          namespace: edgion-test
          name: gcir-enforce-test

# EdgionStreamPlugins referencing the GlobalConnectionIpRestriction PluginMetaData
# The plugin uses pluginMetadataRef to delegate IP filtering to the PM's active profile.
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: gcir-stream-plugins
  namespace: edgion-test
spec:
  plugins:
    - type: GlobalConnectionIpRestriction
      config:
        pluginMetadataRef:
          namespace: edgion-test
          name: gcir-enforce-test

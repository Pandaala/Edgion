# GlobalConnectionIpRestriction with one inline profile per design §6.3 row.
#
# The active profile is hot-swapped via the tcp-geo-selector Selector
# (activeProfileRef below). This same ESP is referenced from BOTH:
#   - the tcp-geo-route TCPRoute (edgion.io/edgion-stream-plugins annotation
#     on the ROUTE) -> Stage-2 "tcp" layer, post route-match
#     (see edgion-gateway/src/routes/tcp/edgion_tcp.rs::check_stream_plugins)
#   - the tcp-geo-bare-gw Gateway (edgion.io/edgion-stream-plugins annotation
#     on the GATEWAY, no TCPRoute attached at all) -> Stage-1 "stage1" layer,
#     the pre-accept ConnectionFilter
#     (see edgion-gateway/src/plugins/stream/connection_filter_bridge.rs)
# Two separate Gateways are used (rather than one Gateway with two listeners)
# because the edgion-stream-plugins annotation is resolved per-Gateway, not
# per-listener: both listeners of one Gateway would get the same Stage-1
# filter, and there would be no way to isolate the "only stage1" case.
#
# Profiles, mapped to design §6.3 rows:
#   row1_ip_deny_terminal — row 1: IP deny wins over geo (terminal)
#   row2_ip_allow_exempts — row 2: IP allow exempts a geo deny (terminal)
#   row3b_and_3d          — row 3b (deny hit) / row 3d (no opinion, falls
#                            through to the Allow default) share one profile
#   row3c_terminal        — row 3c: allowCountries + defaultAction=Deny is
#                            terminal in both directions
#   row4_regression       — row 4: the "inert Allow default" regression this
#                            whole design exists to prevent. `allow` is
#                            present (whitelist mode) so `defaultAction:
#                            allow` is inert; a non-hit source that is also
#                            not geo-denied must still be denied
#                            (DenyByWhitelistMiss must survive the geo stage).
#   row4prime_default_deny — row 4': deny-only geo with no hit, plain
#                            defaultAction=deny falls through untouched.
#   no_geo_baseline        — no geo block at all: byte-for-byte legacy
#                            GlobalConnectionIpRestriction behavior.
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: tcp-geo-esp
  namespace: edgion-test
spec:
  plugins:
    - type: GlobalConnectionIpRestriction
      config:
        enable: true
        activeProfile: row1_ip_deny_terminal
        profiles:
          row1_ip_deny_terminal:
            defaultAction: allow
            deny:
              - name: deny-ru-source
                cidrs:
                  - "127.0.0.5/32"
            geo:
              allowCountries: ["RU"]
              failOpen: false
          row2_ip_allow_exempts:
            defaultAction: allow
            allow:
              - name: allow-ru-source
                cidrs:
                  - "127.0.0.5/32"
            geo:
              denyCountries: ["RU"]
              failOpen: false
          row3b_and_3d:
            defaultAction: allow
            geo:
              denyCountries: ["RU"]
              failOpen: false
          row3c_terminal:
            defaultAction: deny
            geo:
              allowCountries: ["HK"]
              failOpen: false
          row4_regression:
            defaultAction: allow
            allow:
              - name: unrelated-allow
                cidrs:
                  - "127.0.0.9/32"
            geo:
              denyCountries: ["RU"]
              failOpen: true
          row4prime_default_deny:
            defaultAction: deny
            geo:
              denyCountries: ["RU"]
              failOpen: false
          no_geo_baseline:
            defaultAction: deny
            allow:
              - name: loopback
                cidrs:
                  - "127.0.0.0/8"
        activeProfileRef:
          namespace: edgion-test
          name: tcp-geo-selector

apiVersion: edgion.io/v1alpha1
kind: EdgionGatewayConfig
metadata:
  name: example-gateway
spec:
  # GatewayClass HTTP server behavior
  server:
    downstreamKeepaliveRequestLimit: 1000  # per-connection, HTTP/1.1 only, 0 = unlimited

  # Real IP 
  realIp:
    trustedIpRefs:
      - name: global-realip-proxies
        namespace: edgion-test
    realIpHeader: "X-Forwarded-For"

  # 
  securityProtect:
    xForwardedForLimit: 200
    requireSniHostMatch: true
    fallbackSni: "default.example.com"

  # HTTP
  httpTimeout:
    client:
      readTimeout: 60s
      writeTimeout: 60s
      keepaliveTimeout: 75s
    backend:
      defaultConnectTimeout: 5s
      defaultRequestTimeout: 60s
      defaultIdleTimeout: 300s

  # L4 (TCP/TLS) relay idle timeout. Short value so the idle-timeout integration
  # scenario closes a stalled connection quickly. All existing L4 suites are
  # sub-second single connections, so this does not sever them.
  tcpTimeout:
    idleTimeout: 2s

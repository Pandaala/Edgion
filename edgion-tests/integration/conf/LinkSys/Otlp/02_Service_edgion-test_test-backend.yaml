# Service pointing to the local test_server HTTP backend on port 30001.
apiVersion: v1
kind: Service
metadata:
  name: test-backend
  namespace: edgion-test
spec:
  ports:
    - name: http
      port: 30001
      targetPort: 30001
      protocol: TCP
    - name: https
      port: 30002
      targetPort: 30002
      protocol: TCP

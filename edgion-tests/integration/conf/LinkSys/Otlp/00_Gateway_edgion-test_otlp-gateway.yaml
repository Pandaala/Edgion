# Minimal Gateway listener for OTLP access-log integration testing.
# The test sends HTTP requests through this listener to generate access log records.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: otlp-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 31930
    - name: tcp
      protocol: TCP
      port: 31931
    - name: tls
      protocol: TLS
      port: 31932
      hostname: otlp-backend.edgion-test.example.com
      tls:
        mode: Passthrough

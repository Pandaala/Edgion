# HTTPRoute that proxies to the test_server backend.
# Used to generate real HTTP access log entries for the OTLP output test.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: otlp-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: otlp-gateway
      namespace: edgion-test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: test-backend
          namespace: edgion-test
          port: 30001

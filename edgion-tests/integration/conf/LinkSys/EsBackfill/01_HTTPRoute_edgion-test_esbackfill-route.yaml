# HTTPRoute that proxies to the test_server backend.
# Used to generate real HTTP access log entries for the ES backfill test.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: esbackfill-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: esbackfill-gateway
      namespace: edgion-test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: esbackfill-backend
          namespace: edgion-test
          port: 30001

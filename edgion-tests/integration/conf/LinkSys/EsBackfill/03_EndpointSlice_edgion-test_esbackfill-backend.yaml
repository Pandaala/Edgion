# EndpointSlice for the test_server backend (127.0.0.1:30001).
# Required so the gateway can resolve esbackfill-backend and proxy requests to
# the running test_server instance, producing 2xx access log entries.
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: esbackfill-backend
  namespace: edgion-test
  labels:
    kubernetes.io/service-name: esbackfill-backend
addressType: IPv4
ports:
  - name: http
    port: 30001
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true

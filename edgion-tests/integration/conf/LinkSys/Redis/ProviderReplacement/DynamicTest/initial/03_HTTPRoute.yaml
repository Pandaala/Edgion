apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: linksys-provider-replacement
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      sectionName: http
  hostnames:
    - "linksys-provider-replacement.example.com"
  rules:
    - matches:
        - path:
            type: Exact
            value: /echo/provider-replacement
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: linksys-provider-replacement
      backendRefs:
        - name: test-http
          port: 30001

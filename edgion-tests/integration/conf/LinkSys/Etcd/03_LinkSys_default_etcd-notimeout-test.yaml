# LinkSys Etcd resource with NO request timeout configured.
# Used by the degradation/recovery scenario in run_etcd_test.sh: with no
# request timeout, the health-probe per-call default (5s) is the ONLY bound on
# status() — this is the exact case the tokio::time::timeout wrap protects
# (pre-fix a hung etcd would hang far longer than the default).
apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: etcd-notimeout-test
  namespace: default
spec:
  type: etcd
  config:
    endpoints:
      - "http://127.0.0.1:12379"

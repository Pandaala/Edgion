# Scheme-only TLS uses the Gateway System CA bundle and must reject this private test CA.
apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: redis-tls-default-trust
  namespace: default
spec:
  type: redis
  config:
    endpoints:
      - "rediss://127.0.0.1:16380"
    db: 4
    auth:
      secretRef:
        name: redis-test-auth
    pool:
      size: 1
    timeout:
      connect: 3s
      command: 2s

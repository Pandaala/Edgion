  namespace: edgion-test
  labels:
    kubernetes.io/service-name: chain-backend
addressType: IPv4
ports:
  - name: http
    port: 30002
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true

# HTTP upstream (local test_server on 30061).
# NOTE: file-mode (file_system) conf_center requires ONE resource per file, so
# the paired EndpointSlice lives in EndpointSlice_edgion-test_ppin-http.yaml.
apiVersion: v1
kind: Service
metadata:
  name: ppin-http
  namespace: edgion-test
spec:
  ports:
    - name: http
      port: 30061
      targetPort: 30061
      protocol: TCP
  type: ClusterIP

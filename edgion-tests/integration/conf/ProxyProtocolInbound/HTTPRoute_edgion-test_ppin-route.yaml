# Routes both listeners of ppin-gw to the local test_server, whose /headers
# endpoint echoes the request headers back as JSON. That echo is how the test
# observes which client address Edgion decided on: the gateway injects
# X-Forwarded-For / X-Real-IP from the downstream peer address, which is exactly
# what the PROXY protocol header replaces.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ppin-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: ppin-gw
      namespace: edgion-test
  # Deliberately no `hostnames`: the probes run from a BusyBox container whose
  # wget sends `Host: <ip>:<port>`, and host matching is not what this test is
  # about. Matching every host keeps the probe to a plain one-liner.
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: ppin-http
          port: 30061

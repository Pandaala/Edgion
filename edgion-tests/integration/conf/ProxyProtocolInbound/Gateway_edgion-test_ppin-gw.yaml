# Gateway for the inbound PROXY protocol standalone integration test.
#
# The strict JSON annotation selects only `pp`; every unselected listener remains
# disabled. This exercises both mandatory mode and selected-listener scoping.
#
# Ports live in the 584xx range reserved by test_proxy_protocol_inbound.sh so they
# never collide with the shared 12xxx stack or the 583xx plugin-policy block.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: ppin-gw
  namespace: edgion-test
  annotations:
    edgion.io/inbound-proxy-protocol: '{"source":"inline","listeners":["pp"],"config":{"mode":"required"}}'
spec:
  gatewayClassName: public-gateway
  listeners:
    # Behind the L4 load balancer: every connection must start with a PROXY header.
    - name: pp
      protocol: HTTP
      port: 58430
      allowedRoutes:
        namespaces:
          from: All
    # Control listener: unselected by the annotation, so PROXY protocol is disabled.
    - name: plain
      protocol: HTTP
      port: 58431
      allowedRoutes:
        namespaces:
          from: All

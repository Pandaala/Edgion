# Endpoints for the ppin-http Service (local test_server HTTP echo on 30061).
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ppin-http
  namespace: edgion-test
  labels:
    kubernetes.io/service-name: ppin-http
addressType: IPv4
ports:
  - name: http
    port: 30061
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true

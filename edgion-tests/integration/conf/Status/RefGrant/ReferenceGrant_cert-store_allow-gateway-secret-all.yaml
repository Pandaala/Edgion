# D1: Allow Gateway in edgion-default to reference ALL Secrets in cert-store (wildcard, no name)
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-gateway-secret-all
  namespace: cert-store
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: edgion-default
  to:
    - group: ""
      kind: Secret

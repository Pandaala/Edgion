# ClusterRegionSetting fixtures; routing logic references a separate setting.
apiVersion: edgion.io/v1
kind: EdgionConfigData
metadata:
  name: ecd-region-override
  namespace: edgion-default
spec:
  data:
    type: ClusterRegionSetting
    config:
      regions:
      - name: us
        hashRange:
        - 0
        - 999
        backendEndpoint: us-backend:8080
        tls: false
      clusterName: integration
      regionName: us

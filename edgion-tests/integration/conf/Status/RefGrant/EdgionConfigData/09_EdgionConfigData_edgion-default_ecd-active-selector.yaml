# Selector EdgionConfigData in edgion-default.
# Cross-namespace target for Scenario I-2b (active_profile_ref_no_grant_ref_not_permitted).
#
# An EdgionPlugins in edgion-test references this via activeProfileRef
# (RequestAccessPolicy plugin).  visibility defaults to Namespace, so cross-ns
# refs require a matching ReferenceGrant.  Without a grant, the controller sets
# ResolvedRefs=False(RefNotPermitted) on the referrer.
apiVersion: edgion.io/v1
kind: EdgionConfigData
metadata:
  name: ecd-active-selector
  namespace: edgion-default
spec:
  data:
    type: Selector
    config:
      active: "lockdown"
      description: "cross-ns activeProfileRef target for reference-grant integration test"

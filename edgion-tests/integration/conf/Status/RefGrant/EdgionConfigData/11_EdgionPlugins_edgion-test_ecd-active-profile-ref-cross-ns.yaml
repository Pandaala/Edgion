# EdgionPlugins in edgion-test: RequestAccessPolicy with a cross-ns activeProfileRef.
#
# activeProfileRef points to 'ecd-active-selector' in edgion-default (type: Selector).
# No ReferenceGrant exists in edgion-default granting access from edgion-test.
#
# Expected controller status: ResolvedRefs=False(RefNotPermitted).
# Scenario I-2b (active_profile_ref_no_grant_ref_not_permitted) uses this resource.
#
# Data-plane behavior when ref_denied is fail-closed.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ecd-active-profile-ref-cross-ns
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: RequestAccessPolicy
      config:
        defaultProfile: "normal"
        profiles:
          normal:
            defaultAction: deny
            sourceMatch:
              directPeerIp:
                ipRules:
                  - ips:
                      inline:
                        - name: internal
                          cidrs: ["10.0.0.0/8"]
        activeProfileRef:
          name: ecd-active-selector
          namespace: edgion-default

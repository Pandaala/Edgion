# D3: ReferenceGrant with wrong from.namespace (does not match Gateway's namespace)
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-gateway-secret-invalid-from
  namespace: backend
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: Gateway
      namespace: wrong-namespace
  to:
    - group: ""
      kind: Secret
      name: no-grant-cert

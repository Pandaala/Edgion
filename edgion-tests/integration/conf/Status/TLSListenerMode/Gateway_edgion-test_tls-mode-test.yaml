apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-mode-test
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: passthrough
      protocol: TLS
      port: 31325
      tls:
        mode: Passthrough
    - name: unsupported-mode
      protocol: HTTPS
      port: 31326
      tls:
        mode: Passthrough
    - name: terminate
      protocol: TLS
      port: 31327
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-tls
    # Mixed TLS conflict: two TLS listeners on the same port with different modes
    - name: mixed-passthrough
      hostname: passthrough.example.com
      protocol: TLS
      port: 31328
      tls:
        mode: Passthrough
    - name: mixed-terminate
      hostname: terminate.example.com
      protocol: TLS
      port: 31328
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-tls

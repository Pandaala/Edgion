# Targets both ebtp-anc-svc-a-only (sole ref -> wins, gw-a Accepted=True) and
# ebtp-anc-svc-b-only (contends with ebtp-anc-b-win-bonly -> loses the
# lexicographic tie-break, gw-b Accepted=False/Conflicted). Demonstrates that
# a conflict on one target Service marks ONLY the ancestor that Service
# reaches, not every ancestor of the policy.
apiVersion: edgion.io/v1
kind: EdgionBackendTrafficPolicy
metadata:
  name: ebtp-anc-z-loser
  namespace: edgion-test
spec:
  targetRefs:
    - kind: Service
      name: ebtp-anc-svc-a-only
    - kind: Service
      name: ebtp-anc-svc-b-only
  loadBalancer:
    type: LeastConn

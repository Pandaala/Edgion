# Attached to ebtp-anc-gw-a. Reaches the shared Service (ebtp-anc-svc-multi,
# for the two-ancestor case) and the gw-a-only Service (ebtp-anc-svc-a-only,
# for the divergence case).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ebtp-anc-route-a
  namespace: edgion-test
spec:
  parentRefs:
    - name: ebtp-anc-gw-a
      namespace: edgion-test
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /multi
      backendRefs:
        - name: ebtp-anc-svc-multi
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /a-only
      backendRefs:
        - name: ebtp-anc-svc-a-only
          port: 8080

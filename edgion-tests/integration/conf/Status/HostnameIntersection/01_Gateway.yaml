apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: hostname-intersection
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: listener-1
      protocol: HTTP
      port: 31315
      hostname: "very.specific.com"
    - name: listener-2
      protocol: HTTP
      port: 31316
      hostname: "*.wildcard.io"
    - name: listener-3
      protocol: HTTP
      port: 31317
      hostname: "*.anotherwildcard.io"

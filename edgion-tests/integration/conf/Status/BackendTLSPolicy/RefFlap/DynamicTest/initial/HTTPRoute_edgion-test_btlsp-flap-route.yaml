apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: btlsp-flap-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: btlsp-flap-gateway
      namespace: edgion-test
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: btlsp-flap-svc
          port: 8080

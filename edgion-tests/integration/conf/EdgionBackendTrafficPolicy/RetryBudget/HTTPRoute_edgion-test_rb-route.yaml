# Route for the RetryBudget scenario. The retry policy (attempts 3, codes
# [503]) makes the gateway attempt a status-code retry on every 503 the
# degrading backend returns; the EBTP retryConstraint on rb-svc then decides
# whether each retry is admitted or refused with a deterministic 503.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rb-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: rb-gateway
      namespace: edgion-test
  hostnames:
    - "retry-budget.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      retry:
        attempts: 3
        codes: [503]
      timeouts:
        request: "10s"
      backendRefs:
        - name: rb-svc
          namespace: edgion-test
          port: 30001

# BackendTLSPolicy enables upstream TLS for ua-svc-tls and supplies the CA
# bundle to validate the wildcard backend's certificate. `validation.hostname`
# is a Gateway-API-required field, but per the dynamic-upstream-authority
# design (docs/superpowers/specs/2026-07-14-dynamic-upstream-authority-design.md
# §5.6) it is INERT once the Service also carries an `upstreamAuthority`
# policy: the composed per-request authority supplies the real SNI and SAN
# validation name instead. Admission still requires this static hostname to
# be in-pattern, so it is set to an in-pattern-but-unused label to make that
# inertness obvious rather than accidentally matching a real test tenant.
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: ua-backend-tls
  namespace: edgion-test
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: ua-svc-tls
  validation:
    caCertificateRefs:
      - name: backend-ca
        kind: Secret
        group: ""
    hostname: unused-placeholder.sandbox.internal

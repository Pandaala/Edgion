# Service anchoring the plain-HTTP echo backend (test_server's shared
# --http-ports 30001 listener). Used by the cleartext dispatch, active
# health-check, and outbound-path (ForwardAuth) cases — none of which need
# TLS/SNI, only per-tenant Host dispatch.
apiVersion: v1
kind: Service
metadata:
  name: ua-svc-plain
  namespace: edgion-test
spec:
  ports:
    - name: http
      port: 30001
      targetPort: 30001
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: ua-svc-plain-slice
  namespace: edgion-test
  labels:
    kubernetes.io/service-name: ua-svc-plain
addressType: IPv4
ports:
  - name: http
    port: 30001
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true

# Three rules on one HTTPRoute, sharing the hostname "upstream-authority.example.com":
#   /tls      -> ua-svc-tls    (HTTPS wildcard backend; standard-path HTTPS cases)
#   /plain    -> ua-svc-plain  (cleartext echo backend; cleartext + health cases)
#   /outbound -> ua-svc-plain  (same backend, fronted by ForwardAuth; outbound-path case)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ua-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: ua-gateway
      namespace: edgion-test
  hostnames:
    - "upstream-authority.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /tls
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ua-ctxset
      backendRefs:
        - name: ua-svc-tls
          port: 30028
    - matches:
        - path:
            type: PathPrefix
            value: /plain
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ua-ctxset
      backendRefs:
        - name: ua-svc-plain
          port: 30001
    - matches:
        - path:
            type: PathPrefix
            value: /outbound
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ua-ctxset-forwardauth
      backendRefs:
        - name: ua-svc-plain
          port: 30001

# Corrected refs-only variant; unknown-field diagnostics must clear.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: uf-ipr
  namespace: edgion-test
spec:
  requestPlugins:
  - enable: true
    type: IpRestriction
    config:
      ipSource: RemoteIp
      allowRefs:
      - name: acl-uf-ipr-allow
      denyRefs:
      - name: acl-uf-ipr-deny

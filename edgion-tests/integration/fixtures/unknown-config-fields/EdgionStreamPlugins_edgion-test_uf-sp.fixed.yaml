# Corrected variant of EdgionStreamPlugins_edgion-test_uf-sp.yaml: "denys" ->
# "deny". Applying this over the malformed fixture must drain the
# diagnostics endpoint to zero for this resource.
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: uf-sp
  namespace: edgion-test
spec:
  plugins:
    - type: IpRestriction
      config:
        defaultAction: allow
        allow:
          - name: localhost
            cidrs:
              - "127.0.0.0/8"
        deny:
          - name: blocked
            cidrs:
              - "1.2.3.4/32"

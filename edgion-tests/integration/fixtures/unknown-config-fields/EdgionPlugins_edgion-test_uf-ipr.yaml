# DELIBERATELY MALFORMED (Phase 6 negative test):
# "denys" is a typo for the real field "deny". This exercises the plain
# nested-object unknown-key case: the schema walker must report exactly
# "requestPlugins[0].config.denys", while the resource stays Accepted: True
# (warn-not-reject, see 05-issues.md R-12) because a valid "allow" entry
# keeps IpRestrictionConfig::validation_error satisfied.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: uf-ipr
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: IpRestriction
      config:
        ipSource: RemoteIp
        allow:
          - name: office
            cidrs:
              - "10.0.0.0/8"
        denys:
          - name: blocked
            cidrs:
              - "1.2.3.4/32"

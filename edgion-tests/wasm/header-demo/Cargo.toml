[package]
name = "wasm-header-demo"
version = "0.1.0"
edition = "2021"
publish = false

# Standalone workspace: keep this guest crate out of the main Edgion workspace
# (it builds for wasm32 targets only).
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
proxy-wasm = "=0.2.5"

[profile.release]
lto = true
opt-level = "s"
strip = true

# Give the SNI collision listener a route to the shared selector-backed Service.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: edgiontls-sni-collision-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgiontls-sni-collision-gateway
      namespace: edgion-test
      sectionName: https
  hostnames:
    - gateway-tls.test.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mtls-failclose-route
  namespace: edgion-test
spec:
  parentRefs:
  - name: mtls-failclose-gateway
    namespace: edgion-test
  hostnames:
  - mtls-ca-missing.example.com
  - mtls-ca-garbage.example.com
  - frontend-mtls-garbage.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: test-http
      namespace: edgion-test
      port: 30001

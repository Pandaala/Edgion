apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mtls-failclose-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  tls:
    frontend:
      default:
        {}
      perPort:
      - port: 31340
        tls:
          validation:
            caCertificateRefs:
            - name: garbage-frontend-ca
              kind: Secret
              group: ''
  listeners:
  - name: https-mtls-failclose
    protocol: HTTPS
    port: 31199
  - name: https-frontend-mtls-failclose
    hostname: frontend-mtls-garbage.example.com
    protocol: HTTPS
    port: 31340
    tls:
      mode: Terminate
      certificateRefs:
      - name: fv-server-cert

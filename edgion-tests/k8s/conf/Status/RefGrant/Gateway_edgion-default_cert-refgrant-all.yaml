apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cert-refgrant-all
  namespace: edgion-default
spec:
  gatewayClassName: public-gateway
  listeners:
  - name: https-grant-all
    protocol: HTTPS
    port: 31330
    tls:
      certificateRefs:
      - kind: Secret
        name: refgrant-test-cert
        namespace: cert-store

apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tls-cross-ns-allowed
  namespace: app
spec:
  parentRefs:
  - name: tls-refgrant-gateway
    namespace: edgion-test
    sectionName: tls
  hostnames:
  - tls-allowed.refgrant.example.com
  rules:
  - backendRefs:
    - name: tls-refgrant-svc
      namespace: backend
      port: 30010
      weight: 100

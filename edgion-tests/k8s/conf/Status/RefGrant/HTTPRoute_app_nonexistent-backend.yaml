apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nonexistent-backend
  namespace: edgion-default
spec:
  parentRefs:
  - name: public-gateway
    namespace: edgion-test
  hostnames:
  - nonexistent-backend.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: nonexistent-svc
      port: 80

# Cross-namespace TCPRoute without a ReferenceGrant. The backend Service is
# real so a missing fail-close gate would echo instead of closing.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tcp-denied-ref-gw
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: tcp
      protocol: TCP
      port: 31954
      allowedRoutes:
        namespaces:
          from: All

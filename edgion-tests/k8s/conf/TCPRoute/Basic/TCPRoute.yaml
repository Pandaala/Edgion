apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: test-tcp
  namespace: edgion-test
  annotations:
    edgion.io/tcp-keepalive-time: "60"
    edgion.io/tcp-keepalive-interval: "10"
    edgion.io/tcp-keepalive-probes: "4"
spec:
  parentRefs:
    - name: tcp-test-gateway
      namespace: edgion-test
      sectionName: tcp
      port: 31090
  rules:
    - backendRefs:
        - name: test-tcp
          port: 30010
          weight: 100

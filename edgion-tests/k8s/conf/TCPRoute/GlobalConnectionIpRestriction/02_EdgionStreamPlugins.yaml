apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: gcir-stream-plugins
  namespace: edgion-test
spec:
  plugins:
  - type: GlobalConnectionIpRestriction
    config:
      enable: true
      activeProfile: allow-local
      profiles:
        allow-local:
          defaultAction: deny
          allow:
          - name: loopback
            cidrs:
            - 10.0.0.0/8
        block-local:
          defaultAction: allow
          deny:
          - name: loopback-block
            cidrs:
            - 10.0.0.0/8
      activeProfileRef:
        namespace: edgion-test
        name: gcir-enforce-test

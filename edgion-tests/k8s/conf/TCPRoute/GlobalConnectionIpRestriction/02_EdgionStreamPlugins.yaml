apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: gcir-stream-plugins
  namespace: edgion-test
spec:
  plugins:
  - type: GlobalConnectionIpRestriction
    config:
      enable: true
      activeProfile: allow-local
      profiles:
        allow-local:
          defaultAction: deny
          allowRefs:
          - name: k8s-test-client-peer
        block-local:
          defaultAction: allow
          denyRefs:
          - name: k8s-test-client-peer
      activeProfileRef:
        namespace: edgion-test
        name: gcir-enforce-test

# EdgionStreamPlugins: deny all IPs
# Tests that stream plugin at TCPRoute level correctly denies connections
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: tcp-deny-all
  namespace: edgion-test
spec:
  plugins:
    - type: IpRestriction
      config:
        denyRefs:
          - name: acl-tcp-deny-all-deny-72b2c23a10
        defaultAction: deny

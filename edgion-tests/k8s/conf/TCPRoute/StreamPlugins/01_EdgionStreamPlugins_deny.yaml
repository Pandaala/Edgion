# EdgionStreamPlugins: deny all IPs
# Tests that stream plugin at TCPRoute level correctly denies connections
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: tcp-deny-all
  namespace: edgion-test
spec:
  plugins:
    - type: IpRestriction
      config:
        deny:
          - name: deny-all
            cidrs:
              - "0.0.0.0/0"
        defaultAction: deny

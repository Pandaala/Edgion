# Restored phase: allow-list re-added; the Kubernetes client is permitted again.
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: tcp-sp-reload-esp
  namespace: edgion-test
spec:
  plugins:
    - type: IpRestriction
      config:
        defaultAction: deny
        allow:
          - name: kubernetes-client
            cidrs:
              - "0.0.0.0/0"

# TCPRoute that activates ConnectionRateLimit on the new listener.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: tcp-conn-rate
  namespace: edgion-test
  annotations:
    edgion.io/edgion-stream-plugins: "tcp-conn-rate-local"
spec:
  parentRefs:
    - name: tcp-stream-plugins-gw
      namespace: edgion-test
      sectionName: tcp-conn-rate
      port: 31277
  rules:
    - backendRefs:
        - name: test-tcp
          port: 30010
          weight: 100

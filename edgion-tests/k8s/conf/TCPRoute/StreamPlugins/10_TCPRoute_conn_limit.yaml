# TCPRoute that activates ConnectionLimit on its own listener.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: tcp-conn-limit
  namespace: edgion-test
  annotations:
    edgion.io/edgion-stream-plugins: "tcp-conn-limit-route"
spec:
  parentRefs:
    - name: tcp-stream-plugins-gw
      namespace: edgion-test
      sectionName: tcp-conn-limit
      port: 31279
  rules:
    - backendRefs:
        - name: test-tcp
          port: 30010
          weight: 100

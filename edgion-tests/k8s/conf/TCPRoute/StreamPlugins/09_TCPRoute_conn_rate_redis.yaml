# TCPRoute activating the Redis-backed ConnectionRateLimit on its listener.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: tcp-conn-rate-redis
  namespace: edgion-test
  annotations:
    edgion.io/edgion-stream-plugins: "tcp-conn-rate-redis"
spec:
  parentRefs:
    - name: tcp-stream-plugins-gw
      namespace: edgion-test
      sectionName: tcp-conn-rate-redis
      port: 31278
  rules:
    - backendRefs:
        - name: test-tcp
          port: 30010
          weight: 100

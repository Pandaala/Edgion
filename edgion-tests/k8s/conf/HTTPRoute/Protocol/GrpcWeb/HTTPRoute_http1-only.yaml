apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpcweb-http1-only
  namespace: edgion-test
spec:
  parentRefs:
    - name: grpcweb-http1-only-gateway
      namespace: edgion-test
  hostnames:
    - "grpcweb.test.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test.TestService
      backendRefs:
        - name: test-grpcweb
          port: 30021

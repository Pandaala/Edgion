apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sp-change-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: sp-change-gateway
      namespace: edgion-default
  hostnames:
    - "sp-change.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      sessionPersistence:
        sessionName: "edgion-sp-change"
        type: Cookie
        absoluteTimeout: "1h"
        cookieConfig:
          lifetimeType: Permanent
      backendRefs:
        - name: backend-a
          port: 8080
          weight: 100
        - name: backend-b
          port: 8080
          weight: 0
        - name: backend-c
          port: 8080
          weight: 0

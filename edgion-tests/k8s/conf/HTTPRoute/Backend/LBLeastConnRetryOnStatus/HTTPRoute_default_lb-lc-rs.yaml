apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lb-lc-rs
  namespace: edgion-default
spec:
  parentRefs:
  - name: lb-lc-rs-gateway
    namespace: edgion-test
  hostnames:
  - lb-lc-rs.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    retry:
      attempts: 3
      codes:
      - 503
    timeouts:
      request: 10s
      backendRequest: 3s
    backendRefs:
    - name: lb-lc-rs-service
      port: 8080

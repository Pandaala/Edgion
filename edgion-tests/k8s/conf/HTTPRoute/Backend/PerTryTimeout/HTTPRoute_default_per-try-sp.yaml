apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: per-try-sp
  namespace: edgion-default
spec:
  parentRefs:
  - name: per-try-timeout-gateway
    namespace: edgion-test
  hostnames:
  - per-try-sp.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    retry:
      attempts: 3
      codes:
      - 502
      - 503
    sessionPersistence:
      sessionName: edgion-sp-ptt
      type: Cookie
      absoluteTimeout: 1h
      cookieConfig:
        lifetimeType: Permanent
    timeouts:
      request: 10s
      backendRequest: 1s
    backendRefs:
    - name: per-try-sp
      namespace: edgion-test
      port: 30001

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: per-try-deadline
  namespace: edgion-default
spec:
  parentRefs:
  - name: per-try-timeout-gateway
    namespace: edgion-test
  hostnames:
  - per-try-deadline.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    retry:
      attempts: 5
    timeouts:
      request: 2s
      backendRequest: 1500ms
    backendRefs:
    - name: test-http-per-try
      namespace: edgion-test
      port: 30001

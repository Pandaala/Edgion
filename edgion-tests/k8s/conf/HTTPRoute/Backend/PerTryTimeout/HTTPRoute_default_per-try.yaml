apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: per-try
  namespace: edgion-default
spec:
  parentRefs:
  - name: per-try-timeout-gateway
    namespace: edgion-test
  hostnames:
  - per-try.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    retry:
      attempts: 2
    timeouts:
      request: 10s
      backendRequest: 1s
    backendRefs:
    - name: test-http-per-try
      namespace: edgion-test
      port: 30001

# Active gRPC health check against the "unhealthy" service name, so the backend
# is marked unhealthy.
apiVersion: edgion.io/v1
kind: EdgionBackendTrafficPolicy
metadata:
  name: grpc-hc-unhealthy-policy
  namespace: edgion-default
spec:
  targetRefs:
    - kind: Service
      name: grpc-hc-unhealthy
  healthCheck:
    active:
      type: grpc
      port: 30021
      interval: 1s
      timeout: 1s
      healthyThreshold: 1
      unhealthyThreshold: 1
      grpcServiceName: "unhealthy"

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpc-hc-healthy-route
  namespace: edgion-default
spec:
  parentRefs:
  - name: grpc-hc-gateway
    namespace: edgion-test
  hostnames:
  - grpc-hc-healthy.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: grpc-hc-healthy
      port: 30001

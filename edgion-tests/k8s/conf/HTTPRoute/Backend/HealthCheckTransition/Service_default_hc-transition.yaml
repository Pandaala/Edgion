apiVersion: v1
kind: Service
metadata:
  name: hc-transition
  namespace: edgion-default
  annotations:
    edgion.io/health-check: "active:\n  type: http\n  path: /health\n  interval: 1s\n\
      \  timeout: 1s\n  healthyThreshold: 1\n  unhealthyThreshold: 1\n  expectedStatuses:\n\
      \    - 200\n"
spec:
  ports:
  - port: 30001
    targetPort: 30001
    protocol: TCP
  selector:
    app: edgion-test-server

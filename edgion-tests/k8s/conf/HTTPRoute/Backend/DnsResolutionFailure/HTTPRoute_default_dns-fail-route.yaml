apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dns-fail-route
  namespace: edgion-default
spec:
  parentRefs:
  - name: dns-fail-gateway
    namespace: edgion-test
  hostnames:
  - dns-fail.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    timeouts:
      request: 8s
      backendRequest: 1s
    backendRefs:
    - name: nonexistent-backend
      namespace: edgion-default
      port: 80

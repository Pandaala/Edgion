apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: invalid-kind-shares
  namespace: edgion-default
spec:
  parentRefs:
    - name: partially-invalid-gateway
      namespace: edgion-test
  hostnames:
    - invalid-kind-shares.example.com
  rules:
    - matches: [{path: {type: Exact, value: /mixed-same}}]
      backendRefs:
        - {name: valid-backend, namespace: edgion-test, port: 30001, weight: 1}
        - {group: core, name: valid-backend, namespace: edgion-test, port: 30001, weight: 1}
    - matches: [{path: {type: Exact, value: /mixed-other}}]
      backendRefs:
        - {name: valid-backend, namespace: edgion-test, port: 30001, weight: 1}
        - {group: core, name: nonexistent-service, namespace: edgion-test, port: 30001, weight: 1}
    - matches: [{path: {type: Exact, value: /unsupported-kind}}]
      backendRefs:
        - {name: valid-backend, namespace: edgion-test, port: 30001, weight: 1}
        - {group: multicluster.x-k8s.io, kind: ServiceImport, name: valid-backend, namespace: edgion-test, port: 30001, weight: 1}
    - matches: [{path: {type: Exact, value: /invalid-only}}]
      backendRefs:
        - {group: core, name: valid-backend, namespace: edgion-test, port: 30001, weight: 1}
    - matches: [{path: {type: Exact, value: /zero-invalid}}]
      backendRefs:
        - {name: valid-backend, namespace: edgion-test, port: 30001, weight: 1}
        - {group: core, name: valid-backend, namespace: edgion-test, port: 30001, weight: 0}

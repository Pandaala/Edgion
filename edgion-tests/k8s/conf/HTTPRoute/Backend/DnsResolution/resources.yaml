apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: dns-httpdns-local
  namespace: edgion-default
spec:
  type: httpdns
  config:
    urlTemplate: "http://dns-test-server.edgion-test.svc.cluster.local:30001/dns/resolve?host={domain}&ip=pod"
    response:
      kind: json
      ipPath: ips
    fallback:
      type: system
---
apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: dns-httpdns-dead
  namespace: edgion-default
spec:
  type: httpdns
  config:
    urlTemplate: "http://dns-test-server.edgion-test.svc.cluster.local:65530/dns/resolve?host={domain}"
    response:
      kind: json
      ipPath: ips
    fallback:
      type: system
---
apiVersion: v1
kind: Service
metadata:
  name: dns-test-server
  namespace: edgion-test
spec:
  selector:
    app: edgion-sequence-test-server
  ports:
    - name: http
      port: 30001
      targetPort: 30001
      protocol: TCP
    - name: tcp
      port: 30010
      targetPort: 30010
      protocol: TCP
    - name: udp
      port: 30011
      targetPort: 30011
      protocol: UDP
---
apiVersion: v1
kind: Service
metadata:
  name: dns-system
  namespace: edgion-default
  annotations:
    edgion.io/dns-resolution-mode: system
spec:
  type: ExternalName
  externalName: dns-test-server.edgion-test.svc.cluster.local
  ports:
    - port: 30001
      targetPort: 30001
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: dns-httpdns
  namespace: edgion-default
  annotations:
    edgion.io/dns-resolver-ref: edgion-default/dns-httpdns-local
spec:
  type: ExternalName
  externalName: httpdns.dns.test
  ports:
    - port: 30001
      targetPort: 30001
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: dns-gateway-cached
  namespace: edgion-default
  annotations:
    edgion.io/dns-resolution-mode: gateway
    edgion.io/dns-resolver-ref: edgion-default/dns-httpdns-local
spec:
  type: ExternalName
  externalName: gwcached.dns.test
  ports:
    - port: 30001
      targetPort: 30001
      protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: dns-httpdns-fallback
  namespace: edgion-default
  annotations:
    edgion.io/dns-resolver-ref: edgion-default/dns-httpdns-dead
spec:
  type: ExternalName
  externalName: dns-test-server.edgion-test.svc.cluster.local
  ports:
    - port: 30001
      targetPort: 30001
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: dns-res-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 31360
      allowedRoutes:
        namespaces:
          from: All
    - name: tcp-gateway
      protocol: TCP
      port: 31362
      allowedRoutes:
        namespaces:
          from: All
    - name: tcp-system
      protocol: TCP
      port: 31363
      allowedRoutes:
        namespaces:
          from: All
    - name: tcp-controller
      protocol: TCP
      port: 31364
      allowedRoutes:
        namespaces:
          from: All
    - name: udp-system
      protocol: UDP
      port: 31365
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dns-system-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: dns-res-gateway
      namespace: edgion-test
  hostnames: ["system.dns.test"]
  rules:
    - backendRefs:
        - name: dns-system
          kind: Service
          port: 30001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dns-httpdns-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: dns-res-gateway
      namespace: edgion-test
  hostnames: ["httpdns.dns.test"]
  rules:
    - backendRefs:
        - name: dns-httpdns
          kind: Service
          port: 30001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dns-gateway-cached-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: dns-res-gateway
      namespace: edgion-test
  hostnames: ["gateway-cached.dns.test"]
  rules:
    - backendRefs:
        - name: dns-gateway-cached
          kind: Service
          port: 30001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dns-httpdns-fallback-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: dns-res-gateway
      namespace: edgion-test
  hostnames: ["httpdns-fallback.dns.test"]
  rules:
    - backendRefs:
        - name: dns-httpdns-fallback
          kind: Service
          port: 30001
---
apiVersion: v1
kind: Service
metadata:
  name: dns-controller
  namespace: edgion-default
  annotations:
    edgion.io/dns-resolution-mode: controller
spec:
  type: ExternalName
  externalName: dns-test-server.edgion-test.svc.cluster.local
  ports:
    - port: 30001
      targetPort: 30001
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1

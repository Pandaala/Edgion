apiVersion: v1
kind: Service
metadata:
  name: cb-test
  namespace: edgion-default
  annotations:
    edgion.io/outlier-detection: 'consecutiveErrors: 3

      consecutiveGatewayErrors: 3

      ejectionSeconds: 3

      maxEjectionPercent: 0

      '
spec:
  ports:
  - port: 30001
    targetPort: 30001
    protocol: TCP
  selector:
    app: edgion-test-server

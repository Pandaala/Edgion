apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: cb-test
  namespace: edgion-default
spec:
  parentRefs:
  - name: cb-gw
  hostnames:
  - cb-test.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: cb-test
      port: 30001
    timeouts:
      request: 30s
      backendRequest: 5s

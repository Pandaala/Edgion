apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lb-lc-eps
  namespace: edgion-default
spec:
  parentRefs:
  - name: lb-lc-gateway
    namespace: edgion-test
  hostnames:
  - lb-lc-eps.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    retry:
      attempts: 1
    timeouts:
      request: 5s
      backendRequest: 4s
    backendRefs:
    - name: lb-lc-service
      port: 8080

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: btls-sni-route-a
  namespace: edgion-test
spec:
  parentRefs:
  - name: btls-sni-gateway
    namespace: edgion-test
  hostnames:
  - host-a.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: btls-sni-service-a
      port: 30026

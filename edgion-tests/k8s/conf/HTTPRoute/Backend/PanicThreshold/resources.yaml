apiVersion: edgion.io/v1
kind: EdgionBackendTrafficPolicy
metadata:
  name: panic-svc-policy
  namespace: edgion-default
spec:
  targetRefs:
    - kind: Service
      name: panic-svc
  loadBalancer:
    type: RoundRobin
    panicThreshold: 50
  healthCheck:
    active:
      type: http
      path: /status/503
      interval: 1s
      timeout: 1s
      healthyThreshold: 1
      unhealthyThreshold: 1
      expectedStatuses:
        - 200
---
apiVersion: v1
kind: Service
metadata:
  name: panic-svc
  namespace: edgion-default
spec:
  selector:
    app: edgion-test-server
  ports:
    - name: http
      port: 30001
      targetPort: 30001
      protocol: TCP
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: panic-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 31145
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: panic-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: panic-gateway
      namespace: edgion-test
  hostnames:
    - "panic.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: panic-svc
          port: 30001

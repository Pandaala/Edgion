apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-san
  namespace: edgion-test
spec:
  parentRefs:
  - name: backend-tls-san-gateway
    namespace: edgion-test
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /backend-san-match/
    backendRefs:
    - name: test-backend-san-match
      port: 30051
  - matches:
    - path:
        type: PathPrefix
        value: /backend-san-mismatch/
    backendRefs:
    - name: test-backend-san-mismatch
      port: 30051

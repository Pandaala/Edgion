apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lb-rr-noretry
  namespace: edgion-default
spec:
  parentRefs:
    - name: lb-policy-gateway
      namespace: edgion-test
  hostnames:
    - "lb-rr-test.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test
      retry:
        attempts: 0
      timeouts:
        request: 2s        # Total request timeout
        backendRequest: 1s # Backend connect + response timeout (overrides global 5s)
      backendRefs:
        - name: lb-rr-test-service
          port: 8080


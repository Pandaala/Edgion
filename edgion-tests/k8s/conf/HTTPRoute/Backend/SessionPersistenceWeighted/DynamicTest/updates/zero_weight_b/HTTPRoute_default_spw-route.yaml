# Weight of the session-bound backend (spw-b) drops to 0: new sessions must
# all go to spw-a, but the established spw-b session must NOT migrate.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: spw-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: spw-gateway
      namespace: edgion-default
  hostnames:
    - "spw.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      sessionPersistence:
        sessionName: "edgion-spw"
        type: Cookie
        absoluteTimeout: "1h"
        cookieConfig:
          lifetimeType: Permanent
      backendRefs:
        - name: spw-a
          port: 8080
          weight: 100
        - name: spw-b
          port: 8080
          weight: 0

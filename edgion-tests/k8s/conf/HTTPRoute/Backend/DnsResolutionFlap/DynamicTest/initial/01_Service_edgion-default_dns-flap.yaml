# ExternalName Service whose resolver-ref starts pointing at the DOWN httpdns
# (dns-flap-dead). Gateway endpoint-table mode: changing the resolver annotation
# re-keys the table entry at once, so no stale answer masks the change.
apiVersion: v1
kind: Service
metadata:
  name: dns-flap
  namespace: edgion-default
  annotations:
    edgion.io/dns-resolution-mode: gateway
    edgion.io/dns-resolver-ref: edgion-default/dns-flap-dead
spec:
  type: ExternalName
  externalName: flapbackend.test
  ports:
    - port: 30001
      targetPort: 30001
      protocol: TCP

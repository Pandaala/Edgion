# Live httpdns resolver that returns the serving test-server Pod IP. The
# scenario switches the Service's resolver-ref to this LinkSys at runtime to
# prove the hot-reload takes effect (failing -> working).
apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: dns-flap-local
  namespace: edgion-default
spec:
  type: httpdns
  config:
    urlTemplate: "http://edgion-test-server.edgion-test.svc.cluster.local:30001/dns/resolve?host={domain}&ip=pod"
    response:
      kind: json
      ipPath: ips
    fallback:
      type: system

apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: dns-flap-local
  namespace: edgion-default
spec:
  type: httpdns
  config:
    urlTemplate: "http://edgion-test-server.edgion-test.svc.cluster.local:30001/dns/resolve?host={domain}&ip=pod"
    connection:
      allowLoopback: true
      timeoutMs: 3000
      connectTimeoutMs: 1000
      poolMaxIdlePerHost: 2
      poolIdleTimeoutMs: 10000
      maxResponseBytes: 1
    response:
      kind: json
      ipPath: ips
    fallback:
      type: none

apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: dns-flap-local
  namespace: edgion-default
spec:
  type: httpdns
  config:
    urlTemplate: "http://169.254.169.254/d?host={domain}"
    connection:
      allowLoopback: true
    response:
      kind: json
      ipPath: ips
    fallback:
      type: none

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: prefix-slash-z-winner, namespace: edgion-test}
spec:
  parentRefs: [{name: http-test-gateway}]
  hostnames: ["prefix-slash.example.com"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: "/echo/"}
          method: GET
      filters:
        - type: URLRewrite
          urlRewrite:
            path: {type: ReplaceFullPath, replaceFullPath: /echo}
      backendRefs: [{name: prefix-slash-30001, port: 30001}]
---

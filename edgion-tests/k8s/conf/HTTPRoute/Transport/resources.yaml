---
apiVersion: v1
kind: Service
metadata:
  name: transport-stall-h1
  namespace: edgion-test
spec:
  ports:
  - port: 30030
    targetPort: 30030
    protocol: TCP
  selector:
    app: edgion-sequence-test-server

---
apiVersion: edgion.io/v1
kind: EdgionBackendTrafficPolicy
metadata:
  name: transport-stall-h1
  namespace: edgion-test
spec:
  targetRefs:
  - kind: Service
    name: transport-stall-h1
  outlierDetection:
    consecutiveErrors: 100
    consecutiveGatewayErrors: 100
    consecutiveLocalOriginFailures: 1
    ejectionTime: 1s
    maxEjectionTime: 1s
    maxEjectionPercent: 0

---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: transport-stall-h1
  namespace: edgion-test
spec:
  parentRefs:
  - name: transport-gateway
  hostnames:
  - transport-stall-h1.example.com
  rules:
  - timeouts:
      backendRequest: 120s
    backendRefs:
    - name: transport-stall-h1
      port: 30030


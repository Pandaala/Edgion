# Generated from edgion-tests/integration/conf/HTTPRoute/Delegation/*.yaml; child
# backends point at the shared test-http Service through the ReferenceGrant.
apiVersion: v1
kind: Namespace
metadata:
  name: edgion-deleg
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-edgion-deleg-routes-to-test-http
  namespace: edgion-test
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: edgion-deleg
  to:
    - group: ""
      kind: Service
      name: test-http
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: delegation-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 31932
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: deleg-deny-client-header
  namespace: edgion-deleg
spec:
  requestPlugins:
    - enable: true
      type: RequestRestriction
      config:
        mode: Deny
        conditions:
          anyOf:
            - allOf:
                - type: keyMatch
                  key:
                    type: header
                    name: "x-parent-filter"
                  values:
                    - "off"
        status: 403
        message: "child plugin saw the client header"
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: deleg-deny-parent-header
  namespace: edgion-deleg
spec:
  requestPlugins:
    - enable: true
      type: RequestRestriction
      config:
        mode: Deny
        conditions:
          anyOf:
            - allOf:
                - type: keyMatch
                  key:
                    type: header
                    name: "x-parent-filter"
                  values:
                    - "on"
        status: 403
        message: "child plugin saw the parent header"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: billing-child
  namespace: edgion-deleg
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: delegation-parent
      namespace: edgion-test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/billing/pay
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: deleg-deny-client-header
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/billing/audit
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: deleg-deny-parent-header
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
    - matches:
        - path:
            type: PathPrefix
            value: /evil
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
---

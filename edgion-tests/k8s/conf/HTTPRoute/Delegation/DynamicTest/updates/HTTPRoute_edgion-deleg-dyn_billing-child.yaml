# Update phase: the application team moves the rule from /pay to /pay2.
# Only this child changes; the parent and Gateway are untouched.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: billing-child
  namespace: edgion-deleg-dyn
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: delegation-dyn-parent
      namespace: edgion-test
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/billing/pay2
      backendRefs:
        - name: child-dyn-svc
          port: 30001
    - matches:
        - path:
            type: RegularExpression
            value: '^/api/v1/billing/?guard2$'
      backendRefs:
        - name: child-dyn-svc
          port: 30001

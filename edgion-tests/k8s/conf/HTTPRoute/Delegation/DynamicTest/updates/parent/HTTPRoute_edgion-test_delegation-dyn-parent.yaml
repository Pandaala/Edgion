# Parent-only narrowing withdraws the child's regex guard2 intersection while
# keeping /api/v1/billing/pay2 reachable. Restoring the parent recovers guard2.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: delegation-dyn-parent
  namespace: edgion-test
spec:
  parentRefs:
    - name: delegation-dyn-gateway
      namespace: edgion-test
  hostnames:
    - "delegation-dyn.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api/v1/billing/pay2
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          name: "*"
          namespace: edgion-deleg-dyn

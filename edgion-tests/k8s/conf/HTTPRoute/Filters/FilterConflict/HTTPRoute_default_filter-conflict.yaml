apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filter-conflict
  namespace: edgion-default
spec:
  parentRefs:
  - name: filter-conflict-gateway
    namespace: edgion-test
  hostnames:
  - filter-conflict.example.com
  rules:
  - matches:
    - path:
        type: Exact
        value: /rewrite-only
    filters:
    - type: URLRewrite
      urlRewrite:
        hostname: rewritten.example.com
    backendRefs:
    - name: filter-conflict-backend
      namespace: edgion-test
      port: 30001
  - matches:
    - path:
        type: Exact
        value: /redirect-only
    filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 302

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dangling-extension-ref-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "dangling-extension-ref.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /dangling
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: no-such-plugin
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unsupported-extension-ref-kind-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "unsupported-extension-ref-kind.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /unsupported-kind
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: NotAPlugin
            name: x
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
    - matches:
        - path:
            type: PathPrefix
            value: /supported-kind
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

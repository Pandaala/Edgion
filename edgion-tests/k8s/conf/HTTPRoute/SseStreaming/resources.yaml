apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sse-streaming-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 31947
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sse-streaming
  namespace: edgion-test
spec:
  parentRefs:
    - name: sse-streaming-gateway
  hostnames:
    - "test.example.com"
  rules:
    - matches:
        - path:
            type: Exact
            value: /sse
      backendRefs:
        - name: test-http
          port: 30001
    - matches:
        - path:
            type: Exact
            value: /headers
      backendRefs:
        - name: test-http
          port: 30001

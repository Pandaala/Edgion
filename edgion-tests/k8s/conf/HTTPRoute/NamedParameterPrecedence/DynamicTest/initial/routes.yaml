apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata: {name: named-static-z-winner, namespace: edgion-test}
spec:
  parentRefs: [{name: named-parameter-precedence-gateway}]
  hostnames: ["named-parameter-precedence.example.com"]
  rules:
    - matches: [{path: {type: Exact, value: "/named-rank/fixed"}}]
      backendRefs: [{name: named-precedence-30001, port: 30001}]
---

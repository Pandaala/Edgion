# EdgionStreamPlugins: deny all IPs (K8s)
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: tls-deny-all
  namespace: edgion-test
spec:
  tlsRoutePlugins:
    - type: IpRestriction
      config:
        denyRefs:
          - name: acl-tls-deny-all-deny-2f9945393c
        defaultAction: deny

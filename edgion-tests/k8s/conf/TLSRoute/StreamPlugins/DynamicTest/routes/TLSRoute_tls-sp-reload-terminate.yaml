apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tls-sp-reload-terminate
  namespace: edgion-test
  annotations:
    edgion.io/edgion-stream-plugins: "tls-sp-reload"
spec:
  parentRefs:
    - name: tls-stream-plugins-gw
      namespace: edgion-test
      sectionName: tls-allow-localhost
  hostnames:
    - "reload.sp-allow.example.com"
  rules:
    - backendRefs:
        - name: test-tcp
          port: 30010
          weight: 100

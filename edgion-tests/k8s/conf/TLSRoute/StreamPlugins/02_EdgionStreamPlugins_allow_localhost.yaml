# EdgionStreamPlugins: allow all clients in the K8s test cluster.
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: tls-allow-localhost
  namespace: edgion-test
spec:
  plugins:
    - type: IpRestriction
      config:
        defaultAction: allow
        allow:
          - name: allow-all
            cidrs:
              - "0.0.0.0/0"

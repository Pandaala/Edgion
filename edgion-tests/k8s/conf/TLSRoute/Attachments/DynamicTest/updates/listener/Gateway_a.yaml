apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-attachments-a
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: main
      protocol: TLS
      port: 31975
      hostname: "changed-a.attachments.example.com"
      tls:
        mode: Passthrough
    - name: control
      protocol: TLS
      port: 31975
      hostname: "control-a.attachments.example.com"
      tls:
        mode: Passthrough
    - name: narrow
      protocol: TLS
      port: 31975
      hostname: "one.wild.attachments.example.com"
      tls:
        mode: Passthrough

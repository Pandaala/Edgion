apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-route-passthrough-gw
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
  - name: tls-passthrough
    protocol: TLS
    port: 31290
    hostname: '*.sandbox.example.com'
    tls:
      mode: Passthrough

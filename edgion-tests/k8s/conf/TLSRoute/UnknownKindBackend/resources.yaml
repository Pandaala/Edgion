apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-unknown-kind-gw
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: tls-unknown-kind
      protocol: TLS
      port: 31291
      hostname: "*.sandbox.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-tls
            namespace: edgion-test
---
apiVersion: edgion.io/v1
kind: EdgionTls
metadata:
  name: tls-unknown-kind-cert
  namespace: edgion-test
spec:
  parentRefs:
    - name: tls-unknown-kind-gw
      namespace: edgion-test
      sectionName: tls-unknown-kind
  hosts:
    - "*.sandbox.example.com"
  secretRef:
    name: edge-tls
    namespace: edgion-test
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tls-unknown-kind-only
  namespace: edgion-test
spec:
  parentRefs:
    - name: tls-unknown-kind-gw
      sectionName: tls-unknown-kind
  hostnames:
    - unknown-kind.sandbox.example.com
  rules:
    - backendRefs:
        - group: example.com
          kind: Foo
          name: tls-backend
          port: 30051
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tls-mixed-backend
  namespace: edgion-test
spec:
  parentRefs:
    - name: tls-unknown-kind-gw
      sectionName: tls-unknown-kind
  hostnames:
    - mixed-backend.sandbox.example.com
  rules:
    - backendRefs:
        - name: test-tcp
          port: 30010
          weight: 100
        - group: example.com
          kind: Foo
          name: tls-backend
          port: 30051
          weight: 100

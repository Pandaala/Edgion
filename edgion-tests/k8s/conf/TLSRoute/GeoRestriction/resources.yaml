apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: tls-geo-deny
  namespace: edgion-test
spec:
  plugins:
    - type: GlobalConnectionIpRestriction
      config:
        enable: true
        activeProfile: default
        profiles:
          default:
            defaultAction: allow
            deny:
              - name: deny-unrelated-source
                cidrs:
                  - "127.0.0.9/32"
    - type: GeoIpLocation
      config:
        defaultAction: allow
        failOpen: false
        denyRuleGroups:
          - name: block-k8s-peer-country
            rules:
              - source: DirectPeerIp
                key: country
                values: ["US"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-geo-gw
  namespace: edgion-test
  annotations:
    edgion.io/edgion-stream-plugins: "tls-geo-deny"
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: tls-geo
      protocol: TLS
      port: 31953
      hostname: "*.geo.example.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-tls
            namespace: edgion-test
---
apiVersion: edgion.io/v1
kind: EdgionTls
metadata:
  name: tls-geo-cert
  namespace: edgion-test
spec:
  parentRefs:
    - name: tls-geo-gw
      namespace: edgion-test
      sectionName: tls-geo
  hosts:
    - "*.geo.example.com"
  secretRef:
    name: edge-tls
    namespace: edgion-test
---
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: tls-geo-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: tls-geo-gw
      namespace: edgion-test
      sectionName: tls-geo
      port: 31953
  hostnames:
    - "*.geo.example.com"
  rules:
    - backendRefs:
        - name: test-tcp
          port: 30010
          weight: 100

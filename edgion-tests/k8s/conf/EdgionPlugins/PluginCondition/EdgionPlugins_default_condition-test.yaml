apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: condition-test
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      alias: single-leaf
      type: Cors
      config:
        allowOrigins: "*"
        allowMethods: "GET,POST"
        allowHeaders: "Content-Type"
      conditions:
        skip:
          allOf:
            - type: keyExist
              key:
                type: header
                name: "X-Skip-Cors"
    - enable: true
      alias: multi-leaf
      type: Cors
      config:
        allowOrigins: "*"
        allowMethods: "GET,POST"
        allowHeaders: "Content-Type"
      conditions:
        skip:
          anyOf:
            - name: both-debug-headers
              allOf:
                - type: keyExist
                  key:
                    type: header
                    name: "X-Multi-A"
                - type: keyExist
                  key:
                    type: header
                    name: "X-Multi-B"

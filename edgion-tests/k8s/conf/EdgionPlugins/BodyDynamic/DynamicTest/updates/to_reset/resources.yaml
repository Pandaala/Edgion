apiVersion: edgion.io/v1alpha1
kind: EdgionGatewayConfig
metadata:
  name: example-gateway
spec:
  server:
    enableCompression: true
  realIp:
    trustedIpRefs:
      - name: global-realip-proxies
        namespace: edgion-test
    realIpHeader: X-Forwarded-For
  securityProtect:
    allowLoopbackUpstream: true
    xForwardedForLimit: 200
    requireSniHostMatch: true
    fallbackSni: default.example.com
  httpTimeout:
    client:
      readTimeout: 60s
      writeTimeout: 60s
      keepaliveTimeout: 75s
    backend:
      defaultConnectTimeout: 5s
      defaultRequestTimeout: 60s
      defaultIdleTimeout: 300s
  tcpTimeout:
    idleTimeout: 2s
  requestBody:
    enabled: true
    maxBodySize: 32MiB
    storage:
      memoryLimit: 128KiB
  globalPluginsRef:
    - name: als-global
      namespace: edgion-default
    - name: gp-resp-header-modifier
      namespace: edgion-default
    - name: ghost
      namespace: edgion-default
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: body-dynamic
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ProxyRewrite
      config:
        jsonBody:
          operations:
            - op: remove
              path: /discard
            - op: replace
              path: /version
              value: initial
    - enable: true
      type: Dsl
      config:
        name: body-dynamic-json-select
        maxBodyScanPasses: 1
        source: |
          let values = req.body.json_select({
            "version": "$.version",
            "discard": "$.discard"
          })
          if values["version"] != "initial" || values["discard"] != nil {
            return deny(422, "initial JSON multi-select mismatch")
          }
        errorPolicy: deny
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: body-dynamic
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - body-dynamic.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: body-dynamic
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

        target:
          name: test-http
          namespace: edgion-test
          port: 30001
        timeoutMs: 2000
        maxResponseBytes: 4096
        request:
          path:
            template: /guardrail/decision/replace
        windowBytes: 1
        overlapBytes: 0
        failOpen: false
    - type: ExtProc
      config:
        grpcService:
          target: edgion-test-server.edgion-test.svc.cluster.local:30041
          timeoutMs: 2000
        processingMode:
          requestHeaderMode: SEND
          responseHeaderMode: SEND
          responseBodyMode: STREAMED
        failureModeAllow: false

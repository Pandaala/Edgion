apiVersion: v1
kind: Secret
metadata:
  name: guardrail-anthropic-credential
  namespace: edgion-test
type: Opaque
stringData:
  api-key: anthropic-provider-test-key
---
apiVersion: edgion.io/v1
kind: EdgionBackend
metadata:
  name: guardrail-anthropic-provider
  namespace: edgion-test
spec:
  ai:
    provider: Anthropic
    endpoint: http://edgion-test-server.edgion-test.svc.cluster.local:30001/anthropic/prefix
    allowInsecureHttp: true
    credentialPool:
      credentials:
        - name: primary
          secretRef:
            name: guardrail-anthropic-credential
    models:
      - name: claude-fixture
        aliases:
          - claude-alias
    defaults:
      streaming: true
      maxOutputTokens: 64
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: guardrail-anthropic-pass
  namespace: edgion-test
spec:
  requestPlugins:
    - type: AiProxy
      config:
        api: openaiChat
        conversion: chatToAnthropic
        usageObservation: provider
        injectUsageTracking: true
        backendSelection:
          type: Weighted
    - type: Guardrail
      config:

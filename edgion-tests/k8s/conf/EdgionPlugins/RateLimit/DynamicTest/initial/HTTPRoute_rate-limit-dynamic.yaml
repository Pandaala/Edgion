apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rate-limit-dynamic-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "rate-limit-dynamic.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/rate-limit-dynamic
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: rate-limit-dynamic
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

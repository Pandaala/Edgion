apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: json-schema-validation
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - json-schema-validation.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: json-schema-validation
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: json-schema-validation-default-limit
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - json-schema-validation-default-limit.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: json-schema-validation-default-limit
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

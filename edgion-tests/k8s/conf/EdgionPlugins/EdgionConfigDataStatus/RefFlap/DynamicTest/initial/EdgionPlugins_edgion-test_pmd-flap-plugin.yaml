apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: data-flap-plugin
  namespace: edgion-test
spec:
  requestPlugins:
  - type: RegionRoute
    config:
      keyGet:
      - type: header
        name: X-Account-Id
      hashCalc:
        algorithm: crc32
        modulo: 1000
      routeRules:
      - type: RouteByHashRange
      clusterRegionRef:
        name: data-flap-good
        namespace: edgion-test

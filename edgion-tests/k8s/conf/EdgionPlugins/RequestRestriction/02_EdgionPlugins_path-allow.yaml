# 2. Path  -
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: request-restriction-path-allow
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: RequestRestriction
      config:
        mode: Allow
        conditions:
          anyOf:
            - allOf:
                - type: keyMatch
                  key:
                    type: path
                  values:
                    - "/health"
                  regex:
                    - "^/api/.*"
        status: 404
        message: "Path not allowed"

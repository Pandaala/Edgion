# HMAC credentials for RequestRestriction hmacAuth (S14 resolver must fill resolvedCredentials).
apiVersion: v1
kind: Secret
metadata:
  name: rr-hmac-credentials
  namespace: edgion-default
type: Opaque
stringData:
  credentials.yaml: |
    - username: rr-alice
      secret: "rr-hmac-secret-key-must-be-at-least-32-bytes"

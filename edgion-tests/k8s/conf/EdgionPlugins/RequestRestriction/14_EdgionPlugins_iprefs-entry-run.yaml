# S14: entry-level conditions.run ipRefs.
# RequestHeaderModifier runs only for the current K8s test-client Pod, then
# RequestRestriction denies /gated when that header is present.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: request-restriction-iprefs-run
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: RequestHeaderModifier
      conditions:
        run:
          allOf:
            - type: directPeerIpMatch
              ipRefs:
                - name: k8s-test-client-peer
      config:
        set:
          - name: X-IpRef-Run
            value: "yes"
    - enable: true
      type: RequestRestriction
      config:
        mode: Deny
        conditions:
          anyOf:
            - allOf:
                - type: keyMatch
                  key:
                    type: header
                    name: X-IpRef-Run
                  values: ["yes"]
                - type: keyMatch
                  key:
                    type: path
                  regex:
                    - ".*/gated.*"
        status: 403
        message: "Gated path denied after entry-level ipRefs run"

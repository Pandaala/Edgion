# HTTPRoute for RequestRestriction 
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: request-restriction-test-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "request-restriction.example.com"
  rules:
    # 1. Header 
    - matches:
        - path:
            type: PathPrefix
            value: /test/header-deny
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-header-deny
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # 2. Path 
    - matches:
        - path:
            type: PathPrefix
            value: /test/path-allow
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-path-allow
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # 3. Method 
    - matches:
        - path:
            type: PathPrefix
            value: /test/method-allow
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-method-allow
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # 4. Header 
    - matches:
        - path:
            type: PathPrefix
            value: /test/header-required
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-header-required
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # 5.
    - matches:
        - path:
            type: PathPrefix
            value: /test/combined
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-combined
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # 6. Query source: decoded deny.
    - matches:
        - path:
            type: PathPrefix
            value: /test/query-deny
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-query-deny
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # 7. AND within a group: (X-Env: prod) AND (path /admin/)
    - matches:
        - path:
            type: PathPrefix
            value: /test/and-group
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-and-group
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # 8. JwtClaim source: JwtAuth -> RequestRestriction chain, allowlist on realm_access.roles
    - matches:
        - path:
            type: PathPrefix
            value: /test/jwt-claim
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-jwt-claim
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # 9. IP and path in one group
    - matches:
        - path:
            type: PathPrefix
            value: /test/ip-and-path
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-ip-and-path
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # 10. ipRefs in a RequestRestriction group
    - matches:
        - path:
            type: PathPrefix
            value: /test/iprefs-group
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-iprefs-group
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # 11. entry-level conditions.run ipRefs
    - matches:
        - path:
            type: PathPrefix
            value: /test/iprefs-run
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-iprefs-run
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # 12. RequestRestriction HMAC (resolved credentials)
    - matches:
        - path:
            type: PathPrefix
            value: /test/rr-hmac
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-hmac
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # 13. Missing ipRefs in RequestRestriction Deny mode
    - matches:
        - path:
            type: PathPrefix
            value: /test/missing-ipref-deny
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-missing-ipref-deny
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # 14. Missing ipRefs in entry-level conditions.run
    - matches:
        - path:
            type: PathPrefix
            value: /test/missing-ipref-run
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: request-restriction-missing-ipref-run
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

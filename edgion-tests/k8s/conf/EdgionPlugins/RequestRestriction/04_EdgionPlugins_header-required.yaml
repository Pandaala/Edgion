# 4. Header  -  X-Auth-Token
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: request-restriction-header-required
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: RequestRestriction
      config:
        mode: Deny
        conditions:
          anyOf:
            - allOf:
                - type: keyMatch
                  key:
                    type: header
                    name: "X-Auth-Token"
                  values:
                    - "invalid"
                    - "expired"
            - allOf:
                - type: keyExist
                  key:
                    type: header
                    name: "X-Auth-Token"
                  negate: true
        status: 401
        message: "Authentication required"

# 7. AND within a group: deny only when BOTH predicates hold
#    (X-Env: prod) AND (path matches /admin/) => deny. Either predicate false => pass.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: request-restriction-and-group
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: RequestRestriction
      config:
        mode: Deny
        conditions:
          anyOf:
            - allOf:
                - type: keyMatch
                  key:
                    type: header
                    name: "X-Env"
                  values:
                    - "prod"
                - type: keyMatch
                  key:
                    type: path
                  regex:
                    - ".*/admin/.*"
        status: 403
        message: "Admin access denied in prod"

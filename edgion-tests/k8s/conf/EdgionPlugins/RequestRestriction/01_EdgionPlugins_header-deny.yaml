# 1. Header  -  Bot User-Agent
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: request-restriction-header-deny
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: RequestRestriction
      config:
        mode: Blacklist
        ruleGroups:
          - rules:
              - name: "block-bots"
                source: Header
                key: "User-Agent"
                regex:
                  - "(?i).*Bot.*"
                  - "(?i).*Spider.*"
                  - "(?i).*Crawler.*"
                onMissing: NoMatch
        status: 403
        message: "Bot access denied"


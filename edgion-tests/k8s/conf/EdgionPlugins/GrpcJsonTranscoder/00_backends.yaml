apiVersion: v1
kind: Service
metadata:
  name: grpc-transcoder
  namespace: edgion-default
spec:
  ports:
  - name: upstream
    port: 30021
    targetPort: 30021
    protocol: TCP
  selector:
    app: edgion-test-server
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-transcoder-raw
  namespace: edgion-test
spec:
  ports:
  - name: upstream
    port: 30031
    targetPort: 30031
    protocol: TCP
  selector:
    app: edgion-sequence-test-server
---
apiVersion: v1
kind: Service
metadata:
  name: grpc-transcoder-tls-h1
  namespace: edgion-test
spec:
  ports:
  - name: upstream
    port: 30026
    targetPort: 30026
    protocol: TCP
  selector:
    app: edgion-test-server
---
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: grpc-transcoder-tls-h1
  namespace: edgion-test
spec:
  targetRefs:
  - group: ''
    kind: Service
    name: grpc-transcoder-tls-h1
  validation:
    caCertificateRefs:
    - name: backend-ca
      kind: Secret
      group: ''
    hostname: hostname-a.example.com

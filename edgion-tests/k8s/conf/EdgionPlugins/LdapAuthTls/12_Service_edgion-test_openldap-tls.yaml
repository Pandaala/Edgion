apiVersion: v1
kind: Service
metadata:
  name: edgion-test-openldap-tls
  namespace: edgion-test
spec:
  selector:
    app: edgion-test-openldap-tls
  ports:
    - name: ldaps
      port: 33636
      protocol: TCP
      targetPort: 636
    - name: ldaps-mtls
      port: 33637
      protocol: TCP
      targetPort: 636
    - name: starttls
      port: 33389
      protocol: TCP
      targetPort: 389

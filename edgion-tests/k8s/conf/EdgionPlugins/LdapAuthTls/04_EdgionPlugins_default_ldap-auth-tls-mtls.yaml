apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ldap-auth-tls-mtls-test
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: LdapAuth
      config:
        ldapHost: "edgion-test-openldap-mtls.edgion-test.svc.cluster.local"
        ldapPort: 33637
        ldaps: true
        baseDn: "ou=people,dc=example,dc=org"
        attribute: "uid"
        headerType: "ldap"
        realm: "LDAP mTLS Test"
        timeout: 5000
        tls:
          validation:
            caCertificateRefs:
              - kind: Secret
                name: ldap-ca-bundle
          clientCertificateRef:
            name: ldap-client-identity

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ldap-auth-tls-groups-all-test
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: LdapAuth
      config:
        ldapHost: "edgion-test-openldap-tls.edgion-test.svc.cluster.local"
        ldapPort: 33636
        ldaps: true
        baseDn: "ou=people,dc=example,dc=org"
        attribute: "uid"
        bindDn: "cn=admin,dc=example,dc=org"
        bindPasswordRef:
          name: ldap-search-bind
        searchBase: "dc=example,dc=org"
        searchFilter: "(&(objectClass=inetOrgPerson)(uid={username}))"
        requiredGroupsAllOf:
          - "cn=gw-users,ou=groups,dc=example,dc=org"
          - "cn=gw-admins,ou=groups,dc=example,dc=org"
        headerType: "ldap"
        realm: "LDAP Search Test"
        timeout: 5000
        tls:
          validation:
            caCertificateRefs:
              - kind: Secret
                name: ldap-ca-bundle

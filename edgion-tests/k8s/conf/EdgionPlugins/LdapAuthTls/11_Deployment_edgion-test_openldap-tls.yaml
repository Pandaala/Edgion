apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgion-test-openldap-tls
  namespace: edgion-test
  labels:
    app: edgion-test-openldap-tls
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edgion-test-openldap-tls
  template:
    metadata:
      labels:
        app: edgion-test-openldap-tls
    spec:
      initContainers:
        - name: init-seed
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              set -eu
              cp /seed-config/10-users.ldif /seed-work/10-users.ldif
              cp /tls-source/ca.crt /tls-work/ca.crt
              cp /tls-source/server.crt /tls-work/server.crt
              cp /tls-source/server.key /tls-work/server.key
              chmod 644 /tls-work/ca.crt /tls-work/server.crt
              chmod 600 /tls-work/server.key
          volumeMounts:
            - name: seed-config
              mountPath: /seed-config
              readOnly: true
            - name: seed-work
              mountPath: /seed-work
            - name: tls-source
              mountPath: /tls-source
              readOnly: true
            - name: tls-work
              mountPath: /tls-work
      containers:
        - name: openldap
          image: osixia/openldap:1.5.0
          imagePullPolicy: IfNotPresent
          env:
            - name: LDAP_ORGANISATION
              value: "Edgion Test"
            - name: LDAP_DOMAIN
              value: "example.org"
            - name: LDAP_ADMIN_PASSWORD
              value: "admin"
            - name: LDAP_TLS
              value: "true"
            - name: LDAP_TLS_CRT_FILENAME
              value: "server.crt"
            - name: LDAP_TLS_KEY_FILENAME
              value: "server.key"
            - name: LDAP_TLS_CA_CRT_FILENAME
              value: "ca.crt"
            - name: LDAP_TLS_VERIFY_CLIENT
              value: "try"
            - name: LDAP_TLS_ENFORCE
              value: "false"
            - name: LDAP_LOG_LEVEL
              value: "256"
            - name: LDAP_REMOVE_CONFIG_AFTER_SETUP
              value: "false"
          ports:
            - containerPort: 389
              name: ldap
              protocol: TCP
            - containerPort: 636
              name: ldaps
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: ldaps
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 12
          startupProbe:
            tcpSocket:
              port: ldaps
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 60
          livenessProbe:
            tcpSocket:
              port: ldaps
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 6
          volumeMounts:
            - name: seed-work
              mountPath: /container/service/slapd/assets/config/bootstrap/ldif/custom
            - name: tls-work
              mountPath: /container/service/slapd/assets/certs
      volumes:
        - name: seed-config
          configMap:
            name: edgion-test-openldap-seed
        - name: seed-work
          emptyDir: {}
        - name: tls-source
          secret:
            secretName: openldap-tls-certs
        - name: tls-work
          emptyDir: {}

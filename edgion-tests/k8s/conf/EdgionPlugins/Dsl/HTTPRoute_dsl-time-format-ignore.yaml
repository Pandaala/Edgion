apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dsl-time-format-ignore-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "dsl-time-format-ignore.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/dsl-time-format-ignore
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: dsl-time-format-ignore
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

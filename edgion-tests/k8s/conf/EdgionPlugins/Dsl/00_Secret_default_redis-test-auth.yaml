# Opaque Secret for Redis LinkSys auth (BasicAuthResolver: required `password`, optional `username`).
# Loaded before 01_LinkSys_* so the controller can resolve credentials when applying LinkSys.
# Password matches the in-cluster Dragonfly Redis (dragonfly-system/dragonfly-redis) the
# K8s test environment reuses; see 00_LinkSys_default_redis-test.yaml endpoint.
apiVersion: v1
kind: Secret
metadata:
  name: redis-test-auth
  namespace: edgion-default
type: Opaque
stringData:
  password: dragonfly

# HTTPRoute for PathNormalization preserve_path_parameters opt-out scenario
# Hostname: path-norm-preserve.example.com
# Gateway:  reuses edgion-plugins-gateway (edgion-test namespace)
#
# This route is used together with 02_EdgionPlugins_preserve-path-parameters.yaml.
# The gateway must start with preserve_path_parameters = true; otherwise ;param is stripped.
#
# Test coverage:
#   /test/preserve/...  — requests containing ;param (verify literal preservation)
#   /test/preserve/..;jsessionid=x/secret — bypass verification (commitment-degradation scenario, requires preserve mode)
#   /secret             — sensitive path (protected by RequestRestriction Path deny)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: path-norm-preserve-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "path-norm-preserve.example.com"
  rules:
    # Rule 1: preserve-param test endpoint (requests containing ;param)
    # preserve_path_parameters = true: ;v=1 is preserved literally; route matches the /test/preserve prefix
    # preserve_path_parameters = false: ;v=1 is stripped; the /test/preserve prefix still matches
    - matches:
        - path:
            type: PathPrefix
            value: /test/preserve
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: path-norm-preserve-param
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

    # Rule 2: /secret endpoint — protected by the preserve-param plugin's Path deny
    # Default mode (strip): /admin/..;jsessionid=x/secret normalizes to /secret -> 403
    # Opt-out mode (preserve): kept as-is -> /secret deny does not match -> does not enter this rule
    - matches:
        - path:
            type: Exact
            value: /secret
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: path-norm-preserve-param
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

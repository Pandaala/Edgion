apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: path-norm-request-restriction-deny
  namespace: edgion-default
spec:
  requestPlugins:
  - enable: true
    type: RequestRestriction
    config:
      mode: Deny
      anyOf:
      - allOf:
        - type: keyMatch
          key:
            type: path
          values:
          - /admin
      - allOf:
        - type: keyMatch
          key:
            type: requestPath
          regex:
          - '%2[fF]'
      status: 403
      message: Access denied by path normalization policy

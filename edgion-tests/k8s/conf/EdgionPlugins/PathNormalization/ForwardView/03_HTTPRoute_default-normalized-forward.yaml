apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forward-view-default
  namespace: edgion-default
spec:
  parentRefs:
  - name: edgion-plugins-gateway
    namespace: edgion-test
  hostnames:
  - path-fwd-default.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api
    backendRefs:
    - name: test-http
      namespace: edgion-test
      port: 30001

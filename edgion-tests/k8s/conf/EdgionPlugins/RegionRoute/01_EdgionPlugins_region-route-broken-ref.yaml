apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: region-route-broken-ref
  namespace: edgion-default
spec:
  requestPlugins:
  - type: RegionRoute
    config:
      keyGet:
      - type: header
        name: X-Account-Id
      routeRules:
      - type: RouteByDirectRegion
        keyFrom:
        - type: header
          name: X-Direct-Region
      - type: RouteByHashRange
      clusterRegionRef:
        name: no-such-region-route-overlay
        namespace: edgion-default

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: region-route-norules
  namespace: edgion-default
spec:
  requestPlugins:
  - type: RegionRoute
    config:
      regions:
      - name: virginia
        hashRange:
        - 0
        - 599
        backendEndpoint: 127.0.0.1:30001
        tls: false
      - name: ohio
        hashRange:
        - 600
        - 999
        backendEndpoint: 127.0.0.1:30002
        tls: false
      keyGet:
      - type: header
        name: X-Account-Id
      hashCalc:
        algorithm: crc32
        modulo: 1000

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: request-mirror-with-timeout
  namespace: edgion-default
spec:
  requestPlugins:
  - type: RequestMirror
    config:
      backendRef:
        name: test-http
        namespace: edgion-test
        port: 30001
      maxBufferedChunks: 1
      channelFullTimeoutMs: 200
      connectTimeoutMs: 500
      writeTimeoutMs: 2000
      mirrorLog: true

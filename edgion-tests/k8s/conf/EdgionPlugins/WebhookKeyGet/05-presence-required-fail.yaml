# Scenario 5: presence-required-fail (K8s mode)
# ---------------------------------------------------------------------------
# A required origin header (X-Required) with presence: required. The
# allowDegradation/statusOnError fields below are part of the shared
# ExternalHttpConnection schema but are NOT honored by the webhook connector
# (they are only read by forward_auth) -- key_get simply returns None on any
# failure, including a missing required field; the consuming CtxSet plugin
# just leaves the target var unset (no 403, no gateway-side status override).
# Backend via Service (real selector) + auto EndpointSlice.
apiVersion: v1
kind: Service
metadata:
  name: wh5-svc
  namespace: edgion-default
spec:
  selector:
    app: edgion-test-server
  ports:
    - name: http
      port: 30001
      targetPort: 30001
      protocol: TCP
  type: ClusterIP
---
apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: wh5-resolver
  namespace: edgion-default
spec:
  type: webhook
  config:
    target:
      kind: Service
      name: wh5-svc
      namespace: edgion-default
      port: 30001
    request:
      path:
        template: "/webhook/resolve"
      method:
        template: "GET"
      headers:
        origin:
          - name: X-Required
            presence: required
    timeoutMs: 5000
    success:
      statusCodes: [200]
    allowDegradation: false
    statusOnError: 403
    maxResponseBytes: 4096
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: wh5-ctx-set
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: CtxSet
      config:
        vars:
          - name: wh5_user_id
            from:
              type: webhook
              webhookRef: "edgion-default/wh5-resolver"
              extract:
                source: body
                path: "data.user_id"
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wh5-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "wh5.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/wh5
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: wh5-ctx-set
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

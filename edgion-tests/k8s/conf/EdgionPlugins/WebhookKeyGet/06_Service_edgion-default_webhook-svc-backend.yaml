# Service for webhook service-target integration test (K8s mode).
# K8s automatically creates the EndpointSlice from this Service's selector;
# the gateway resolves the backend via the shared EpSliceStore, proving
# the target.type=service path without a controller-embedded endpoint list.
apiVersion: v1
kind: Service
metadata:
  name: webhook-svc-backend
  namespace: edgion-default
spec:
  selector:
    app: edgion-test-server
  ports:
    - name: http
      port: 30001
      targetPort: 30001
      protocol: TCP
  type: ClusterIP

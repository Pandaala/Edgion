apiVersion: v1
kind: Secret
metadata:
  name: hmac-body-credentials
  namespace: edgion-default
type: Opaque
stringData:
  credentials.yaml: |
    - username: body-user
      secret: "body-hmac-secret-key-must-be-at-least-32-bytes"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-body
  namespace: edgion-default
spec:
  selector:
    app: edgion-test-server
  ports:
    - name: http
      port: 30040
      targetPort: 30040
      protocol: TCP
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: hmac-body
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: HmacAuth
      config:
        secretGroups:
          - name: default
            secretRefs:
              - name: hmac-body-credentials
                namespace: edgion-default
        algorithms: [hmac-sha256]
        clockSkew: 300
        enforceHeaders: ["@request-target", host, date, digest]
        validateRequestBody: true
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: forward-auth-body
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ForwardAuth
      config:
        target:
          name: auth-body
          namespace: edgion-default
          port: 30040
        request:
          path:
            template: /verify
          method:
            template: POST
          headers:
            forwardAll: true
        forwardBody: true
        decision: {}
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: proxy-rewrite-body
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ProxyRewrite
      config:
        jsonBody:
          operations:
            - op: remove
              path: /secret
            - op: replace
              path: /name
              value: gateway
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ext-proc-body
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ExtProc
      config:
        grpcService:
          target: "edgion-test-server.edgion-test.svc.cluster.local:30041"
          timeoutMs: 2000
        processingMode:
          requestHeaderMode: SEND
          requestBodyMode: BUFFERED
        failureModeAllow: false
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: wasm-body
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: Wasm
      body:
        maxBodySize: 1MiB
        conditions:
          run:
            anyOf:
              - type: keyMatch
                key:
                  type: method
                values: [POST]
      config:
        source:
          file: /usr/local/edgion/test-assets/header_demo.wasm
        failOpen: false
        timeoutMs: 1000
  upstreamResponseBodyFilterPlugins:
    - enable: true
      type: Wasm
      config:
        pluginConfig:
          string: response-body-probe
        source:
          file: /usr/local/edgion/test-assets/header_demo.wasm
        failOpen: false
        timeoutMs: 1000
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: wasm-body-mirror
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: Wasm
      body:
        maxBodySize: 1MiB
      config:
        source:
          file: /usr/local/edgion/test-assets/header_demo.wasm
        failOpen: false
        timeoutMs: 1000
    - enable: true
      type: RequestMirror
      config:
        backendRef:
          name: test-http
          namespace: edgion-test
          port: 30001
        connectTimeoutMs: 500
        writeTimeoutMs: 1000
        maxBufferedChunks: 10
        mirrorLog: true
        maxConcurrent: 100
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: body-owner-chain
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: HmacAuth
      config:
        secretGroups:
          - name: default
            secretRefs:
              - name: hmac-body-credentials
                namespace: edgion-default
        algorithms: [hmac-sha256]
        clockSkew: 300
        enforceHeaders: ["@request-target", host, date, digest]
        validateRequestBody: true
    - enable: true
      type: ExtProc
      config:
        grpcService:
          target: "edgion-test-server.edgion-test.svc.cluster.local:30041"
          timeoutMs: 2000
        processingMode:
          requestHeaderMode: SEND
          requestBodyMode: BUFFERED
        failureModeAllow: false
    - enable: true
      type: ForwardAuth
      config:
        target:
          name: auth-body
          namespace: edgion-default
          port: 30040
        request:
          path:
            template: /verify
          method:
            template: POST
          headers:
            forwardAll: true
            custom:
              - name: Authorization
                value: Bearer valid-token
        forwardBody: true
        decision: {}
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: body-mutation-retry-shorter
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ProxyRewrite
      config:
        jsonBody:
          operations:
            - op: remove
              path: /discard
            - op: replace
              path: /payload
              value: x
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: body-mutation-retry-longer

      config:
        jsonBody:
          operations:
            - op: replace
              path: /version
              value: committed-body-created-by-a-longer-proxy-rewrite-mutation
    - enable: true
      type: RequestMirror
      config:
        backendRef:
          name: test-http
          namespace: edgion-test
          port: 30001
        connectTimeoutMs: 500
        writeTimeoutMs: 1000
        maxBufferedChunks: 10
        mirrorLog: true
        maxConcurrent: 100
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: json-patch-advanced
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ProxyRewrite
      config:
        jsonBody:
          operations:
            - op: test
              path: /version
              value: 1.0
            - op: remove
              path: /secret
            - op: replace
              path: /name
              value: gateway
            - op: add
              path: /items/-
              value: tail
            - op: copy
              from: /profile
              path: /profileSnapshot
            - op: move
              from: /name
              path: /displayName
            - op: add
              path: /tenant
              valueTemplate: "${header:X-Tenant}"
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: json-patch-atomic-failure
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ProxyRewrite
      config:
        jsonBody:
          operations:
            - op: replace
              path: /name
              value: must-not-be-published
            - op: test
              path: /version
              value: 2
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: json-patch-spill
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ProxyRewrite
      body:
        maxBodySize: 512KiB
      config:
        jsonBody:
          operations:
            - op: remove
              path: /discard
            - op: replace
              path: /version
              value: spilled
            - op: copy
              from: /meta
              path: /metaCopy
---

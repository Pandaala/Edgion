# DynamicExternalUpstream - Fallback mode (default behavior)
# Maps X-Target-Region header values to external domains
# onMissing: fallback → no header = normal backend
# onNoMatch: fallback → unmatched key = normal backend
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: deu-skip
  namespace: edgion-default
spec:
  requestPlugins:
    - type: DynamicExternalUpstream
      dye:
        request:
          - name: X-Dynamic-External-Upstream
      config:
        from:
          type: header
          name: X-Target-Region
        domainMap:
          "us":
            domain: localhost
            port: 30001
            tls: false
            overrideHost: localhost
          "eu":
            domain: localhost
            port: 30002
            tls: false
            overrideHost: localhost
          "ap":
            domain: localhost
            port: 30003
            tls: false
            overrideHost: localhost
        onMissing: fallback
        onNoMatch: fallback

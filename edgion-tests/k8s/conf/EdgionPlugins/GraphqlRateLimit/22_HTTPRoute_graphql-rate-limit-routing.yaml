apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: graphql-rate-limit-routing
  namespace: edgion-default
spec:
  parentRefs:
  - name: edgion-plugins-gateway
    namespace: edgion-test
  hostnames:
  - graphql-rate-limit-routing.example.com
  rules:
  - filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: graphql-rate-limit-routing
    backendRefs:
    - name: test-http
      namespace: edgion-test
      port: 30001

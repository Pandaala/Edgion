apiVersion: edgion.io/v1
kind: EdgionConfigData
metadata:
  name: data-managed
  namespace: edgion-default
spec:
  data:
    type: ClusterRegionSetting
    config:
      regions:
      - name: east
        hashRange:
        - 0
        - 499
        backendEndpoint: edgion-test-server.edgion-test.svc.cluster.local:30001
        tls: false
      - name: west
        hashRange:
        - 500
        - 999
        backendEndpoint: edgion-test-server.edgion-test.svc.cluster.local:30002
        tls: false
      clusterName: integration
      regionName: east
---
apiVersion: edgion.io/v1
kind: EdgionConfigData
metadata:
  name: data-validated
  namespace: edgion-default
spec:
  data:
    type: ClusterRegionSetting
    config:
      regions:
      - name: east
        hashRange:
        - 0
        - 499
        backendEndpoint: edgion-test-server.edgion-test.svc.cluster.local:30001
        tls: false
      - name: west
        hashRange:
        - 500
        - 999
        backendEndpoint: edgion-test-server.edgion-test.svc.cluster.local:30002
        tls: false
      clusterName: integration
      regionName: east
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: data-managed
  namespace: edgion-default
spec:
  requestPlugins:
  - type: RegionRoute
    config:
      keyGet:
      - type: header
        name: X-Account-Id
      hashCalc:
        algorithm: crc32
        modulo: 1000
      routeRules:
      - type: RouteByHashRange
      clusterRegionRef:
        name: data-managed
        namespace: edgion-default
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: data-validated
  namespace: edgion-default
spec:
  requestPlugins:
  - type: RegionRoute
    config:
      keyGet:
      - type: header
        name: X-Account-Id
      hashCalc:
        algorithm: crc32
        modulo: 1000
      routeRules:
      - type: RouteByHashRange
      clusterRegionRef:
        name: data-validated
        namespace: edgion-default
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: data-managed-test
  namespace: edgion-default
spec:
  parentRefs:
  - name: edgion-plugins-gateway
    namespace: edgion-test
    sectionName: http
  hostnames:
  - data-managed.example.com
  rules:
  - backendRefs:
    - name: test-http
      namespace: edgion-test
      port: 30001
    filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: data-managed

# RegionRouteOverride EdgionConfigData for data-managed test
#
# Pre-created by administrators before applying the EdgionPlugins data-managed resource.
# The EdgionPlugins overrideRef points here; when this resource exists, ResolvedRefs=True.
apiVersion: edgion.io/v1
kind: EdgionConfigData
metadata:
  name: data-managed
  namespace: edgion-default
spec:
  data:
    type: RegionRouteOverride
    config:
      regions:
        - name: east
          hashRange: [0, 499]
          backendEndpoint: "edgion-test-server.edgion-test.svc.cluster.local:30001"
          tls: false
        - name: west
          hashRange: [500, 999]
          backendEndpoint: "edgion-test-server.edgion-test.svc.cluster.local:30002"
          tls: false
---

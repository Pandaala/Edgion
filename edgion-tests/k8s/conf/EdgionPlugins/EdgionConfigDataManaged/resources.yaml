---
# HTTPRoute for EdgionConfigDataManagedRegionRoute tests.
# Normal backend test-http:30001 used for pass-through tests.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: data-managed-test
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
      sectionName: http  # Port 31180
  hostnames:
    - "data-managed.example.com"
  rules:
    - backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: data-managed

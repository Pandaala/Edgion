---
# EdgionConfigDataManagedRegionRoute - Scenario 1: pre-created RegionRouteOverride overlay
#
# An EdgionPlugins with overrideRef pointing to a pre-created RegionRouteOverride EdgionConfigData.
# The EdgionConfigData "data-managed" must be created by administrators before applying this file.
#
# Verification: GET /configserver/EdgionPlugins?namespace=edgion-default&name=data-managed
# should return data with status.conditions Accepted=True and ResolvedRefs=True.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: data-managed
  namespace: edgion-default
spec:
  requestPlugins:
    - type: RegionRoute
      config:
        regions:
          - name: east
            hashRange: [0, 499]
            backendEndpoint: "edgion-test-server.edgion-test.svc.cluster.local:30001"
            tls: false
          - name: west
            hashRange: [500, 999]
            backendEndpoint: "edgion-test-server.edgion-test.svc.cluster.local:30002"
            tls: false
        keyGet:
          - type: header
            name: X-Account-Id
        hashCalc:
          algorithm: crc32
          modulo: 1000
        routeRules:
          - type: RouteByHashRange
        overrideRef:
          name: "data-managed"
          namespace: edgion-default
---

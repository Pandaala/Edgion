apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: jwt-claim-headers
  namespace: edgion-default
spec:
  requestPlugins:
    - type: JwtAuth
      config:
        issuerGroups:
          - name: default
            issuers: ["https://test.example"]
            secretRefs:
              - name: jwt-secret
                namespace: edgion-default
        anonymous: guest
        claimsToHeaders:
          sub: X-Identity-A

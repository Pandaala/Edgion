apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: basic-auth-grouped
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: BasicAuth
      config:
        secretGroups:
          - name: partner-a
            secretRefs:
              - name: basic-auth-partner-a
                namespace: edgion-default
          - name: partner-b
            secretRefs:
              - name: basic-auth-partner-b
                namespace: edgion-default
        realm: "Partner API"

apiVersion: v1
kind: Service
metadata:
  name: direct-port-dynamic
  namespace: edgion-test
spec:
  selector:
    app: direct-port-unready
  ports:
    - name: app
      port: 443
      targetPort: 30002
      protocol: TCP
    - name: sibling
      port: 9443
      targetPort: 30003
      protocol: TCP

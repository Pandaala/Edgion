apiVersion: v1
kind: Service
metadata:
  name: direct-port-dynamic
  namespace: edgion-test
spec:
  selector:
    app: edgion-test-server
  ports:
    - name: app
      port: 443
      targetPort: 30051
      protocol: TCP
    - name: sibling
      port: 9443
      targetPort: 30003
      protocol: TCP

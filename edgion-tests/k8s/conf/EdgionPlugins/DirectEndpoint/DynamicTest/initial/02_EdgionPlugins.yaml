apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: direct-port-dynamic
  namespace: edgion-test
spec:
  requestPlugins:
    - type: DirectEndpoint
      dye:
        response:
          - name: X-Direct-Endpoint
      config:
        from:
          type: header
          name: x-target-ip
        onMissing: fallback
        onInvalid: reject
        inheritTls: true

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: direct-port-dynamic
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
      sectionName: http
  hostnames: ["direct-port-dynamic.example.com"]
  rules:
    - backendRefs:
        - name: direct-port-dynamic
          port: 443
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: direct-port-dynamic

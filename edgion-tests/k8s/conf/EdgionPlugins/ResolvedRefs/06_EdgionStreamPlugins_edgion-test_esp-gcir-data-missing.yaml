apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: esp-gcir-data-missing
  namespace: edgion-test
spec:
  plugins:
  - type: GlobalConnectionIpRestriction
    config:
      enable: true
      activeProfile: main
      profiles:
        main:
          defaultAction: deny
          allow:
          - name: office
            cidrs:
            - 10.0.0.0/8
      activeProfileRef:
        name: esp-gcir-data-nonexistent
        namespace: edgion-test

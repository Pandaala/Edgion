# ForwardAuth secret-ref test (K8s mode)
#
# The controller resolves ${secretRef:edgion-default/fa-auth-token:token} to "valid-token"
# and ships it over conf_sync. The gateway injects "Bearer valid-token" into the outbound
# auth request. No client-side Authorization header is sent; the secretRef alone provides
# the credential.
#
# auth-svc Service is shared from 01_EdgionPlugins_forward-auth-basic.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: fa-auth-token
  namespace: edgion-default
type: Opaque
data:
  # base64 of "valid-token"
  token: dmFsaWQtdG9rZW4=
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: forward-auth-secret-ref
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ForwardAuth
      config:
        target:
          name: auth-svc
          namespace: edgion-default
          port: 30040
        timeoutMs: 5000
        request:
          path:
            template: "/verify"
          method:
            template: "GET"
          headers:
            # forwardAll omitted (defaults to false) — do NOT forward the client's
            # Authorization header. The secretRef custom entry is the sole credential.
            custom:
              - name: Authorization
                template: "Bearer ${secretRef:edgion-default/fa-auth-token:token}"
        decision:
          upstreamHeaders:
            - X-User-ID

# HTTPRoute for ForwardAuth secret-ref test (K8s mode)
# Hostname: forward-auth-secret.example.com
# Plugin:   forward-auth-secret-ref (EdgionPlugins with ${secretRef} custom header)
# Backend:  test-http (standard test backend at port 30001)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: forward-auth-secret-ref-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "forward-auth-secret.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: forward-auth-secret-ref
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

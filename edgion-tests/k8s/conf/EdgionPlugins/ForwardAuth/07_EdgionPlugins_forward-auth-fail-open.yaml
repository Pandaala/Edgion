# ForwardAuth fail-open (degradation) test: auth server is unreachable, allowDegradation=true
# The target port 30098 is never started, so every call to the auth service results in
# a transport-level error. With allowDegradation=true the gateway must skip auth and
# forward the request to the upstream backend.
#
# Service declared here (headless / no selector — no pod listens on 30098).
# Shared by forward-auth-fail-close (file 09).
apiVersion: v1
kind: Service
metadata:
  name: auth-unreachable-svc
  namespace: edgion-default
spec:
  ports:
    - name: http
      port: 30098
      targetPort: 30098
      protocol: TCP
  type: ClusterIP
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: forward-auth-fail-open
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ForwardAuth
      config:
        target:
          name: auth-unreachable-svc
          namespace: edgion-default
          port: 30098
        timeoutMs: 2000
        allowDegradation: true
        decision:
          upstreamHeaders: []
          clientHeaders: []

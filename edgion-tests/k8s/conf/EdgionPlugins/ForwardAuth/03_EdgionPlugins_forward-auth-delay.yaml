# ForwardAuth with authFailureDelayMs = 300ms
# When auth service returns 401/403, response is delayed 300ms before being returned
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: forward-auth-delay
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: ForwardAuth
      config:
        target:
          name: auth-svc
          namespace: edgion-default
          port: 30040
        timeoutMs: 5000
        request:
          path:
            template: "/verify"
          method:
            template: "GET"
          headers:
            forwardAll: true
        decision:
          upstreamHeaders:
            - X-User-ID
            - X-User-Role
          clientHeaders:
            - WWW-Authenticate
          authFailureDelayMs: 300

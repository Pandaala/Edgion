apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: guardrail-encoding-fail-open
  namespace: edgion-test
spec:
  requestPlugins:
    - type: AiProxy
      config:
        api: openaiChat
        usageObservation: provider
        injectUsageTracking: true
        backendSelection:
          type: Weighted
    - type: Guardrail
      config:
        target:
          name: test-http
          namespace: edgion-test
          port: 30001
        timeoutMs: 2000
        maxResponseBytes: 4096
        request:
          path:
            template: /guardrail/decision/pass
        windowBytes: 1
        overlapBytes: 0
        failOpen: true
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: guardrail-encoding-fail-close
  namespace: edgion-test
spec:
  requestPlugins:
    - type: AiProxy
      config:
        api: openaiChat
        usageObservation: provider
        injectUsageTracking: true
        backendSelection:
          type: Weighted
    - type: Guardrail
      config:
        target:
          name: test-http
          namespace: edgion-test
          port: 30001
        timeoutMs: 2000
        maxResponseBytes: 4096
        request:
          path:
            template: /guardrail/decision/pass
        windowBytes: 1
        overlapBytes: 0
        failOpen: false
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: guardrail-encoding-fail-open
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-gateway
  hostnames:
    - guardrail-encoding-fail-open.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: guardrail-encoding-fail-open
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: fixture-provider
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: guardrail-encoding-fail-close
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-gateway
  hostnames:
    - guardrail-encoding-fail-close.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: guardrail-encoding-fail-close
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: fixture-provider

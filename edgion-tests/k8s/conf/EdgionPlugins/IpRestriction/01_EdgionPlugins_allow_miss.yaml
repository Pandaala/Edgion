apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ip-restriction-allow-miss
  namespace: edgion-default
spec:
  requestPlugins:
  - enable: true
    type: IpRestriction
    config:
      ipSource: RemoteIp
      allow:
      - name: office
        cidrs:
        - 127.0.0.0/8
      status: 403
      message: IP not in allow list

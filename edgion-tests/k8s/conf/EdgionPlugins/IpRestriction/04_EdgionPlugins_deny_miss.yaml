apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ip-restriction-deny-miss
  namespace: edgion-default
spec:
  requestPlugins:
  - enable: true
    type: IpRestriction
    config:
      ipSource: RemoteIp
      defaultAction: allow
      deny:
      - name: blocked
        cidrs:
        - 127.0.0.1/32
      status: 403
      message: IP is blocked

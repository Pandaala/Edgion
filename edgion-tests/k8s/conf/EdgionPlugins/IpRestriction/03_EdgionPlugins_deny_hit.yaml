apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ip-restriction-deny-hit
  namespace: edgion-default
spec:
  requestPlugins:
  - enable: true
    type: IpRestriction
    config:
      ipSource: RemoteIp
      defaultAction: allow
      denyRefs:
      - name: k8s-test-client-peer
      status: 403
      message: IP is blocked

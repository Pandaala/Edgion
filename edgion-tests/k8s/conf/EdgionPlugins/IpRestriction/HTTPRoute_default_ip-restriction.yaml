apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ip-restriction-test-route
  namespace: edgion-default
spec:
  parentRefs:
  - name: edgion-plugins-gateway
    namespace: edgion-test
  hostnames:
  - ip-restriction.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /test/allow-miss
    filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: ip-restriction-allow-miss
    backendRefs:
    - name: test-http
      namespace: edgion-test
      port: 30001
  - matches:
    - path:
        type: PathPrefix
        value: /test/allow-hit
    filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: ip-restriction-allow-hit
    backendRefs:
    - name: test-http
      namespace: edgion-test
      port: 30001
  - matches:
    - path:
        type: PathPrefix
        value: /test/deny-hit
    filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: ip-restriction-deny-hit
    backendRefs:
    - name: test-http
      namespace: edgion-test
      port: 30001
  - matches:
    - path:
        type: PathPrefix
        value: /test/deny-miss
    filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: ip-restriction-deny-miss
    backendRefs:
    - name: test-http
      namespace: edgion-test
      port: 30001

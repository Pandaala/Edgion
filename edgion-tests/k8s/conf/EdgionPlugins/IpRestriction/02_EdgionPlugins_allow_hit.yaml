apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ip-restriction-allow-hit
  namespace: edgion-default
spec:
  requestPlugins:
  - enable: true
    type: IpRestriction
    config:
      ipSource: RemoteIp
      allowRefs:
      - name: k8s-test-client-peer
      status: 403
      message: IP not in allow list

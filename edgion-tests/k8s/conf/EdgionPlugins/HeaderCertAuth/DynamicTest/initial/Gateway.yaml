# Restore the existing shared mTLS listener after removing scenario-owned resources.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mtls-test-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: https-mtls
      protocol: HTTPS
      port: 31110

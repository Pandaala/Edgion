apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: waf-transport-h2
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - waf-transport-h2.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: waf-dynamic
      backendRefs:
        - name: test-transport-h2
          namespace: edgion-test
          port: 30031

apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: waf-dynamic
  namespace: edgion-default
spec:
  waf:
    mode: 'on'
    requestBody:
      inspection: prefix
      json:
        lexical:
          maxSourceBytes: 1048576
          maxRawTokenBytes: 524288
          maxDecodedBytes: 2097152
          maxEvents: 8192
          maxDepth: 32
          maxRetainedBytes: 1048576
          maxWork: 16777216
        structure:
          maxRetainedBytes: 1048576
          maxKeyBytes: 65536
          maxMembers: 4096
          maxPathBytes: 4096
          maxDepth: 32
          maxWork: 16777216
        results:
          maxCandidates: 4096
          maxDeferredEntries: 4096
          maxDeferredBytes: 1048576
          maxFacts: 8192
          maxRetainedBytes: 1048576
          maxWork: 33554432
    policyRef:
      name: waf-policy

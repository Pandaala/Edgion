apiVersion: edgion.io/v1
kind: EdgionConfigData
metadata:
  name: waf-rules-inspection-continue
  namespace: edgion-default
spec:
  data:
    type: WafRuleBundle
    config:
      version: "1"
      profile: inspection_continue
      provenance: edgion-tests/waf-dynamic
      digest: ef911e3d87aa29e16166ace6abfeeadf066dd00cb7c9777761ebc1704d30af9d
      roots: [main.conf]
      rules:
        - name: main.conf
          content: |
            SecRule REQUEST_HEADERS:X-Waf-Inspection-Phase "!@streq continue" "id:2460,phase:1,deny,status:409"
            SecRule ARGS|XML:/*|REQUEST_BODY "@contains blocked" "id:2461,phase:2,deny,status:406"
            SecRule REQUEST_HEADERS:X-Waf-Check-Response "@streq yes" "id:2462,phase:3,deny,status:407"

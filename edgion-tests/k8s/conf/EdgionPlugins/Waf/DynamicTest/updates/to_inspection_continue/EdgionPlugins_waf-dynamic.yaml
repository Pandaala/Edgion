apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: waf-dynamic
  namespace: edgion-default
spec:
  waf:
    mode: on
    requestBody:
      inspection: full
      maxInspectSize: "32"
      onLimit: continue
      maxJsonBodySize: "128"
      maxXmlBodySize: "128"
    policyRef:
      name: waf-policy

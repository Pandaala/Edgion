        content: 'SecRule REQUEST_HEADERS:X-Waf-Version "!@streq json-v2" "id:6101,phase:1,deny,status:451"

          SecRule ARGS:q "@pm query-deny" "id:6102,phase:2,deny,status:409"

          SecRule ARGS "@pm forbidden" "id:6103,phase:2,deny,status:406"

          SecRule REQBODY_ERROR "@eq 1" "id:6104,phase:2,deny,status:422"

          '

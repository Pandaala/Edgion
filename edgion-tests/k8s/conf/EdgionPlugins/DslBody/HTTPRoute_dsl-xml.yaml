apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dsl-xml-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames: [dsl-xml.example.com]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: ExtensionRef
          extensionRef: {group: edgion.io, kind: EdgionPlugins, name: dsl-xml}
      retry:
        attempts: 2
        codes: [503]
      backendRefs:
        - name: test-http-retry
          namespace: edgion-test
          port: 30001

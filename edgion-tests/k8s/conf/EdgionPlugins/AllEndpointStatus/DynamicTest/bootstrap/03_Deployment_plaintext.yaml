apiVersion: apps/v1
kind: Deployment
metadata:
  name: aes-tls-dynamic-plaintext
  namespace: edgion-test
  labels:
    app: aes-tls-dynamic
    role: plaintext
    edgion.io/test-server-image: "true"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: aes-tls-dynamic
      role: plaintext
  template:
    metadata:
      labels:
        app: aes-tls-dynamic
        role: plaintext
        endpoint-set-plaintext: "true"
        edgion.io/test-server-image: "true"
    spec:
      containers:
        - name: test-server
          image: docker.io/pandaala/edgion-test-server:v0.1.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/test_server"]
          args:
            - --http-ports=30001
          ports:
            - name: https
              containerPort: 30001
          readinessProbe:
            httpGet:
              path: /health
              port: https

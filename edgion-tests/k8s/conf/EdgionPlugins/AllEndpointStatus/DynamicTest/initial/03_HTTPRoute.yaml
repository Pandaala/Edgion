apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: aes-tls-dynamic
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames: ["aes-tls-dynamic.example.com"]
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: aes-tls-dynamic
      backendRefs:
        - name: aes-tls-dynamic
          port: 443

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-guard-ordering-dynamic
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-gateway
  hostnames:
    - ai-guard-ordering-dynamic.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ai-guard-ordering-dynamic
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: ai-guard-ordering-dynamic

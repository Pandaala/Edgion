apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: response-cache-dynamic
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames: ["response-cache-dynamic.example.com"]
  rules:
    - matches:
        - method: GET
          path:
            type: Exact
            value: /cache
        - method: POST
          path:
            type: Exact
            value: /graphql
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: response-cache-dynamic
      backendRefs:
        - name: response-cache-dynamic
          namespace: edgion-test
          port: 30001

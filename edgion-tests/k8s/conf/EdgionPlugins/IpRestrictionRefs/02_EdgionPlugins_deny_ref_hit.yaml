# IpRestriction plugin using denyRefs to reference the central ipref-blocklist.
# The test client's IP (OrbStack test-client Pod IP) is covered by 192.168.0.0/16 → deny-list hit → expect 403.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ip-restriction-deny-ref-hit
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: IpRestriction
      config:
        ipSource: RemoteIp
        defaultAction: allow
        denyRefs:
          - name: ipref-blocklist
        status: 403
        message: "IP is in referenced block list"

# IpList EdgionConfigData — central allow-list for IpRestrictionRefs tests.
# Contains the loopback range (192.168.0.0/16) so the test client's TCP peer
# address (OrbStack test-client Pod IP) resolves as "in-list" when referenced via allowRefs.
apiVersion: edgion.io/v1
kind: EdgionConfigData
metadata:
  name: ipref-allowlist
  namespace: edgion-default
spec:
  data:
    type: IpList
    config:
      items:
        - name: loopback
          cidrs:
            - "192.168.0.0/16"

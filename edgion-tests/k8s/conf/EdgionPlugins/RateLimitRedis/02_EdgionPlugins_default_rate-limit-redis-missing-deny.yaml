apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: rate-limit-redis-missing-deny
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: RateLimitRedis
      config:
        redisRef: "edgion-default/redis-test"
        onRedisFailure: Allow
        rejectStatus: 429
        rejectMessage: "Missing key denied"
        showLimitHeaders: true
        keyPrefix: "edgion:it:rlr:missing-deny:"
        quotas:
          - name: default
            policies:
              - rate: 3
                interval: "10s"
                algorithm: SlidingWindow
            key:
              - type: header
                name: "X-Rate-Key"
            onKeyMiss: Deny

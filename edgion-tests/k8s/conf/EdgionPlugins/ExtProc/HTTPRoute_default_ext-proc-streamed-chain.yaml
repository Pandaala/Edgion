apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ext-proc-streamed-chain-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames: ["ext-proc-streamed-chain.example.com"]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /}
      filters:
        - type: ExtensionRef
          extensionRef: {group: edgion.io, kind: EdgionPlugins, name: ext-proc-streamed-chain}
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
---

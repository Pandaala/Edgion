# auth-svc Service (k8s flavor: selector-based; control-plane populates EndpointSlice).
# Inlined here so the ExtProc suite is self-contained when loaded in isolation.
apiVersion: v1
kind: Service
metadata:
  name: auth-svc
  namespace: edgion-default
spec:
  selector:
    app: auth-svc
  ports:
    - name: http
      port: 30040
      targetPort: 30040
      protocol: TCP
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ext-proc-coexist
  namespace: edgion-default
spec:
  requestPlugins:
  - enable: true
    type: ForwardAuth
    config:
      target: { name: auth-svc, namespace: edgion-default, port: 30040 }
      timeoutMs: 5000
      request:
        path:   { template: "/verify" }
        method: { template: "GET" }
        headers:
          forwardAll: true
      decision:
        upstreamHeaders: [X-User-ID]
  - enable: true
    type: ExtProc
    config:
      grpcService:
        target: edgion-test-server.edgion-test.svc.cluster.local:30041
        timeoutMs: 2000
      processingMode:
        requestHeaderMode: SEND
      failureModeAllow: false

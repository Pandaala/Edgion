apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ext-proc-failclose
  namespace: edgion-default
spec:
  requestPlugins:
  - enable: true
    type: ExtProc
    config:
      grpcService:
        target: 127.0.0.1:30099
        timeoutMs: 500
      processingMode:
        requestHeaderMode: SEND
      failureModeAllow: false

# Second HTTPRoute that references the SAME EdgionPlugins (rate-limit-header-key)
# as HTTPRoute_default_rate-limiter.yaml, under a DIFFERENT hostname.
#
# Shared-counter regression pin (types-decouple plugins): the in-memory RateLimitLocal
# Count-Min-Sketch state lives in ONE `Arc<CompiledPlugins>` keyed by ns/name in
# GLOBAL_PLUGIN_STORE. Both routes resolve that single runtime via
# `get_plugin_runtime("edgion-default/rate-limit-header-key")` (Arc::clone), so a
# given X-Rate-Key shares ONE budget across both routes. If a regression made the
# plugin runtime compile per referencing route (instead of one per ns/name shared
# via the store), each route would get its own CMS and the effective limit would
# double — the `rate_limit_shared_counter_across_routes` client test pins that.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: rate-limit-test-route-b
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "rate-limit-b.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test/rate-limit
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: rate-limit-header-key
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

apiVersion: v1
kind: Secret
metadata:
  name: credential-injector-token
  namespace: edgion-default
type: Opaque
stringData:
  bearerToken: static-provider-token
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-bearer
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-custom
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
        target:
          type: Header
          name: X-Provider-Key
          valuePrefix: "Token "
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-later-rewrite
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
        target:
          type: Header
          name: X-Provider-Key
    - type: ProxyRewrite
      config:
        headers:
          set:
            - name: X-Provider-Key
              value: later-plugin-value
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-later-route-modifier
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
        target:
          type: Header
          name: X-Provider-Key
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-double
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
        target:
          type: Header
          name: X-Provider-Key
          valuePrefix: "First "
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
        target:
          type: Header
          name: X-Provider-Key
          valuePrefix: "Second "
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-missing
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-missing-token
---
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: credential-injector-mirror
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          name: credential-injector-token
    - type: RequestMirror
      config:
        backendRef:
          name: test-http
          namespace: edgion-test
          port: 30001
        connectTimeoutMs: 500
        writeTimeoutMs: 1000
        maxBufferedChunks: 10
        maxConcurrent: 100
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: credential-injector-bearer
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - credential-injector-bearer.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: credential-injector-bearer
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: credential-injector-mirror
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - credential-injector-mirror.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: credential-injector-mirror
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: credential-injector-custom
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway

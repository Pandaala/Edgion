# IpRestriction plugin: INLINE deny group (NOT a denyRef) whose good CIDR covers
# the client (192.168.0.0/16). The sibling inline entry is invalid ("not-a-cidr"),
# but partial-good compilation keeps the good CIDR, so the client peer
# (OrbStack test-client Pod IP) is a deny-list hit -> 403. This proves the inline deny path is
# partial-good: a bad inline CIDR does not fail the plugin (no init_failed /
# deny-all collapse), and the valid sibling entry still enforces.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ip-restriction-inline-deny-hit
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: IpRestriction
      config:
        ipSource: RemoteIp
        defaultAction: allow
        denyRefs:
          - name: acl-ip-restriction-inline-de-deny-66dd1d77d6
        status: 403
        message: "IP is in inline partial-good block list"

apiVersion: edgion.io/v1alpha1
kind: EdgionGatewayConfig
metadata:
  name: example-gateway
spec:
  # GatewayClass HTTP server behavior
  server:
    enableCompression: true

  # Real IP 
  realIp:
    trustedIpRefs:
      - name: global-realip-proxies
        namespace: edgion-test
    realIpHeader: "X-Forwarded-For"

  # 
  securityProtect:
    allowLoopbackUpstream: true
    xForwardedForLimit: 200
    requireSniHostMatch: true
    fallbackSni: "default.example.com"

  # HTTP 
  httpTimeout:
    client:
      readTimeout: 60s
      writeTimeout: 60s
      keepaliveTimeout: 75s
    backend:
      defaultConnectTimeout: 5s
      defaultRequestTimeout: 60s
      defaultIdleTimeout: 300s

  tcpTimeout:
    idleTimeout: 2s

  # The full canonical fixture tree overlays this same cluster-scoped config
  # for GlobalPluginsSnapshot. K8s fixture ownership keeps one authoritative
  # object, so the equivalent global references live in the base object.
  globalPluginsRef:
    # AccessLogExtern declarations are inert outside requests that supply
    # their configured sources, so sharing this Tier 1 reference is safe.
    - name: als-global
      namespace: edgion-default
    - name: gp-resp-header-modifier
      namespace: edgion-default

apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-redis
  namespace: dragonfly-system
type: Opaque
stringData:
  redis-password: dragonfly
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dragonfly-redis-master
  namespace: dragonfly-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dragonfly-redis-master
  template:
    metadata:
      labels:
        app: dragonfly-redis-master
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - exec redis-server --appendonly no --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dragonfly-redis
                  key: redis-password
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -qx PONG
            initialDelaySeconds: 1
            periodSeconds: 2
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - redis-cli -a "$REDIS_PASSWORD" ping | grep -qx PONG
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: dragonfly-redis-master
  namespace: dragonfly-system
spec:
  selector:
    app: dragonfly-redis-master
  ports:
    - name: redis
      port: 6379
      targetPort: redis

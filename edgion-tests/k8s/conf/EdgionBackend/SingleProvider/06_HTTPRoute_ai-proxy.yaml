apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-proxy-default
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-gateway
  hostnames:
    - ai-default.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ai-proxy-default
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: single-provider-fixture-provider
---

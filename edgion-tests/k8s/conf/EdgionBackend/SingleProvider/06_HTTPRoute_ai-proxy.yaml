apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ai-proxy-priority-retry
  namespace: edgion-test
spec:
  parentRefs:
    - name: ai-gateway
  hostnames:
    - ai-retry.example.com
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: ai-proxy-priority-retry
      retry:
        attempts: 1
        codes:
          - 503
      timeouts:
        request: 5s
        backendRequest: 2s
      backendRefs:
        - group: edgion.io
          kind: EdgionBackend
          name: fixture-provider-retryable
        - group: edgion.io
          kind: EdgionBackend
          name: single-provider-fixture-provider
---

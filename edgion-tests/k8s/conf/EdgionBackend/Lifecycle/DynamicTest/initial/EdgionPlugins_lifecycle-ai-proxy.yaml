apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: lifecycle-ai-proxy
  namespace: edgion-test
spec:
  requestPlugins:
    - enable: true
      type: AiProxy
      config:
        api: openaiChat
        usageObservation: provider
        injectUsageTracking: true
        backendSelection:
          type: Weighted

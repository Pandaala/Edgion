# TCPRoute for the Gateway with an invalid qualified StreamPlugins reference.
# The listener must reject the connection before this route can proxy it.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: stream-plugins-tcp-qualified
  namespace: edgion-test
spec:
  parentRefs:
    - name: stream-plugins-qualified-gw
      namespace: edgion-test
      sectionName: tcp
  rules:
    - backendRefs:
        - name: test-tcp
          port: 30010
          weight: 100

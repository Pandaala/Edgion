# Gateway with an invalid qualified StreamPlugins reference.
# Gateway-level attachments are same-namespace only, so even this qualified
# same-namespace value must fail closed instead of loading the allow-all policy.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: stream-plugins-qualified-gw
  namespace: edgion-test
  annotations:
    edgion.io/edgion-stream-plugins: "edgion-test/allow-all-ips"
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: tcp
      protocol: TCP
      port: 31272

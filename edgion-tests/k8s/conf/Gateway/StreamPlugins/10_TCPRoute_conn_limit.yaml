# TCPRoute for the listener-level ConnectionLimit gateway (echo backend).
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TCPRoute
metadata:
  name: stream-plugins-tcp-conn-limit
  namespace: edgion-test
spec:
  parentRefs:
    - name: stream-plugins-conn-limit-gw
      namespace: edgion-test
      sectionName: tcp
  rules:
    - backendRefs:
        - name: test-tcp
          port: 30010
          weight: 100

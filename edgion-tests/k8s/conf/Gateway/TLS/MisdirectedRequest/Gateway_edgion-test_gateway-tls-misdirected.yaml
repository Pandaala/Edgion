# Gateway with three HTTPS listener host scopes sharing one port.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-tls-misdirected
  namespace: edgion-test
  annotations:
    edgion.io/require-sni-host-match: "true"
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: https-exact
      protocol: HTTPS
      port: 31337
      hostname: "sni421-exact.test.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-tls
            namespace: edgion-test
    - name: https-wildcard
      protocol: HTTPS
      port: 31337
      hostname: "*.sni421.test.com"
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-tls
            namespace: edgion-test
    - name: https-catchall
      protocol: HTTPS
      port: 31337
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-tls
            namespace: edgion-test

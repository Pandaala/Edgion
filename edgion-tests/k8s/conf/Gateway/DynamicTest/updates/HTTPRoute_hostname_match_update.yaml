# Update phase: remove the route hostname restriction together with the
# listener hostname restriction.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: route-hostname-match
  namespace: edgion-test
spec:
  parentRefs:
    - name: dynamic-test-gateway
      namespace: edgion-test
      sectionName: http-with-hostname
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /match
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

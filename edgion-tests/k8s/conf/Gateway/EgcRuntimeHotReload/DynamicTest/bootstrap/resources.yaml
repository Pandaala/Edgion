apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: egc-runtime-hot-reload
spec:
  controllerName: edgion.io/gateway-controller
  parametersRef:
    group: edgion.io
    kind: EdgionGatewayConfig
    name: egc-runtime-hot-reload
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: egc-runtime-hot-reload
  namespace: edgion-test
spec:
  gatewayClassName: egc-runtime-hot-reload
  listeners:
    - name: http
      protocol: HTTP
      port: 31981
    - name: tls
      protocol: TLS
      port: 31982
      hostname: egc-runtime.sandbox.example.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: edge-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: egc-runtime-hot-reload
  namespace: edgion-test
spec:
  parentRefs:
    - name: egc-runtime-hot-reload
      sectionName: http
  hostnames:
    - egc-runtime.sandbox.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: test-http
          port: 30001
---
apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: egc-runtime-hot-reload
  namespace: edgion-test
spec:
  parentRefs:
    - name: egc-runtime-hot-reload
      sectionName: tls
  hostnames:
    - egc-runtime.sandbox.example.com
  rules:
    - backendRefs:
        - name: test-tcp
          port: 30010

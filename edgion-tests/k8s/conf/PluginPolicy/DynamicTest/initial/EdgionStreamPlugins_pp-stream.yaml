apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: pp-stream
  namespace: edgion-test
spec:
  plugins:
  - type: IpRestriction
    config:
      defaultAction: allow
      deny: &id001
      - name: unrelated
        cidrs:
        - 192.0.2.0/24
  tlsRoutePlugins:
  - type: IpRestriction
    config:
      defaultAction: allow
      deny: *id001
      ipSource: DirectPeerIp

apiVersion: v1
kind: Service
metadata:
  name: pp-backend
  namespace: edgion-test
spec:
  type: ClusterIP
  ports:
  - name: http
    port: 30001
    targetPort: 30001
    protocol: TCP
  - name: tcp
    port: 30010
    targetPort: 30010
    protocol: TCP
  - name: udp
    port: 30011
    targetPort: 30011
    protocol: UDP
  - name: https
    port: 30051
    targetPort: 30051
    protocol: TCP
  selector:
    app: edgion-test-server

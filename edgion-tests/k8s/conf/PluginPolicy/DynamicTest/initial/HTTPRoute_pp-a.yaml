apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: pp-a
  namespace: edgion-test
spec:
  parentRefs:
  - name: pp-a
    sectionName: http
  hostnames:
  - pp-a.example.com
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /mock
    filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: pp-mock
    backendRefs:
    - name: pp-backend
      port: 30001
  - matches:
    - path:
        type: PathPrefix
        value: /dsl
    filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: pp-dsl
    backendRefs:
    - name: pp-backend
      port: 30001
  - matches:
    - path:
        type: PathPrefix
        value: /waf
    filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: pp-waf
    backendRefs:
    - name: pp-backend
      port: 30001
  - matches:
    - path:
        type: PathPrefix
        value: /response
    filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: pp-response
    backendRefs:
    - name: pp-backend
      port: 30001
  - matches:
    - path:
        type: PathPrefix
        value: /body
    filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: pp-body
    backendRefs:
    - name: pp-backend
      port: 30001
  - matches:
    - path:
        type: PathPrefix
        value: /async
    filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: pp-async
    backendRefs:
    - name: pp-backend
      port: 30001

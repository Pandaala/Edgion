apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-ratelimit-shared-hostnames
  namespace: edgion-test
spec:
  parentRefs:
  - name: grpc-ratelimit-gateway
    namespace: edgion-test
    sectionName: grpc
  hostnames:
  - a.shared.example.com
  - b.shared.example.com
  rules:
  - matches:
    - method:
        type: Exact
        service: test.TestService
        method: SayHello
    filters:
    - type: ExtensionRef
      extensionRef:
        group: edgion.io
        kind: EdgionPlugins
        name: grpc-rate-limit-shared
    backendRefs:
    - name: test-grpc
      port: 30021

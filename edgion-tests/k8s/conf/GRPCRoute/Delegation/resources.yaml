apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: delegation-parent
  namespace: edgion-test
spec:
  parentRefs:
    - name: grpc-delegation-gateway
      namespace: edgion-test
      sectionName: grpc
  hostnames:
    - "grpc-delegation.example.com"
  rules:
    - matches:
        - method:
            type: Exact
            service: test.TestService
            method: StreamNumbers
      backendRefs:
        - name: test-grpc
          port: 30021
    - matches:
        - method:
            type: Exact
            service: test.TestService
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-parent-filter
                value: "on"
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: GRPCRoute
          name: "*"
          namespace: edgion-grpc-deleg

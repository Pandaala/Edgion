apiVersion: v1
kind: Namespace
metadata:
  name: edgion-grpc-deleg
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-edgion-grpc-deleg-routes-to-test-grpc
  namespace: edgion-test
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: edgion-grpc-deleg
  to:
    - group: ""
      kind: Service
      name: test-grpc
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grpc-delegation-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: grpc
      protocol: HTTP
      port: 31934
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: delegation-parent
  namespace: edgion-test
spec:
  parentRefs:
    - name: grpc-delegation-gateway
      namespace: edgion-test
      sectionName: grpc
  hostnames:
    - grpc-delegation.example.com
  rules:
    - matches:
        - method:
            type: Exact
            service: test.TestService
            method: StreamNumbers
      backendRefs:
        - name: test-grpc
          port: 30021
    - matches:
        - method:
            type: Exact
            service: test.TestService
      filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: x-parent-filter
                value: "on"
      backendRefs:
        - group: gateway.networking.k8s.io
          kind: GRPCRoute
          name: "*"
          namespace: edgion-grpc-deleg
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: child
  namespace: edgion-grpc-deleg
spec:
  parentRefs:
    - kind: GRPCRoute
      group: gateway.networking.k8s.io
      name: delegation-parent
      namespace: edgion-test
  rules:
    - matches:
        - method:
            type: Exact
            service: test.TestService
            method: SayHello
      backendRefs:
        - name: test-grpc
          namespace: edgion-test
          port: 30021
    - matches:
        - method:
            type: Exact
            service: test.OtherService
            method: Whatever
      backendRefs:
        - name: test-grpc
          namespace: edgion-test
          port: 30021

      kind: GRPCRoute
      name: grpc-matchless-parent
      namespace: edgion-test
  rules:
    - backendRefs:
        - name: test-grpc
          namespace: edgion-test
          port: 30021
---
apiVersion: gateway.networking.k8s.io/v1

# Generated from edgion-tests/integration/conf/GRPCRoute/Delegation/*.yaml; child
# backends point at the shared test-grpc Service through the ReferenceGrant.
apiVersion: v1
kind: Namespace
metadata:
  name: edgion-grpc-deleg
---
apiVersion: gateway.networking.k8s.io/v1
kind: ReferenceGrant
metadata:
  name: allow-edgion-grpc-deleg-routes-to-test-grpc
  namespace: edgion-test
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      namespace: edgion-grpc-deleg
  to:
    - group: ""
      kind: Service
      name: test-grpc
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grpc-delegation-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: grpc
      protocol: HTTP
      port: 31934
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: backtrack-child
  namespace: edgion-grpc-deleg
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: GRPCRoute
      name: grpc-backtrack-parent
      namespace: edgion-test
  rules:
    - matches:
        - method:
            type: Exact
            service: test.TestService
            method: SayHello
      backendRefs:
        - name: test-grpc
          namespace: edgion-test
          port: 30021
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: child
  namespace: edgion-grpc-deleg
spec:
  parentRefs:
    - kind: GRPCRoute
      group: gateway.networking.k8s.io
      name: delegation-parent
      namespace: edgion-test
  rules:
    - matches:
        - method:
            type: Exact
            service: test.TestService
            method: SayHello
      backendRefs:
        - name: test-grpc
          namespace: edgion-test
          port: 30021
    - matches:
        - method:
            type: Exact
            service: test.OtherService
            method: Whatever
      backendRefs:
        - name: test-grpc
          namespace: edgion-test
          port: 30021
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: matchless-child
  namespace: edgion-grpc-deleg
spec:
  parentRefs:

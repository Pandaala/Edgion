apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: regex-match-test
  namespace: edgion-test
spec:
  parentRefs:
    - name: grpc-match-gateway
      namespace: edgion-test
      sectionName: grpc

  hostnames:
    - "grpc-regex.example.com"

  rules:
    # Rule 1: Regex method match - matches any method starting with "Say"
    # This rule uses RegularExpression type: both service and method are treated as regex
    # service "test\\.TestService" is a regex that matches literal "test.TestService"
    # method "Say.*" matches "SayHello", "SayGoodbye", etc.
    - matches:
        - method:
            type: RegularExpression
            service: "test\\.TestService"
            method: "Say.*"
      backendRefs:
        - name: test-grpc
          port: 30021

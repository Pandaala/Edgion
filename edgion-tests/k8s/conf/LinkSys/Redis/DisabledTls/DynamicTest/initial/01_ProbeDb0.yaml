apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: redis-disabled-tls-probe-0
  namespace: edgion-default
spec:
  type: redis
  config:
    endpoints:
      - "redis://dragonfly-redis-master.dragonfly-system.svc.cluster.local:6379"
    db: 0
    auth:
      secretRef:
        name: redis-disabled-tls-auth
    pool:
      size: 1
    timeout:
      connect: 3s
      command: 2s

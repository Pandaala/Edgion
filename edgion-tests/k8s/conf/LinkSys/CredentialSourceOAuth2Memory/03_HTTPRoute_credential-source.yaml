# HTTPRoute for persist-off OAuth2 CredentialInjector evidence.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: oauth2-memory-credential-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
      sectionName: http
  hostnames:
    - "oauth2-memory.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /echo
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: oauth2-memory-credential-plugin
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

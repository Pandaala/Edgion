apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: oauth2-credential-plugin
  namespace: edgion-default
spec:
  requestPlugins:
    - type: CredentialInjector
      config:
        credentialRef:
          group: edgion.io
          kind: LinkSys
          name: oauth2-credential-source
        target:
          type: Bearer

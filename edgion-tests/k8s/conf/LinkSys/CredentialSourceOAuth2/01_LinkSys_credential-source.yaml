apiVersion: edgion.io/v1
kind: LinkSys
metadata:
  name: oauth2-credential-source
  namespace: edgion-default
spec:
  type: credentialSource
  config:
    provider:
      type: oauth2ClientCredentials
      tokenEndpoint: https://edgion-test-server.edgion-test.svc.cluster.local:30051/oauth2/token
      clientAuthentication:
        method: clientSecretBasic
        activeSecretRef:
          name: oauth2-bootstrap-active
        previousSecretRef:
          name: oauth2-bootstrap-previous
      scopes:
        - inference.invoke
      tls:
        enabled: true
        verify: false
    rotation:
      interval: 5m
      requestTimeout: 5s
      retryInitialBackoff: 1s
      retryMaxBackoff: 5s
    egress:
      blockPrivate: false

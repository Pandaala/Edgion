apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ep-validation-condition-set-both-operators
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: Cors
      config: {}
      conditions:
        run:
          allOf:
            - type: probability
              ratio: 1.0
          anyOf:
            - type: probability
              ratio: 1.0

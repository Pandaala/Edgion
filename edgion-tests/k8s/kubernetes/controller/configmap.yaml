apiVersion: v1
kind: ConfigMap
metadata:
  name: edgion-controller-config
  namespace: edgion-system
  labels:
    app: edgion-controller
    app.kubernetes.io/name: edgion-controller
    app.kubernetes.io/component: controller
data:
  edgion-controller.yaml: |
    # Edgion Controller Configuration for Kubernetes Integration Testing
    work_dir: /usr/local/edgion

    server:
      grpc_listen: 0.0.0.0:12151
      admin_listen: 0.0.0.0:12101
      probe_listen: 0.0.0.0:12100
      metrics_listen: 0.0.0.0:12190

    logging:
      log_dir: logs
      log_prefix: edgion-controller
      log_level: info
      json_format: true
      console: true
      buffer_size: 10000

    conf_center:
      type: kubernetes
      controller_name: edgion.io/gateway-controller
      # Route delegation suites own reverse-lock children in dedicated namespaces.
      watch_namespaces: [edgion-system, edgion-default, edgion-test, edgion-backend, backend, app, app2, cert-store, edgion-deleg, edgion-grpc-deleg, edgion-deleg-dyn, edgion-grpc-deleg-dyn, edgion-it]
      # HA mode: "leader-only" (default) or "all-serve"
      ha_mode: leader-only

      leader_election:
        lease_name: edgion-controller-leader
        lease_namespace: edgion-system
        lease_duration_secs: 15
        renew_deadline_secs: 10
        retry_period_secs: 2

      metadata_filter:
        blocked_annotations:
          - kubectl.kubernetes.io/last-applied-configuration
          - meta.helm.sh/release-name
          - meta.helm.sh/release-namespace
        remove_managed_fields: true

    debug:
      enabled: false

    conf_sync:
      no_sync_kinds: [ReferenceGrant, Secret]
      default_capacity: 200

    # conf_sync channel security. REQUIRED: omitting this section entirely makes the
    # process refuse to start (fail-close).
    #
    # This test stack mirrors PRODUCTION: auto_ca means the Controller's internal CA mints
    # (and rotates) the serving identity and the gateway client leaf Secret in-cluster, so
    # the K8s integration suite exercises the same auto-CA + rotation path the shipped
    # manifests (cicd/deploy/kubernetes/) run. The Controller ServiceAccount already has the
    # secrets create/update/patch RBAC this needs (see rbac.yaml). The Controller side needs
    # only auto_ca: true -- it derives an in-memory identity; the Gateway side is asymmetric
    # (it also needs the mounted cert paths, see the gateway configmap).
    conf_sync_security:
      auto_ca: true

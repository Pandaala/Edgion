apiVersion: v1
kind: Service
metadata:
  name: edgion-controller-leader
  namespace: edgion-system
  labels:
    app: edgion-controller
    app.kubernetes.io/name: edgion-controller
    app.kubernetes.io/component: controller-leader
spec:
  type: ClusterIP
  selector:
    app: edgion-controller
    edgion.io/leader: "true"
  ports:
  - name: grpc
    port: 12151
    targetPort: 12151
    protocol: TCP
  - name: http
    port: 12101
    targetPort: 12101
    protocol: TCP
  - name: probe
    port: 12100
    targetPort: 12100
    protocol: TCP
  - name: metrics
    port: 12190
    targetPort: 12190
    protocol: TCP

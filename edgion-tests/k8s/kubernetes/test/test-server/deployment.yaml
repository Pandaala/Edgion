apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgion-test-server
  namespace: edgion-test
  labels:
    app: edgion-test-server
    app.kubernetes.io/name: edgion-test-server
    app.kubernetes.io/component: test
spec:
  replicas: 3
  selector:
    matchLabels:
      app: edgion-test-server
  template:
    metadata:
      labels:
        app: edgion-test-server
        app.kubernetes.io/name: edgion-test-server
        app.kubernetes.io/component: test
    spec:
      containers:
      - name: test-server
        image: docker.io/pandaala/edgion-test-server:v0.1.1
        imagePullPolicy: IfNotPresent
        command: ["/usr/local/bin/test_server"]
        args:
        - "--http-ports=30001,30002,30003,30004"
        - "--grpc-ports=30021,30022"
        - "--websocket-port=30005"
        - "--tcp-port=30010"
        - "--tcp-pp2-port=30012"
        - "--udp-port=30011"
        - "--auth-port=30040"
        - "--ext-proc-port=30041"
        - "--ext-proc-tls-port=30042"
        - "--ext-proc-mtls-port=30043"
        - "--ext-proc-tls-cert=/etc/edgion/backend-tls/tls.crt"
        - "--ext-proc-tls-key=/etc/edgion/backend-tls/tls.key"
        - "--https-backend-port=30051"
        - "--https-backend-mtls-port=30052"
        - "--cert-file=/etc/edgion/backend-tls/tls.crt"
        - "--key-file=/etc/edgion/backend-tls/tls.key"
        - "--client-ca-file=/etc/edgion/client-ca/ca.crt"
        - "--https-backend-multi-sni-port=30026"
        - "--multi-sni-cert-a=/etc/edgion/backend-sni-a/tls.crt"
        - "--multi-sni-key-a=/etc/edgion/backend-sni-a/tls.key"
        - "--multi-sni-cert-b=/etc/edgion/backend-sni-b/tls.crt"
        - "--multi-sni-key-b=/etc/edgion/backend-sni-b/tls.key"
        - "--https-backend-wildcard-port=30028"
        - "--wildcard-cert=/etc/edgion/backend-wildcard/tls.crt"
        - "--wildcard-key=/etc/edgion/backend-wildcard/tls.key"
        - "--log-level=info"
        ports:
        - name: http-1
          containerPort: 30001
          protocol: TCP
        - name: http-2
          containerPort: 30002
          protocol: TCP
        - name: http-3
          containerPort: 30003
          protocol: TCP
        - name: http-4
          containerPort: 30004
          protocol: TCP
        - name: grpc-1
          containerPort: 30021
          protocol: TCP
        - name: grpc-2
          containerPort: 30022
          protocol: TCP
        - name: websocket
          containerPort: 30005
          protocol: TCP
        - name: tcp
          containerPort: 30010
          protocol: TCP
        - name: auth
          containerPort: 30040
          protocol: TCP
        - name: ext-proc
          containerPort: 30041
          protocol: TCP
        - name: ext-proc-tls
          containerPort: 30042
          protocol: TCP
        - name: ext-proc-mtls
          containerPort: 30043
          protocol: TCP
        - name: https-backend
          containerPort: 30051
          protocol: TCP
        - name: https-b-mtls
          containerPort: 30052
          protocol: TCP
        - name: https-sni
          containerPort: 30026
          protocol: TCP
        - name: https-wildcard
          containerPort: 30028
          protocol: TCP
        - name: udp
          containerPort: 30011
          protocol: UDP
        volumeMounts:
        - name: backend-server-tls
          mountPath: /etc/edgion/backend-tls
          readOnly: true
        - name: client-ca
          mountPath: /etc/edgion/client-ca
          readOnly: true
        - name: backend-server-sni-a-tls
          mountPath: /etc/edgion/backend-sni-a
          readOnly: true
        - name: backend-server-sni-b-tls
          mountPath: /etc/edgion/backend-sni-b
          readOnly: true
        - name: backend-server-wildcard-tls
          mountPath: /etc/edgion/backend-wildcard
          readOnly: true
        env:
        - name: RUST_LOG
          value: "info"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
          httpGet:
            path: /health
            port: 30001
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 30001
          initialDelaySeconds: 3
          periodSeconds: 5
      volumes:
      - name: backend-server-tls
        secret:
          secretName: backend-server-tls
      - name: client-ca
        secret:
          secretName: client-ca
      - name: backend-server-sni-a-tls
        secret:
          secretName: backend-server-sni-a-tls
      - name: backend-server-sni-b-tls
        secret:
          secretName: backend-server-sni-b-tls
      - name: backend-server-wildcard-tls
        secret:
          secretName: backend-server-wildcard-tls
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgion-test-server
  namespace: edgion-deleg-dyn
  labels:
    app: edgion-test-server
    app.kubernetes.io/name: edgion-test-server
    app.kubernetes.io/component: test
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edgion-test-server
  template:
    metadata:
      labels:
        app: edgion-test-server
        app.kubernetes.io/name: edgion-test-server
        app.kubernetes.io/component: test
    spec:
      containers:
        - name: test-server
          image: docker.io/pandaala/edgion-test-server:v0.1.1
          imagePullPolicy: IfNotPresent
          command: ["/usr/local/bin/test_server"]
          args:
            - "--http-ports=30001"
            - "--grpc-ports=30021"
            - "--log-level=info"
          ports:
            - name: http-1
              containerPort: 30001
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /health
              port: 30001
            initialDelaySeconds: 3
            periodSeconds: 5
---

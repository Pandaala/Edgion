global
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

listen ppv2
    bind *:58440
    server edgion edgion-gateway:58430 send-proxy-v2

listen ppv1
    bind *:58441
    server edgion edgion-gateway:58430 send-proxy

listen ppv2probe
    bind *:58442
    server dump edgion-wire-dump:58444 send-proxy-v2

listen ppv1probe
    bind *:58443
    server dump edgion-wire-dump:58445 send-proxy

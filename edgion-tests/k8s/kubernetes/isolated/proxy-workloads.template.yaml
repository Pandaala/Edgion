apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgion-proxy-controller
  namespace: "__NAMESPACE__"
  labels:
    edgion.io/test-run: "__RUN_ID__"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edgion-proxy-controller
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgion-proxy-controller
        edgion.io/test-run: "__RUN_ID__"
    spec:
      serviceAccountName: edgion-proxy-controller
      securityContext:
        fsGroup: 10001
      containers:
        - name: controller
          image: "__ISOLATED_IMAGE__"
          imagePullPolicy: __ISOLATED_PULL_POLICY__
          command:
            - /usr/local/bin/run-edgion-proxy-component
          args:
            - controller
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: grpc
              containerPort: 12151
            - name: admin
              containerPort: 12152
            - name: probe
              containerPort: 12153
          readinessProbe:
            httpGet:
              path: /ready
              port: probe
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 45
          volumeMounts:
            - name: work
              mountPath: /work
            - name: certs
              mountPath: /work/certs
              readOnly: true
            - name: controller-config
              mountPath: /scenario/config
              readOnly: true
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: work
          emptyDir: {}
        - name: certs
          persistentVolumeClaim:
            claimName: edgion-proxy-certs
        - name: controller-config
          configMap:
            name: edgion-proxy-controller-config
---
apiVersion: apps/v1
kind: Deployment

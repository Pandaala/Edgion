            - /usr/local/bin/run-edgion-proxy-component
          args:
            - gateway
          ports:
            - name: admin
              containerPort: 12160
            - name: probe
              containerPort: 12161
            - name: metrics
              containerPort: 12162
          readinessProbe:
            httpGet:

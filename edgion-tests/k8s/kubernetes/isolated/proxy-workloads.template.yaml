apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgion-proxy-test-server
  namespace: "__NAMESPACE__"
  labels:
    edgion.io/test-run: "__RUN_ID__"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edgion-proxy-test-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgion-proxy-test-server
        edgion.io/test-run: "__RUN_ID__"
    spec:
      containers:
        - name: test-server
          image: "__ISOLATED_IMAGE__"
          imagePullPolicy: __ISOLATED_PULL_POLICY__
          command:
            - /usr/local/bin/run-edgion-proxy-component
          args:
            - test-server
          env:
            - name: TEST_SERVER_PORT
              value: "__TEST_SERVER_PORT__"
          ports:
            - name: http
              containerPort: __TEST_SERVER_PORT__
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgion-proxy-wire-dump
  namespace: "__NAMESPACE__"
  labels:
    edgion.io/test-run: "__RUN_ID__"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edgion-proxy-wire-dump
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgion-proxy-wire-dump
        edgion.io/test-run: "__RUN_ID__"
    spec:
      containers:
        - name: wire-dump
          image: "__ISOLATED_IMAGE__"
          imagePullPolicy: __ISOLATED_PULL_POLICY__
          command:
            - /usr/local/bin/run-edgion-proxy-component
          args:
            - wire-dump
          ports:
            - name: api
              containerPort: 18080
            - name: v2
              containerPort: 58444
            - name: v1
              containerPort: 58445
          readinessProbe:
            httpGet:
              path: /v2
              port: api
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgion-proxy-haproxy
  namespace: "__NAMESPACE__"
  labels:
    edgion.io/test-run: "__RUN_ID__"
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: edgion-proxy-haproxy
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgion-proxy-haproxy
        edgion.io/test-run: "__RUN_ID__"
    spec:
      containers:
        - name: haproxy
          image: "__HAPROXY_IMAGE__"
          imagePullPolicy: __HAPROXY_PULL_POLICY__
          args:
            - -W
            - -db
            - -f
            - /usr/local/etc/haproxy/haproxy.cfg
          volumeMounts:
            - name: haproxy-config
              mountPath: /usr/local/etc/haproxy/haproxy.cfg
              subPath: haproxy.cfg
              readOnly: true
          readinessProbe:
            tcpSocket:
              port: __HAPROXY_READY_PORT__
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 99
            runAsGroup: 99
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: haproxy-config
          configMap:
            name: edgion-proxy-haproxy-config

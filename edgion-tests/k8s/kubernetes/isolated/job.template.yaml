apiVersion: batch/v1
kind: Job
metadata:
  name: "__JOB_NAME__"
  namespace: "__NAMESPACE__"
  labels:
    app.kubernetes.io/name: edgion-isolated-test
    app.kubernetes.io/component: isolated-job
    edgion.io/test-run: "__RUN_ID__"
    edgion.io/test-scenario: "__SCENARIO_ID__"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: __ACTIVE_DEADLINE_SECONDS__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgion-isolated-test
        app.kubernetes.io/component: isolated-job
        edgion.io/test-run: "__RUN_ID__"
        edgion.io/test-scenario: "__SCENARIO_ID__"
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 15
      containers:
        - name: isolated-test
          image: "__IMAGE__"
          imagePullPolicy: __IMAGE_PULL_POLICY__
          args:
            - "__SCENARIO_ID__"
            - "__CANONICAL_SCRIPT__"
            - "__SCRIPT_TIMEOUT_SECONDS__"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "4"
              memory: 4Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault

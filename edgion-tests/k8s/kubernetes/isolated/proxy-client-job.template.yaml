apiVersion: batch/v1
kind: Job
metadata:
  name: edgion-proxy-client
  namespace: "__NAMESPACE__"
  labels:
    edgion.io/test-run: "__RUN_ID__"
    edgion.io/test-scenario: "__SCENARIO_ID__"
spec:
  backoffLimit: 0
  activeDeadlineSeconds: __CLIENT_DEADLINE_SECONDS__
  template:
    metadata:
      labels:
        app.kubernetes.io/name: edgion-proxy-client
        edgion.io/test-run: "__RUN_ID__"
        edgion.io/test-scenario: "__SCENARIO_ID__"
    spec:
      restartPolicy: Never
      containers:
        - name: client
          image: "__ISOLATED_IMAGE__"
          imagePullPolicy: __ISOLATED_PULL_POLICY__
          command:
            - /usr/local/bin/run-k8s-proxy-protocol-test
          args:
            - "__SCENARIO_ID__"
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            seccompProfile:
              type: RuntimeDefault

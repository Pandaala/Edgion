global
    log stdout format raw local0

defaults
    mode tcp
    timeout connect 5s
    timeout client 30s
    timeout server 30s

listen ppv2
    bind *:58540
    server edgion edgion-gateway:28530 send-proxy-v2

listen ppv2probe
    bind *:58542
    server dump edgion-wire-dump:58444 send-proxy-v2

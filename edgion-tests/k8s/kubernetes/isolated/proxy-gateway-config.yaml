work_dir: /work

logging:
  log_dir: /work/logs
  log_prefix: edgion-gateway
  log_level: info
  json_format: false
  console: true

metrics:
  listen: "0.0.0.0:12162"

conf_sync_security:
  tls:
    cert: certs/grpc/primary/client.crt
    key: certs/grpc/primary/client.key
    ca: certs/grpc/primary/ca.crt

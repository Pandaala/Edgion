apiVersion: v1
kind: ConfigMap
metadata:
  name: edgion-gateway-config
  namespace: edgion-system
  labels:
    app: edgion-gateway
    app.kubernetes.io/name: edgion-gateway
    app.kubernetes.io/component: gateway
data:
  edgion-gateway.yaml: |
    # Edgion Gateway Configuration for Kubernetes Integration Testing
    work_dir: /usr/local/edgion

    gateway:
      # Controller gRPC server address (use K8s service DNS)
      server_addrs: [https://edgion-controller-leader.edgion-system.svc.cluster.local:12151]
      # Test-only admin API access for suites that run inside test-client pods.
      # Production defaults remain loopback-only unless explicitly configured.
      admin_listen: "0.0.0.0:12001"
      # Probe endpoints listen on 0.0.0.0:12000.
      geoip:
        db_path: /usr/local/edgion/test-assets/geoip/edgion-test-city.mmdb

    logging:
      log_dir: logs
      log_prefix: edgion-gateway
      log_level: "debug,pingora_proxy=error,pingora_core=error"
      json_format: true
      console: false
      buffer_size: 10000

    server:
      # threads: 4
      # work_stealing: true
      # grace_period_seconds: 30
      # graceful_shutdown_timeout_seconds: 10
      # upstream_keepalive_pool_size: 128

    access_log:
      enabled: true
      output:
        localFile:
          path: logs/edgion_access.log
          rotation:
            strategy: daily
            max_files: 7
            check_interval_secs: 60

    # Integration tests assert on `path` and on plugin-log values written through
    # `sensitive(...)`. The shipped default is `replace`; the harness opts out so
    # those assertions keep reading real values.
    access_log_sensitive:
      mode: off

    metrics:
      backend_requests:
        labels:
          backend: true
      genai_tokens:
        enabled: true

    ssl_log:
      enabled: true
      output:
        localFile:
          path: logs/ssl.log
          rotation:
            strategy:
              size: 104857600
            max_files: 5
            check_interval_secs: 60

    tcp_log:
      enabled: false
      output:
        localFile:
          path: logs/tcp.log

    udp_log:
      enabled: false
      output:
        localFile:
          path: logs/udp.log

    # conf_sync channel security. REQUIRED: omitting this section entirely makes the
    # process refuse to start (fail-close).
    #
    # Mirrors PRODUCTION (cicd/deploy/kubernetes/): auto_ca means the Controller's internal
    # CA provisions the gateway client leaf Secret (edgion-conf-sync-certs) in-cluster. The
    # Gateway side is ASYMMETRIC -- unlike the Controller, auto_ca alone makes it refuse to
    # start; it also needs these cert paths, which resolve to the mounted Secret. The
    # edgion-conf-sync-certs volume is mounted at /etc/edgion/conf-sync-certs by the gateway
    # Deployment with optional: true, since the pod starts before the Controller has minted
    # the Secret and the conf_sync client connects lazily and retries until it appears.
    conf_sync_security:
      auto_ca: true
      tls:
        cert: /etc/edgion/conf-sync-certs/client.crt
        key: /etc/edgion/conf-sync-certs/client.key
        ca: /etc/edgion/conf-sync-certs/ca.crt

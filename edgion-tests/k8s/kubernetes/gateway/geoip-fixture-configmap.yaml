# Synthetic GeoIP database for Kubernetes integration tests. It extends the
# canonical fixture with 192.168.0.0/16, the OrbStack Pod CIDR, mapped to the
# same US/Cambridge record as the canonical 10.0.0.0/8 private range.
apiVersion: v1
kind: ConfigMap
metadata:
  name: edgion-geoip-test-fixture
  namespace: edgion-system
binaryData:
  edgion-test-city.mmdb: 

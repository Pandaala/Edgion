---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: compatible-gateway
  namespace: edgion-test
spec:
  gatewayClassName: compatible-gateway
  listeners:
  - name: http
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: All
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: Gateway
metadata:
  name: compatible-beta-gateway
  namespace: edgion-test
spec:
  gatewayClassName: compatible-beta-class
  listeners:
  - name: http
    protocol: HTTP
    port: 10080

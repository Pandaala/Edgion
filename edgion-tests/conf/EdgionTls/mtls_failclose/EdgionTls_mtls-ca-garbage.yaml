# tls-F011 case 2: caSecretRef resolves, but the Secret's ca.crt payload is garbage.
# add_ca_bundle_to_store returns Err on X509::stack_from_pem failure; the reorder
# ensures cert/key have not yet been bound and the handshake aborts.
# Uses edge-tls (wildcard *.example.com SAN) so SAN validation passes and the SNI
# matcher is populated, allowing apply_edgion_tls_cert to be reached at handshake time.
apiVersion: edgion.io/v1
kind: EdgionTls
metadata:
  name: mtls-ca-garbage
  namespace: edgion-test
spec:
  parentRefs:
    - name: mtls-failclose-gateway
      namespace: edgion-test
      sectionName: https-mtls-failclose
  hosts:
    - mtls-ca-garbage.example.com
  secretRef:
    name: edge-tls
    namespace: edgion-test
  clientAuth:
    mode: Mutual
    caSecretRef:
      name: garbage-ca
      namespace: edgion-test
    verifyDepth: 1

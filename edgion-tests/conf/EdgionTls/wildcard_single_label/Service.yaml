# Service reused from EdgionTls/https scenario (test-http / port 30001).
# No new Service is needed; this file is kept for schema completeness and
# to allow the conf-loader to apply it without errors even if the Service
# is not yet present from another suite's load order.
apiVersion: v1
kind: Service
metadata:
  name: test-http
  namespace: edgion-test
spec:
  ports:
    - port: 30001
      targetPort: 30001
      protocol: TCP

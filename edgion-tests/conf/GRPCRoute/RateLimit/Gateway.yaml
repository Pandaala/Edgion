# gRPC RateLimit Gateway (dedicated listener so the scenario can run in isolation)
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grpc-ratelimit-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: grpc
      protocol: HTTP
      port: 31063

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tlsroute-status-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: tls
      protocol: TLS
      port: 31338
      hostname: "*.tls-status.example.com"
      tls:
        mode: Passthrough
      allowedRoutes:
        namespaces:
          from: All

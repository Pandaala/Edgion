apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nonexistent-backend
  namespace: edgion-default
spec:
  parentRefs:
    - name: public-gateway
      namespace: edgion-test
  hostnames:
    - nonexistent-backend.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # Same namespace, but the Service does not exist; should trigger ResolvedRefs=False/BackendNotFound
        - name: nonexistent-svc
          port: 80

# GRPCRoute Status Test Gateway
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: grpc-status-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: grpc
      protocol: HTTP
      port: 31335
      allowedRoutes:
        namespaces:
          from: All

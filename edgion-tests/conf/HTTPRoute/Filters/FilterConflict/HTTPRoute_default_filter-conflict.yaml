# HTTPRoute with 3 rules:
#   rule[0]: valid URLRewrite only → should proxy with rewritten path (200)
#   rule[1]: URLRewrite + RequestRedirect conflict → should be skipped (404)
#   rule[2]: valid RequestRedirect only → should redirect (302)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: filter-conflict
  namespace: edgion-default
spec:
  parentRefs:
    - name: filter-conflict-gateway
      namespace: edgion-test
  hostnames:
    - "filter-conflict.example.com"
  rules:
    # rule[0]: valid — URLRewrite only (hostname rewrite, no path change)
    - matches:
        - path:
            type: Exact
            value: /rewrite-only
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: rewritten.example.com
      backendRefs:
        - name: filter-conflict-backend
          namespace: edgion-test
          port: 30001

    # rule[1]: INVALID — URLRewrite + RequestRedirect conflict
    - matches:
        - path:
            type: Exact
            value: /conflict
      filters:
        - type: URLRewrite
          urlRewrite:
            hostname: rewritten.example.com
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
      backendRefs:
        - name: filter-conflict-backend
          namespace: edgion-test
          port: 30001

    # rule[2]: valid — RequestRedirect only
    - matches:
        - path:
            type: Exact
            value: /redirect-only
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 302
      backendRefs:
        - name: filter-conflict-backend
          namespace: edgion-test
          port: 30001

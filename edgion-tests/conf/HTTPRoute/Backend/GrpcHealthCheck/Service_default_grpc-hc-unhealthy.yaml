apiVersion: v1
kind: Service
metadata:
  name: grpc-hc-unhealthy
  namespace: edgion-default
  annotations:
    edgion.io/health-check: |
      active:
        type: grpc
        port: 30021
        interval: 1s
        timeout: 1s
        healthyThreshold: 1
        unhealthyThreshold: 1
        grpcServiceName: "unhealthy"
spec:
  ports:
    - port: 30001
      targetPort: 30001
      protocol: TCP

# Service for H2 mTLS backend (routes to port 30052, the existing mTLS backend).
# appProtocol: kubernetes.io/h2c forces Pingora to use HTTP/2 on the upstream connection
# (set_http_version(2, 2)).  When combined with BackendTLSPolicy, the upstream connection
# is H2 over TLS + mTLS — effectively ALPN h2.  The test_server mTLS backend on port
# 30052 already advertises ALPN ["h2", "http/1.1"], so both sides agree on H2.
apiVersion: v1
kind: Service
metadata:
  name: h2-mtls-sp-service
  namespace: edgion-test
spec:
  ports:
    - name: https
      port: 30052
      protocol: TCP
      targetPort: 30052
      appProtocol: kubernetes.io/h2c
  type: ClusterIP

apiVersion: v1
kind: Secret
metadata:
  name: hmac-credentials-partner-a
  namespace: edgion-default
type: Opaque
stringData:
  credentials.yaml: |
    - username: partner-a-user
      secret: "partner-a-secret-key-at-least-32-bytes-long-padding"
      headers:
        X-Consumer-Username: partner-a-user
        X-Customer-ID: pa-001

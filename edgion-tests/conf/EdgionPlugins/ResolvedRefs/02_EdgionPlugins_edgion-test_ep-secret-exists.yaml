# Scenario 1: EdgionPlugins referencing a Secret that EXISTS → ResolvedRefs=True
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ep-secret-exists
  namespace: edgion-test
spec:
  requestPlugins:
    - type: BasicAuth
      config:
        secretGroups:
          - name: default
            secretRefs:
              - name: ep-resolved-refs-test-secret
                namespace: edgion-test

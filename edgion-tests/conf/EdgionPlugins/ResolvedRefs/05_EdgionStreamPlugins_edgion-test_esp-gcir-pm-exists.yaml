# Scenario 3: EdgionStreamPlugins referencing an EXISTING GCIR PluginMetaData → ResolvedRefs=True
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: esp-gcir-pm-exists
  namespace: edgion-test
spec:
  plugins:
    - type: GlobalConnectionIpRestriction
      config:
        pluginMetadataRef:
          name: esp-gcir-pm-exists
          namespace: edgion-test

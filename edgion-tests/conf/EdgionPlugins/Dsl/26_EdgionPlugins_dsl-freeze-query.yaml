# Verifies that EdgionHttpContext::cached_query is frozen to entry_raw_query.
# req.set_uri rewrites the URI to a different query, but req.query("name")
# read afterwards must still return the entry-time value, proving the cache
# is order-independent regardless of plugin URI rewrites.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: dsl-freeze-query
  namespace: edgion-default
spec:
  requestPlugins:
    - enable: true
      type: Dsl
      config:
        name: "freeze-query"
        source: |
          req.set_uri("/request-header-test?name=AFTER_REWRITE")
          let captured = req.query("name")
          if captured == nil {
            req.set_header("X-Captured-Name", "MISSING")
          } else {
            req.set_header("X-Captured-Name", captured)
          }
        errorPolicy: deny

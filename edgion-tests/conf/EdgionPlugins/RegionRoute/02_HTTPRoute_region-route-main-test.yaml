# HTTPRoute for RegionRoute main test (all three route rules).
# Normal backend test-http:30001 (edgion-test) used when plugin passes through.
# ReferenceGrant in edgion-test allows edgion-default → edgion-test cross-ns reference.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: region-route-main-test
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
      sectionName: http  # Port 31180
  hostnames:
    - "region-route-main.example.com"
  rules:
    - backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: region-route-main

# Route attached to the catch-all listener (no hostname restriction)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: misdirected-catchall-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: gateway-tls-misdirected
      namespace: edgion-test
      sectionName: https-catchall
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

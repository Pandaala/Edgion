# EdgionStreamPlugins: deny all IPs
# Verifies a UDPRoute-level stream plugin denies packets (dropped, no echo).
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: udp-deny-all
  namespace: edgion-test
spec:
  plugins:
    - type: IpRestriction
      config:
        defaultAction: deny

apiVersion: v1
kind: ConfigMap
metadata:
  name: edgion-controller-config
  namespace: edgion-system
  labels:
    app: edgion-controller
data:
  edgion-controller.yaml: |
    work_dir: /usr/local/edgion

    server:
      grpc_listen: 0.0.0.0:12151
      admin_listen: 0.0.0.0:12101
      probe_listen: 0.0.0.0:12100
      metrics_listen: 0.0.0.0:12190

    logging:
      log_dir: logs
      log_prefix: edgion-controller
      log_level: info
      json_format: true
      console: false
      buffer_size: 10000

    conf_center:
      type: kubernetes
      controller_name: edgion.io/gateway-controller
      gateway_address: PLACEHOLDER_WILL_BE_PATCHED
      # Empty watch_namespaces = watch all namespaces.
      # Conformance tests create resources in gateway-conformance-* namespaces.
      leader_election:
        lease_name: edgion-controller-leader
        lease_namespace: edgion-system
        lease_duration_secs: 15
        renew_deadline_secs: 10
        retry_period_secs: 2

      metadata_filter:
        blocked_annotations:
          - kubectl.kubernetes.io/last-applied-configuration
          - meta.helm.sh/release-name
          - meta.helm.sh/release-namespace
        remove_managed_fields: true

    conf_sync:
      no_sync_kinds: [ReferenceGrant, Secret]
      default_capacity: 200

    # conf_sync channel security. REQUIRED: omitting this section entirely makes the
    # process refuse to start (fail-close).
    #
    # DELIBERATE: the conformance stack runs conf_sync in PLAINTEXT across pods, which is
    # NOT what production does (cicd/deploy/kubernetes/ uses `auto_ca: true`). Conformance
    # tests Gateway API semantics, not transport security, so plaintext keeps the fixture
    # minimal -- but it means the auto_ca path gets no coverage here either.
    # Tracked in tasks/todo/k8s-integration-cover-auto-ca-conf-sync.md.
    conf_sync_security:
      tls:
        skip_tls: true

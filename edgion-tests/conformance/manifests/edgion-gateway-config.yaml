# EdgionGatewayConfig for conformance testing.
# Referenced by GatewayClass 'edgion' via parametersRef.
# Cluster-scoped resource (no namespace).
apiVersion: edgion.io/v1alpha1
kind: EdgionGatewayConfig
metadata:
  name: conformance-gateway
spec:
  realIp:
    trustedIpRefs:
      - name: conformance-realip-proxies
        namespace: edgion-system
    realIpHeader: "X-Forwarded-For"

  securityProtect:
    xForwardedForLimit: 500
    requireSniHostMatch: true

  httpTimeout:
    client:
      readTimeout: 60s
      writeTimeout: 60s
      keepaliveTimeout: 75s
    backend:
      defaultConnectTimeout: 5s
      defaultRequestTimeout: 60s
      defaultIdleTimeout: 300s

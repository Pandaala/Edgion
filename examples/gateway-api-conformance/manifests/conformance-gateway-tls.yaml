# Pre-created Gateways for TLSRoute conformance runs.
# These must be applied BEFORE starting the gateway pod so that listeners are
# created at startup (Edgion does not support dynamic listener creation yet).
#
# This manifest is intentionally TLS-focused. It avoids the pre-created HTTPS
# listener on port 443 from the default manifest because that listener conflicts
# with the TLS passthrough listeners required by TLSRoute data-plane tests.
#
# Port 8443 is pre-bound for TLS Terminate tests (TerminateSimple,
# TerminateSupportedKinds, TerminateNotSupported, MixedNotSupported).
# Port 8883 is pre-bound for the MixedTerminationSameNamespace test.
# The conformance suite will update these Gateways at runtime; the important
# thing is that the ports are already bound by the gateway process.
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-conformance-infra
  labels:
    gateway-conformance: infra
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-conformance-app-backend
  labels:
    gateway-conformance: backend
---
apiVersion: v1
kind: Namespace
metadata:
  name: gateway-conformance-web-backend
  labels:
    gateway-conformance: backend
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-tlsroute
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: edgion
  listeners:
  - name: https
    port: 443
    protocol: TLS
    hostname: "*.example.com"
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: TLSRoute
    tls:
      mode: Passthrough
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-tlsroute-exact-hostname-x-1
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: edgion
  listeners:
  - name: listener-exact-hostname
    protocol: TLS
    port: 443
    hostname: abc.example.com
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: TLSRoute
    tls:
      mode: Passthrough
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-tlsroute-more-specific-wc-hostname-x-2
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: edgion
  listeners:
  - name: listener-more-specific-wc-hostname
    protocol: TLS
    port: 443
    hostname: "*.example.com"
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: TLSRoute
    tls:
      mode: Passthrough
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-tlsroute-less-specific-wc-hostname-x-3
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: edgion
  listeners:
  - name: listener-less-specific-wc-hostname
    protocol: TLS
    port: 443
    hostname: "*.com"
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: TLSRoute
    tls:
      mode: Passthrough
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gw-tlsroute-empty-hostname-x-4
  namespace: gateway-conformance-infra
spec:
  gatewayClassName: edgion
  listeners:
  - name: listener-empty-hostname
    protocol: TLS
    port: 443
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: TLSRoute
    tls:
      mode: Passthrough
---
# Pre-bind port 8443 for TLS Terminate tests.
# The conformance suite creates Gateways on this port at runtime; we only need
# the port to be bound by the gateway process before the tests start.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pre-bind-tls-terminate-8443
  namespace: gateway-conformance-infra
  annotations:
    edgion.io/backend-protocol: tcp
spec:
  gatewayClassName: edgion
  listeners:
  - name: tls-terminate
    port: 8443
    protocol: TLS
    hostname: terminate.example.com
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: TLSRoute
    tls:
      mode: Terminate
      certificateRefs:
      - name: tls-terminate-checks-certificate
---
# Pre-bind port 8883 for TLSRouteMixedTerminationSameNamespace test.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: pre-bind-tls-mixed-8883
  namespace: gateway-conformance-infra
  annotations:
    edgion.io/backend-protocol: tcp
spec:
  gatewayClassName: edgion
  listeners:
  - name: tls-terminate
    port: 8883
    protocol: TLS
    hostname: tls.example.com
    allowedRoutes:
      namespaces:
        from: Same
      kinds:
      - kind: TLSRoute
    tls:
      mode: Terminate
      certificateRefs:
      - name: tls-terminate-checks-certificate

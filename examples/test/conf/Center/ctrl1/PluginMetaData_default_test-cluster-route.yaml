# ClusterRegionRoute PluginMetaData for center integration test — controller 1
# myRegion=east — controller 2 uses myRegion=west for the same pm_key,
# which triggers a consistency conflict.
apiVersion: edgion.io/v1
kind: PluginMetaData
metadata:
  name: test-cluster-route
  namespace: default
spec:
  metadata:
    type: ClusterRegionRoute
    config:
      myRegion: east
      regions:
        - name: east
          hashRange: [0, 499]
          backendEndpoint: "127.0.0.1:30001"
          tls: false
        - name: west
          hashRange: [500, 999]
          backendEndpoint: "127.0.0.1:30002"
          tls: false
      keyGet:
        - type: header
          name: X-User-Id
      routeRules:
        - type: RouteByDirectRegion
          keyFrom:
            - type: header
              name: X-Direct-Region
        - type: RouteByHashRange

# ClusterRegionRoute PluginMetaData for center integration test — controller 2
# Same pm_key (default/test-cluster-route) as controller 1 but myRegion=west.
# Center consistency check should detect the myRegion conflict.
apiVersion: edgion.io/v1
kind: PluginMetaData
metadata:
  name: test-cluster-route
  namespace: default
spec:
  metadata:
    type: ClusterRegionRoute
    config:
      myRegion: west
      regions:
        - name: east
          hashRange: [0, 499]
          backendEndpoint: "127.0.0.1:30001"
          tls: false
        - name: west
          hashRange: [500, 999]
          backendEndpoint: "127.0.0.1:30002"
          tls: false
      keyGet:
        - type: header
          name: X-User-Id
      routeRules:
        - type: RouteByDirectRegion
          keyFrom:
            - type: header
              name: X-Direct-Region
        - type: RouteByHashRange

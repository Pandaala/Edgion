# HTTPRoute with ALL rules pointing to nonexistent services
# Controller should set Accepted: False (all rules invalid)
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: all-invalid
  namespace: edgion-default
spec:
  parentRefs:
    - name: partially-invalid-gateway
      namespace: edgion-test
  hostnames:
    - "all-invalid.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /bad-one
      backendRefs:
        - name: nonexistent-service-a
          namespace: edgion-test
          port: 30001
    - matches:
        - path:
            type: PathPrefix
            value: /bad-two
      backendRefs:
        - name: nonexistent-service-b
          namespace: edgion-test
          port: 30001

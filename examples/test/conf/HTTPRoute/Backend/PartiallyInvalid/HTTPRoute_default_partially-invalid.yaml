# HTTPRoute with 2 rules: rule[0] valid, rule[1] points to nonexistent service
# Controller should set PartiallyInvalid: True and Gateway should skip rule[1]
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: partially-invalid
  namespace: edgion-default
spec:
  parentRefs:
    - name: partially-invalid-gateway
      namespace: edgion-test
  hostnames:
    - "partially-invalid.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /valid
      backendRefs:
        - name: valid-backend
          namespace: edgion-test
          port: 30001
    - matches:
        - path:
            type: PathPrefix
            value: /invalid-backend
      backendRefs:
        - name: nonexistent-service
          namespace: edgion-test
          port: 30001

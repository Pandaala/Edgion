apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: panic-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: panic-gateway
      namespace: edgion-test
  hostnames:
    - "panic.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: panic-svc
          port: 30001

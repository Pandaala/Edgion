# LB LeastConn test Gateway
# Annotations enable metrics test mode for verifying LB distribution
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lb-lc-gateway
  namespace: edgion-test
  annotations:
    edgion.io/metrics-test-key: "lb-lc-test"
    edgion.io/metrics-test-type: "lb"
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 31122
      allowedRoutes:
        namespaces:
          from: All

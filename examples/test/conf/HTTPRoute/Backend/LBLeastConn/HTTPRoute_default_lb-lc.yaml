# LeastConn LB route: 3-endpoint pool, /delay/1-second backend
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lb-lc-eps
  namespace: edgion-default
spec:
  parentRefs:
    - name: lb-lc-gateway
      namespace: edgion-test
  hostnames:
    - "lb-lc-eps.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      retry:
        attempts: 0
      timeouts:
        request: 5s
        backendRequest: 4s
      backendRefs:
        - name: lb-lc-service
          port: 8080
          filters:
            - type: ExtensionRef
              extensionRef:
                group: edgion.io
                kind: LBPolicyLeastConn
                name: default

# EWMA LB + retry-on-503 — regression for FinalizeMode::Discard not updating EWMA.
# After a retry storm, the gateway must still route healthy traffic across both endpoints.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lb-ewma-rs-gateway
  namespace: edgion-test
  annotations:
    edgion.io/metrics-test-key: "lb-ewma-rs"
    edgion.io/metrics-test-type: "lb"
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 31126
      allowedRoutes:
        namespaces:
          from: All

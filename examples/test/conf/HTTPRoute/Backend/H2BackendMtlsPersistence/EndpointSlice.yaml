# EndpointSlice for H2 mTLS backend.
# Points to 127.0.0.1:30052 which is the existing mTLS backend server (no new port needed).
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: h2-mtls-sp-service
  namespace: edgion-test
  labels:
    kubernetes.io/service-name: h2-mtls-sp-service
addressType: IPv4
ports:
  - name: https
    port: 30052
    protocol: TCP
endpoints:
  - addresses:
      - "127.0.0.1"
    conditions:
      ready: true

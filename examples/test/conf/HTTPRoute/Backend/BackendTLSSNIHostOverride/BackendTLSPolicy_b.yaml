# BackendTLSPolicy for SNI host override suite — policy B.
# validation.hostname = "hostname-b.example.com" instructs the Gateway to use
# this value as the TLS SNI extension when connecting to btls-sni-service-b.
# The multi-SNI backend resolver returns cert B only for this exact SNI.
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: btls-sni-policy-b
  namespace: edgion-test
spec:
  targetRefs:
    - group: ""
      kind: Service
      name: btls-sni-service-b
  validation:
    caCertificateRefs:
      - name: backend-ca
        kind: Secret
        group: ""
    hostname: hostname-b.example.com

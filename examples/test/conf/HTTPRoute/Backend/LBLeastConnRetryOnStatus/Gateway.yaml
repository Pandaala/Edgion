# g1-007 regression: Gateway combining LeastConn LB and retry-on-503.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lb-lc-rs-gateway
  namespace: edgion-test
  annotations:
    edgion.io/metrics-test-key: "lb-lc-rs"
    # Use the "lb" test type rather than "retry": we care about whether the LB
    # can still balance across endpoints after the retry storm.  try_count is
    # inferred from response behaviour (503 -> retry exhaust -> 503; 503,200 -> 200).
    edgion.io/metrics-test-type: "lb"
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: http
      protocol: HTTP
      port: 31124
      allowedRoutes:
        namespaces:
          from: All

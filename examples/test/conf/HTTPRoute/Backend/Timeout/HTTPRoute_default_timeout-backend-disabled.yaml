apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: timeout-backend-disabled
  namespace: edgion-default
spec:
  parentRefs:
    - name: timeout-gateway
      namespace: edgion-test
  hostnames:
    - "timeout-backend-disabled.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        backendRequest: "0s"   # "0s" = 禁用后端请求超时，request timeout 未设置
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

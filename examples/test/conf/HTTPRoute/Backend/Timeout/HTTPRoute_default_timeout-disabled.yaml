apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: timeout-disabled
  namespace: edgion-default
spec:
  parentRefs:
    - name: timeout-gateway
      namespace: edgion-test
  hostnames:
    - "timeout-disabled.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: "0s"          # "0s" = 禁用请求超时，backendRequest 未设置走全局默认
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

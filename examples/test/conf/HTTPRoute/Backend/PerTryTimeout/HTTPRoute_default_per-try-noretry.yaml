apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: per-try-noretry
  namespace: edgion-default
spec:
  parentRefs:
    - name: per-try-timeout-gateway
      namespace: edgion-test
  hostnames:
    - "per-try-noretry.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      timeouts:
        request: "10s"
        backendRequest: "1s"
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

# Session Persistence with Cookie
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sp-cookie
  namespace: edgion-default
  annotations:
    edgion.io/max-retries: "0"
spec:
  parentRefs:
    - name: sp-gateway
      namespace: edgion-test
  hostnames:
    - "sp-cookie.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /test
      sessionPersistence:
        sessionName: "edgion-sp-test"
        type: Cookie
        absoluteTimeout: "1h"
        cookieConfig:
          lifetimeType: Permanent
      backendRefs:
        - name: sp-service
          port: 8080

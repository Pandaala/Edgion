# GlobalConnectionIpRestriction PluginMetaData for L4 enforcement tests
#
# Two profiles:
#   allow-local: defaultAction=deny, only 127.0.0.0/8 allowed  — loopback IS allowed
#   block-local: defaultAction=allow, 127.0.0.0/8 explicitly denied — loopback IS blocked
#
# Initial state: activeProfile=allow-local (local test connects from 127.0.0.1 → ALLOWED)
apiVersion: edgion.io/v1
kind: PluginMetaData
metadata:
  name: gcir-enforce-test
  namespace: edgion-test
spec:
  metadata:
    type: GlobalConnectionIpRestriction
    config:
      enable: true
      activeProfile: allow-local
      profiles:
        allow-local:
          defaultAction: deny
          allow:
            - name: loopback
              cidrs:
                - "127.0.0.0/8"
        block-local:
          defaultAction: allow
          deny:
            - name: loopback-block
              cidrs:
                - "127.0.0.0/8"

# GlobalConnectionIpRestriction PluginMetaData — smoke test fixture
#
# Verifies that the standard PM CRUD path accepts the new MetaDataEntry variant.
# Profile p1: allow-list semantics — only 192.168.1.0/24 is allowed; all others denied.
# Profile strict: deny-list semantics — explicitly deny 10.10.10.0/24; default allow.
#
# Integration tests (Task 25-26) will exercise the full L4 enforcement path.
apiVersion: edgion.io/v1
kind: PluginMetaData
metadata:
  name: gcir-smoke
  namespace: edgion-test
spec:
  metadata:
    type: GlobalConnectionIpRestriction
    config:
      enable: true
      activeProfile: p1
      description: "Smoke test PM for GlobalConnectionIpRestriction"
      profiles:
        p1:
          defaultAction: deny
          allow:
            - name: office
              cidrs:
                - "192.168.1.0/24"
        strict:
          defaultAction: allow
          deny:
            - name: blocked-range
              cidrs:
                - "10.10.10.0/24"

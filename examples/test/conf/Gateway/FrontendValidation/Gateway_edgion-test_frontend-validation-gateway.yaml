apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: frontend-validation-gateway
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: https-fv
      hostname: "fv-mtls.example.com"
      protocol: HTTPS
      port: 31120
      tls:
        mode: Terminate
        certificateRefs:
          - name: fv-server-cert
        frontendValidation:
          caCertificateRefs:
            - name: fv-client-ca
              kind: Secret
              group: ""

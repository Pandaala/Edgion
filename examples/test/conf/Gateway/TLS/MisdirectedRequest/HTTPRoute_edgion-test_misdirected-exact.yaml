# Route attached to the exact-hostname listener
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: misdirected-exact-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: gateway-tls-misdirected
      namespace: edgion-test
      sectionName: https-exact
  hostnames:
    - "sni421-exact.test.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

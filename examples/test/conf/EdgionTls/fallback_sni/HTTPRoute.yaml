# Route for both the matched SNI and a quick health check.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: fallback-sni-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: fallback-sni-gateway
      namespace: edgion-test
  hostnames:
    - default.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

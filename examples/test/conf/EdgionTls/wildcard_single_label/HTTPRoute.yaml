# HTTPRoute for wildcard_single_label scenario.
# Matches the single-label wildcard hostname *.example.com so that
# route-matching is not the failure point when testing TLS cert selection.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wc-single-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: wc-single-gateway
      namespace: edgion-test
      sectionName: https-wc-single
  hostnames:
    - "*.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

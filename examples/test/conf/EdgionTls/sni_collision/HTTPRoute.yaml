# EdgionTls SNI collision HTTPRoute
# Attaches to the HTTPS listener so it is programmed and the TLS handshake
# has a route context for gateway-tls.test.com.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: edgiontls-sni-collision-route
  namespace: edgion-test
spec:
  parentRefs:
    - name: edgiontls-sni-collision-gateway
      namespace: edgion-test
      sectionName: https
  hostnames:
    - gateway-tls.test.com
  rules:
    # Catch-all route to the shared HTTP backend
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

# RegionRoute - myRegion and failoverTo test
# virginia: myRegion (local pass-through)
# ohio: failoverTo=virginia (redirects to myRegion → local)
# europe: failoverTo=ohio (redirects to ohio → jump, since ohio ≠ myRegion)
# endpoint "127.0.0.1:30002" for europe's redirect target is ohio's loopback → 502
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: region-route-myregion
  namespace: edgion-default
spec:
  requestPlugins:
    - type: RegionRoute
      config:
        regions:
          - name: virginia
            hashRange: [0, 333]
            backendEndpoint: "127.0.0.1:30001"
            tls: false
          - name: ohio
            hashRange: [334, 666]
            backendEndpoint: "127.0.0.1:30002"
            tls: false
            failoverTo: virginia
          - name: europe
            hashRange: [667, 999]
            backendEndpoint: "127.0.0.1:30002"
            tls: false
            failoverTo: ohio
        myRegion: virginia
        routeRules:
          - type: RouteByDirectRegion
            keyFrom:
              - type: header
                name: X-Direct-Region

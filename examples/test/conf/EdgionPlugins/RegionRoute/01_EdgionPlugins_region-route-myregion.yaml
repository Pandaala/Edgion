# RegionRoute - myRegion and failoverTo test
# virginia: myRegion (local pass-through)
# ohio: failoverTo=virginia (redirects to myRegion → local)
# europe: failoverTo=ohio (redirects to ohio → jump, since ohio ≠ myRegion)
# endpoint "127.0.0.1:30002" for europe's redirect target is ohio's loopback → 502
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: region-route-myregion
  namespace: edgion-default
spec:
  requestPlugins:
    - type: RegionRoute
      config:
        serviceRegionRouteRef: "region-route-myregion"

# RegionRoute - hash routing + direct_region override + region_key_hash passthrough
#
# Two regions using IP endpoints (IP form avoids DNS dependency in tests):
#   virginia: 127.0.0.1:30001  hash_range [0, 600]  (60%)
#   ohio:     127.0.0.1:30002  hash_range [601,1000] (40%)
#
# region_key:  X-Account-Id header (first), then cookie account_id (second fallback)
# direct_region: X-Direct-Region header
# region_key_hash: x_region_hash cookie (pre-computed 0-1000 passthrough)
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: region-route-hash
  namespace: default
spec:
  requestPlugins:
    - type: RegionRoute
      config:
        regions:
          - name: virginia
            hashRange: [0, 600]
            backendEndpoint: "127.0.0.1:30001"
            tls: false
          - name: ohio
            hashRange: [601, 1000]
            backendEndpoint: "127.0.0.1:30002"
            tls: false
        directRegion:
          keyFrom:
            - type: header
              name: X-Direct-Region
        regionKeyHash:
          keyFrom:
            - type: cookie
              name: x_region_hash
        regionKey:
          - type: header
            name: X-Account-Id
          - type: cookie
            name: account_id

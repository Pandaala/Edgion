# ServiceRegionRoute PluginMetaData for region-route-norules
#
# Pre-created by administrator. References the ClusterRegionRoute PluginMetaData
# that has no routeRules configured → plugin is always a no-op (pass-through).
# The norules test verifies that traffic passes through unchanged (200 response).
apiVersion: edgion.io/v1
kind: PluginMetaData
metadata:
  name: region-route-norules
  namespace: edgion-default
spec:
  metadata:
    type: ServiceRegionRoute
    config:
        clusterRef:
          namespace: edgion-default
          name: global-region-norules
        regions:
          - name: virginia
          - name: ohio

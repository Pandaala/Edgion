# Service PluginMetaData for ctrl-2
#
# In the new architecture, the GlobalRegionRoute PluginMetaData holds topology (not per-controller PluginMetaDatas).
# This file is a ServiceRegionRoute PluginMetaData for ctrl-2, referencing the GlobalRegionRoute PluginMetaData via globalRef.
apiVersion: edgion.io/v1
kind: PluginMetaData
metadata:
  name: region-route-main
  namespace: edgion-default
spec:
  metadata:
    type: ServiceRegionRoute
    config:
        globalRef:
          namespace: edgion-default
          name: global-region-conf
        regions:
          - name: virginia
          - name: ohio

# HTTPRoute for RegionRoute no-key (pass-through) test
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: region-route-nokey-test
  namespace: default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
      sectionName: http  # Port 31180
  hostnames:
    - "region-route-nokey.example.com"
  rules:
    - backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: region-route-nokey

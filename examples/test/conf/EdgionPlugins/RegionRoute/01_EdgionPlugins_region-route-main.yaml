# RegionRoute - main config using ServiceRegionRoute PluginMetaData
#
# All routing config comes from the ServiceRegionRoute PluginMetaData "region-route-main",
# which in turn references the GlobalRegionRoute PluginMetaData "global-region-conf" via globalRef.
#
# This tests the full PluginMetaData resolve flow:
#   1. Controller resolves serviceRegionRouteRef → loads ServiceRegionRoute PluginMetaData
#   2. ServiceRegionRoute PluginMetaData's globalRef → loads GlobalRegionRoute PluginMetaData for topology + routing rules
#   3. Gateway receives the merged config with route rules + matchMap
#
# Two regions (from GlobalRegionRoute PluginMetaData):
#   virginia: 127.0.0.1:30001  hashRange [0, 599]  (60%)
#   ohio:     127.0.0.1:30002  hashRange [600, 999] (40%)
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: region-route-main
  namespace: edgion-default
spec:
  requestPlugins:
    - type: RegionRoute
      config:
        serviceRegionRouteRef: "region-route-main"

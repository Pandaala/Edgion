# RegionRoute - no routeRules → plugin is always a no-op (passes through)
# All config comes from the ServiceRegionRoute PluginMetaData (which references the ClusterRegionRoute PluginMetaData for topology).
# The ServiceRegionRoute PluginMetaData for "region-route-norules" should have no routeRules → plugin no-op.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: region-route-norules
  namespace: edgion-default
spec:
  requestPlugins:
    - type: RegionRoute
      config:
        serviceRegionRouteRef: "region-route-norules"

# Scenario 1: valid GCIR PM — expect Accepted=True, ResolvedRefs=True
apiVersion: edgion.io/v1
kind: PluginMetaData
metadata:
  name: pm-status-gcir-valid
  namespace: edgion-test
spec:
  metadata:
    type: GlobalConnectionIpRestriction
    config:
      enable: true
      activeProfile: main
      description: "Status test: valid GCIR"
      profiles:
        main:
          defaultAction: deny
          allow:
            - name: office
              cidrs:
                - "10.0.0.0/8"

# EdgionPlugins resource referencing pmd-flap-good via serviceRegionRouteRef.
# Initial phase: PMD exists → EdgionPlugins Accepted=True.
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: pmd-flap-plugin
  namespace: edgion-test
spec:
  requestPlugins:
    - type: RegionRoute
      config:
        serviceRegionRouteRef: "pmd-flap-good"

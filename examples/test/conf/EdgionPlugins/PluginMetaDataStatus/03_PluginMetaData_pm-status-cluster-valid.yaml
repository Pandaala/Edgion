# Scenario 3: valid ClusterRegionRoute PM — expect Accepted=True, ResolvedRefs=True
apiVersion: edgion.io/v1
kind: PluginMetaData
metadata:
  name: pm-status-cluster-valid
  namespace: edgion-test
spec:
  metadata:
    type: ClusterRegionRoute
    config:
      regions:
        - name: east
          hashRange: [0, 499]
          backendEndpoint: "127.0.0.1:30001"
          tls: false
        - name: west
          hashRange: [500, 999]
          backendEndpoint: "127.0.0.1:30002"
          tls: false
      keyGet:
        - type: header
          name: X-Account-Id
      hashCalc:
        algorithm: crc32
        modulo: 1000
      routeRules:
        - type: RouteByHashRange

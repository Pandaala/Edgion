# Scenario: Cors plugin with allowCredentials=true and wildcard origin
# Expect: Accepted=False/Invalid, message contains "allowCredentials"
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ep-validation-cors-invalid
  namespace: default
spec:
  requestPlugins:
    - enable: true
      type: Cors
      config:
        allowCredentials: true
        allowOrigins:
          - "*"

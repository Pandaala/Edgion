# HTTPRoute for the GlobalPluginsSnapshot integration test.
# No route-level filters: the test isolates the *global* plugins snapshot
# behavior. Requests with hostname "global-plugins-snapshot.example.com"
# matching path /headers proxy to the shared test_server.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: global-plugins-snapshot-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: edgion-plugins-gateway
      namespace: edgion-test
  hostnames:
    - "global-plugins-snapshot.example.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/headers"
      backendRefs:
        - name: test-http
          namespace: edgion-test
          port: 30001

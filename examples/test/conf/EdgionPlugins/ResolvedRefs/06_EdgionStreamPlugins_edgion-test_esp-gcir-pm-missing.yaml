# Scenario 4: EdgionStreamPlugins referencing a MISSING GCIR PluginMetaData → ResolvedRefs=False/InvalidPluginMetaDataRef
apiVersion: edgion.io/v1
kind: EdgionStreamPlugins
metadata:
  name: esp-gcir-pm-missing
  namespace: edgion-test
spec:
  plugins:
    - type: GlobalConnectionIpRestriction
      config:
        pluginMetadataRef:
          name: esp-gcir-pm-nonexistent
          namespace: edgion-test

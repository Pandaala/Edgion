# Scenario 2: EdgionPlugins referencing a Secret that DOES NOT EXIST → ResolvedRefs=False/BackendNotFound
apiVersion: edgion.io/v1
kind: EdgionPlugins
metadata:
  name: ep-secret-missing
  namespace: edgion-test
spec:
  requestPlugins:
    - type: BasicAuth
      config:
        secretGroups:
          - name: default
            secretRefs:
              - name: ep-resolved-refs-nonexistent-secret
                namespace: edgion-test

apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tls-mixed-backend
  namespace: edgion-test
spec:
  parentRefs:
    - name: tls-unknown-kind-gw
      namespace: edgion-test
      sectionName: tls-unknown-kind
  hostnames:
    - "mixed-backend.sandbox.example.com"
  rules:
    - backendRefs:
        - name: test-tcp
          port: 30010
          weight: 100
        - group: example.com
          kind: Foo
          name: tls-backend
          port: 30051
          weight: 100

# gRPC shared-CMS regression route — HOSTNAME (H) dimension.
#
# ONE rule with TWO hostnames (a.shared / b.shared) and a SINGLE match-item.
# The rule-level Arc<PluginRuntime> (and the RateLimit Count-Min-Sketch state
# inside it) MUST be shared across both hostnames so the limit stays GLOBAL per
# rule, not multiplied by the hostname count.
#
# NOTE ON SCOPE: gRPC uses a flat match engine — `effective_hostnames` is a Vec
# on the shared route_info and a rule's plugin_runtime is built once per rule
# regardless of hostname count (grpc/conf_handler_impl.rs has no per-hostname
# unit fan-out, unlike http/conf_handler_impl.rs which loops over hostnames).
# So today both hostnames structurally resolve to the same unit; this scenario
# pins that observable contract and future-proofs it against a refactor that
# would fan gRPC units out per (rule, hostname) without re-sharing the runtime.
# The STRONG H-dimension guard lives on the HTTP side (where the per-hostname
# build site actually exists) — tracked in
# tasks/review-decouple/http-01-missing-shared-cms-regression-test.md.
#
# A fixed `x-rate-key` value forces ALL requests into one CMS bucket, so the
# limit is keyed only by the rule's shared PluginRuntime.
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: grpc-ratelimit-shared-hostnames
  namespace: edgion-test
spec:
  parentRefs:
    - name: grpc-ratelimit-gateway
      namespace: edgion-test
      sectionName: grpc

  hostnames:
    - "a.shared.example.com"   # H = 2
    - "b.shared.example.com"

  rules:
    # Single rule, single match-item, one rule-level RateLimit filter.
    # The two hostnames above share this rule's single PluginRuntime.
    - matches:
        - method:
            type: Exact
            service: test.TestService
            method: SayHello
      filters:
        - type: ExtensionRef
          extensionRef:
            group: edgion.io
            kind: EdgionPlugins
            name: grpc-rate-limit-shared
      backendRefs:
        - name: test-grpc
          port: 30021

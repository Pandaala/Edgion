apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: regex-service-match-test
  namespace: edgion-test
spec:
  parentRefs:
    - name: grpc-match-gateway
      namespace: edgion-test
      sectionName: grpc

  hostnames:
    - "grpc-regex-svc.example.com"

  rules:
    # Rule 1: Regex service-only match (no method specified)
    # Matches any service whose name starts with "test."
    - matches:
        - method:
            type: RegularExpression
            service: "test\\..*"
      backendRefs:
        - name: test-grpc
          port: 30021

apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: tls-mode-test
  namespace: edgion-test
spec:
  gatewayClassName: public-gateway
  listeners:
    - name: passthrough
      protocol: TLS
      port: 31325
      tls:
        mode: Passthrough
    - name: mixed
      protocol: TLS
      port: 31326
      tls:
        mode: Mixed
    - name: terminate
      protocol: TLS
      port: 31327
      tls:
        mode: Terminate

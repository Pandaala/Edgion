apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nonexistent-backend
  namespace: edgion-default
spec:
  parentRefs:
    - name: public-gateway
      namespace: edgion-test
  hostnames:
    - nonexistent-backend.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # 同命名空间，但 Service 不存在，应触发 ResolvedRefs=False/BackendNotFound
        - name: nonexistent-svc
          namespace: edgion-default
          port: 80

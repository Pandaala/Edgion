apiVersion: gateway.networking.k8s.io/v1
kind: TLSRoute
metadata:
  name: tls-cross-ns-denied
  namespace: app2
spec:
  parentRefs:
    - name: tls-refgrant-gateway
      namespace: edgion-test
      sectionName: tls
  hostnames:
    - "tls-denied.refgrant.example.com"
  rules:
    - backendRefs:
        - name: tls-refgrant-svc
          namespace: backend
          port: 30010
          weight: 100

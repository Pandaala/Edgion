apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: invalid-kind-route
  namespace: edgion-default
spec:
  parentRefs:
    - name: public-gateway
      namespace: edgion-test
  hostnames:
    - invalid-kind.example.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        # kind is not Service; should trigger ResolvedRefs=False/InvalidKind
        - group: ""
          kind: Foo
          name: some-svc
          port: 80

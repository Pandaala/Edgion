apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wildcard-matches-wildcard
  namespace: edgion-test
spec:
  parentRefs:
    - name: hostname-intersection
      namespace: edgion-test
  hostnames:
    - "*.anotherwildcard.io"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /s4
      backendRefs:
        - name: test-http
          port: 30001

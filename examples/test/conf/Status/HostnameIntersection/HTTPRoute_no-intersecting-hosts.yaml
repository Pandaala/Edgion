apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: no-intersecting-hosts
  namespace: edgion-test
spec:
  parentRefs:
    - name: hostname-intersection
      namespace: edgion-test
  hostnames:
    - "specific.but.wrong.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /s5
      backendRefs:
        - name: test-http
          port: 30001

apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: specific-matches-specific
  namespace: edgion-test
spec:
  parentRefs:
    - name: hostname-intersection
      namespace: edgion-test
  hostnames:
    - "very.specific.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /s1
      backendRefs:
        - name: test-http
          port: 30001

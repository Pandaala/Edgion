name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          install-deps: "true"
          cache-enabled: "true"
          cache-key-prefix: "cargo-check"

      # `--workspace` so the end-to-end harness `edgion-tests` (a member kept out
      # of `default-members`) gets the fast type-check signal too — without it,
      # `--all-targets` alone covers only default members and harness breakages
      # surface much later in the slow `test` job.
      - name: Verify Pingora source policy
        run: python3 cicd/checks/check_pingora_source_policy.py

      - name: Verify generated Gateway API transform contract
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y python3-yaml
          python3 cicd/checks/test_generate_gateway_api_transform_contract.py
          python3 cicd/checks/generate_gateway_api_transform_contract.py --check
          python3 cicd/checks/test_generate_gateway_api_reference_contract.py
          python3 cicd/checks/generate_gateway_api_reference_contract.py --check

      - name: Run cargo check
        run: cargo check --locked --workspace --all-targets

  # Minimal Gateway: every optional subsystem (kafka/otlp/geoip/wasm)
  # compiled out. Guards the feature gating and the fail-closed placeholders.
  gateway-core:
    name: Gateway Core Features
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          install-deps: "true"
          cache-enabled: "true"
          cache-key-prefix: "cargo-gateway-core"

      - name: Check Gateway core build
        run: cargo check --locked -p edgion-gateway --all-targets --no-default-features --features allocator-jemalloc,boringssl

      - name: Test Gateway core library
        run: cargo test --locked -p edgion-gateway --lib --no-default-features --features allocator-jemalloc,boringssl

  gateway-build:
    name: Gateway Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          install-deps: "true"
          cache-enabled: "true"
          cache-key-prefix: "cargo-gateway"

      - name: Build Gateway
        run: |
          cargo build --locked -p edgion-gateway --bin edgion-gateway
          cargo tree --locked -p edgion-gateway --edges normal > /tmp/gateway-tree.txt

      - name: Verify compiled capability
        run: |
          capabilities="$(target/debug/edgion-gateway --print-build-capabilities)"
          grep -qx 'format=edgion-build-capabilities/v1' <<<"$capabilities"
          grep -qx 'body-buffering=enabled' <<<"$capabilities"
          grep -qx 'pingora-mode=edgion-fork' <<<"$capabilities"
          for subsystem in kafka otlp geoip wasm; do
            grep -qx "subsystem-${subsystem}=enabled" <<<"$capabilities"
          done

      - name: Verify Pingora source isolation
        run: |
          pingora_nodes="$(grep -E 'pingora-[^ ]+ v' /tmp/gateway-tree.txt)"
          if grep -v 'github.com/Pandaala/pingora' <<<"$pingora_nodes"; then
            echo "Gateway contains a non-fork Pingora package"
            exit 1
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          components: rustfmt
          install-deps: "false"
          cache-enabled: "false"
          cache-key-prefix: "cargo-fmt"

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  agent-docs:
    name: Agent Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate agent docs
        run: python3 cicd/checks/validate_agent_docs.py

      - name: Check migrated unit-test layout
        run: |
          python3 cicd/checks/test_check_unit_test_layout.py
          python3 cicd/checks/check_unit_test_layout.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          components: clippy
          install-deps: "true"
          cache-enabled: "true"
          cache-key-prefix: "cargo-clippy"

      # `--workspace` so clippy also lints `edgion-tests` (excluded from
      # `default-members`); otherwise the harness never gets a clippy signal in CI.
      - name: Run clippy
        run: cargo clippy --locked --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.99.1"
          install-deps: "true"
          cache-enabled: "true"
          cache-key-prefix: "cargo-test"

      - name: Run tests
        run: cargo test --locked --all

  ext_proc_fixture:
    name: ExtProc Go Fixture
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edgion-tests/integration/fixtures/ext_proc_external
    steps:
      - uses: actions/checkout@v6

      - name: Setup Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.10"
          cache-dependency-path: edgion-tests/integration/fixtures/ext_proc_external/go.sum

      - name: Verify pinned module graph
        env:
          GOTOOLCHAIN: local
        run: go mod verify

      - name: Run fixture tests
        env:
          GOTOOLCHAIN: local
        run: go test -mod=readonly ./...

      - name: Verify read-only fixture build
        env:
          GOTOOLCHAIN: local
        run: go build -mod=readonly ./...

  # Summary job for branch protection
  ci-success:
    name: CI Success
    needs: [check, gateway-core, gateway-build, fmt, agent-docs, clippy, test, ext_proc_fixture]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.check.result }}" != "success" ]] || \
             [[ "${{ needs.gateway-core.result }}" != "success" ]] || \
             [[ "${{ needs.gateway-build.result }}" != "success" ]] || \
             [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.agent-docs.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]] || \
             [[ "${{ needs.ext_proc_fixture.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"

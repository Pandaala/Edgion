name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.96.1"
          install-deps: "true"
          cache-enabled: "true"
          cache-key-prefix: "cargo-check"

      # `--workspace` so the end-to-end harness `edgion-tests` (a member kept out
      # of `default-members`) gets the fast type-check signal too — without it,
      # `--all-targets` alone covers only default members and harness breakages
      # surface much later in the slow `test` job.
      - name: Run cargo check
        run: cargo check --workspace --all-targets

  gateway-flavors:
    name: Gateway Flavor (${{ matrix.flavor }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - flavor: body
            binary: edgion-gateway
            expected_body: enabled
            expected_mode: edgion-fork
          - flavor: stock
            binary: edgion-gateway-stock
            expected_body: disabled
            expected_mode: stock
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.96.1"
          install-deps: "true"
          cache-enabled: "true"
          cache-key-prefix: "cargo-gateway-${{ matrix.flavor }}"

      - name: Build body Gateway
        if: matrix.flavor == 'body'
        run: |
          cargo build -p edgion-gateway --bin edgion-gateway
          cargo tree -p edgion-gateway --edges normal > /tmp/gateway-tree.txt

      - name: Build stock Gateway
        if: matrix.flavor == 'stock'
        run: |
          cargo build -p edgion-gateway \
            --bin edgion-gateway-stock \
            --no-default-features \
            --features allocator-jemalloc,boringssl,upstream-pingora
          cargo tree -p edgion-gateway \
            --edges normal \
            --no-default-features \
            --features allocator-jemalloc,boringssl,upstream-pingora \
            > /tmp/gateway-tree.txt

      - name: Verify compiled capability
        run: |
          capabilities="$(target/debug/${{ matrix.binary }} --print-build-capabilities)"
          grep -qx 'format=edgion-build-capabilities/v1' <<<"$capabilities"
          grep -qx 'body-buffering=${{ matrix.expected_body }}' <<<"$capabilities"
          grep -qx 'pingora-mode=${{ matrix.expected_mode }}' <<<"$capabilities"

      - name: Verify Pingora source isolation
        run: |
          pingora_nodes="$(grep -E 'pingora-[^ ]+ v' /tmp/gateway-tree.txt)"
          if [[ '${{ matrix.flavor }}' == 'body' ]]; then
            if grep -v 'github.com/Pandaala/pingora' <<<"$pingora_nodes"; then
              echo "Body Gateway contains a non-fork Pingora package"
              exit 1
            fi
          else
            if grep -q 'github.com/Pandaala/pingora' <<<"$pingora_nodes"; then
              echo "Stock Gateway contains a fork Pingora package"
              exit 1
            fi
          fi

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.96.1"
          components: rustfmt
          install-deps: "false"
          cache-enabled: "false"
          cache-key-prefix: "cargo-fmt"

      - name: Run cargo fmt
        run: cargo fmt --all -- --check

  agent-docs:
    name: Agent Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate agent docs
        run: python3 cicd/checks/validate_agent_docs.py

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.96.1"
          components: clippy
          install-deps: "true"
          cache-enabled: "true"
          cache-key-prefix: "cargo-clippy"

      # `--workspace` so clippy also lints `edgion-tests` (excluded from
      # `default-members`); otherwise the harness never gets a clippy signal in CI.
      - name: Run clippy
        run: cargo clippy --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Rust toolchain
        uses: ./.github/actions/setup-rust
        with:
          toolchain: "1.96.1"
          install-deps: "true"
          cache-enabled: "true"
          cache-key-prefix: "cargo-test"

      - name: Run tests
        run: cargo test --all

  # Summary job for branch protection
  ci-success:
    name: CI Success
    needs: [check, gateway-flavors, fmt, agent-docs, clippy, test]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.check.result }}" != "success" ]] || \
             [[ "${{ needs.gateway-flavors.result }}" != "success" ]] || \
             [[ "${{ needs.fmt.result }}" != "success" ]] || \
             [[ "${{ needs.agent-docs.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.test.result }}" != "success" ]]; then
            echo "One or more jobs failed"
            exit 1
          fi
          echo "All CI checks passed!"

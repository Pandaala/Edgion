name: check-edgion-data-overlay
on:
  pull_request:
  push:
    branches: [main]
# Structural CI gates for the EdgionData overlay refactor. See
# `cicd/checks/check_no_legacy_data_refs.sh`,
# `cicd/checks/check_edgion_data_variant_parity.py`,
# `cicd/checks/check_overlay_signal_completeness.sh` for policy details.
jobs:
  no-legacy-refs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Forbid legacy PluginMetaData / ClusterRegionRoute / ServiceRegionRoute refs
        run: cicd/checks/check_no_legacy_data_refs.sh

  variant-parity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: EdgionData CRD `type` enum matches Rust `DataEntry` variants
        run: python3 cicd/checks/check_edgion_data_variant_parity.py

  overlay-signal-completeness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Overlay consumer plugins emit the full fail-to-base signal set
        run: cicd/checks/check_overlay_signal_completeness.sh

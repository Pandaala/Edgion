[package]
name = "edgion-gateway"
version.workspace = true
edition.workspace = true
publish = false
authors.workspace = true

[lib]
name = "edgion_gateway"
path = "src/lib.rs"

[[bin]]
name = "edgion-gateway"
path = "src/bin/edgion_gateway.rs"
required-features = ["body-buffering"]

[[bin]]
name = "edgion-gateway-stock"
path = "src/bin/edgion_gateway_stock.rs"
required-features = ["upstream-pingora"]

[lints]
workspace = true

[features]
# Default features
default = ["allocator-jemalloc", "boringssl", "body-buffering"]

# Pingora source selection (mutually exclusive).
body-buffering = [
    "dep:pingora-core-edgion",
    "dep:pingora-http-edgion",
    "dep:pingora-limits-edgion",
    "dep:pingora-load-balancing-edgion",
    "dep:pingora-proxy-edgion",
    "dep:pingora-ketama-edgion",
    "dep:tempfile",
]
upstream-pingora = [
    "dep:pingora-core-upstream",
    "dep:pingora-http-upstream",
    "dep:pingora-limits-upstream",
    "dep:pingora-load-balancing-upstream",
    "dep:pingora-proxy-upstream",
    "dep:pingora-ketama-upstream",
]

# Memory allocator selection (mutually exclusive) — lives with the binary.
allocator-jemalloc = ["tikv-jemallocator"]
allocator-mimalloc = ["mimalloc"]
allocator-system = []

# TLS backend selection (mutually exclusive)
boringssl = [
    "pingora-core-edgion?/boringssl",
    "pingora-proxy-edgion?/boringssl",
    "pingora-core-upstream?/boringssl",
    "pingora-proxy-upstream?/boringssl",
    "dep:boring-sys",
    "dep:boring",
]
rustls = [
    "pingora-core-edgion?/rustls",
    "pingora-proxy-edgion?/rustls",
    "pingora-core-upstream?/rustls",
    "pingora-proxy-upstream?/rustls",
]

# FIPS-validated BoringSSL. Image-build only (NOT a default). Links a prebuilt
# FIPS `bcm.o` into the normal libcrypto via boring's fips-link-precompiled,
# which avoids the from-source `boring/fips` path that conflicts with
# pingora-boringssl's forced `pq-experimental` patch. The prebuilt module is
# supplied at build time via BORING_BSSL_FIPS_PRECOMPILED_BCM_O.
fips = ["boringssl", "boring/fips-link-precompiled"]

# Legacy route tests using deprecated ZtraceHttpRoute (disabled by default)
legacy_route_tests = []

[dependencies]
# Memory allocators (optional, controlled by features)
tikv-jemallocator = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }

# Shared resource/config schema crate (leaf; reused by the future EdgionCenter)
edgion-resources.workspace = true

# Shared common crate (config loader, observe, secret store, link core, etc.)
edgion-common.workspace = true

# EdgionDSL language core (parser/compiler/bytecode/validator); the gateway
# keeps the VM and builtin dispatch and re-exports the core paths.
edgion-dsl.workspace = true

# Core async runtime and error handling
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true

# Serialization/Deserialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
json-patch.workspace = true
mime.workspace = true

# Kubernetes conf_client and types
kube.workspace = true
k8s-openapi.workspace = true
schemars.workspace = true

# gRPC (config sync)
tonic.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
# Built-in webpki roots for building custom rustls ClientConfig (ext_proc connector)
webpki-roots.workspace = true
# Custom hyper connector for the ext_proc tonic channel (TLS toggle / custom CA / mTLS)
hyper-util.workspace = true
x509-parser.workspace = true
prost.workspace = true

futures.workspace = true

# HTTP server
axum.workspace = true
axum-server.workspace = true

# Utilities
bytes.workspace = true
base64.workspace = true
filetime.workspace = true
flate2.workspace = true
chrono.workspace = true
parking_lot.workspace = true
uuid.workspace = true
arc-swap.workspace = true
notify.workspace = true
dashmap.workspace = true
regex.workspace = true
regex-automata.workspace = true
rand.workspace = true
smallvec.workspace = true
indexmap.workspace = true
sha2.workspace = true
subtle.workspace = true
tar.workspace = true
crc32fast.workspace = true
hmac.workspace = true
aes-gcm.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true

# Pingora. Exactly one complete source family is selected by the Gateway flavor.
pingora-core-edgion = { workspace = true, optional = true }
pingora-http-edgion = { workspace = true, optional = true }
pingora-limits-edgion = { workspace = true, optional = true }
pingora-load-balancing-edgion = { workspace = true, optional = true }
pingora-proxy-edgion = { workspace = true, optional = true }
pingora-ketama-edgion = { workspace = true, optional = true }

pingora-core-upstream = { workspace = true, optional = true }
pingora-http-upstream = { workspace = true, optional = true }
pingora-limits-upstream = { workspace = true, optional = true }
pingora-load-balancing-upstream = { workspace = true, optional = true }
pingora-proxy-upstream = { workspace = true, optional = true }
pingora-ketama-upstream = { workspace = true, optional = true }
etcd-client.workspace = true
fred.workspace = true

# BoringSSL bindings for custom TLS callbacks (optional, only for boringssl feature)
boring-sys = { workspace = true, optional = true }
boring = { workspace = true, optional = true }

# Metrics
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-util.workspace = true

# CLI
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
opentelemetry.workspace      = true
opentelemetry_sdk.workspace  = true
opentelemetry-otlp.workspace = true
http.workspace = true
percent-encoding.workspace = true

# HTTP client for link_sys providers (webhook / elasticsearch) and the
# request_mirror plugin — a runtime dependency, not test-only.
reqwest.workspace = true
# Retry-After header parsing (delta-seconds / HTTP-date) in the outbound retry loop.
httpdate.workspace = true
# Form-body percent-encoding for outbound request bodies (BodySpec::Form).
url = { workspace = true }

rusqlite.workspace = true
md-5.workspace = true
cookie.workspace = true
instant-acme.workspace = true
rcgen.workspace = true
time.workspace = true
sha1.workspace = true
ldap3.workspace = true
rskafka.workspace = true
tower.workspace = true
# Runtime body storage for the body-enabled flavor.
tempfile = { workspace = true, optional = true }
# Wasm runtime for the proxy-wasm host plugin
wasmtime.workspace = true

[target.'cfg(unix)'.dependencies]
# Disk-usage probe for LocalFile log sink health (statvfs).
rustix = { version = "1.1", features = ["fs"] }

[dev-dependencies]
edgion-common = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
wat.workspace = true
h2.workspace = true
tokio-tungstenite.workspace = true
mockall.workspace = true
colored.workspace = true
console.workspace = true
expect-test.workspace = true
proxy-header.workspace = true
wiremock.workspace = true
proptest.workspace = true

apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgion-controller
  namespace: edgion-system
  labels:
    app: edgion-controller
spec:
  replicas: 2
  selector:
    matchLabels:
      app: edgion-controller
  template:
    metadata:
      labels:
        app: edgion-controller
    spec:
      serviceAccountName: edgion-controller
      containers:
      - name: edgion-controller
        image: docker.io/pandaala/edgion-controller:0.1.5
        args:
        - "--config-file"
        - "/usr/local/edgion/config/edgion-controller.yaml"
        ports:
        - name: grpc
          containerPort: 12151
          protocol: TCP
        - name: http
          containerPort: 12101
          protocol: TCP
        - name: probe
          containerPort: 12100
          protocol: TCP
        - name: metrics
          containerPort: 12190
          protocol: TCP
        livenessProbe:
          httpGet:
            path: /health
            port: 12100
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 12100
          initialDelaySeconds: 5
          periodSeconds: 10
        env:
        - name: RUST_LOG
          value: "info"
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        # Admin credentials injected from the edgion-admin-credentials Secret.
        # The Secret is created by deploy.sh before the controller is applied.
        - name: EDGION_ADMIN_USERNAME
          valueFrom:
            secretKeyRef:
              name: edgion-admin-credentials
              key: username
        - name: EDGION_ADMIN_PASSWORD
          valueFrom:
            secretKeyRef:
              name: edgion-admin-credentials
              key: password
        - name: EDGION_ADMIN_JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: edgion-admin-credentials
              key: jwt_secret
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        volumeMounts:
        - name: config
          mountPath: /usr/local/edgion/config
          readOnly: true
        - name: logs
          mountPath: /usr/local/edgion/logs
      volumes:
      - name: config
        configMap:
          name: edgion-controller-config
      - name: logs
        emptyDir: {}

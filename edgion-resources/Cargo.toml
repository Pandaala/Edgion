[package]
name = "edgion-resources"
version.workspace = true
edition.workspace = true
publish = false
authors.workspace = true

[lib]
name = "edgion_resources"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
# Runtime-independent matching and data-structure algorithms.
edgion-algo.workspace = true

# EdgionDSL language core (compile/validate path shared with the gateway)
edgion-dsl.workspace = true
edgion-waf.workspace = true

# Local-response body representation shared with the Gateway response writer
bytes.workspace = true

# Serialization / schema
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
yaml_serde.workspace = true
schemars.workspace = true
jsonschema.workspace = true
apollo-parser.workspace = true
cel.workspace = true
jsonptr.workspace = true

# Kubernetes resource model
kube = { workspace = true, features = ["derive"] }
k8s-openapi.workspace = true

# Matcher / config helpers
regex.workspace = true
smallvec.workspace = true
parking_lot.workspace = true
url.workspace = true
http.workspace = true

# Errors
thiserror.workspace = true
anyhow.workspace = true

# Auth / crypto config helpers
jsonwebtoken.workspace = true
zeroize.workspace = true
base64.workspace = true
sha2.workspace = true
hex.workspace = true

# Misc
clap.workspace = true
chrono.workspace = true
prost.workspace = true
prost-types.workspace = true
prost-reflect.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true

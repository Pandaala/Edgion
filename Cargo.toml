[workspace]
members = ["edgion-resources", "edgion-common", "edgion-cli", "edgion-gateway", "edgion-controller", "edgion-tests"]
# `edgion-tests` is the ~56k-line end-to-end harness. It is a member (so
# `cargo build -p edgion-tests` works and CI can target it), but is kept out of
# `default-members` so a bare `cargo build` / `cargo check --all-targets` for
# production does NOT compile it. Build it explicitly with `-p edgion-tests`.
default-members = ["edgion-resources", "edgion-common", "edgion-cli", "edgion-gateway", "edgion-controller"]
# Virtual manifest: after the crate split there is no root `edgion` package — the
# three binaries (`edgion-gateway`, `edgion-controller`, `edgion-cli`) are peers
# and no single package owns the workspace. A virtual manifest has no
# `package.edition` to infer the resolver from, so resolver 2 MUST be stated
# explicitly. Resolver 1 would union features across the dependency graph and
# could enable both `boringssl` and `rustls` on pingora-core simultaneously (they
# are mutually exclusive) — v2 preserves per-target feature selection. The
# mutually-exclusive TLS/allocator features now live on the leaf crates
# (`edgion-gateway`/`edgion-controller`/`edgion-cli`), never at a root package.
resolver = "2"

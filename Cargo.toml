[workspace]
members = ["edgion-algo", "edgion-waf", "edgion-wasm", "edgion-ldap", "edgion-dsl", "edgion-resources", "edgion-common", "edgion-cli", "edgion-gateway", "edgion-controller", "edgion-tests"]
# `edgion-tests` is the ~56k-line end-to-end harness. It is a member (so
# `cargo build -p edgion-tests` works and CI can target it), but is kept out of
# `default-members` so a bare `cargo build` / `cargo check --all-targets` for
# production does NOT compile it. Build it explicitly with `-p edgion-tests`.
default-members = ["edgion-algo", "edgion-waf", "edgion-wasm", "edgion-ldap", "edgion-dsl", "edgion-resources", "edgion-common", "edgion-cli", "edgion-gateway", "edgion-controller"]
# Virtual manifest: after the crate split there is no root `edgion` package — the
# three binaries (`edgion-gateway`, `edgion-controller`, `edgion-cli`) are peers
# and no single package owns the workspace. A virtual manifest has no
# `package.edition` to infer the resolver from, so resolver 2 MUST be stated
# explicitly. Resolver 1 would union features across the dependency graph and
# could enable both `boringssl` and `rustls` on pingora-core simultaneously (they
# are mutually exclusive) — v2 preserves per-target feature selection. The
# mutually-exclusive TLS/allocator features now live on the leaf crates
# (`edgion-gateway`/`edgion-controller`/`edgion-cli`), never at a root package.
resolver = "2"

# Shared package metadata. Members inherit via `<key>.workspace = true`.
# `license` is intentionally omitted for now (no member declared one before this
# change — add it here once confirmed against the LICENSE file). `publish` stays
# per-member (`edgion-tests` sets `publish = false`).
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["pandalaa"]

# Centralized lint policy. Members opt in with `[lints] workspace = true`.
# Unlike `cargo clippy --all-targets` (a CLI invocation), these levels apply on
# every `cargo build`/`check` and in the IDE, so the bar is enforced uniformly
# without anyone having to remember a flag. CI does not pass `-D warnings`, so
# these are advisory warnings, not hard build failures.
#
# Deliberately NOT setting `unsafe_code`: the gateway/common crates carry
# legitimate `unsafe` (BoringSSL FFI, allocator hooks), so a global deny/warn
# would only generate false positives.
# `unreachable_pub` and `unused_qualifications` were evaluated and dropped: they
# fired ~583 times across the existing code (tidiness-only, low bug value) and
# cleaning them up was not worth the churn. Only zero-noise lints are kept.
[workspace.lints.rust]
unused_lifetimes = "warn"

[workspace.lints.clippy]
# A curated, high-signal / low-false-positive tier above clippy's defaults.
await_holding_lock    = "warn"  # holding a lock across `.await` — deadlock-prone in a proxy
rc_buffer             = "warn"
inefficient_to_string = "warn"
implicit_clone        = "warn"
manual_let_else       = "warn"

# Single source of truth for dependency versions. Members opt in with
# `<dep>.workspace = true`; member-specific features are additive on top, and
# `optional` is set at the member (workspace deps cannot carry `optional`).
[workspace.dependencies]
# Internal crates (path is relative to the workspace root). Not published, so
# path-only — no version pin.
edgion-algo       = { path = "edgion-algo" }
edgion-waf        = { path = "edgion-waf" }
edgion-wasm       = { path = "edgion-wasm" }
edgion-ldap       = { path = "edgion-ldap" }
edgion-dsl        = { path = "edgion-dsl" }
edgion-resources  = { path = "edgion-resources" }
edgion-common     = { path = "edgion-common" }
# default-features = false so that a crate depending on this workspace dep
# (e.g. edgion-tests, which needs only log_consts) can select a single TLS
# backend without also activating boringssl. The gateway binary itself still
# selects its own defaults via its own [features] default list.
edgion-gateway    = { path = "edgion-gateway", default-features = false }
edgion-controller = { path = "edgion-controller" }
edgion-cli        = { path = "edgion-cli" }

# Async runtime / error handling
# Tokio >=1.54 requires the Pingora fork's zero-capacity L4 read-buffer fix (572e044).
# See skills/04-review/supply-chain/compatibility-constraints/pingora-tokio-zero-capacity.md.
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7"
tokio-stream = "0.1"
tokio-rustls = "0.26"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "2.0.18"
futures = "0.3.31"

# Serialization / schema
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
yaml_serde = "0.10.7"
serde_ignored = "0.1.14"
schemars = "=1.2.3"
jsonschema = { version = "0.40", default-features = false }
apollo-parser = "=0.8.7"
cel = { version = "0.14.5", default-features = false }
json-patch = { version = "4.1", default-features = false }
jsonptr = "0.7.1"
mime = "0.3.17"

# Kubernetes
# Members enable client, runtime or derive according to their ownership.
kube = { version = "4.2.0", default-features = false }
k8s-openapi = { version = "0.28.0", features = ["v1_34", "schemars"] }

# gRPC / protobuf
tonic = { version = "0.14.9", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14.9"
tonic-prost-build = "0.14.9"
prost = "0.14.4"
prost-types = "0.14.4"
prost-reflect = { version = "=0.16.5", features = ["serde"] }

# TLS / certificates
rustls = { version = "0.23", features = ["aws_lc_rs", "ring"] }
webpki-roots = "1"
x509-parser = { version = "0.18", features = ["verify"] }
rcgen = { version = "0.14.7", features = ["x509-parser"] }
instant-acme = "0.8.4"
# BoringSSL bindings for custom TLS callbacks — pulled in (optional) only by the
# `boringssl` feature of the crates that hold the callback code.
boring = "5.4"
boring-sys = "5.4"
foreign-types = "0.5"

# Pingora — the Gateway builds exclusively against the Edgion fork family so
# public types never cross a source boundary. Development selects
# `edgion_v0.9.1`; Cargo.lock pins its exact commit. The source-policy guard
# requires the same selector across the family. CI/release builds use `--locked`.
pingora-core = { git = "https://github.com/Pandaala/pingora.git", branch = "edgion_v0.9.1", features = ["connection_filter"] }
pingora-http = { git = "https://github.com/Pandaala/pingora.git", branch = "edgion_v0.9.1" }
pingora-proxy = { git = "https://github.com/Pandaala/pingora.git", branch = "edgion_v0.9.1" }
pingora-limits = { git = "https://github.com/Pandaala/pingora.git", branch = "edgion_v0.9.1" }
pingora-load-balancing = { git = "https://github.com/Pandaala/pingora.git", branch = "edgion_v0.9.1" }
pingora-ketama = { git = "https://github.com/Pandaala/pingora.git", branch = "edgion_v0.9.1" }
tinyufo = { package = "TinyUFO", git = "https://github.com/Pandaala/pingora.git", branch = "edgion_v0.9.1" }

# HTTP server / client
axum = { version = "0.8.8", features = ["macros"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls-no-provider", "http2", "stream", "form", "query"] }
http = "1.4.0"
http-body = "=1.1.0"
httpdate = "1"
h2 = "0.4"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "tokio"] }
tower = { version = "0.5", features = ["util"] }
tokio-tungstenite = "0.29"
proxy-header = "0.1.2"
percent-encoding = "2.3"
cookie = "0.18.1"

# Storage / datastores
redis = { version = "1.8.1", default-features = false, features = ["aio", "tokio-comp", "tokio-rustls-comp", "tls-rustls-webpki-roots", "cluster-async"] }
etcd-client = { version = "0.21.1", features = ["tls"] }

rskafka = { version = "0.6", default-features = false, features = ["transport-tls"] }

# Crypto / encoding
base64 = "0.22"
flate2 = "1"
hex = "0.4"
sha1 = "0.10.6"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
crc32fast = "1.4"
subtle = "2"
# &mut-only cell that is Sync regardless of its payload; used for per-request
# streamed body handlers stored in the (Sync-required) request context.
sync_wrapper = "1"
tar = "0.4"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["use_pem", "aws_lc_rs"] }
zeroize = { version = "1", features = ["derive"] }

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
log = "0.4"
metrics = "0.24"
metrics-exporter-prometheus = "0.18"
metrics-util = { version = "0.20", features = ["debugging"] }
quanta = "=0.12.6"
opentelemetry      = { version = "0.33.1", default-features = false, features = ["logs"] }
opentelemetry_sdk  = { version = "0.33.1", default-features = false, features = ["logs"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["logs", "grpc-tonic"] }

# CLI / terminal
clap = { version = "4.5", features = ["derive", "env"] }
tabled = "0.22"
colored = "3.1.1"
console = "0.16"

# Memory allocators (made `optional` at the binary crates that set the allocator)
tikv-jemallocator = "0.6"
mimalloc = { version = "0.1", default-features = false }

# Utilities
bytes = "1.11.1"
zstd = { version = "0.14.3", default-features = false }
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
croner = "4.0.2"
time = { version = "0.3", features = ["std"] }
uuid = { version = "1.19", features = ["v4", "v7"] }
parking_lot = "0.12"
arc-swap = "1.8"
portable-atomic = "1.14"
dashmap = "6.1"
indexmap = "2"
rpds = "1.2.1"
smallvec = "1.15"
regex = "1.12"
regex-automata = "0.4"
url = "2"
rand = "0.9"
nom = "7"
notify = "8.2"
walkdir = "2"

# WebAssembly runtime for the Wasm HTTP plugin (proxy-wasm host)
wasmtime = { version = "49.0.5", default-features = false, features = [
    "anyhow",
    "async",
    "backtrace",
    "gc",
    "gc-copying",
    "gc-drc",
    "gc-null",
    "wat",
    "profiling",
    "parallel-compilation",
    "cranelift",
    "pooling-allocator",
    "demangle",
    "addr2line",
    "coredump",
    "debug-builtins",
    "runtime",
    "component-model",
    "component-model-async",
    "threads",
    "stack-switching",
    "std",
    "debug",
    "compile-time-builtins",
    "wit-parser",
] }
wasmparser = "=0.251.0"
# WAT text-format -> binary compiler; used by vm_manager tests to write raw
# .wasm bytes to disk for the file-source loader (wasmtime's own `wat`
# feature only covers `Module::new` taking text input, not raw bytes).
wat = "1"

# Async DNS resolver able to target a specific server (tokio::net::lookup_host
# cannot). default-features = false to avoid pulling a second TLS backend into
# the workspace TLS-backend unification; enable only the tokio runtime and
# system-config features.
hickory-resolver = { version = "0.26.1", default-features = false, features = ["tokio", "system-config"] }

# MaxMind GeoIP2/GeoLite2 MMDB reader (GeoIP country/city restriction feature).
# `mmap` feature enables `Reader::open_mmap` for zero-copy database loading.
# Pinned to >=0.27 (RUSTSEC-2025-0132: `open_mmap` was unsoundly marked safe
# below 0.27, since remapping while the file is modified on disk is UB).
maxminddb = { version = "0.30", features = ["mmap"] }
# Backs maxminddb's mmap feature; pinned explicitly since the gateway also
# opens the fixture directly via `open_mmap` in tests.
memmap2 = "0.9"

# Dev / test
tempfile = "3"
wiremock = "0.6"
mockall = "0.14.0"
proptest = "1"
expect-test = "1.5"

# Dedicated profile for shipped/release artifacts. Plain `release` stays lean so
# day-to-day dev, CI, and profiling iterate fast; only the final binaries built
# for distribution pay the LTO + single-codegen-unit cost. Build with
# `cargo build --profile production` (point the Dockerfile/release pipeline at it).
#
# `lto = "thin"`: cross-crate inlining (edgion ↔ pingora hot paths) at a fraction
#   of `fat` LTO's link time/memory.
# `codegen-units = 1`: whole-crate optimization (no intra-crate parallelism).
# `debug = 1`: keep line tables so production flamegraphs/perf still map to
#   source — note LTO inlining still merges frames; this only preserves symbols.
[profile.production]
inherits = "release"
lto = "thin"
codegen-units = 1
debug = 1

# TEMPORARY local development override for the Pingora fork admission-permit
# change. Remove once the fork commit is pushed and the lockfile is updated.
[patch."https://github.com/Pandaala/pingora.git"]
pingora-core = { path = "/Volumes/ExtStore/ws3/pingora/pingora-core" }
pingora-http = { path = "/Volumes/ExtStore/ws3/pingora/pingora-http" }
pingora-proxy = { path = "/Volumes/ExtStore/ws3/pingora/pingora-proxy" }
pingora-limits = { path = "/Volumes/ExtStore/ws3/pingora/pingora-limits" }
pingora-load-balancing = { path = "/Volumes/ExtStore/ws3/pingora/pingora-load-balancing" }
pingora-ketama = { path = "/Volumes/ExtStore/ws3/pingora/pingora-ketama" }
TinyUFO = { path = "/Volumes/ExtStore/ws3/pingora/tinyufo" }

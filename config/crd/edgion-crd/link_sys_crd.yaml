apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: linksys.edgion.io
spec:
  group: edgion.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: "LinkSys defines connections to external systems"
              required:
                - type
                - config
              properties:
                type:
                  type: string
                  description: "System type"
                  enum: ["redis", "etcd", "elasticsearch", "kafka", "webhook"]
                config:
                  type: object
                  description: "System-specific configuration"
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    # Common fields for all system types
                    endpoints:
                      type: array
                      description: "Server endpoints"
                      items:
                        type: string
                    # Redis/Etcd auth - simple secretRef (required when auth is present)
                    auth:
                      type: object
                      description: "Authentication configuration"
                      oneOf:
                        # Redis/Etcd style (simple secretRef)
                        - required: ["secretRef"]
                          properties:
                            secretRef:
                              type: object
                              description: "Secret reference for credentials (required)"
                              required: ["name"]
                              properties:
                                name:
                                  type: string
                                  description: "Name of the secret"
                                namespace:
                                  type: string
                                  description: "Namespace of the secret"
                              additionalProperties: false
                          additionalProperties: false
                        # Elasticsearch/Webhook style (tagged enum with type)
                        - required: ["type", "secretRef"]
                          properties:
                            type:
                              type: string
                              description: "Authentication type"
                              enum: ["basic", "apiKey", "bearer", "hmac"]
                            secretRef:
                              type: object
                              description: "Secret reference for credentials"
                              required: ["name"]
                              properties:
                                name:
                                  type: string
                                  description: "Name of the secret"
                                namespace:
                                  type: string
                                  description: "Namespace of the secret"
                              additionalProperties: false
                          additionalProperties: false
                    tls:
                      type: object
                      description: "TLS/SSL configuration"
                      properties:
                        enabled:
                          type: boolean
                          description: "Enable TLS"
                          default: false
                        insecureSkipVerify:
                          type: boolean
                          description: "Skip certificate verification (insecure)"
                        certs:
                          type: object
                          description: "TLS certificates; private key MUST be provided via secretRef (inline clientKey is rejected)"
                          properties:
                            caCert:
                              type: string
                              description: "CA certificate (PEM, public material)"
                            clientCert:
                              type: string
                              description: "Client certificate (PEM, public material)"
                            secretRef:
                              type: object
                              description: "Secret reference (kubernetes.io/tls or Opaque with tls.crt/tls.key/ca.crt keys)"
                              required: ["name"]
                              properties:
                                name:
                                  type: string
                                namespace:
                                  type: string
                              additionalProperties: false
                          additionalProperties: false
                    timeout:
                      type: object
                      description: "Timeout configuration (milliseconds)"
                      x-kubernetes-preserve-unknown-fields: true
                    # Redis specific
                    db:
                      type: integer
                      description: "Redis database number (0-15)"
                      format: int32
                    pool:
                      type: object
                      description: "Connection pool configuration"
                      properties:
                        size:
                          type: integer
                          format: int32
                        minIdle:
                          type: integer
                          format: int32
                    topology:
                      type: object
                      description: "Redis topology configuration"
                      properties:
                        mode:
                          type: string
                          enum: ["standalone", "sentinel", "cluster"]
                        sentinel:
                          type: object
                          properties:
                            masterName:
                              type: string
                            sentinels:
                              type: array
                              items:
                                type: string
                            password:
                              type: string
                        cluster:
                          type: object
                          properties:
                            readFromReplicas:
                              type: boolean
                            maxRedirects:
                              type: integer
                              format: int32
                    # Etcd specific
                    namespace:
                      type: string
                      description: "Etcd namespace prefix"
                    autoSyncInterval:
                      type: integer
                      description: "Auto-sync cluster members interval (seconds)"
                      format: int64
                    keepAlive:
                      type: object
                      description: "HTTP/2 keep-alive configuration"
                      properties:
                        time:
                          type: integer
                          format: int64
                        timeout:
                          type: integer
                          format: int64
                        permitWithoutStream:
                          type: boolean
                    # Webhook specific
                    uri:
                      type: string
                      description: "Webhook service URL"
                    requestMethod:
                      type: string
                      description: "HTTP method (GET, POST, etc.)"
                    timeoutMs:
                      type: integer
                      format: int64
                      description: "Request timeout in milliseconds"
                    observability:
                      type: object
                      description: "Observability configuration"
                      properties:
                        metrics:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                            labels:
                              type: object
                              additionalProperties:
                                type: string
                        logging:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                            level:
                              type: string
                            slowLogThreshold:
                              type: integer
                              format: int64
            status:
              type: object
              description: "Status of LinkSys"
              properties:
                conditions:
                  type: array
                  description: |
                    Gateway-API-style conditions:
                      - `Accepted` reflects spec validation.
                      - `ResolvedRefs` reflects whether all referenced Kubernetes
                        Secrets (auth + TLS) were successfully resolved by the
                        Controller. Extension reasons: `SecretNotFound`,
                        `MissingKeys`, `DecodeError`, `InvalidSecretType`; and
                        the standard `RefNotPermitted` for cross-namespace denial.
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
          description: "System type"
        - name: Endpoints
          type: string
          jsonPath: .spec.config.endpoints[0]
          description: "First endpoint"
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=='Accepted')].status
        - name: ResolvedRefs
          type: string
          jsonPath: .status.conditions[?(@.type=='ResolvedRefs')].status
          description: "Whether all referenced Secrets have been resolved"
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: linksys
    singular: linksys
    kind: LinkSys
    shortNames:
      - lsys

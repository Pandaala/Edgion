apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: linksys.edgion.io
spec:
  group: edgion.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: "LinkSys defines connections to external systems"
              required:
                - type
                - config
              properties:
                type:
                  type: string
                  description: "System type"
                config:
                  type: object
                  description: "System-specific configuration"
                  x-kubernetes-preserve-unknown-fields: true
                  properties:
                    # Common fields for all system types
                    endpoints:
                      type: array
                      description: "Provider server endpoints; Redis uses exactly one for standalone, one or more for cluster, and none for sentinel"
                      items:
                        type: string
                    # Redis/Etcd/OTLP auth - simple secretRef (required when auth is present)
                    auth:
                      type: object
                      description: "Authentication configuration"
                      # Structural schema: every field is declared once here; the
                      # oneOf below only narrows via required/not. Logical branches
                      # must not re-declare type/description, and a node cannot carry
                      # additionalProperties alongside properties.
                      properties:
                        type:
                          type: string
                          description: "Authentication type (elasticsearch style); omit for redis/etcd/otlp simple secretRef auth"
                          enum: ["basic", "apiKey", "bearer", "hmac"]
                        secretRef:
                          type: object
                          description: "Secret reference for credentials (required)"
                          required: ["name"]
                          properties:
                            group:
                              type: string
                              description: "API group of the referenced Secret; validated by the Controller"
                            kind:
                              type: string
                              description: "Referenced resource kind; validated by the Controller"
                            name:
                              type: string
                              description: "Name of the secret"
                            namespace:
                              type: string
                              description: "Namespace of the secret"
                        in:
                          type: string
                          description: "Injection location for apiKey auth"
                          enum: ["header", "query"]
                        headerName:
                          type: string
                          description: "Header name for apiKey header injection"
                        queryParam:
                          type: string
                          description: "Query parameter name for apiKey query injection"
                      oneOf:
                        # Redis/Etcd/OTLP style: secretRef only, no `type` discriminator
                        - required: ["secretRef"]
                          not:
                            required: ["type"]
                        # Elasticsearch style: tagged by `type`
                        - required: ["type", "secretRef"]
                    tls:
                      type: object
                      description: "TLS/SSL configuration"
                      properties:
                        enabled:
                          type: boolean
                          description: "Enable TLS"
                          default: false
                        verify:
                          type: boolean
                          description: "Verify the peer TLS certificate (default true). verify: false is honored (operator responsibility); a WARN is logged at startup. Redis, Etcd and OTLP always verify — verify: false is rejected at startup for them (the SDK has no skip-verify API)."
                        validation:
                          type: object
                          description: "CA trust configuration for outbound TLS connections"
                          properties:
                            caCertificateRefs:
                              type: array
                              description: "References to CA certificate resources (Secret or ConfigMap)"
                              items:
                                type: object
                                properties:
                                  group:
                                    type: string
                                    description: "Group of the referent; defaults to empty string (core)"
                                  kind:
                                    type: string
                                    description: "Kind of the referent; e.g. Secret or ConfigMap"
                                  name:
                                    type: string
                                    description: "Name of the referent"
                                  namespace:
                                    type: string
                                    description: "Namespace of the referent. Cross-namespace refs require a ReferenceGrant"
                                required: [kind, name]
                            wellKnownCACertificates:
                              type: string
                              description: "Use well-known system CA certificates (e.g. Mozilla roots)"
                              enum: [System]
                            hostname:
                              type: string
                              description: "Optional SNI override and default SAN check hostname"
                            subjectAltNames:
                              type: array
                              description: "Subject alternative names to verify in the server certificate"
                              items:
                                type: object
                                properties:
                                  type:
                                    type: string
                                    description: "SAN type"
                                    enum: [Hostname, URI]
                                  hostname:
                                    type: string
                                    description: "Hostname SAN value (used when type is Hostname)"
                                  uri:
                                    type: string
                                    description: "URI SAN value (used when type is URI)"
                                required: [type]
                        clientCertificateRef:
                          type: object
                          description: "Reference to a kubernetes.io/tls Secret for mTLS client identity"
                          properties:
                            group:
                              type: string
                              description: "Group of the referent; defaults to empty string (core)"
                            kind:
                              type: string
                              description: "Kind of the referent; defaults to Secret"
                            name:
                              type: string
                              description: "Name of the referent"
                            namespace:
                              type: string
                              description: "Namespace of the referent. Cross-namespace refs require a ReferenceGrant"
                          required: [name]
                    timeout:
                      type: object
                      description: "Provider timeout configuration"
                      x-kubernetes-preserve-unknown-fields: true
                    # Redis specific
                    db:
                      type: integer
                      description: "Redis database number (0-255)"
                      format: int32
                    pool:
                      type: object
                      description: "Connection pool configuration"
                      x-kubernetes-preserve-unknown-fields: true
                      properties:
                        size:
                          type: integer
                          format: int32
                    topology:
                      type: object
                      description: "Redis topology configuration"
                      properties:
                        mode:
                          type: string
                          enum: ["standalone", "sentinel", "cluster"]
                        sentinel:
                          type: object
                          properties:
                            masterName:
                              type: string
                            sentinels:
                              type: array
                              description: "One or more Redis Sentinel endpoints"
                              items:
                                type: string
                        cluster:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                          properties:
                            maxRedirects:
                              type: integer
                              format: int32
                    # Etcd specific
                    namespace:
                      type: string
                      description: "Etcd namespace prefix"
                    autoSyncInterval:
                      type: integer
                      description: "Auto-sync cluster members interval (seconds)"
                      format: int64
                      minimum: 0
                      maximum: 86400
                    maxCallSendSize:
                      type: integer
                      minimum: 1
                      maximum: 67108864
                      description: "Etcd protobuf bytes per outgoing message, checked before encoding"
                    maxCallRecvSize:
                      type: integer
                      minimum: 1
                      maximum: 67108864
                      description: "Etcd protobuf bytes per incoming message, checked from the gRPC envelope before payload accumulation"
                    userAgent:
                      type: string
                      minLength: 1
                      maxLength: 256
                      pattern: '^[ -~]+$'
                    rejectOldCluster:
                      type: boolean
                      description: "When true, requires minClusterVersion and checks every physical connection"
                    minClusterVersion:
                      type: string
                      pattern: '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
                      description: "Stable major.minor.patch floor; only valid with rejectOldCluster true"
                    keepAlive:
                      type: object
                      description: "HTTP/2 keep-alive configuration"
                      properties:
                        time:
                          type: integer
                          format: int64
                          minimum: 1
                          maximum: 86400
                        timeout:
                          type: integer
                          format: int64
                          minimum: 1
                          maximum: 86400
                        permitWithoutStream:
                          type: boolean
                    # Webhook specific
                    uri:
                      type: string
                      description: "Webhook service URL"
                    timeoutMs:
                      type: integer
                      format: int64
                      description: "Request timeout in milliseconds"
                    observability:
                      type: object
                      description: "Observability configuration"
                      properties:
                        metrics:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                            labels:
                              type: object
                              additionalProperties:
                                type: string
                        logging:
                          type: object
                          properties:
                            enabled:
                              type: boolean
                            level:
                              type: string
                            slowLogThreshold:
                              type: integer
                              format: int64
            status:
              type: object
              description: "Status of LinkSys"
              properties:
                controllers:
                  type: array
                  maxItems: 32
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys:
                    - controllerName
                  items:
                    type: object
                    required: [controllerName, status]
                    properties:
                      controllerName:
                        type: string
                        minLength: 1
                      status:
                        type: object
                        properties:
                          conditions:
                            type: array
                            description: Gateway API Accepted and ResolvedRefs conditions.
                            x-kubernetes-list-type: map
                            x-kubernetes-list-map-keys:
                              - type
                            items:
                              type: object
                              required:
                                - type
                              properties:
                                type:
                                  type: string
                                status:
                                  type: string
                                lastTransitionTime:
                                  type: string
                                  format: date-time
                                reason:
                                  type: string
                                message:
                                  type: string
                                observedGeneration:
                                  type: integer
                                  format: int64
                          observedGeneration:
                            type: integer
                            format: int64
                          credentialState:
                            type: string
                            enum: [Idle, Valid, Expired, Unavailable]
                          publishedGeneration:
                            type: string
                          issuedAt:
                            type: string
                            format: date-time
                          validUntil:
                            type: string
                            format: date-time
                          lastSuccessfulRefreshTime:
                            type: string
                            format: date-time
                          nextRefreshTime:
                            type: string
                            format: date-time
                          desiredConsumerCount:
                            type: integer
                            format: int32
                            minimum: 0
                          publishedConsumerCount:
                            type: integer
                            format: int32
                            minimum: 0
                          conflictedConsumerCount:
                            type: integer
                            format: int32
                            minimum: 0
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.type
          description: "System type"
        - name: Endpoints
          type: string
          jsonPath: .spec.config.endpoints[0]
          description: "First endpoint"
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: linksys
    singular: linksys
    kind: LinkSys
    shortNames:
      - lsys

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: edgiongatewayclassconfigs.edgion.io
spec:
  group: edgion.io
  names:
    kind: EdgionGatewayConfig
    listKind: EdgionGatewayConfigList
    plural: edgiongatewayclassconfigs
    singular: edgiongatewayclassconfig
    shortNames:
      - edgwcfg
  scope: Cluster
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                downstreamTls:
                  type: object
                  properties:
                    minTlsVersion:
                      type: string
                      enum: [TLS1_0, TLS1_1, TLS1_2, TLS1_3]
                      description: "Default minimum TLS version; EdgionTls may override. TLS1_0/TLS1_1 are deprecated opt-ins."
                    ciphers:
                      type: array
                      description: "Default OpenSSL cipher expressions (TLS 1.2 and earlier); EdgionTls replaces this list. Empty selects backend defaults, including under FIPS policy."
                      items:
                        type: string
                    ecdhCurves:
                      type: array
                      minItems: 1
                      maxItems: 4
                      x-kubernetes-validations:
                        - rule: "self.all(c, self.filter(x, x == c).size() == 1)"
                          message: "ecdhCurves must not contain duplicates"
                      items:
                        type: string
                        maxLength: 6
                        enum: [X25519, P-256, P-384, P-521]

                # ============================================
                # Server Configuration
                # ============================================
                server:
                  type: object
                  description: "GatewayClass-scoped HTTP server behavior"
                  properties:
                    enableCompression:
                      type: boolean
                      description: "Enable downstream response compression (default: false)"
                      default: false
                    downstreamKeepaliveRequestLimit:
                      type: integer
                      description: "Maximum requests a downstream HTTP/1 connection serves before close (default 10000; 0 means unlimited)"
                      format: int32
                      default: 10000

                # ============================================
                # HTTP Timeout Configuration
                # ============================================
                httpTimeout:
                  type: object
                  description: "HTTP timeout configuration"
                  properties:
                    client:
                      type: object
                      description: "Client-side timeout settings"
                      properties:
                        readTimeout:
                          type: string
                          description: "Timeout for reading request from client (e.g., '60s', '1m')"
                          default: "60s"
                          pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                        writeTimeout:
                          type: string
                          description: "Timeout for writing response to client"
                          default: "60s"
                          pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                        keepaliveTimeout:
                          type: string
                          description: "HTTP keepalive timeout"
                          default: "75s"
                          pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                    backend:
                      type: object
                      description: "Backend-side timeout settings"
                      properties:
                        defaultConnectTimeout:
                          type: string
                          description: "Timeout for connecting to upstream backend"
                          default: "5s"
                          pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                        defaultRequestTimeout:
                          type: string
                          description: "Total request timeout including retries"
                          default: "60s"
                          pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                        defaultIdleTimeout:
                          type: string
                          description: "Idle timeout for backend connection pool"
                          default: "300s"
                          pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"

                # ============================================
                # Retry Policy
                # ============================================
                retry:
                  type: object
                  description: "GatewayClass-wide retry defaults"
                  properties:
                    attempts:
                      type: integer
                      description: "Maximum retries after the initial upstream attempt (default: 2)"
                      format: int32
                      minimum: 0
                      maximum: 2147483647
                      default: 2

                # ============================================
                # Real IP Configuration
                # ============================================
                realIp:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                  description: "Real IP extraction through referenced IpLists; removed or unknown fields fail closed."
                  required:
                    - trustedIpRefs
                  properties:
                    trustedIpRefs:
                      type: array
                      minItems: 1
                      description: "Ordered trusted proxy IpLists. Global references require explicit namespaces and current Cluster visibility."
                      items:
                        type: object
                        required:
                          - name
                          - namespace
                        properties:
                          name:
                            type: string
                          namespace:
                            type: string
                    realIpHeader:
                      type: string
                      description: "Header to extract real IP from (default: 'X-Forwarded-For')"
                      default: "X-Forwarded-For"
                      pattern: "^[A-Za-z0-9!#$%&'*+\\-.^_`|~]+$"
                      maxLength: 256
                    recursive:
                      type: boolean
                      description: "Walk X-Forwarded-For right-to-left skipping trusted proxies (default true)"
                      default: true
                    maxTrustedHops:
                      type: integer
                      description: "Cap on trusted proxy hops to traverse when resolving the real IP"
                      format: int32

                # ============================================
                # Upstream Forwarded Header Configuration
                # ============================================
                forwardedHeaders:
                  type: object
                  description: "Gateway-owned headers sent to upstream requests"
                  properties:
                    remoteIpHeader:
                      type: string
                      description: "Header receiving the final resolved RemoteIp on upstream requests"
                      pattern: "^[A-Za-z0-9!#$%&'*+\\-.^_`|~]+$"
                      maxLength: 256
                      default: "X-Real-IP"

                # ============================================
                # Security Protection Configuration
                # ============================================
                securityProtect:
                  type: object
                  description: "Security protection configuration"
                  properties:
                    xForwardedForLimit:
                      type: integer
                      description: "Maximum length of X-Forwarded-For header in bytes (default: 200)"
                      format: int64
                      default: 200
                    requireSniHostMatch:
                      type: boolean
                      description: "Require SNI and Host header to match for HTTPS requests (default: true)"
                      default: true
                    fallbackSni:
                      type: string
                      description: "Fallback SNI hostname when client doesn't provide SNI"
                    tlsProxyLogRecord:
                      type: boolean
                      description: "Enable TLS proxy connection logging (default true)"
                      default: true
                    allowLoopbackUpstream:
                      type: boolean
                      description: "Allow loopback upstream addresses for this Gateway (default false)"
                      default: false
                waf:
                  type: object
                  description: "Policy for optional expensive WAF checks; normal inspection remains enabled"
                  properties:
                    expensiveChecks:
                      type: boolean
                      default: false
                      description: "Enable classified checks that retain cross-field aggregate records"

                requestBody:
                  type: object
                  description: "GatewayClass-wide request-body buffering policy."
                  properties:
                    enabled:
                      type: boolean
                      default: true
                      description: "Runtime capture switch. A body-capable binary still refuses capture when false."
                    maxBodySize:
                      type: string
                      default: "32MiB"
                      description: "Hard ceiling on the original request entity payload."
                    storage:
                      type: object
                      properties:
                        memoryLimit:
                          type: string
                          default: "128KiB"
                          description: "Resident payload threshold before optional disk spill."
                        spillToDisk:
                          type: boolean
                          default: true
                          description: "Allow disk spill above memoryLimit."
                        maxBufferedSize:
                          type: string
                          description: "New capture owner capacity; omission inherits maxBodySize."
                        operationTimeout:
                          type: string
                          default: "5s"
                          pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                          description: "Non-zero deadline for admission plus execution of one storage operation."

                # ============================================
                # Plugin Execution Policy
                # ============================================
                pluginPolicy:
                  type: object
                  description: "GatewayClass-scoped plugin execution policy, dynamically applied by the Gateway."
                  properties:
                    allow:
                      type: array
                      description: "Exact qualified names permitted to execute. Presence enables allow-list mode; an empty list restricts every plugin."
                      items:
                        type: string
                    deny:
                      type: array
                      default: []
                      description: "Exact-name restrictions; deny takes precedence over allow."
                      items:
                        type: object
                        required: [name]
                        properties:
                          name:
                            type: string
                            description: "Case-sensitive qualified plugin name: http/Type, stream/Type, or tls-route/Type."
                          action:
                            type: string
                            enum: [block, bypass]
                            description: "Optional override of deniedAction."
                          blockStatus:
                            type: integer
                            minimum: 400
                            maximum: 599
                            description: "Optional override of blockStatus; forbidden for an effective bypass action."
                    defaultAction:
                      type: string
                      enum: [allow, deny]
                      default: allow
                      description: "Unmatched-name action when no allow list is configured."
                    deniedAction:
                      type: string
                      enum: [block, bypass]
                      default: block
                      description: "Execution behavior for restricted plugins unless an entry overrides it."
                    blockStatus:
                      type: integer
                      minimum: 400
                      maximum: 599
                      default: 503
                      description: "Default HTTP status for block actions; stream stages ignore it."

                # ============================================
                # Global Plugins Reference
                # ============================================
                globalPluginsRef:
                  type: array
                  description: "Global plugins references that apply to all routes using this GatewayClass"
                  items:
                    type: object
                    required:
                      - name
                    properties:
                      name:
                        type: string
                        description: "Name of the EdgionPlugins resource"
                        minLength: 1
                      namespace:
                        type: string
                        description: "Namespace of the EdgionPlugins resource (defaults to 'default')"

                # ============================================
                # Access Log Extension Policy (masking whitelist)
                # ============================================
                accessLogExtern:
                  type: object
                  description: "Access log extension policy: which keys bypass masking"
                  properties:
                    unmaskedKeys:
                      type: object
                      description: >-
                        Per-source lists of keys logged in clear. Everything else is
                        masked per the gateway's access_log_sensitive.mode. Header
                        names match case-insensitively; query/cookie/ctx names are
                        case-sensitive.
                      properties:
                        header:
                          type: array
                          items:
                            type: string
                        respHeader:
                          type: array
                          items:
                            type: string
                        query:
                          type: array
                          items:
                            type: string
                        cookie:
                          type: array
                          items:
                            type: string
                        ctx:
                          type: array
                          items:
                            type: string

                # ============================================
                # Preflight Policy Configuration
                # ============================================
                preflightPolicy:
                  type: object
                  description: "Preflight request handling policy"
                  properties:
                    mode:
                      type: string
                      description: "Preflight detection mode"
                      enum: ["cors-standard", "all-options"]
                      default: "cors-standard"
                    statusCode:
                      type: integer
                      description: "Status code to return when no CORS plugin is configured (default: 204)"
                      format: int32
                      default: 204
                      minimum: 200
                      maximum: 599

                tcpTimeout:
                  type: object
                  description: "Timeout configuration for L4 TCP-transport relays"
                  properties:
                    idleTimeout:
                      type: string
                      description: "Idle timeout for the established L4 relay (default 1h; '0'/'0s' disables)"
                      default: "1h"
                      pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                    connectTimeout:
                      type: string
                      description: "Upper bound for establishing the upstream TCP connection (default 10s; '0'/'0s' disables)"
                      default: "10s"
                      pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                loadBalancing:
                  type: object
                  description: "Gateway-wide load-balancing configuration"
                  properties:
                    degradeThreshold:
                      type: integer
                      description: "Degrade threshold percent (0-100); 0 disables degrade mode"
                      format: int32
                      default: 0
                      minimum: 0
                      maximum: 100
                linkSys:
                  type: object
                  description: "Global LinkSys provider configuration"
                  properties:
                    webhookMaxResponseBytes:
                      type: integer
                      description: "Global hard cap for webhook response body size in bytes (default 16384)"
                      format: int64
                      default: 16384
                    maxInstancesPerKind:
                      type: integer
                      description: "Max current registered persistent LinkSys instances per provider kind (default 200). Pending keys are retried after removal or a cap increase; updates and deletes proceed without waiting for old cleanup."
                      format: int64
                      default: 200
                      minimum: 1
                      maximum: 10000
                outboundTls:
                  type: object
                  description: "Cluster-wide default for plugin / LinkSys outbound TLS"
                  properties:
                    verify:
                      type: boolean
                      description: "Global default for outbound TLS peer verification; defaults to true"
                    validation:
                      type: object
                      description: "CA trust configuration for outbound TLS connections"
                      properties:
                        caCertificateRefs:
                          type: array
                          description: "References to CA certificate resources (Secret or ConfigMap)"
                          items:
                            type: object
                            properties:
                              group:
                                type: string
                                description: "Group of the referent; defaults to empty string (core)"
                                maxLength: 253
                                pattern: '^$|^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                              kind:
                                type: string
                                description: "Kind of the referent; e.g. Secret or ConfigMap"
                                minLength: 1
                                maxLength: 63
                                pattern: '^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$'
                              name:
                                type: string
                                description: "Name of the referent"
                                minLength: 1
                                maxLength: 253
                              namespace:
                                type: string
                                description: "Namespace of the referent. Required for cluster-scoped EGC; missing namespace is invalid"
                                minLength: 1
                                maxLength: 63
                                pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?$'
                            required: [kind, name, namespace]
                        wellKnownCACertificates:
                          type: string
                          description: "Use well-known system CA certificates (e.g. Mozilla roots)"
                          enum: [System]
                        hostname:
                          type: string
                          description: "Optional SNI override and default SAN check hostname"
                          maxLength: 253
                          pattern: '^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                        subjectAltNames:
                          type: array
                          description: "Subject alternative names to verify in the server certificate"
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                description: "SAN type"
                                enum: [Hostname, URI]
                              hostname:
                                type: string
                                description: "Hostname SAN value (used when type is Hostname)"
                                maxLength: 253
                                pattern: '^(\*\.)?[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$'
                              uri:
                                type: string
                                description: "URI SAN value (used when type is URI)"
                            required: [type]
                    clientCertificateRef:
                      type: object
                      description: "Reference to a kubernetes.io/tls Secret for mTLS client identity"
                      properties:
                        group:
                          type: string
                          description: "Group of the referent; defaults to empty string (core)"
                        kind:
                          type: string
                          description: "Kind of the referent; defaults to Secret"
                        name:
                          type: string
                          description: "Name of the referent"
                        namespace:
                          type: string
                          description: "Namespace of the referent"
                      required: [name, namespace]
                dnsResolver:
                  type: object
                  description: "Data-plane default DNS policy for ExternalName and AI hostname backends"
                  properties:
                    lookupFamily:
                      type: string
                      enum: [ipv4Only, ipv6Only, all]
                      default: ipv4Only
                      description: "Requested backend address families, independently inherited from resolver selection"
                    linkSysRef:
                      type: object
                      description: "Reference to an httpdns LinkSys resource (namespace required; cluster-scoped EGC)"
                      properties:
                        namespace:
                          type: string
                          description: "Namespace of the httpdns LinkSys resource"
                        name:
                          type: string
                          description: "Name of the httpdns LinkSys resource"
                      required: [namespace, name]
                    servers:
                      type: array
                      description: "Inline standard-DNS server list (ip[:port]); mutually exclusive with linkSysRef"
                      items:
                        type: string
                    cacheTtl:
                      type: string
                      description: "Data-plane resolution cache TTL (default 5s)"
                      default: "5s"
                      pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"

            status:
              type: object
              description: "Status of the gateway config"
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

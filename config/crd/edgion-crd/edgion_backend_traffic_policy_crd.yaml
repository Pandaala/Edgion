apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: edgionbackendtrafficpolicies.edgion.io
spec:
  group: edgion.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: "Per-destination traffic policy (load-balancing algorithm, active health check, outlier detection, panic threshold) attached to Services via targetRefs"
              required:
                - targetRefs
              properties:
                targetRefs:
                  type: array
                  description: "Services this policy attaches to (same namespace as the policy)"
                  items:
                    type: object
                    required:
                      - kind
                      - name
                    properties:
                      group:
                        type: string
                        description: "Group of the referent. Empty string (default) = core API group"
                      kind:
                        type: string
                        description: "Kind of the referent. v1 supports only \"Service\""
                      name:
                        type: string
                        description: "Name of the referent Service (same namespace as the policy)"
                loadBalancer:
                  type: object
                  description: "Load-balancing algorithm and panic threshold"
                  required:
                    - type
                  properties:
                    type:
                      type: string
                      description: "Algorithm. RoundRobin is the engine default"
                      enum: ["RoundRobin", "LeastConn", "Ewma", "ConsistentHash"]
                    consistentHash:
                      type: object
                      description: "Required iff type == ConsistentHash"
                      required:
                        - hashOn
                      properties:
                        hashOn:
                          type: string
                          enum: ["header", "cookie", "queryParam", "sourceIp"]
                        key:
                          type: string
                          description: "Header/cookie/query-param name to hash on. Omit for sourceIp (conditional validation runs at controller ingest)."
                    panicThreshold:
                      type: integer
                      description: "Percent 0-100. Overrides the global EdgionGatewayConfig.spec.loadBalancing.panicThreshold for the target"
                      minimum: 0
                      maximum: 100
                healthCheck:
                  type: object
                  description: "Active health check (probe) configuration"
                  properties:
                    active:
                      type: object
                      description: "Active health check configuration (periodic probing)"
                      properties:
                        type:
                          type: string
                          description: "Probe type: \"http\" (default), \"tcp\", or \"grpc\""
                          enum: ["http", "tcp", "grpc"]
                          default: "http"
                        path:
                          type: string
                          description: "HTTP request path for health check. Default: \"/\""
                          default: "/"
                        port:
                          type: integer
                          description: "Optional health check port override"
                          minimum: 1
                          maximum: 65535
                        interval:
                          type: string
                          description: "Interval between probes (e.g. \"10s\", \"1m\")"
                          default: "10s"
                          pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                        timeout:
                          type: string
                          description: "Probe timeout (e.g. \"3s\", \"500ms\")"
                          default: "3s"
                          pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                        healthyThreshold:
                          type: integer
                          description: "Consecutive successes before marking healthy"
                          minimum: 0
                          default: 2
                        unhealthyThreshold:
                          type: integer
                          description: "Consecutive failures before marking unhealthy"
                          minimum: 0
                          default: 3
                        expectedStatuses:
                          type: array
                          description: "Expected healthy HTTP status codes"
                          items:
                            type: integer
                            minimum: 0
                            maximum: 65535
                          default: [200]
                        host:
                          type: string
                          description: "Optional Host header override for HTTP checks"
                        grpcServiceName:
                          type: string
                          description: |
                            gRPC Health Check service name. Empty string (default) checks the
                            overall server health. Only used when type is "grpc".
                outlierDetection:
                  type: object
                  description: "Outlier detection (passive ejection) configuration"
                  properties:
                    consecutiveErrors:
                      type: integer
                      description: "Consecutive application-5xx (any >=500 that is NOT 502/503/504) before ejection"
                      minimum: 0
                      default: 5
                    consecutiveGatewayErrors:
                      type: integer
                      description: |
                        Consecutive upstream-origin gateway failures (backend returned
                        502/503/504) before ejection. Defaults to consecutiveErrors when unset
                        (sibling-dependent default resolved by the gateway, not declared here).
                      minimum: 0
                    consecutiveLocalOriginFailures:
                      type: integer
                      description: |
                        Consecutive local-origin failures (connect/TLS-handshake/transport-reset/
                        proxy errors) before ejection. Defaults to consecutiveGatewayErrors when
                        unset (sibling-dependent default resolved by the gateway, not declared here).
                      minimum: 0
                    ejectionTime:
                      type: string
                      description: "Base ejection duration (GEP-2257 duration, multiplied by the endpoint's ejection count)"
                      default: "30s"
                      pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                    maxEjectionTime:
                      type: string
                      description: |
                        Upper bound on the backoff-scaled ejection duration (GEP-2257 duration).
                        Defaults to max("5m", ejectionTime) when unset (sibling-dependent
                        default resolved by the gateway, not declared here).
                      pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                    maxEjectionPercent:
                      type: integer
                      description: "Max percent of a service's endpoints that may be ejected at once (0 disables the cap)"
                      minimum: 0
                      default: 50
                upstreamAuthority:
                  type: object
                  description: >-
                    Dynamic upstream authority (Host + SNI) within a wildcard pattern this
                    backend declares. The connection stays pinned to the Service's endpoints;
                    only the authority varies.
                  required:
                    - pattern
                    - template
                  properties:
                    pattern:
                      type: string
                      description: Wildcard pattern, exactly one leading '*.' label (e.g. '*.sandbox.internal').
                    template:
                      type: string
                      description: >-
                        Per-request template for the wildcard label. Its literal tail must equal
                        the pattern's suffix and its dynamic slot must contain no literal '.'
                        (e.g. '${ctx:tenant}.sandbox.internal').
                    healthCheckHost:
                      type: string
                      description: >-
                        Static authority for active health probes. Required when healthCheck.active
                        is set. Must match `pattern`.
                retryConstraint:
                  type: object
                  description: "Retry budget: caps retry volume as a percentage of request volume, with a floor rate so low-traffic backends can still retry"
                  properties:
                    budget:
                      type: object
                      description: "Percentage budget on retry volume"
                      default:
                        percent: 20
                        interval: "10s"
                      properties:
                        percent:
                          type: integer
                          description: "Max retries as a percentage of total attempts, 0-100"
                          minimum: 0
                          maximum: 100
                          default: 20
                        interval:
                          type: string
                          description: "Sliding window over which the percentage is computed (GEP-2257 duration)"
                          pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                          default: "10s"
                    minRetryRate:
                      type: object
                      description: >-
                        Floor so low-traffic backends can still retry when the percentage budget
                        rounds to ~0. Always present; the operator can tune it via count/interval
                        but cannot disable it.
                      default:
                        count: 10
                        interval: "1s"
                      required:
                        - count
                        - interval
                      properties:
                        count:
                          type: integer
                          description: "Retries allowed per interval regardless of the percentage budget"
                          minimum: 1
                          maximum: 1000000
                        interval:
                          type: string
                          description: "Window over which count is measured (GEP-2257 duration), independent of budget.interval"
                          pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
                circuitBreaker:
                  type: object
                  description: "Circuit breaker: per-endpoint hard cap on concurrent in-flight requests. Absent = no concurrency cap"
                  required:
                    - maxParallelRequests
                  properties:
                    maxParallelRequests:
                      type: integer
                      format: int32
                      description: >-
                        Max concurrent in-flight requests to a single backend ENDPOINT (one pod).
                        Excess requests are shed with a non-retrying 503 rather than queued. This
                        is a PER-ENDPOINT cap: a service with N ready endpoints admits up to
                        N * maxParallelRequests concurrently. Must be >= 1.
                      minimum: 1
                connection:
                  type: object
                  description: >-
                    Per-backend connection tuning override. HTTP upstream connections only:
                    stream (TCPRoute/TLSRoute) backends use tcpTimeout.connectTimeout and
                    ignore this block.
                  properties:
                    connectTimeout:
                      type: string
                      description: >-
                        Per-backend gateway->backend connection-establishment deadline
                        (GEP-2257 duration), overriding
                        EdgionGatewayConfig.spec.httpTimeout.backend.defaultConnectTimeout
                        for the targeted Services. Must be in (0s, 1h].
                      pattern: "^([0-9]{1,5}(h|m|s|ms)){1,4}$"
            status:
              type: object
              properties:
                ancestors:
                  type: array
                  maxItems: 16
                  description: >-
                    GEP-2648 per-ancestor policy status. One entry per ancestor
                    Gateway whose routes reach a target Service, stamped with the
                    writing controller's name.
                  items:
                    type: object
                    required:
                      - ancestorRef
                      - controllerName
                    properties:
                      ancestorRef:
                        type: object
                        required:
                          - name
                        properties:
                          group:
                            type: string
                          kind:
                            type: string
                          namespace:
                            type: string
                          name:
                            type: string
                          sectionName:
                            type: string
                          port:
                            type: integer
                            format: int32
                      controllerName:
                        type: string
                      conditions:
                        type: array
                        description: "Gateway-API-style conditions for this ancestor"
                        items:
                          type: object
                          properties:
                            type:
                              type: string
                            status:
                              type: string
                            lastTransitionTime:
                              type: string
                              format: date-time
                            reason:
                              type: string
                            message:
                              type: string
                            observedGeneration:
                              type: integer
                              format: int64
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: TargetRef
          type: string
          jsonPath: .spec.targetRefs[0].name
          description: First target Service name
        - name: LBType
          type: string
          jsonPath: .spec.loadBalancer.type
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: edgionbackendtrafficpolicies
    singular: edgionbackendtrafficpolicy
    kind: EdgionBackendTrafficPolicy
    shortNames:
      - ebtp

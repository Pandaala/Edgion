apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: edgionplugins.edgion.io
spec:
  group: edgion.io
  names:
    kind: EdgionPlugins
    listKind: EdgionPluginsList
    plural: edgionplugins
    singular: edgionplugins
    shortNames:
      - eplugins
  scope: Namespaced
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              description: "EdgionPlugins specification"
              properties:
                # ============================================
                # Request Stage Plugins (async)
                # ============================================
                requestPlugins:
                  type: array
                  description: "Request stage plugins (async)"
                  items:
                    type: object
                    properties:
                      enable:
                        type: boolean
                        description: "Whether this plugin is enabled (default: true)"
                        default: true
                      alias: &aliasSchema
                        # Charset (^[a-zA-Z0-9._-]{1,32}$) is enforced by the
                        # runtime preparse validator and surfaced as
                        # Accepted=False/Invalid on the resource status.
                        # The CRD only enforces length so that semantic alias
                        # errors flow through the same operator-feedback path
                        # as other plugin-config errors (rate=0, bad regex,
                        # allowCredentials+wildcard, etc.) instead of being
                        # rejected at apply-time without status visibility.
                        type: string
                        description: "Optional operator-defined label echoed into PluginLog.alias for distinguishing multiple entries of the same plugin type in the access log (charset ^[a-zA-Z0-9._-]{1,32}$ enforced at preparse)"
                        maxLength: 32
                        minLength: 1
                      # --- conditionEnable: define anchor here, reuse below ---
                      conditionEnable: &conditionEnableSchema
                        type: object
                        description: "Simple conditional enable (legacy)"
                        properties:
                          timeBefore:
                            type: string
                            description: "Plugin enabled before this time (RFC3339)"
                      # --- conditions: define anchor here, reuse below ---
                      conditions: &conditionsSchema
                        type: object
                        description: "Advanced plugin conditions for conditional execution"
                        properties:
                          skip: &conditionSetSchema
                            type: object
                            description: "A bounded condition set with one explicit Boolean operator"
                            properties:
                              allOf:
                                type: array
                                description: "Atomic conditions combined with AND"
                                items: &conditionSchema
                                  type: object
                                  description: "A single condition (tagged union with 'type' field)"
                                  required: [type]
                                  properties:
                                    type:
                                      type: string
                                      description: "Condition type"
                                      enum: [keyExist, keyMatch, timeRange, probability, directPeerIpMatch, remoteIpMatch, secretMatch, hmacAuth, jwtClaimMatch, mtlsMatch]
                                    key: &keyGetSchema
                                      type: object
                                      description: "Key accessor (KeyGet) - source for reading values"
                                      properties:
                                        type:
                                          type: string
                                          description: "Key source type"
                                          enum: [remoteIp, header, cookie, query, path, method, ctx, remoteIpAndPath, requestPath]
                                        name:
                                          type: string
                                          description: "Key name (required for header, cookie, query, ctx)"
                                    values:
                                      type: array
                                      description: "Exact values to match (keyMatch)"
                                      items:
                                        type: string
                                    regex:
                                      type: array
                                      description: "Regex patterns to match (keyMatch)"
                                      items:
                                        type: string
                                    caseSensitive:
                                      type: boolean
                                      description: "Case sensitivity for exact values (default true; regex uses (?i) if needed)"
                                    negate:
                                      type: boolean
                                      description: "Invert the condition result after the missing-value check (default false)"
                                    after:
                                      type: string
                                      description: "Time after which condition is true (RFC3339)"
                                    before:
                                      type: string
                                      description: "Time before which condition is true (RFC3339)"
                                    ratio:
                                      type: number
                                      description: "Probability ratio 0.0-1.0"
                                      minimum: 0.0
                                      maximum: 1.0
                                    ips:
                                      type: array
                                      description: "Inline IPs or CIDRs (directPeerIpMatch / remoteIpMatch)"
                                      items:
                                        type: string
                                    ipRefs:
                                      type: array
                                      description: "EdgionConfigData IpList references (directPeerIpMatch / remoteIpMatch)"
                                      items:
                                        type: object
                                        x-kubernetes-preserve-unknown-fields: true
                                    secretRef:
                                      type: object
                                      description: "Secret reference (secretMatch)"
                                      x-kubernetes-preserve-unknown-fields: true
                                    secretKey:
                                      type: string
                                      description: "Exact Secret data key to compare (secretMatch)"
                                    secretGroups:
                                      type: array
                                      description: "HMAC credential Secret groups (hmacAuth)"
                                      items:
                                        type: object
                                        x-kubernetes-preserve-unknown-fields: true
                                    algorithms:
                                      type: array
                                      description: "Allowed HMAC algorithms (hmacAuth)"
                                      items:
                                        type: string
                                    clockSkew:
                                      type: integer
                                      description: "Maximum HMAC clock skew in seconds (hmacAuth)"
                                    enforceHeaders:
                                      type: array
                                      description: "Headers that must appear in the signed header list (hmacAuth)"
                                      items:
                                        type: string
                                    validateRequestBody:
                                      type: boolean
                                      description: "Verify the request body digest (hmacAuth). Valid only inside RequestAccessPolicy conditions or RequestRestriction."
                                    minSecretLength:
                                      type: integer
                                      description: "Minimum HMAC secret length in bytes (hmacAuth)"
                                    secretField:
                                      type: string
                                      description: "Credential field name for the HMAC secret (hmacAuth)"
                                    usernameField:
                                      type: string
                                      description: "Credential field name for the HMAC username (hmacAuth)"
                                    claim:
                                      type: string
                                      description: "Dot-nested JWT claim path (jwtClaimMatch)"
                                    field:
                                      type: string
                                      description: "mTLS certificate field (mtlsMatch): subject, cn, or san"
                                      enum: [subject, cn, san]
                                    sanType:
                                      type: string
                                      description: "SAN type filter for mtlsMatch field san (DNS, URI, Email)"
                                      enum: [DNS, URI, Email]
                              anyOf:
                                type: array
                                description: "Alternatives combined with OR; an alternative is atomic or one allOf group"
                                items: &anyOfClauseSchema
                                  type: object
                                  description: "An atomic condition or a named one-level allOf group"
                                  properties:
                                    type:
                                      type: string
                                      description: "Condition type"
                                      enum: [keyExist, keyMatch, timeRange, probability, directPeerIpMatch, remoteIpMatch, secretMatch, hmacAuth, jwtClaimMatch, mtlsMatch]
                                    key: *keyGetSchema
                                    values:
                                      type: array
                                      description: "Exact values to match (keyMatch)"
                                      items: { type: string }
                                    regex:
                                      type: array
                                      description: "Regex patterns to match (keyMatch)"
                                      items: { type: string }
                                    caseSensitive: { type: boolean }
                                    negate: { type: boolean }
                                    after: { type: string }
                                    before: { type: string }
                                    ratio:
                                      type: number
                                      minimum: 0.0
                                      maximum: 1.0
                                    ips:
                                      type: array
                                      items: { type: string }
                                    ipRefs:
                                      type: array
                                      items:
                                        type: object
                                        x-kubernetes-preserve-unknown-fields: true
                                    secretRef:
                                      type: object
                                      x-kubernetes-preserve-unknown-fields: true
                                    secretKey: { type: string }
                                    secretGroups:
                                      type: array
                                      items:
                                        type: object
                                        x-kubernetes-preserve-unknown-fields: true
                                    algorithms:
                                      type: array
                                      items: { type: string }
                                    clockSkew: { type: integer }
                                    enforceHeaders:
                                      type: array
                                      items: { type: string }
                                    validateRequestBody: { type: boolean }
                                    minSecretLength: { type: integer }
                                    secretField: { type: string }
                                    usernameField: { type: string }
                                    claim: { type: string }
                                    field:
                                      type: string
                                      enum: [subject, cn, san]
                                    sanType:
                                      type: string
                                      enum: [DNS, URI, Email]
                                    name:
                                      type: string
                                      description: "Optional attribution name for an allOf group"
                                    allOf:
                                      type: array
                                      description: "Atomic conditions combined with AND"
                                      items: *conditionSchema
                                  # Structural schema: declare the property union
                                  # once above; these branches only narrow the
                                  # discriminator requirements.
                                  oneOf:
                                    - required: [type]
                                      not:
                                        required: [allOf]
                                    - &allOfGroupSchema
                                      required: [allOf]
                                      not:
                                        required: [type]
                                  x-kubernetes-validations:
                                    - rule: "has(self.type) != has(self.allOf)"
                                      message: "an anyOf clause must contain exactly one of type or allOf"
                                    - rule: "!has(self.name) || has(self.allOf)"
                                      message: "name is only valid on an allOf group"
                            # Structural schema: properties stay outside oneOf;
                            # branches only select the required operator.
                            oneOf:
                              - required: [allOf]
                                not:
                                  required: [anyOf]
                              - required: [anyOf]
                                not:
                                  required: [allOf]
                            x-kubernetes-validations:
                              - rule: "has(self.allOf) != has(self.anyOf)"
                                message: "a condition set must contain exactly one of allOf or anyOf"
                          run: *conditionSetSchema
                      # --- dye: define anchor here, reuse below ---
                      dye: &dyeSchema
                        type: object
                        description: >-
                          Entry-level dye suite: render traffic-tagging headers
                          on plugin outcomes (success / fallback / reject /
                          fail-open / fail-close).
                        properties:
                          request:
                            type: array
                            items: &dyeRuleSchema
                              type: object
                              required: ["name"]
                              properties:
                                name:
                                  type: string
                                on:
                                  type: array
                                  items:
                                    type: string
                                    enum: ["success", "fallback", "reject", "fail-open", "fail-close"]
                                value:
                                  type: string
                                conditions: *conditionsSchema
                          response:
                            type: array
                            items: *dyeRuleSchema
                      # --- body: define anchor here, reuse in the async response stage ---
                      body: &bodySchema
                        type: object
                        description: "Body requirement for body-aware plugins: force-buffer the body (OpenResty-style) before the plugin runs"
                        properties:
                          maxBodySize:
                            type: string
                            description: "Per-plugin body-size LIMIT (human size '1k'/'1m'/'64M'). If the body exceeds it, only THIS plugin treats it as too-large (per onReadFailure). It does NOT size the shared buffer (that is bounded by the resolved Gateway request-body policy); multiple plugins can each set their own with no conflict. Usually left unset."
                          onReadFailure:
                            type: string
                            enum: [failClose, failOpen]
                            description: "Behavior when the body cannot be read (default failClose → 500, or 413 if oversize; failOpen skips the plugin)"
                          conditions: *conditionsSchema
                      type:
                        type: string
                        description: "Plugin type"
                        enum:
                          - BasicAuth
                          - AiProxy
                          - A2aGateway
                          - Cors
                          - Csrf
                          - CtxSet
                          - WebhookKeyGet
                          - ForwardAuth
                          - IpRestriction
                          - JwtAuth
                          - JweDecrypt
                          - KeyAuth
                          - HmacAuth
                          - HeaderCertAuth
                          - LdapAuth
                          - OpenidConnect
                          - Mock
                          - ProxyRewrite
                          - RateLimit
                          - RateLimitRedis
                          - RealIp
                          - RequestRestriction
                          - RequestBodyBuffer
                          - JsonSchemaValidation
                          - FormJsonTransform
                          - RequestHeaderModifier
                          - ResponseHeaderModifier
                          - RequestRedirect
                          - UrlRewrite
                          - DebugAccessLogToHeader
                          - DirectEndpoint
                          - DynamicInternalUpstream
                          - DynamicExternalUpstream
                          - AllEndpointStatus
                          - Dsl
                          - RegionRoute
                          - RequestMirror
                          - FaultInjection
                          - TraceContext
                          - ExtProc
                          - Guardrail
                          - AiGuard
                          - RequestAccessPolicy
                          - GeoIpLocation
                          - Canary
                          - Wasm
                      config:
                        type: object
                        description: "Plugin-specific configuration"
                        x-kubernetes-preserve-unknown-fields: true
                        # KeyAuth-specific fields declared here so the API server
                        # validates them at admission time. Other plugin types have
                        # their unknown fields preserved by the flag above.
                        # Fields with no type constraint use x-kubernetes-preserve-unknown-fields
                        # on their sub-objects; primitive leaf fields are typed directly.
                        properties:
                          # --- KeyAuth config fields ---
                          keySources:
                            type: array
                            description: "Key source list (header, query, cookie, ctx)"
                            items:
                              type: object
                              x-kubernetes-preserve-unknown-fields: true
                              properties:
                                type:
                                  type: string
                                  enum: [header, query, cookie, ctx]
                                name:
                                  type: string
                              required: [type]
                          hideCredentials:
                            type: boolean
                            description: "Remove API Key from request after validation"
                          authFailureDelayMs:
                            type: integer
                            minimum: 0
                            description: "Delay response on auth failure in milliseconds"
                          anonymous:
                            type: string
                            description: "Anonymous consumer name; allows unauthenticated requests"
                          realm:
                            type: string
                            description: "Authentication realm name"
                          keyField:
                            type: string
                            description: "Field name storing the key value in Secret"
                          upstreamHeaderFields:
                            type: array
                            description: "Extra headers to forward upstream from key metadata"
                            items:
                              type: string
                          secretGroups:
                            type: array
                            description: "Named groups of Secret references for KeyAuth"
                            items:
                              type: object
                              required: [name, secretRefs]
                              properties:
                                name:
                                  type: string
                                  description: "Group name (Kubernetes label-value charset, max 63 chars)"
                                  pattern: '^[a-zA-Z0-9]([-_.a-zA-Z0-9]*[a-zA-Z0-9])?$'
                                  maxLength: 63
                                description:
                                  type: string
                                  description: "Human-readable description (not used by runtime)"
                                secretRefs:
                                  type: array
                                  minItems: 1
                                  description: "Secret references for this group"
                                  items:
                                    type: object
                                    required: [name]
                                    properties:
                                      name:
                                        type: string
                                        description: "Secret name"
                                      namespace:
                                        type: string
                                        description: "Secret namespace (defaults to EdgionPlugins namespace)"
                          # --- HmacAuth config fields ---
                          algorithms:
                            type: array
                            description: "Allowed HMAC algorithms"
                            items:
                              type: string
                              enum: [hmac-sha256, hmac-sha384, hmac-sha512]
                          clockSkew:
                            type: integer
                            minimum: 1
                            description: "Maximum allowed clock skew in seconds"
                          enforceHeaders:
                            type: array
                            description: "Headers required in signed headers list"
                            items:
                              type: string
                          validateRequestBody:
                            type: boolean
                            description: "Verify the request body against the signed Digest header (SHA-256). Enforced via the body gate; fail-closes (500) until full-body buffering is implemented."
                          minSecretLength:
                            type: integer
                            minimum: 0
                            description: "Minimum acceptable HMAC secret length in bytes"
                          secretField:
                            type: string
                            description: "Field name in credential entry for secret value"
                          usernameField:
                            type: string
                            description: "Field name in credential entry for username"
                          # --- JwtAuth config fields ---
                          algorithm:
                            type: string
                            enum: [HS256, HS384, HS512, RS256, RS384, RS512, ES256, ES384]
                            description: "JwtAuth plugin-level default JWT signature algorithm (overridable per issuerGroup)"
                          header:
                            type: string
                            description: "JwtAuth: header name to read token from"
                          query:
                            type: string
                            description: "JwtAuth: query parameter name for token"
                          allowTokenInQuery:
                            type: boolean
                            description: "JwtAuth: allow reading the token from the URL query parameter (default false; RFC 6750 SHOULD NOT)"
                          cookie:
                            type: string
                            description: "JwtAuth: cookie name for token"
                          keyClaimName:
                            type: string
                            description: "JwtAuth: JWT payload claim name identifying the credential key"
                          lifetimeGracePeriod:
                            type: integer
                            minimum: 0
                            description: "JwtAuth: clock skew tolerance in seconds for exp/nbf"
                          audiences:
                            type: array
                            description: "JwtAuth plugin-level default valid audiences (overridable per issuerGroup)"
                            items: { type: string }
                          base64Secret:
                            type: boolean
                            description: "JwtAuth: whether HS* secret is base64-encoded"
                          maximumExpiration:
                            type: integer
                            minimum: 0
                            description: "JwtAuth: maximum allowed exp in seconds from now (0 = no limit)"
                          storeClaimsInCtx:
                            type: boolean
                            description: "JwtAuth: store decoded claims in ctx var 'jwt_claims'"
                          claimsToHeaders:
                            type: object
                            additionalProperties: { type: string }
                            description: "JwtAuth: map JWT claim names to upstream header names"
                          issuerGroups:
                            type: array
                            description: "JwtAuth: named groups of issuers + Secret refs"
                            items:
                              type: object
                              required: [name, issuers, secretRefs]
                              properties:
                                name:
                                  type: string
                                  pattern: '^[a-zA-Z0-9]([-_.a-zA-Z0-9]*[a-zA-Z0-9])?$'
                                  maxLength: 63
                                description: { type: string }
                                issuers:
                                  type: array
                                  minItems: 1
                                  items: { type: string }
                                secretRefs:
                                  type: array
                                  minItems: 1
                                  items:
                                    type: object
                                    required: [name]
                                    properties:
                                      name: { type: string }
                                      namespace: { type: string }
                                algorithm:
                                  type: string
                                  enum: [HS256, HS384, HS512, RS256, RS384, RS512, ES256, ES384]
                                audiences:
                                  type: array
                                  items: { type: string }

                # ============================================
                # Upstream Response Filter Stage Plugins (sync)
                # ============================================
                upstreamResponseFilterPlugins:
                  type: array
                  description: "Upstream response filter stage plugins (sync)"
                  items:
                    type: object
                    properties:
                      enable:
                        type: boolean
                        default: true
                      alias: *aliasSchema
                      conditionEnable: *conditionEnableSchema
                      conditions: *conditionsSchema
                      dye: *dyeSchema
                      type:
                        type: string
                        enum:
                          - ResponseHeaderModifier
                          - ResponseRewrite
                          - DebugAccessLogToHeader
                          - Dsl
                          - Wasm
                      config:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true

                # ============================================
                # Upstream Response Body Filter Stage Plugins (sync)
                # ============================================
                upstreamResponseBodyFilterPlugins:
                  type: array
                  description: "Upstream response body filter stage plugins (sync, bandwidth throttling)"
                  items:
                    type: object
                    properties:
                      enable:
                        type: boolean
                        default: true
                      alias: *aliasSchema
                      conditionEnable: *conditionEnableSchema
                      conditions: *conditionsSchema
                      dye: *dyeSchema
                      type:
                        type: string
                        enum:
                          - BandwidthLimit
                          - Wasm
                      config:
                        type: object
                        description: "Plugin-specific configuration"
                        x-kubernetes-preserve-unknown-fields: true

                # ============================================
                # Upstream Response Stage Plugins (async)
                # ============================================
                upstreamResponsePlugins:
                  type: array
                  description: "Upstream response stage plugins (async)"
                  items:
                    type: object
                    properties:
                      enable:
                        type: boolean
                        default: true
                      alias: *aliasSchema
                      conditionEnable: *conditionEnableSchema
                      conditions: *conditionsSchema
                      dye: *dyeSchema
                      body: *bodySchema
                      type:
                        type: string
                      config:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true

                # ============================================
                # Access Log Extension Declarations (not a stage)
                # ============================================
                accessLogExtern:
                  type: array
                  description: >-
                    Access log extension declarations. Not an execution stage: these
                    entries never run as filters, they are read when the access log
                    entry is serialized. Each entry projects exactly one value into
                    the entry's `ext` block.
                  maxItems: 16
                  items:
                    type: object
                    required:
                      - key
                      - from
                      - name
                    properties:
                      key:
                        type: string
                        description: "Field name inside the entry's ext block"
                        minLength: 1
                        maxLength: 63
                      from:
                        type: string
                        description: >-
                          Source type. routeLabel/routeAnnotation are never masked;
                          header/query/cookie/respHeader/ctx are masked unless the
                          key is whitelisted in EdgionGatewayConfig.
                        enum:
                          - routeLabel
                          - routeAnnotation
                          - header
                          - query
                          - cookie
                          - respHeader
                          - ctx
                      name:
                        type: string
                        description: "Key within the source"
                        minLength: 1
                        maxLength: 63

            status:
              type: object
              description: "Status of EdgionPlugins"
              properties:
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64

      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: edgiondata.edgion.io
spec:
  group: edgion.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - data
              description: "EdgionData defines named data resources referenced by EdgionPlugins / EdgionStreamPlugins. Exactly one DataEntry variant, discriminated by `data.type`."
              properties:
                data:
                  type: object
                  description: "The single data entry carried by this EdgionData."
                  required:
                    - type
                    - config
                  properties:
                    type:
                      type: string
                      description: "Variant tag. Determines the shape of `config`."
                      enum:
                        - KeyList
                        - IpList
                        - ClusterRegionRoute
                        - ServiceRegionRoute
                        - GlobalConnectionIpRestriction
                    config:
                      type: object
                      description: |
                        Variant-specific configuration. Shape depends on `type`:
                          - KeyList: { matchMode?: "Exact"|"Regex", items: [{ name, description?, items: [{ key, code?, priority?, id?, behavior? }] }] }
                          - IpList: { items: [{ name, description?, cidrs: string[] }] }   (grouped CIDRs / bare IPs, v4/v6)
                          - ClusterRegionRoute: full cluster topology + route rules + matchMap
                          - ServiceRegionRoute: { clusterRef: {namespace, name}, regions: [{ name, failoverTo? }] }
                          - GlobalConnectionIpRestriction: { enable, activeProfile, profiles: { <name>: { defaultAction, allow?, deny? } } }
                        Validation of the concrete shape is performed by the Controller
                        and surfaced via the `Accepted` status condition.
                      x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              description: "Status of EdgionData."
              properties:
                conditions:
                  type: array
                  description: |
                    Gateway-API-style conditions.
                    - `Accepted`: the spec passed per-variant preparse validation.
                    - `ResolvedRefs`: cross-EdgionData references resolve (only meaningful for
                      ServiceRegionRoute.clusterRef; otherwise always True).
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.data.type
          description: "DataEntry variant"
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=='Accepted')].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: edgiondata
    singular: edgiondata
    kind: EdgionData
    shortNames:
      - edata

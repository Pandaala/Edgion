apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: edgionstreamplugins.edgion.io
spec:
  group: edgion.io
  names:
    kind: EdgionStreamPlugins
    listKind: EdgionStreamPluginsList
    plural: edgionstreamplugins
    shortNames:
    - esplugins
    singular: edgionstreamplugins
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              plugins:
                type: array
                description: List of stream plugins to apply
                items:
                  type: object
                  properties:
                    enable:
                      type: boolean
                      description: Whether this plugin is enabled (default true)
                      default: true
                    conditionEnable:
                      type: object
                      description: Conditional enable configuration
                      properties:
                        timeBefore:
                          type: string
                          description: Plugin enabled before this time (RFC3339)
                    type:
                      type: string
                      description: Plugin type
                      enum:
                      - IpRestriction
                      - GlobalConnectionIpRestriction
                      - ConnectionRateLimit
                      - GeoIpLocation
                    config:
                      type: object
                      description: Plugin configuration
                      x-kubernetes-preserve-unknown-fields: true
              tlsRoutePlugins:
                type: array
                description: List of Stage-2 TLS-route stream plugins to apply
                items:
                  type: object
                  properties:
                    enable:
                      type: boolean
                      description: Whether this plugin is enabled (default true)
                      default: true
                    type:
                      type: string
                      description: Plugin type
                      enum:
                      - IpRestriction
                    config:
                      type: object
                      description: Plugin configuration
                      x-kubernetes-preserve-unknown-fields: true
          status:
            type: object
            properties:
              controllers:
                type: array
                maxItems: 32
                x-kubernetes-list-type: map
                x-kubernetes-list-map-keys:
                  - controllerName
                items:
                  type: object
                  required: [controllerName, status]
                  properties:
                    controllerName:
                      type: string
                      minLength: 1
                    status:
                      type: object
                      properties:
                        conditions:
                          type: array
                          x-kubernetes-list-type: map
                          x-kubernetes-list-map-keys:
                            - type
                          items:
                            type: object
                            required:
                              - type
                            properties:
                              type:
                                type: string
                              status:
                                type: string
                              lastTransitionTime:
                                type: string
                                format: date-time
                              reason:
                                type: string
                              message:
                                type: string
                              observedGeneration:
                                type: integer
                                format: int64
    subresources:
      status: {}
    additionalPrinterColumns:
    - name: Age
      type: date
      jsonPath: .metadata.creationTimestamp

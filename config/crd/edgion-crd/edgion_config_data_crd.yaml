apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: edgionconfigdata.edgion.io
spec:
  group: edgion.io
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - data
              description: "EdgionConfigData defines named typed data resources. Exactly one ConfigEntry variant (KeyList, IpList, RequestAccessUrlAllowList, ProxyProtocolTrust, Selector, RegionRouteOverride, WafRuleBundle, WafPolicy, Misc) is selected by `data.type`. ProxyProtocolTrust, WafRuleBundle and WafPolicy are strict, non-overlay data and require enable=true with active absent. WafRuleBundle may change executable WAF policy; writing it grants control over WAF rules used by its consumers."
              properties:
                enable:
                  type: boolean
                  default: true
                  description: "Top-level kill switch. When false, consumers ignore this overlay and fall back to their own base defaults. Defaults to true."
                active:
                  type: string
                  description: "Optional profile selector. When set, consumers that support preloaded profiles use this value to select the active profile from the base config. Consumers that do not support profiles ignore this field."
                visibility:
                  type: string
                  enum:
                    - Namespace
                    - Cluster
                  default: Namespace
                  description: "Cross-namespace reference visibility. Namespace (default): cross-ns references require a matching ReferenceGrant. Cluster: any namespace may reference this resource. WARNING: Cluster grants reference access to all current and future namespaces with no per-grant audit trail; revoke by setting back to Namespace."
                data:
                  type: object
                  description: "The single data entry carried by this EdgionConfigData."
                  required:
                    - type
                    - config
                  properties:
                    type:
                      type: string
                      description: "Variant tag. Determines the shape of `config`."
                    config:
                      type: object
                      description: |
                        Variant-specific configuration. Shape depends on `type`:
                          - KeyList: { matchMode?: "exact"|"regex", items: [{ name, description?, items: [{ key, code?, priority?, id?, behavior? }] }] }
                          - IpList: { items: [{ name, description?, cidrs: string[] }] }   (grouped CIDRs / bare IPs, v4/v6)
                          - RequestAccessUrlAllowList: { items: [{ name, hosts?, paths, allOf? }] }; data-only URL allow candidates bound and expanded by the referring RequestAccessPolicy. allOf uses the same Condition enum as plugin conditions (keyExist, keyMatch, timeRange, probability, directPeerIpMatch, remoteIpMatch, secretMatch, hmacAuth)
                          - ProxyProtocolTrust: strict non-overlay inbound PROXY sender trust policy — { mode: "required" } or { mode: "trustedSources", trustedCidrs: string[] }; invalid or unknown fields reject the policy
                          - Selector: active-profile selector — { active?: string, description?: string }; referenced via activeProfileRef in plugin configs. `active` names one of the consumer's configured profiles; `active: null`/absent uses its default. Switches among profiles only — never disables filtering
                          - RegionRouteOverride: all-Optional overlay for RegionRoute — { enable?, active?, regions? }; referenced via overrideRef in EdgionPlugins RegionRoute configs
                          - WafRuleBundle: strict non-overlay WAF inputs — { version, profile, provenance, digest?, roots: string[], rules: [{ name, content }], phraseAssets?: [{ name, content }] }; optional digest is a lowercase SHA-256 self-check of the canonical bundle contents
                          - WafPolicy: shared WAF combinations — { profiles: { name: { bundleRefs: [{ name, namespace?, expectedDigest?, optional? }] } }, defaultProfile }; expectedDigest optionally pins the selected bundle contents; a referring plugin compiles the selected combination as one generation
                          - Misc: open payload (x-kubernetes-preserve-unknown-fields); escape hatch for third-party or unknown payloads only
                        Validation of the concrete shape is performed by the Controller
                        and surfaced via the `Accepted` status condition.
                      x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              description: "Status of EdgionConfigData."
              properties:
                conditions:
                  type: array
                  description: |
                    Gateway-API-style conditions.
                    - `Accepted`: the spec passed per-variant preparse validation.
                    - `ResolvedRefs`: required cross-resource references resolve. WafPolicy
                      checks its referenced WafRuleBundle resources.
                    - `PartiallyInvalid`: optional WafPolicy references
                      were skipped; usable required bundles remain effective.
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
                      observedGeneration:
                        type: integer
                        format: int64
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Type
          type: string
          jsonPath: .spec.data.type
          description: "ConfigEntry variant"
        - name: Enable
          type: boolean
          jsonPath: .spec.enable
          description: "Kill switch (false = consumers fall back to base)"
        - name: Accepted
          type: string
          jsonPath: .status.conditions[?(@.type=='Accepted')].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
  scope: Namespaced
  names:
    plural: edgionconfigdata
    singular: edgionconfigdata
    kind: EdgionConfigData
    shortNames:
      - edata

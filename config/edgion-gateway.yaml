# ================================================================================
# Edgion Gateway Configuration File
# ================================================================================
#
# :
#   1. :
#      ./edgion-gateway --config-file /usr/local/edgion/config/edgion-gateway.yaml
#
#   2.  server_addrs:
#      ./edgion-gateway --server-addr http://127.0.0.1:12151
#
#   3. :
#      ./edgion-gateway --config-file /usr/local/edgion/config/edgion-gateway.yaml --server-addr http://192.168.1.100:12151
#
# ================================================================================

# ============================================================================
# Working Directory Configuration
# ============================================================================
# All relative paths in this configuration file will be relative to work_dir.
# Absolute paths will be used as-is.
#
# Priority order:
#   1. Command line: --work-dir /path
#   2. Environment:  EDGION_WORK_DIR=/path
#   3. Config file:  work_dir: "/path"
#   4. Default:      "." (current directory)
#
# Standard directory layout:
#   work_dir/
#   ├── logs/        # Log files
#   ├── runtime/     # Runtime state
#   └── config/      # Configuration files
#
# Examples:
#   Development:  work_dir: "."
#   Production:   work_dir: "/usr/local/edgion"
#   Container:    work_dir: "/usr/local/edgion"
# ============================================================================
work_dir: "."

# Process-wide RequestMirror safety budgets; changes require a restart.
# Shared by all routes and plugin generations. Zero does not disable limits.
request_mirror:
  max_concurrent: 1024       # 1..65536 active mirror tasks
  max_buffered_bytes: 64MiB  # 1 byte..1GiB retained mirror bodies; not total RSS

# Process-wide Anthropic unary conversion limits; changes require a restart.
# Unknown keys in every AI conversion subtree fail startup. Limits apply only
# to selected non-streaming Chat-to-Anthropic conversion. Defaults derive a
# 25MiB reservation and ten slots; memory_budget is not a process RSS limit.
ai:
  conversion:
    chat_to_anthropic:
      unary:
        max_input_size: 1MiB
        max_output_size: 1MiB
        hold_timeout: 120s
        memory_budget: 256MiB
        max_json_depth: 64
        max_json_nodes: 16384
        max_key_size: 256B
        max_source_events: 4096
        max_metadata_size: 64KiB

gateway:
  # Restart-only Wasm limits. Unknown gateway keys fail startup.
  # Full defaults and safety ranges: docs/en/user-guide/http-route/filters/edgion-plugins/wasm.md
  # wasm_limits:
  #   guest_memory_bytes: 536870912
  #   max_instances: 128
  #   max_preparations: 4
  #   max_idle_instances: 32
  #   max_idle_guest_memory_bytes: 134217728
  # Controller conf_sync gRPC address.
  # Scheme: https:// when conf_sync_security carries certs (the default, see the
  # bottom of this file); http:// only under an explicit `skip_tls: true`.
  server_addrs: ["https://127.0.0.1:12151"]

  # IP of this process's traffic listener sockets (default: 0.0.0.0).
  # Use a host-owned address on physical machines when sharing listener ports.
  # Gateway.spec.addresses describes the external load balancer/VIP instead.
  # bind_ip: "0.0.0.0"

  # Decoded HTTP/2 response-header-list limit for Gateway-initiated reqwest calls.
  # Valid range: 16384..=65536 bytes. Changes require a Gateway restart.
  # outbound_http2_max_header_list_size: 16384

  # Admin HTTP server listen address (optional).
  # The Gateway Admin API listens on this address; default is 127.0.0.1:12001
  # (loopback only). Set it to 0.0.0.0 to expose the admin/readiness port over the
  # pod IP (e.g. for a kubelet httpGet readiness probe).
  # The Metrics API is on its own listener at :12090 and is not affected by this field.
  # admin_listen: "0.0.0.0:12001"

  # Probe HTTP server listen address (optional; liveness/readiness only).
  # Serves /health and /ready on a dedicated outward port; default is 0.0.0.0:12000
  # so a kubelet httpGet probe can reach it over the pod IP. Carries no sensitive
  # data, so binding 0.0.0.0 is safe. The admin API (above) stays loopback.
  # probe_listen: "0.0.0.0:12000"

logging:
  #
  log_dir: logs

  #
  # : {log_prefix}.{date}.log
  log_prefix: edgion-gateway

  # : trace, debug, info, warn, error
  # - trace: ，
  # - debug: ，
  # - info:  ，
  # - warn:
  # - error:
  log_level: "debug,pingora_proxy=error,pingora_core=error"

  #  JSON
  # true:   JSON ，
  # false:
  json_format: false

  #
  console: true

  #
  #
  buffer_size: 10000

# ================================================================================
# Pingora Server Configuration
# ================================================================================
server:
  # Number of worker threads (default: number of CPU cores)
  # ， CPU
  # threads: 4

  # Optional downstream HTTP/2 receive windows in bytes and streams per connection.
  # Omission preserves Pingora defaults: 65535 bytes for both windows, 100 streams.
  # Windows: 65535..=16777216; streams: 1..=1024.
  # Stream window * streams must be <= 67108864 bytes. Restart required.
  # downstream_h2_stream_window_size: 65535
  # downstream_h2_connection_window_size: 65535
  # downstream_h2_max_concurrent_streams: 100

  # Optional downstream TLS handshake offload, disabled when both are omitted.
  # Each terminating HTTPS/TLS listener owns its own pool; total threads must be <= 64.
  # downstream_tls_offload_threadpools: 2
  # downstream_tls_offload_thread_per_pool: 2

  # Enable work stealing (default: true)
  # ，
  # work_stealing: true

  # Grace period for shutdown in seconds (default: 30)
  # ，
  # grace_period_seconds: 30

  # Graceful shutdown timeout in seconds (default: 10)
  # ，
  # graceful_shutdown_timeout_seconds: 10

  # Upstream keepalive pool size (default: 128)
  # ，
  # upstream_keepalive_pool_size: 128

  # Error log file path (optional)
  # Pingora
  # error_log: logs/pingora_error.log

# ================================================================================
# Access Log Configuration (HTTP/gRPC)
# ================================================================================
# Access log  HTTP  gRPC
# ：LocalFile, Elasticsearch, Kafka

access_log:
  #  Access  (default: true)
  enabled: true

  output:
    localFile:
      # Access log （ work_dir，）
      path: logs/edgion_access.log

      # ：
      # ， cpu_cores * 10_000
      # queueSize: 100000

      # ：
      # rotation:
      #   strategy: daily  # : "daily", "hourly", "never",  {size: 104857600}
      #   maxFiles: 10
      #   checkIntervalSecs: 30

      # ：
      # es:
      #   endpoint: http://localhost:9200
      #   index: edgion-access
      #
      # kafka:
      #   brokers: [localhost:9092]
      #   topic: edgion-access

# This repo-local config file deliberately runs with masking OFF: it is the
# local-dev and integration-harness config (`docs/en/ops-guide/configuration/
# gateway-config.md` names this file as the default path, and the zh-CN
# getting-started guide points new operators at it), and the integration
# suites assert on `path` and on plugin-log values written through
# `sensitive(...)` — those assertions need real, unmasked values.
#
# This is NOT the production default. When `access_log_sensitive` is absent
# from a config file, the shipped/production default is `replace`. The
# release image bakes no config (cicd/docker/Dockerfile.runtime), so a
# Kubernetes deployment is unaffected by this file and gets the `replace`
# default unless it supplies its own `access_log_sensitive` section.
access_log_sensitive:
  mode: off

# ================================================================================
# SSL/TLS Callback Log Configuration
# ================================================================================
# SSL log  TLS ，
#  access log （metrics）

ssl_log:
  #  SSL  (default: true)
  enabled: true

  output:
    localFile:
      # SSL log （ work_dir，）
      path: logs/ssl.log

      # ：
      # ， cpu_cores * 10_000
      # queueSize: 100000

      # ：
      # ， SSL ，
      rotation:
        strategy: {size: 104857600}  # 100MB per file
        maxFiles: 10                #  10
        checkIntervalSecs: 30     #  30

      # （ access log ）
      # es:
      #   endpoint: http://localhost:9200
      #   index: edgion-ssl

# ================================================================================
# TCP Connection Log Configuration
# ================================================================================
# TCP log  TCP ，
# ，

tcp_log:
  #  TCP  (default: false)
  enabled: false

  output:
    localFile:
      # TCP log （ work_dir，）
      path: logs/tcp.log

      # ：
      # queueSize: 50000

      # ：
      # rotation:
      #   strategy: daily  #
      #   maxFiles: 10
      #   checkIntervalSecs: 30

# ================================================================================
# UDP Session Log Configuration
# ================================================================================
# UDP log  UDP ，
# ，

udp_log:
  #  UDP  (default: false)
  enabled: false

  output:
    localFile:
      # UDP log （ work_dir，）
      path: logs/udp.log

      # ：
      # queueSize: 50000

      # ：
      # rotation:
      #   strategy: daily  #
      #   maxFiles: 10
      #   checkIntervalSecs: 30

# ============================================================================
# conf_sync Channel Security (mTLS)
# ============================================================================
# This channel carries resolved Secrets (TLS private keys, backend credentials)
# from Controller to Gateway. Following the Istio principle that certificate /
# secret distribution is never served over plaintext, mTLS is the DEFAULT in every
# environment — this file included. The shipped Kubernetes manifests
# (cicd/deploy/kubernetes/) use the Controller's internal CA (auto_ca: true).
#
# REQUIRED: this section must be present. Omitting it entirely makes the Gateway
# REFUSE TO START (fail-close, since 2026-07-14) — plaintext must be an explicit,
# audited choice, never the consequence of a forgotten config block.
# Pick one of: auto_ca (Kubernetes), cert paths (file mode), or skip_tls (plaintext).
# Must match Controller's config — mismatched configs cause handshake failure.
#
# Cert paths are resolved relative to work_dir. To run this file as-is with a bare
# `cargo run` (work_dir = repo root), bootstrap the cert set explicitly first:
#   cargo run --bin edgion-cli -- gen-certs --output file --output-dir certs/grpc --cert-name primary
# No test script populates the repo root implicitly; integration runs generate
# their certs inside their own per-run work directory.
#
# `skip_tls: true` (plaintext) still exists as an emergency escape hatch, but it is
# never a default: the Gateway logs an ERROR and raises the metric
# edgion_system_error_state{reason="skip_tls"} so the degraded state stays visible.
conf_sync_security:
  active: primary
  certs:
    - name: primary
      cert: certs/grpc/primary/client.crt   # Gateway client certificate
      key: certs/grpc/primary/client.key    # Gateway client private key
      ca: certs/grpc/primary/ca.crt         # CA certificate (verifies Controller server cert)
#
# --- Multi-cert format (supports cert rotation / CA migration) ---
# conf_sync_security:
#   active: primary               # Name of the active cert set
#   certs:
#     - name: primary
#       cert: certs/grpc/primary/client.crt
#       key: certs/grpc/primary/client.key
#       ca: certs/grpc/primary/ca.crt
#     - name: new-ca
#       cert: certs/grpc/new-ca/client.crt
#       key: certs/grpc/new-ca/client.key
#       ca: certs/grpc/new-ca/ca.crt

# --- GeoIP (process-global, restart-only; see edgion-gateway/src/geoip/) ---
# `geoip` is a field of `GatewayConfig` (no `#[serde(flatten)]`), so it MUST
# nest under the `gateway:` key above, like `server_addrs`/`admin_listen` do
# — a top-level `geoip:` key is ignored and emits a startup WARN with
# `field_path="geoip"` and `action="ignored"`.
# gateway:
#   geoip:
#     db_path: /var/lib/edgion/GeoLite2-City.mmdb   # absolute, or resolved against work_dir
#     update_url: https://example.com/GeoLite2-City.mmdb   # optional periodic hot-swap source

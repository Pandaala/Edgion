# ================================================================================
# Edgion Controller Configuration File — Etcd Mode
# ================================================================================
#
# Usage:
#   ./edgion-controller --config-file config/edgion-controller-etcd.yaml
#
# This configuration uses etcd as the configuration center backend.
# Resources (Gateway, Route, Plugin, etc.) are stored in etcd instead of
# the local file system or Kubernetes API.
#
# Like file_system mode, etcd is a NON-Kubernetes mode: the controller loads CRD schemas
# from <work_dir>/config/crd at startup (K8s mode gets them from the API server instead).
# The release tarball ships these; the container image does NOT bundle them -- if you run
# this mode from the container image, mount config/crd into <work_dir>/config/crd. See
# docs/en/getting-started/installation-and-deployment.md ("Running the container image in a
# non-Kubernetes mode").
#
# ================================================================================

work_dir: "."

# ============================================================================
# Logging Configuration
# ============================================================================
logging:
  log_dir: logs
  log_prefix: edgion-controller
  log_level: info

# ============================================================================
# Server Configuration
# ============================================================================
server:
  # conf_sync listener. It carries resolved Secrets (TLS private keys, backend
  # credentials) to the data plane and is mTLS by default (see the conf_sync_security
  # section at the bottom), so binding it on all interfaces is safe.
  grpc_listen: "0.0.0.0:12151"
  # Secure default: loopback. A distributed etcd-backed deployment that needs
  # remote admin access must set 0.0.0.0 plus allow_admin_ips.
  admin_listen: "127.0.0.1:12101"

# ============================================================================
# Configuration Center — Etcd Mode
# ============================================================================
conf_center:
  type: etcd
  endpoints: [http://127.0.0.1:2379]
  key_prefix: /edgion

  # Connection timeout (milliseconds)
  # connect_timeout_ms: 5000

  # Per-request timeout (milliseconds)
  # request_timeout_ms: 10000

  # HTTP/2 keep-alive (seconds)
  # keep_alive_time_secs: 30
  # keep_alive_timeout_secs: 10

# ============================================================================
# Etcd Authentication (optional)
# ============================================================================
# conf_center:
#   auth:
#     username: root
#     password: changeme

# ============================================================================
# Etcd TLS (optional)
# ============================================================================
# conf_center:
#   tls:
#     ca_cert_file: /etc/edgion/certs/etcd-ca.pem
#     client_cert_file: /etc/edgion/certs/etcd-client.pem
#     client_key_file: /etc/edgion/certs/etcd-client-key.pem

# ============================================================================
# Config Sync (Controller → Gateway gRPC sync)
# ============================================================================
conf_sync:
  no_sync_kinds: [ReferenceGrant, Secret]
  default_capacity: 200

# ============================================================================
# conf_sync Channel Security (mTLS)
# ============================================================================
# REQUIRED: omitting this section entirely makes the process REFUSE TO START
# (fail-close, since 2026-07-14) -- the conf_sync channel carries resolved Secrets
# (TLS private keys, backend credentials), so plaintext must be an explicit choice.
# Pick one of: auto_ca (Kubernetes), cert paths (file mode), or skip_tls (plaintext).
#
# etcd mode is the profile MOST likely to be split across hosts, which is exactly why
# it defaults to file-mode mTLS: the moment the Gateway runs on a different machine
# than the Controller, plaintext here would put TLS private keys on the wire.
#
# Paths are resolved relative to work_dir. Generate the referenced set explicitly with:
#   cargo run --bin edgion-cli -- gen-certs --output file --output-dir <work_dir>/certs/grpc --cert-name primary
# In a real deployment point these at
# the operator-managed absolute paths instead, e.g.:
#
#   conf_sync_security:
#     tls:
#       cert: /etc/edgion/conf-sync-certs/server.crt
#       key:  /etc/edgion/conf-sync-certs/server.key
#       ca:   /etc/edgion/conf-sync-certs/ca.crt
#
# and give the Gateway the matching client cert / key / ca.
conf_sync_security:
  tls:
    cert: certs/grpc/primary/server.crt
    key: certs/grpc/primary/server.key
    ca: certs/grpc/primary/ca.crt

# ================================================================================
# Edgion Controller Configuration File
# ================================================================================
#
# :
#   1. :
#      ./edgion-controller --config-file /usr/local/edgion/config/edgion-controller.yaml
#
#   2.  conf_dir:
#      ./edgion-controller --config-file /usr/local/edgion/config/edgion-controller.yaml --conf-dir ./edgion-tests/integration/conf
#
#   3. :
#      ./edgion-controller --config-file /usr/local/edgion/config/edgion-controller.yaml --log-level debug
#
# ================================================================================

# ============================================================================
# Working Directory Configuration
# ============================================================================
# Most runtime output paths in this configuration file will be relative to work_dir.
# Absolute paths will be used as-is.
# Note: conf_center.file_system.conf_dir currently follows the process cwd.
#
# Priority order:
#   1. Command line: --work-dir /path
#   2. Environment:  EDGION_WORK_DIR=/path
#   3. Config file:  work_dir: "/path"
#   4. Default:      "." (current directory)
#
# Standard directory layout:
#   work_dir/
#   ├── logs/        # Log files
#   ├── runtime/     # Runtime state
#   └── config/      # Configuration files
#
# Examples:
#   Development:  work_dir: "."
#   Production:   work_dir: "/usr/local/edgion"
#   Container:    work_dir: "/usr/local/edgion"
# ============================================================================
work_dir: "."

# K8s mode is selected via conf_center.type = "kubernetes"
# K8s  conf_center.type = "kubernetes"

server:
  # gRPC
  #  Gateway
  grpc_listen: "0.0.0.0:12151"

  # Admin HTTP API (/api/v1, /configclient); used by edgion-cli and Web Dashboard.
  # Secure default: loopback only. For cluster/remote access set 0.0.0.0 AND set
  # allow_admin_ips (and/or a NetworkPolicy) — exposing the admin plane is an
  # explicit operator choice.
  admin_listen: "127.0.0.1:12101"

  # probe_listen: "0.0.0.0:12100"    # Liveness/readiness (/health, /ready); default 0.0.0.0:12100
  # metrics_listen: "0.0.0.0:12190"  # Prometheus metrics (/metrics); default 0.0.0.0:12190

logging:
  #
  log_dir: logs

  #
  # : {log_prefix}.{date}.log
  log_prefix: edgion-controller

  # : trace, debug, info, warn, error
  # - trace: ，
  # - debug: ，
  # - info:  ，
  # - warn:
  # - error:
  log_level: info

  #  JSON
  # true:   JSON ，
  # false:
  json_format: false

  # （stdout）
  # true:   +
  # false:
  console: true

  #
  #
  buffer_size: 10000

# ============================================================================
# Configuration Center (conf_center)
# ============================================================================
# Determines which backend to use for configuration management:
#   - file_system: Local YAML files with file watching (development/testing)
#   - kubernetes:  K8s API with resource watching (production)
#
# FileSystem mode example:
# conf_center:
#   type: file_system
#   conf_dir: edgion-tests/integration/conf  # In the current implementation relative paths resolve against the process cwd; use an absolute path for more stable behavior
#
# Kubernetes mode example (production):
# conf_center:
#   type: kubernetes
#   gateway_class: edgion              # Required: GatewayClass name to manage
#   controller_name: "edgion.io/gateway-controller"  # Required: Gateway API controllerName
#   watch_namespaces: []               # Empty = all namespaces, or [ns1, ns2]
#   label_selector: ""                 # Optional: filter resources by label
#
#   leader_election:
#     lease_name: edgion-controller-leader    # Lease resource name
#     lease_namespace: edgion-system          # Namespace for Lease (default: from POD_NAMESPACE env)
#     lease_duration_secs: 15                 # Lease validity period (apiserver-side)
#     renew_deadline_secs: 10                 # Window for retaining leadership across transient errors
#     retry_period_secs: 2                    # Single sleep cadence between every acquire/renew attempt (matches client-go RetryPeriod)
#
#   metadata_filter:
#     blocked_annotations:                    # Annotations to remove from resources
#       - kubectl.kubernetes.io/last-applied-configuration
#       - meta.helm.sh/release-name
#       - meta.helm.sh/release-namespace
#     remove_managed_fields: true             # Remove managedFields to save memory
# ============================================================================
conf_center:
  type: file_system
  conf_dir: edgion-tests/integration/conf

debug:
  #
  #  debug  trace ， 30  GatewayClass
  #  false
  enabled: true

conf_sync:
  no_sync_kinds: [ReferenceGrant, Secret]
  # EventStore ring buffer default capacity for all resource types
  default_capacity: 200

# ============================================================================
# Federation Client (center)
# ============================================================================
# Connect this Controller to a Federation Center.
# Omit this section entirely if you are not using federation.
#
# center:
#   address: "https://center.example.com:12251"
#   name: "ctrl-1"
#   cluster: "prod"
#
#   # Hot-reloadable kill-switch. false => federation client does not run.
#   # Reloaded via POST /api/v1/reload without a process restart.
#   # Default: true
#   enabled: true
#
#   security:
#     active: primary
#     certs:
#       - name: primary
#         cert: certs/grpc/primary/client.crt
#         key: certs/grpc/primary/client.key
#         ca: certs/grpc/primary/ca.crt
#
#   # Federation RBAC for Center operations.
#   #
#   # ABSENT => built-in default policy applies:
#   #   - read (get/list/watch/list-keys) on ALL resource kinds EXCEPT Secret
#   #     (EdgionTls IS readable; only the Secret kind is excluded for credential safety)
#   #   - write (create/update/delete) on EdgionConfigData only
#   #     (drives IP-restriction sync + region-route sync; grants write to ALL plugin
#   #     metadata, not only region/ip -- this limitation is intentional for simplicity)
#   #   - get, list, and failover on RegionRoute (synthetic label, not a ResourceKind):
#   #     get/list allow the aggregate read endpoints
#   #     (GET /api/v1/cluster-region-routes, GET /api/v1/service-region-routes);
#   #     failover covers the POST failover endpoint
#   #   - NO reload, server-info, diagnostics, or any other verb beyond the above
#   #
#   # PRESENT => the explicit rules FULLY OVERRIDE the built-in default.
#   # Use an explicit rbac block to grant more (e.g. Secret read, reload) or less
#   # than the default. See docs/en/ops-guide/federation-rbac.md for examples.
#   #
#   # IMPORTANT -- kind casing: kinds MUST use the canonical PascalCase resource
#   # Kind name (e.g. EdgionConfigData, HTTPRoute, RegionRoute). Lowercase or alias
#   # spellings (e.g. edgionconfigdata) silently never match any request. Verbs are
#   # case-insensitive (get, GET, Get all work).
#   #
#   # WARNING: NEVER use kinds: ["*"] with get / list / watch.
#   # There is no server-side Secret backstop on the fed path; a wildcard
#   # read lets Center read Secret / EdgionTls private-key material via the
#   # blind proxy. Always enumerate concrete kinds for any UI surface.
#   # (The built-in default avoids this by excluding Secret explicitly.)
#   #
#   # Example: explicit minimal allowlist (automated operations only):
#   rbac:
#     allow:
#       - verbs: [get, list, watch, create, update, delete]
#         kinds: [EdgionConfigData]
#       - verbs: [failover]
#         kinds: [RegionRoute]
#       - verbs: [reload]
#         kinds: ["*"]

# ============================================================================
# Static CLI Tokens (cli_tokens)
# ============================================================================
# Role-scoped Bearer tokens for the Controller Admin API.
# Intended for CI/automation that must call the Admin API non-interactively.
# Tokens are SHA-256-stored; the raw token is never persisted.
#
# Workflow:
#   1. Run: edgion-cli gen-token
#      The command prints an "edg_..." token and its SHA-256 digest.
#   2. Paste the SHA-256 value into token_sha256 below.
#   3. Distribute the "edg_..." token to the consumer (use --token or EDGION_TOKEN).
#   4. Apply the config: POST /api/v1/reload  (hot-reloadable, no restart needed).
#
# RBAC rules use the same (verb, kind) model as [center].rbac.
# See docs/en/ops-guide/federation-rbac.md#cli-token-rbac for the full guide.
#
# SECURITY — read before enabling:
#   - NEVER use kinds: ["*"] with get / list / list-keys: exposes Secret and
#     EdgionTls private-key material via the blind proxy. Enumerate concrete kinds.
#   - verbs: ["*"] is equivalent to Superuser — grant narrowly.
#   - Rotate by replacing token_sha256 + running reload (no restart).
#   - --token / EDGION_TOKEN do NOT touch ~/.edgion/token (ephemeral per-invocation).
#
# cli_tokens:
#   # Read-only token — safe for monitoring / read-only CI pipelines.
#   - name: monitor-bot
#     token_sha256: "<64 lowercase hex chars from edgion-cli gen-token>"
#     rbac:
#       allow:
#         # Enumerate concrete kinds; do NOT use kinds: ["*"] with read verbs.
#         - verbs: [get, list]
#           kinds: [HTTPRoute, GRPCRoute, TCPRoute, Service,
#                   EdgionGatewayConfig, EdgionTls, EdgionConfigData]
#
#   # Scoped read-write token — manages plugin metadata + reload only.
#   - name: plugin-manager
#     token_sha256: "<64 lowercase hex chars from edgion-cli gen-token>"
#     rbac:
#       allow:
#         - verbs: [get, list, watch, create, update, delete]
#           kinds: [EdgionConfigData]
#         # reload is write-only; kinds: ["*"] is safe here (no read surface).
#         - verbs: [reload]
#           kinds: ["*"]

# ============================================================================
# conf_sync Channel Security (mTLS)
# ============================================================================
# Omit this section entirely to keep plaintext gRPC (backward compatible).
# When configured, Controller requires valid certificates to start gRPC listener.
#
# --- Option A: Legacy single-cert format (backward compatible) ---
# conf_sync_security:
#   tls:
#     cert: certs/grpc/server.crt   # Controller server certificate
#     key: certs/grpc/server.key    # Controller server private key
#     ca: certs/grpc/ca.crt         # CA certificate (verifies Gateway client cert)
#     skip_tls: false               # Emergency bypass: true = skip TLS (INSECURE)
#
# --- Option B: Multi-cert format (supports cert rotation / CA migration) ---
# conf_sync_security:
#   active: primary               # Name of the active cert set
#   certs:
#     - name: primary
#       cert: certs/grpc/primary/server.crt
#       key: certs/grpc/primary/server.key
#       ca: certs/grpc/primary/ca.crt
#     - name: new-ca
#       cert: certs/grpc/new-ca/server.crt
#       key: certs/grpc/new-ca/server.key
#       ca: certs/grpc/new-ca/ca.crt

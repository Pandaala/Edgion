[package]
name = "edgion-cli"
version = "0.1.0"
edition = "2021"
authors = ["pandalaa"]

[lib]
name = "edgion_cli"
path = "src/lib.rs"

[[bin]]
name = "edgion-cli"
path = "src/bin/edgion_ctl.rs"

[features]
# Default features: jemalloc allocator (selected in the binary).
default = ["allocator-jemalloc"]

# Memory allocator selection (mutually exclusive) — lives with the binary.
allocator-jemalloc = ["tikv-jemallocator"]
allocator-mimalloc = ["mimalloc"]
allocator-system = []

[dependencies]
edgion-common = { path = "../edgion-common" }
edgion-resources = { path = "../edgion-resources" }

# Memory allocators (optional, controlled by features)
tikv-jemallocator = { version = "0.6", optional = true }
mimalloc = { version = "0.1", default-features = false, optional = true }

tokio = { version = "1.49", features = ["full"] }
anyhow = "1.0"

clap = { version = "4.5", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"

kube = { version = "2.0.1", features = ["runtime", "derive"] }
k8s-openapi = { version = "0.26.1", features = ["latest", "schemars"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots", "http2", "stream"] }

base64 = "0.22"
hex = "0.4"
chrono = "0.4"
rand = "0.9"
sha2 = "0.10"
time = { version = "0.3", features = ["std"] }
rcgen = { version = "0.14.7", features = ["x509-parser"] }
rpassword = "7"
zeroize = { version = "1", features = ["derive"] }
tabled = "0.20"
tracing = "0.1"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"

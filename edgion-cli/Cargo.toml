[package]
name = "edgion-cli"
version.workspace = true
edition.workspace = true
publish = false
authors.workspace = true

[lib]
name = "edgion_cli"
path = "src/lib.rs"

[[bin]]
name = "edgion-cli"
path = "src/bin/edgion_ctl.rs"

[lints]
workspace = true

[features]
# Default features: jemalloc allocator (selected in the binary).
default = ["allocator-jemalloc"]

# Memory allocator selection (mutually exclusive) — lives with the binary.
allocator-jemalloc = ["dep:tikv-jemallocator"]
allocator-mimalloc = ["dep:mimalloc"]
allocator-system = []

[dependencies]
edgion-common.workspace = true
edgion-resources.workspace = true
edgion-wasm.workspace = true

# Memory allocators (optional, controlled by features)
tikv-jemallocator = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }

tokio.workspace = true
anyhow.workspace = true

clap.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["float_roundtrip"] }
yaml_serde.workspace = true

kube = { workspace = true, features = ["client", "rustls-tls", "ring"] }
k8s-openapi.workspace = true

reqwest.workspace = true
# CLI --ca-cert keeps its prepared rustls client configuration.
rustls.workspace = true

base64.workspace = true
hex.workspace = true
chrono.workspace = true
rand.workspace = true
sha2.workspace = true
url.workspace = true
time.workspace = true
rcgen.workspace = true
zeroize.workspace = true
tabled.workspace = true
tempfile.workspace = true

[dev-dependencies]
parking_lot.workspace = true
tokio-rustls.workspace = true
wiremock.workspace = true
wat.workspace = true

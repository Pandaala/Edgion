syntax = "proto3";

package fed_sync;

// ── Center → Controller: request list/watch of a resource kind ──

message FedWatchRequest {
    string request_id    = 1;  // UUID for correlating responses
    string kind          = 2;  // Resource kind, e.g. "PluginMetaData"
    uint64 from_version  = 3;  // 0 = full list + watch; >0 = resume watch
}

// ── Controller → Center: full list response ──

message FedWatchListResponse {
    string request_id    = 1;  // Echo FedWatchRequest.request_id
    string data          = 2;  // JSON-serialized full list
    uint64 sync_version  = 3;  // Current version
    string server_id     = 4;  // ConfigSyncServer instance ID (restart detection)
}

// ── Controller → Center: incremental watch events ──

message FedWatchEventResponse {
    string request_id    = 1;  // Echo FedWatchRequest.request_id
    string data          = 2;  // JSON-serialized event array
    uint64 sync_version  = 3;  // Current version
    string server_id     = 4;  // ConfigSyncServer instance ID
    string error         = 5;  // Non-empty = error code
}

// Controller (client) 连接 Center (server) 的持久双向流
// Controller 第一条消息必须是 RegisterRequest
service FederationSync {
    rpc Sync(stream ControllerMessage) returns (stream CenterMessage);
}

// ── Controller → Center ──────────────────────────────────────

message ControllerMessage {
    oneof payload {
        RegisterRequest      register              = 1;  // 首条消息，注册自身信息
        Pong                 pong                  = 2;  // 心跳响应
        CommandResponse      command_response      = 4;  // 响应 center 的命令
        HttpProxyResponse    http_proxy_response   = 5;  // HTTP 代理响应
        FedWatchListResponse watch_list_response   = 6;  // 反向 list/watch：全量列表响应
        FedWatchEventResponse watch_event_response = 7;  // 反向 list/watch：增量事件响应
    }
}

message RegisterRequest {
    string          controller_id   = 1;  // 稳定标识：cluster + name 拼接，跨重启不变
    string          cluster         = 2;  // 集群标识（固定 string）
    repeated string env             = 3;  // 环境标签列表
    repeated string tag             = 4;  // 扩展标签列表
    repeated string supported_kinds = 5;  // 本 controller 持有的资源 kind 列表（已排除 no_sync_kinds）
}

message Pong {
    uint64 timestamp = 1;  // echo Ping.timestamp，毫秒时间戳
}

message CommandResponse {
    string request_id = 1;
    bool   success    = 2;
    string message    = 3;  // 失败时的错误信息
}

// ── Center → Controller ──────────────────────────────────────

message CenterMessage {
    oneof payload {
        RegisterAck      register_ack  = 1;  // 注册确认
        Ping             ping          = 2;  // 心跳
        CommandRequest   command       = 4;  // 下发命令
        HttpProxyRequest http_proxy    = 5;  // HTTP 代理请求（Center 转发前端请求）
        FedWatchRequest  watch_request = 6;  // 请求 controller 反向 list/watch
    }
}

message RegisterAck {
    // session_id 是 center 内部概念，仅用于日志追踪，controller 不需要回传
    string session_id = 1;
}

message Ping {
    uint64 timestamp = 1;  // 毫秒时间戳
}

message CommandRequest {
    string request_id = 1;
    oneof command {
        ReloadCommand reload = 2;
        ApplyCommand  apply  = 3;
        DeleteCommand delete = 4;
    }
}

message ReloadCommand {}

message ApplyCommand {
    string kind = 1;
    string data = 2;  // 资源 JSON（ConfCenter 原始格式）
}

message DeleteCommand {
    string kind      = 1;
    string namespace = 2;
    string name      = 3;
}

// ── HTTP Proxy（Center ↔ Controller HTTP 隧道）────────────────

// Center → Controller: 将前端 HTTP 请求封装后通过 gRPC 流发送
message HttpProxyRequest {
    string              request_id = 1;  // UUID，用于关联响应
    string              method     = 2;  // HTTP 方法：GET, POST, PUT, DELETE
    string              path       = 3;  // 请求路径：/api/v1/namespaced/httproute
    map<string, string> headers    = 4;  // HTTP 请求头
    bytes               body       = 5;  // 请求体
}

// Controller → Center: 将内部路由执行结果封装返回
message HttpProxyResponse {
    string              request_id  = 1;  // echo HttpProxyRequest.request_id
    uint32              status_code = 2;  // HTTP 状态码：200, 404, 500...
    map<string, string> headers     = 3;  // HTTP 响应头
    bytes               body        = 4;  // 响应体
}

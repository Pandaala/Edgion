[package]
name = "edgion-ldap"
version.workspace = true
edition.workspace = true
authors.workspace = true
publish = false

# Runtime-light leaf: only tokio's AsyncRead/AsyncWrite traits (`io-util`) are
# used. Declared directly instead of `tokio.workspace = true` because the
# workspace entry enables `full`; Cargo feature unification still selects
# `full` in a whole-workspace build. Keep both version requirements in sync with
# the workspace `tokio` entry.
[dependencies]
tokio = { version = "1.54.1", default-features = false, features = ["io-util"], optional = true }
thiserror.workspace = true

# `client` gates the async bind session and its tokio dependency. The codec,
# protocol decoders, filter compiler and DN helpers are runtime-free, which lets
# `edgion-resources` use them for validation (`default-features = false`).
[features]
default = ["client"]
client = ["dep:tokio"]

[dev-dependencies]
tokio = { version = "1.54.1", features = ["rt", "macros", "io-util"] }

[lints]
workspace = true

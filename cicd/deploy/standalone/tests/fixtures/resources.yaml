apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: package-test
spec:
  controllerName: edgion.io/gateway-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: package-test
  namespace: default
spec:
  gatewayClassName: package-test
  listeners:
    - name: http
      protocol: HTTP
      port: 80
---
apiVersion: v1
kind: Service
metadata:
  name: package-backend
  namespace: default
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 18080
      targetPort: 18080
      protocol: TCP
---
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: package-backend
  namespace: default
  labels:
    kubernetes.io/service-name: package-backend
addressType: IPv4
ports:
  - name: http
    port: 18080
    protocol: TCP
endpoints:
  - addresses: ["__BACKEND_IPV4__"]
    conditions:
      ready: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: package-test
  namespace: default
spec:
  parentRefs:
    - name: package-test
  hostnames: ["package.test"]
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: package-backend
          port: 18080

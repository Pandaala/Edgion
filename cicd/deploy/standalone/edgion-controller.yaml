work_dir: /usr/local/edgion

server:
  # gRPC listener for the Gateway conf_sync channel. It carries resolved Secrets (TLS
  # private keys, backend credentials) to the data plane and is mTLS by default (see the
  # conf_sync_security section below), so binding it on all interfaces is safe: a peer
  # without a valid client certificate cannot complete the handshake. This lets you split
  # the Controller and Gateway onto different hosts without editing this line.
  grpc_listen: "0.0.0.0:12151"
  admin_listen: "0.0.0.0:12101"

logging:
  log_dir: logs
  log_prefix: edgion-controller
  log_level: info
  json_format: true
  console: false
  buffer_size: 10000

# FileSystem mode: watches a local directory of Gateway API YAML files.
# Place your GatewayClass, Gateway, HTTPRoute, etc. YAML files in conf_dir.
conf_center:
  type: file_system
  conf_dir: conf

debug:
  enabled: false

conf_sync:
  no_sync_kinds: [ReferenceGrant, Secret]
  default_capacity: 200

# ============================================================================
# conf_sync Channel Security
# ============================================================================
# REQUIRED: omitting this section entirely makes the process REFUSE TO START
# (fail-close, since 2026-07-14) -- the conf_sync channel carries resolved Secrets
# (TLS private keys, backend credentials), so plaintext must be an explicit choice.
# Pick one of: auto_ca (Kubernetes), cert paths (file mode, below), or skip_tls (plaintext).
#
# File-mode mTLS is the standalone default. Generate the cert set (once) with:
#
#   edgion-cli gen-certs --output file --output-dir /usr/local/edgion/certs/grpc \
#       --server-san 127.0.0.1 --server-san localhost
#
# That writes certs/grpc/primary/{ca,server,client}.{crt,key}. The Gateway loads the
# matching client cert from the same set (see edgion-gateway.yaml).
#
# SPLITTING CONTROLLER AND GATEWAY ONTO DIFFERENT HOSTS? Add the Controller's reachable
# host to the server cert: re-run gen-certs with an extra `--server-san <host-or-ip>`
# (the value the Gateway's `server_addr` dials), copy the client.crt/client.key/ca.crt to
# the Gateway host, and point its `server_addr` at this Controller. No plaintext ever
# crosses the network -- the mTLS handshake protects the Secrets this channel carries.
conf_sync_security:
  tls:
    cert: certs/grpc/primary/server.crt   # Controller server certificate (PEM)
    key: certs/grpc/primary/server.key    # Server private key (PEM)
    ca: certs/grpc/primary/ca.crt         # CA used to verify the Gateway client certificate

apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgion-gateway
  namespace: edgion-system
  labels:
    app: edgion-gateway
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Probe endpoints live on a dedicated port (12000) in this release. Keep
      # serving endpoints from dropping below the current replica count during the
      # rollout: a surge pod must pass its probes before any old pod is removed.
      # Tradeoff: a probe-port mismatch wedges the rollout instead of causing an
      # outage — watch `kubectl rollout status`.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: edgion-gateway
  template:
    metadata:
      labels:
        app: edgion-gateway
    spec:
      # 10s for endpoint removal, 30s + 10s for Pingora, then UDP and telemetry cleanup.
      terminationGracePeriodSeconds: 70
      containers:
      - name: edgion-gateway
        image: docker.io/pandaala/edgion-gateway:0.1.5
        args:
        - "--config-file"
        - "/usr/local/edgion/config/edgion-gateway.yaml"
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        - name: https
          containerPort: 443
          protocol: TCP
        - name: http-8080
          containerPort: 8080
          protocol: TCP
        - name: https-8443
          containerPort: 8443
          protocol: TCP
        - name: admin
          containerPort: 12001
          protocol: TCP
        - name: probe
          containerPort: 12000
          protocol: TCP
        - name: metrics
          containerPort: 12090
          protocol: TCP
        env:
        - name: RUST_LOG
          value: "info"
        # Gateway admin API token injected from the edgion-gateway-admin-credentials
        # Secret. The Secret is created by deploy.sh before the gateway is applied.
        # Resolved by the kubelet (secretKeyRef); the gateway never calls the API server.
        - name: EDGION_GATEWAY_ADMIN_TOKEN
          valueFrom:
            secretKeyRef:
              name: edgion-gateway-admin-credentials
              key: token
        startupProbe:
          httpGet:
            path: /health
            port: 12000
            scheme: HTTP
          periodSeconds: 2
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: 12000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        volumeMounts:
        - name: config
          mountPath: /usr/local/edgion/config
          readOnly: true
        - name: logs
          mountPath: /usr/local/edgion/logs
        - name: conf-sync-certs
          mountPath: /etc/edgion/conf-sync-certs
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: edgion-gateway-config
      - name: logs
        emptyDir: {}
      - name: conf-sync-certs
        secret:
          secretName: edgion-conf-sync-certs
          # optional: the Controller's internal CA provisions this Secret. The pod
          # must start before it exists; the conf_sync client connects lazily and
          # retries until the cert appears.
          optional: true

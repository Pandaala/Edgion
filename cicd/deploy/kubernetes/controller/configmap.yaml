apiVersion: v1
kind: ConfigMap
metadata:
  name: edgion-controller-config
  namespace: edgion-system
  labels:
    app: edgion-controller
data:
  edgion-controller.yaml: |
    work_dir: /usr/local/edgion

    server:
      grpc_listen: 0.0.0.0:12151
      # 0.0.0.0 is REQUIRED in K8s (ClusterIP Service -> Pod IP). Restrict with
      # the bundled NetworkPolicy and/or allow_admin_ips below.
      admin_listen: 0.0.0.0:12101
      # Hardening: restrict the admin plane to the cluster Pod/Service CIDR.
      # Matched against the TCP peer IP only (X-Forwarded-For is never trusted).
      # Empty/unset = allow all. Uncomment and set to your cluster's CIDRs:
      # allow_admin_ips:
      #   - "10.0.0.0/8"
      probe_listen: 0.0.0.0:12100
      metrics_listen: 0.0.0.0:12190

    logging:
      log_dir: logs
      log_prefix: edgion-controller
      log_level: info
      json_format: true
      console: true
      buffer_size: 10000

    conf_center:
      type: kubernetes
      gateway_class: public-gateway
      # controller_name derives from the Controller namespace and Deployment name.
      watch_namespaces: []
      ha_mode: leader-only

      leader_election:
        lease_name: edgion-controller-leader
        lease_namespace: edgion-system
        lease_duration_secs: 15
        retry_period_secs: 2

      metadata_filter:
        blocked_annotations:
          - kubectl.kubernetes.io/last-applied-configuration
          - meta.helm.sh/release-name
          - meta.helm.sh/release-namespace
        remove_managed_fields: true

    debug:
      enabled: false

    conf_sync:
      no_sync_kinds: [ReferenceGrant, Secret]
      default_capacity: 200

    # mTLS for the Controller→Gateway conf_sync channel (carries resolved Secrets).
    # auto_ca: the Controller's internal CA self-provisions the CA + gateway leaf
    # Secret and mints its own server cert in memory (no mounted cert files needed).
    # For bring-your-own root, pre-create the `edgion-conf-sync-ca` Secret (see README).
    conf_sync_security:
      auto_ca: true

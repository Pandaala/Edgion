syntax = "proto3";

// Trimmed but wire-compatible subset of Envoy's external processing protocol.
//
// The package name and all field numbers match the upstream definitions in
// `envoy/service/ext_proc/v3/external_processor.proto` (plus the
// `envoy.config.core.v3` / `envoy.type.v3` helper messages it depends on), so
// an off-the-shelf ext_proc server speaks to this client unchanged.
//
// Protobuf wire format encodes only field numbers and wire types — never type
// names or packages — so the core/type helper messages below are declared in
// THIS package (with matching field numbers) instead of pulling in the full
// envoy/udpa/xds/validate proto trees. This keeps codegen self-contained.
//
// MVP scope: request-header and response-header phases only. Body and trailer
// messages are defined for faithful decoding but are never sent by this client.
package envoy.service.ext_proc.v3;

// The external processing service. A single bidirectional stream carries one
// HTTP transaction's phases in order.
service ExternalProcessor {
  rpc Process(stream ProcessingRequest) returns (stream ProcessingResponse);
}

// One phase sent from the gateway to the external processor.
message ProcessingRequest {
  reserved 1;  // upstream: async_mode (removed)
  oneof request {
    HttpHeaders request_headers = 2;
    HttpHeaders response_headers = 3;
    HttpBody request_body = 4;
    HttpBody response_body = 5;
    HttpTrailers request_trailers = 6;
    HttpTrailers response_trailers = 7;
  }
}

// One phase's verdict returned by the external processor.
message ProcessingResponse {
  oneof response {
    HeadersResponse request_headers = 1;
    HeadersResponse response_headers = 2;
    BodyResponse request_body = 3;
    BodyResponse response_body = 4;
    TrailersResponse request_trailers = 5;
    TrailersResponse response_trailers = 6;
    ImmediateResponse immediate_response = 7;
  }
}

// Headers of a request or response phase.
message HttpHeaders {
  HeaderMap headers = 1;
  bool end_of_stream = 3;
}

message HttpBody {
  bytes body = 1;
  bool end_of_stream = 2;
}

message HttpTrailers {
  HeaderMap trailers = 1;
}

message HeadersResponse {
  CommonResponse response = 1;
}

message BodyResponse {
  CommonResponse response = 1;
}

message TrailersResponse {
  HeaderMutation header_mutation = 1;
}

// Mutations the processor wants applied for a header/body phase.
message CommonResponse {
  enum ResponseStatus {
    CONTINUE = 0;
    CONTINUE_AND_REPLACE = 1;
  }
  ResponseStatus status = 1;
  HeaderMutation header_mutation = 2;
  BodyMutation body_mutation = 3;
  HeaderMap trailers = 4;
  bool clear_route_cache = 5;
}

// Short-circuit: return this response to the client instead of proxying.
message ImmediateResponse {
  HttpStatus status = 1;
  HeaderMutation headers = 2;
  bytes body = 3;
  // field 4 (grpc_status) intentionally omitted for MVP
  string details = 5;
}

// ext_proc's own header mutation (distinct from config.core.v3.HeaderMutation).
message HeaderMutation {
  repeated HeaderValueOption set_headers = 1;
  repeated string remove_headers = 2;
}

message BodyMutation {
  oneof mutation {
    bytes body = 1;
    bool clear_body = 2;
  }
}

// ---- helpers mirroring envoy.type.v3 (matching field numbers) ----

// Mirrors envoy.type.v3.HttpStatus. `code` is the numeric HTTP status; upstream
// declares it as the StatusCode enum, which is wire-identical to int32.
message HttpStatus {
  int32 code = 1;
}

// ---- helpers mirroring envoy.config.core.v3 (matching field numbers) ----

message HeaderMap {
  repeated HeaderValue headers = 1;
}

message HeaderValue {
  string key = 1;
  string value = 2;
  // Newer ext_proc servers send the value as raw bytes here; prefer it when set.
  bytes raw_value = 3;
}

enum HeaderAppendAction {
  APPEND_IF_EXISTS_OR_ADD = 0;
  ADD_IF_ABSENT = 1;
  OVERWRITE_IF_EXISTS_OR_ADD = 2;
  OVERWRITE_IF_EXISTS = 3;
}

message HeaderValueOption {
  HeaderValue header = 1;
  // field 2 (append, deprecated BoolValue) intentionally omitted
  HeaderAppendAction append_action = 3;
  bool keep_empty_value = 4;
}

[package]
name = "edgion-common"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "edgion_common"
path = "src/lib.rs"

# TLS backend selection is driven by the workspace: `pingora-core` is unified
# across the dependency graph (resolver 2), so the binary crates' `boringssl` /
# `rustls` feature flows into this crate's `pingora-core` automatically — the
# same arrangement `edgion-resources` relies on. `edgion-common` has no
# TLS-backend-gated code, so it deliberately exposes no TLS feature of its own.

[features]
# Exposes cross-crate test helpers (env-var serialization locks, JWKS discovery
# seeding) to other crates' test builds. Enabled via their `[dev-dependencies]`
# so it is off for normal/production builds.
test-util = []

[dependencies]
# Shared resource/config schema crate (leaf)
edgion-resources.workspace = true

# Core async runtime and error handling
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true

# Serialization/Deserialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true

# Kubernetes client and types
kube.workspace = true
k8s-openapi.workspace = true
schemars.workspace = true

# gRPC (config sync + fed sync)
tonic.workspace = true
tonic-reflection.workspace = true
prost.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-native-certs.workspace = true
x509-parser.workspace = true

futures.workspace = true

# HTTP server
axum.workspace = true
axum-server.workspace = true

# Utilities
bytes.workspace = true
base64.workspace = true
chrono.workspace = true
parking_lot.workspace = true
uuid.workspace = true
arc-swap.workspace = true
dashmap.workspace = true
regex.workspace = true
rand.workspace = true
smallvec.workspace = true
indexmap.workspace = true
bcrypt.workspace = true
sha2.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true

# Pingora (TLS backend feature flows from the workspace via unification)
pingora-core.workspace = true
pingora-http.workspace = true
etcd-client.workspace = true

# Metrics
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-util.workspace = true

# CLI / logging
clap.workspace = true
zeroize.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
http.workspace = true
percent-encoding.workspace = true

reqwest.workspace = true

rcgen.workspace = true
time.workspace = true

[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
mockall.workspace = true
proptest.workspace = true
expect-test.workspace = true
tower.workspace = true

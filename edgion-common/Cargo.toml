[package]
name = "edgion-common"
version.workspace = true
edition.workspace = true
publish = false
authors.workspace = true

[lib]
name = "edgion_common"
path = "src/lib.rs"

[lints]
workspace = true

# TLS backend selection is driven by the workspace: `pingora-core` is unified
# across the dependency graph (resolver 2), so the binary crates' `boringssl` /
# `rustls` feature flows into this crate's `pingora-core` automatically — the
# same arrangement `edgion-resources` relies on. `edgion-common` has no
# TLS-backend-gated code, so it deliberately exposes no TLS feature of its own.

[features]
# Exposes cross-crate test helpers (env-var serialization locks, JWKS discovery
# seeding) to other crates' test builds. Enabled via their `[dev-dependencies]`
# so it is off for normal/production builds.
test-util = []

[dependencies]
# Shared resource/config schema crate (leaf)
edgion-resources.workspace = true

# Core async runtime and error handling
tokio.workspace = true
anyhow.workspace = true
async-trait.workspace = true

# Serialization/Deserialization
serde.workspace = true
serde_json.workspace = true

# Kubernetes client and types
kube.workspace = true
k8s-openapi.workspace = true

# gRPC (config sync + fed sync)
tonic.workspace = true
prost.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
webpki-roots.workspace = true
x509-parser.workspace = true

# HTTP server
axum.workspace = true

# Utilities
base64.workspace = true
chrono.workspace = true
parking_lot.workspace = true
regex.workspace = true
rand.workspace = true

# Pingora (TLS backend feature flows from the workspace via unification)
pingora-core.workspace = true
etcd-client.workspace = true

# Metrics
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-util.workspace = true

# CLI / logging
clap.workspace = true
zeroize.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
http.workspace = true

reqwest.workspace = true

rcgen.workspace = true
time.workspace = true

# Standard-DNS resolver backend (targets an explicit server list; see src/dns/).
hickory-resolver.workspace = true

[build-dependencies]
tonic-build.workspace = true

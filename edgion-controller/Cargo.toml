[package]
name = "edgion-controller"
version.workspace = true
edition.workspace = true
authors.workspace = true

[lib]
name = "edgion_controller"
path = "src/lib.rs"

[[bin]]
name = "edgion-controller"
path = "src/bin/edgion_controller.rs"

[lints]
workspace = true

[features]
default = ["allocator-jemalloc", "boringssl"]

# Memory allocator selection (mutually exclusive) — lives with the binary.
allocator-jemalloc = ["tikv-jemallocator"]
allocator-mimalloc = ["mimalloc"]
allocator-system = []

# TLS backend selection — the controller has no TLS-gated code of its own, but
# it links pingora (core/proxy) directly, so it must pick pingora's backend.
# (Previously forwarded through the gateway crate; that dependency is now gone.)
boringssl = ["pingora-core/boringssl", "pingora-proxy/boringssl"]
rustls = ["pingora-core/rustls", "pingora-proxy/rustls"]

[dependencies]
# Memory allocators (optional, controlled by features)
tikv-jemallocator = { workspace = true, optional = true }
mimalloc = { workspace = true, optional = true }

# Shared resource/config schema crate (leaf; reused by the future EdgionCenter)
edgion-resources.workspace = true

# Shared common crate (config loader, observe, secret store, link core, etc.)
edgion-common.workspace = true

# Core async runtime and error handling
tokio.workspace = true
tokio-util.workspace = true
tokio-stream.workspace = true
anyhow.workspace = true
async-trait.workspace = true
thiserror.workspace = true

# Serialization/Deserialization
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
jsonschema.workspace = true

# Kubernetes conf_client and types
kube.workspace = true
k8s-openapi.workspace = true
schemars.workspace = true

# gRPC (config sync)
tonic.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
# System CA roots for building custom rustls ClientConfig (Redis LinkSys TLS)
rustls-native-certs.workspace = true
x509-parser.workspace = true
tonic-reflection.workspace = true
prost.workspace = true

# File system monitoring
notify.workspace = true
walkdir.workspace = true
futures.workspace = true

# HTTP server
axum.workspace = true
axum-server.workspace = true

# Utilities
bytes.workspace = true
base64.workspace = true
chrono.workspace = true
parking_lot.workspace = true
uuid.workspace = true
arc-swap.workspace = true
dashmap.workspace = true
regex.workspace = true
rand.workspace = true
smallvec.workspace = true
indexmap.workspace = true
nom.workspace = true
sha2.workspace = true
subtle.workspace = true
crc32fast.workspace = true
hmac.workspace = true
aes-gcm.workspace = true
hex.workspace = true
jsonwebtoken.workspace = true

# Pingora
pingora-core.workspace = true
pingora-http.workspace = true
pingora-limits.workspace = true
pingora-load-balancing.workspace = true
pingora-proxy.workspace = true
etcd-client.workspace = true
fred.workspace = true

# Metrics
metrics.workspace = true
metrics-exporter-prometheus.workspace = true
metrics-util.workspace = true

# CLI
clap.workspace = true
rpassword.workspace = true
zeroize.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
http.workspace = true
percent-encoding.workspace = true

# Test client dependencies
reqwest.workspace = true

# CLI table formatting
tabled.workspace = true

rusqlite.workspace = true
md-5.workspace = true
cookie.workspace = true
instant-acme.workspace = true
rcgen.workspace = true
time.workspace = true
sha1.workspace = true
ldap3.workspace = true
pingora-ketama.workspace = true
tower.workspace = true


[build-dependencies]
tonic-build.workspace = true

[dev-dependencies]
edgion-common = { workspace = true, features = ["test-util"] }
tempfile.workspace = true
mockall.workspace = true
expect-test.workspace = true
wiremock.workspace = true
